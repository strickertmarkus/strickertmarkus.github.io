<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
    --bg: #F0F2F5;
    --card: #FFFFFF;
    --text: #1A1A2E;
    --text-sec: #6B7280;
    --border: #E5E7EB;
    --income: #10B981;
    --danger: #DC2626;
    --warning: #F59E0B;
    --accent: #2563EB;
}
html.dark-mode {
    --bg: #0F1219;
    --card: #1A1F2E;
    --text: #E2E8F0;
    --text-sec: #94A3B8;
    --border: #2A3041;
    --income: #34D399;
    --danger: #F87171;
    --warning: #FBBF24;
    --accent: #60A5FA;
}

body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    min-height: 100vh;
}

body, .card, .stat-card, .goal-card, .btn, input, select {
    transition: background-color 0.3s, color 0.3s, border-color 0.3s;
}

.header {
    background: linear-gradient(135deg, #1E293B 0%, #334155 100%);
    color: white;
    padding: 28px 0 24px;
    text-align: center;
    position: relative;
    box-shadow: 0 4px 24px rgba(0,0,0,0.15);
}
html.dark-mode .header {
    background: linear-gradient(135deg, #0B0F1A 0%, #151C2C 100%);
    box-shadow: 0 4px 30px rgba(0,0,0,0.5);
}
.header h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.3px; }
.header p { font-size: 12px; color: #94A3B8; margin-top: 4px; }

.container { max-width: 1400px; margin: 0 auto; padding: 24px 16px 60px; }

.top-bar {
    display: flex; align-items: center; gap: 12px; margin-bottom: 24px; flex-wrap: wrap;
}
.top-bar a {
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--accent); font-weight: 600; font-size: 13px;
    text-decoration: none; padding: 8px 16px;
    border: 1.5px solid var(--border); border-radius: 8px;
    background: var(--card); transition: all 0.2s;
}
.top-bar a:hover { background: var(--bg); border-color: var(--accent); }

/* ── GRID ────────────────────────────────────── */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin-bottom: 24px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
.full { grid-column: 1 / -1; }

.card {
    background: var(--card);
    border-radius: 14px;
    padding: 24px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    border: 1px solid var(--border);
}
.card h3 {
    font-size: 13px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.5px; color: var(--text-sec); margin-bottom: 16px;
}

.stat-card {
    background: var(--card);
    border-radius: 12px;
    padding: 20px;
    border: 1px solid var(--border);
    text-align: center;
    box-shadow: 0 1px 4px rgba(0,0,0,0.04);
}
.stat-card .label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-sec); margin-bottom: 6px; }
.stat-card .value { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; }
.stat-card .sub { font-size: 11px; color: var(--text-sec); margin-top: 4px; }

.chart-wrap { position: relative; width: 100%; height: 320px; }
.chart-wrap canvas { max-width: 100%; }

/* ── SAVINGS GOALS ────────────────────────────── */
.savings-goals-section {
    grid-column: 1 / -1;
    background: linear-gradient(135deg, rgba(16,185,129,0.08) 0%, rgba(16,185,129,0.04) 100%);
    border: 1.5px solid rgba(16,185,129,0.2);
    border-radius: 14px;
    padding: 28px;
    margin-bottom: 24px;
}
.savings-goals-section h3 {
    font-size: 16px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--income);
    margin-bottom: 4px;
}
.savings-goals-section p {
    font-size: 13px;
    color: var(--text-sec);
    margin-bottom: 20px;
}
.goals-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 18px;
    margin-bottom: 16px;
}
.goal-card {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 14px;
    padding: 24px;
    position: relative;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}
.goal-card .goal-name { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
.goal-card .goal-target { font-size: 13px; color: var(--text-sec); margin-bottom: 4px; }
.goal-card .goal-monthly { font-size: 12px; color: var(--income); margin-bottom: 12px; font-weight: 600; }
.goal-progress-bar {
    width: 100%;
    height: 14px;
    border-radius: 8px;
    background: var(--border);
    overflow: hidden;
    margin-bottom: 12px;
}
.goal-progress-fill { height: 100%; border-radius: 8px; transition: width 0.5s ease; }
.goal-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    font-size: 13px;
    margin-bottom: 14px;
    padding: 10px;
    background: var(--bg);
    border-radius: 8px;
}
.goal-stats span { color: var(--text-sec); }
.goal-stats .value { color: var(--text); font-weight: 700; font-size: 14px; }
.goal-actions { display: flex; gap: 8px; }
.goal-actions button {
    padding: 6px 12px;
    font-size: 12px;
    font-family: inherit;
    font-weight: 600;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s;
    border: none;
    flex: 1;
}
.btn-edit { background: rgba(37,99,235,0.12); color: var(--accent); }
.btn-edit:hover { background: rgba(37,99,235,0.25); }
.btn-del { background: rgba(220,38,38,0.12); color: var(--danger); }
.btn-del:hover { background: rgba(220,38,38,0.25); }
.btn-extra { background: rgba(96,165,250,0.12); color: #60A5FA; }
.btn-extra:hover { background: rgba(96,165,250,0.25); }
.stat-netto { color: #2563EB; }
html.dark-mode .stat-netto { color: #60A5FA; }
.btn-add-goal {
    padding: 12px 24px;
    font-size: 14px;
    font-family: inherit;
    font-weight: 700;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
    background: rgba(16,185,129,0.2);
    border: 1.5px solid rgba(16,185,129,0.4);
    color: var(--income);
}
.btn-add-goal:hover { background: rgba(16,185,129,0.3); border-color: rgba(16,185,129,0.6); }

/* ── MODAL ───────────────────────────────────── */
.modal-overlay {
    display: none; position: fixed; inset: 0; z-index: 1000;
    background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);
    align-items: center; justify-content: center;
}
.modal-overlay.active { display: flex; }
.modal {
    background: var(--card); border-radius: 14px; padding: 28px;
    width: 90%; max-width: 420px; box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}
.modal h3 { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 16px; }
.modal label { display: block; font-size: 12px; font-weight: 600; color: var(--text-sec); margin-bottom: 4px; margin-top: 12px; }
.modal input, .modal select {
    width: 100%; padding: 8px 12px; border: 1.5px solid var(--border);
    border-radius: 8px; font-family: inherit; font-size: 13px;
    background: var(--bg); color: var(--text);
}
.modal input:focus, .modal select:focus { outline: none; border-color: var(--accent); }
.modal-buttons { display: flex; gap: 10px; margin-top: 20px; }
.modal-buttons button {
    flex: 1; padding: 10px; font-family: inherit; font-size: 13px;
    font-weight: 600; border-radius: 8px; cursor: pointer;
}
.modal-btn-primary { background: var(--accent); color: white; border: none; }
.modal-btn-primary:hover { filter: brightness(1.1); }
.modal-btn-cancel { background: var(--bg); color: var(--text); border: 1.5px solid var(--border); }
.modal-btn-cancel:hover { background: var(--border); }

/* ── RESPONSIVE ──────────────────────────────── */
@media (max-width: 900px) {
    .grid-2, .grid-3 { grid-template-columns: 1fr; }
    .grid-4 { grid-template-columns: repeat(2, 1fr); }
    .header h1 { font-size: 22px; }
    .header p { font-size: 11px; }
    #dark-mode-btn { top: 10px !important; right: 10px !important; width: 34px !important; height: 34px !important; font-size: 16px !important; }
    .savings-goals-section { padding: 20px 16px; }
    .goals-grid { grid-template-columns: 1fr; }
    .goal-card { padding: 18px; }
    .chart-wrap[style*="360px"] { height: 280px !important; }
}
@media (max-width: 480px) {
    .container { padding: 12px 8px 50px; }
    .grid-4 { grid-template-columns: 1fr 1fr; gap: 8px; }
    .stat-card .value { font-size: 18px; }
    .stat-card { padding: 14px; }
    .stat-card .label { font-size: 10px; }
    .card { padding: 16px; }
    .card h3 { font-size: 11px; }
    .chart-wrap { height: 220px; }
    .chart-wrap[style*="360px"] { height: 220px !important; }
    .header { padding: 20px 0 16px; }
    .header h1 { font-size: 18px; }
    .header p { font-size: 10px; }
    #dark-mode-btn { top: 8px !important; right: 8px !important; width: 32px !important; height: 32px !important; font-size: 14px !important; padding: 4px !important; }
    .top-bar { margin-bottom: 16px; }
    .top-bar a { font-size: 12px; padding: 6px 12px; }
    .savings-goals-section { padding: 16px 12px; margin-bottom: 16px; }
    .savings-goals-section h3 { font-size: 14px; }
    .savings-goals-section p { font-size: 12px; margin-bottom: 14px; }
    .goals-grid { grid-template-columns: 1fr; gap: 12px; }
    .goal-card { padding: 16px; }
    .goal-card .goal-name { font-size: 14px; }
    .goal-card .goal-target { font-size: 12px; }
    .goal-stats { gap: 8px; font-size: 12px; padding: 8px; }
    .goal-stats .value { font-size: 13px; }
    .goal-actions button { font-size: 11px; padding: 5px 8px; }
    .btn-add-goal { padding: 10px 18px; font-size: 13px; width: 100%; text-align: center; }
    .grid-2, .grid-3 { gap: 12px; margin-bottom: 16px; }
    .modal { padding: 20px; width: 95%; }
    .modal h3 { font-size: 16px; }
    .modal label { font-size: 12px; }
    .modal input, .modal select { font-size: 14px; padding: 8px 10px; }
    .modal-buttons button { padding: 10px; font-size: 12px; }
}

/* ── NAV DROPDOWN ───────────────────────────────── */
.nav-dropdown-wrapper { position: relative; display: inline-block; }
.nav-dropdown-menu { display: none; position: absolute; top: 100%; right: 0; margin-top: 6px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.15); min-width: 220px; z-index: 1000; overflow: hidden; animation: navDropIn 0.2s ease; }
.nav-dropdown-menu.show { display: block; }
@keyframes navDropIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
.nav-dropdown-menu a { display: flex; align-items: center; gap: 10px; padding: 12px 16px; color: var(--text); text-decoration: none; font-size: 14px; font-weight: 500; transition: background 0.15s; }
.nav-dropdown-menu a:hover { background: rgba(59,109,224,0.08); }
html.dark-mode .nav-dropdown-menu a:hover { background: rgba(96,165,250,0.1); }
.nav-dropdown-menu a .nav-icon { font-size: 18px; width: 24px; text-align: center; }
.nav-dropdown-menu a.active { background: rgba(59,109,224,0.08); color: #3B6DE0; font-weight: 600; }
html.dark-mode .nav-dropdown-menu a.active { background: rgba(96,165,250,0.1); color: #60A5FA; }

/* Editable Headings */
h3.editable-heading { cursor: pointer; position: relative; display: inline-block; transition: background 0.2s; padding: 2px 4px; border-radius: 4px; }
h3.editable-heading:hover { background: rgba(59,109,224,0.08); }
html.dark-mode h3.editable-heading:hover { background: rgba(96,165,250,0.1); }
.heading-input { font-size: inherit; font-weight: 700; background: transparent; border: none; border-bottom: 2px solid #3B6DE0; color: var(--text); font-family: inherit; outline: none; padding: 2px 4px; }
html.dark-mode .heading-input { border-bottom-color: #60A5FA; }
/* ── Analys (an-*) ── */
.an{max-width:760px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-left,0px)) 64px;display:block}
.an-seg{display:flex;gap:4px;margin:4px 0 14px}
.an-seg button{appearance:none;border:0;background:transparent;color:#929ba9;font:500 14px/1 Inter,sans-serif;padding:10px 15px;border-radius:19px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.an-seg button[aria-pressed="true"]{color:#FDBA74;background:rgba(253,186,116,.08)}
.an-seg button:focus-visible,.an a:focus-visible{outline:2px solid #FDBA74;outline-offset:2px}
.an-kpis{display:grid;grid-template-columns:1fr 1fr;gap:16px 18px}
.an-kpi{padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.08);min-width:0}
.an-kpi small{display:block;color:#FDBA74;font:700 10px/1.4 Inter,sans-serif;letter-spacing:.17em;text-transform:uppercase}
.an-kpi b{display:block;font-size:27px;font-weight:700;letter-spacing:-.4px;margin-top:4px;color:#f0f6fc;font-variant-numeric:tabular-nums}
.an-kpi b.plus,.an .plus{color:#4ADE80}.an-kpi b.minus,.an .minus{color:#F87171}
.an-kpi em{display:block;font-style:normal;color:#929ba9;font-size:12.5px;margin-top:2px}
.an-chip{display:inline-block;padding:2px 9px;border-radius:10px;font-size:12px;font-weight:600;font-style:normal;white-space:nowrap;font-variant-numeric:tabular-nums}
.an-chip.ok{color:#4ADE80;background:rgba(74,222,128,.10)}.an-chip.bad{color:#F87171;background:rgba(248,113,113,.10)}
.an-k{display:flex;justify-content:space-between;align-items:center;color:#FDBA74;font:700 11px/1.4 Inter,sans-serif;letter-spacing:.18em;text-transform:uppercase;padding-bottom:10px;border-bottom:1px solid rgba(255,255,255,.08);margin:30px 0 12px}
.an-k small{color:#929ba9;font-weight:500;letter-spacing:0;text-transform:none;font-size:12.5px}
.an-muted{color:#929ba9;font-size:14px;margin:4px 0}
.an-chart svg{width:100%;height:auto;display:block;max-height:240px}
.an-chart text{fill:#7d8996;font:500 9.5px Inter,sans-serif}
.an-key{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:#929ba9;margin-top:8px}
.an-key i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.an-key i.dash{height:0;width:12px;border-top:2px dashed rgba(255,255,255,.55);border-radius:0;vertical-align:3px}
.an-note{color:#7d8996;font-size:12px;margin:6px 0 0}
.an-cat{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;padding:9px 0}
.an-dot{width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c)}
.an-cat b{font-size:15px;font-weight:600;color:#f0f6fc}
.an-cat .v{font-size:14px;color:#d5dbe3;text-align:right;font-variant-numeric:tabular-nums}
.an-track{grid-column:2/4;height:6px;border-radius:3px;background:rgba(255,255,255,.07);position:relative}
.an-track i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--c);box-shadow:0 0 8px var(--c)}
.an-track u{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:rgba(255,255,255,.6);border-radius:1px}
.an-cat em{grid-column:2/4;font-style:normal;font-size:12.5px;color:#929ba9;font-variant-numeric:tabular-nums}
.an-dev{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14.5px;color:#d5dbe3;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.an-dev small{color:#7d8996;font-size:12.5px}
.an-big{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:end}
.an-big b{display:block;font-size:25px;font-weight:700;color:#4ADE80;font-variant-numeric:tabular-nums}
.an-big b.s{font-size:17px;color:#f0f6fc}
.an-big em{display:block;font-style:normal;color:#929ba9;font-size:12.5px}
.an-big .r{text-align:right}
.an-spark{width:100%;height:52px;display:block;margin:10px 0 4px}
.an-it{display:flex;justify-content:space-between;font-size:14.5px;color:#d5dbe3;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.an-it span:last-child{color:#929ba9;font-variant-numeric:tabular-nums}
.an-foot{color:#7d8996;font-size:12.5px;text-align:center;margin-top:30px}
.an a{color:#FDBA74;text-decoration:none}
@media(min-width:700px){.an-kpis{grid-template-columns:repeat(4,1fr)}}

</style>
