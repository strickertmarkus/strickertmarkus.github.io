<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Logga In - Familia Strickert</title>
  <script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-auth-compat.js"></script>
  <script src="auth-config.js"></script>
  <script src="auth-gate.js?v=20260830-budget-hub-v1"></script>
  <style>
    :root {
      --bg: #0f1219;
      --card: #1a1f2e;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --border: #2a3041;
      --accent: #60a5fa;
      --error: #f87171;
      --ok: #34d399;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #1c2740 0%, var(--bg) 60%);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
    }

    h1 {
      margin: 0 0 6px;
      font-size: 24px;
      letter-spacing: .3px;
    }

    .sub {
      margin: 0 0 18px;
      font-size: 13px;
      color: var(--muted);
    }

    label {
      display: block;
      margin: 10px 0 6px;
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .7px;
      font-weight: 700;
    }

    input {
      width: 100%;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #101629;
      color: var(--text);
      padding: 11px 12px;
      font-size: 14px;
      outline: none;
    }

    input:focus {
      border-color: var(--accent);
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 16px;
    }

    button {
      border-radius: 10px;
      border: 1px solid var(--border);
      padding: 10px 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      color: var(--text);
      background: #11192b;
    }

    button.primary {
      border-color: rgba(96,165,250,.5);
      background: #13213c;
      color: #93c5fd;
    }

    #login-message {
      min-height: 20px;
      margin-top: 12px;
      font-size: 12px;
      color: var(--muted);
    }

    .hint {
      margin-top: 14px;
      font-size: 11px;
      color: var(--muted);
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1 style="cursor:pointer" onclick="location.href='home.html'">Logga in</h1>
    <p class="sub">Du stannar inloggad på enheten tills du loggar ut eller rensar webbläsardata.</p>

    <form id="login-form">
      <label for="login-email">E-post</label>
      <input id="login-email" type="email" autocomplete="email" required>

      <label for="login-password">Lösenord</label>
      <input id="login-password" type="password" autocomplete="current-password" required>

      <div class="actions">
        <button class="primary" type="submit">Logga in</button>
        <button type="button" id="create-account-btn">Skapa konto</button>
      </div>
    </form>

    <div id="login-message"></div>
    <div class="hint">Tips: Aktivera Email/Password under Firebase Authentication om kontoskapande inte fungerar.</div>
  </div>
</body>
</html>
