/* The Shopping shell stays intact; only reserve a small header slot for the Home launcher. */
.app-header{grid-template-columns:minmax(0,1fr) auto}
.app-header>.brand{grid-column:1;grid-row:1}
.app-header>.shopping-mode-switch{grid-column:1/-1;grid-row:2}
.app-header>.site-hub-home{grid-column:2;grid-row:1;align-self:center}

</style>


<style>
/* Home displays the entire Shopping app directly beneath the Listor tab. */
html.shopping-embedded{--home-visible-height:720px;--home-dialog-center:360px;--home-dialog-top:14px}
html.shopping-embedded body{min-height:0;overflow-x:hidden;background:#0f1219}
html.shopping-embedded .app-wrap{min-height:0}
html.shopping-embedded .app-header{display:block;max-width:1200px;padding:10px 24px 0}
html.shopping-embedded .app-header>.brand,
html.shopping-embedded .shopping-mode-switch{display:flex;width:100%;margin:0;padding-bottom:12px}
html.shopping-embedded .wrap{padding:14px 24px 70px}
@media(max-width:680px){
  html.shopping-embedded .app-header{padding:10px 12px 0}
  html.shopping-embedded .wrap{padding:12px 12px 50px}
}
</style>
<script>
/* Keep the parent Home page as the scroll container; do not duplicate list state. */
(function(){
  if(new URLSearchParams(location.search).get('embed')!=='home')return;
  document.documentElement.classList.add('shopping-embedded');
  if(window.parent===window)return;
  var lastHeight=0,queued=false;
  function report(){
    if(queued)return;
    queued=true;
    requestAnimationFrame(function(){
      queued=false;
      var app=document.querySelector('.app-wrap');
      if(!app)return;
      var height=Math.ceil(app.offsetTop+app.scrollHeight);
      if(Math.abs(height-lastHeight)>2){
        lastHeight=height;
        window.parent.postMessage({type:'shopping:content-height',height:height},location.origin);
      }
    });
  }
  window.addEventListener('message',function(event){
    if(event.source!==window.parent||event.origin!==location.origin||!event.data)return;
    if(event.data.type!=='home:viewport')return;
    var top=Number(event.data.top),height=Number(event.data.height);
    if(!Number.isFinite(top)||!Number.isFinite(height)||height<120)return;
    var root=document.documentElement.style;
    root.setProperty('--home-visible-height',Math.round(height)+'px');
    root.setProperty('--home-dialog-center',Math.round(top+height/2)+'px');
    root.setProperty('--home-dialog-top',Math.round(top+12)+'px');
  });
  window.addEventListener('DOMContentLoaded',function(){
    var app=document.querySelector('.app-wrap');
    if(app&&'ResizeObserver' in window)new ResizeObserver(report).observe(app);
    if(app&&'MutationObserver' in window)new MutationObserver(report).observe(app,{childList:true,subtree:true,characterData:true});
    if(document.fonts&&document.fonts.ready)document.fonts.ready.then(report);
    report();
  });
  window.addEventListener('load',report);
  window.addEventListener('resize',report);
})();
</script>

<style>
/* Home's Listor shows Shopping's three original toggles in a single compact row. */
html.shopping-embedded .shopping-mode-switch{
  display:flex;grid-column:auto;grid-row:auto;align-items:center;justify-content:flex-start;
  gap:6px;width:100%;max-width:420px;min-height:42px;
  margin:0;padding:0;border-bottom:0;
}
html.shopping-embedded .shopping-mode-switch>[data-list-mode-button]{
  display:inline-flex;flex:0 1 auto;align-items:center;justify-content:center;
  gap:7px;min-width:0;min-height:42px;padding:9px 12px;
  border:1px solid transparent;border-radius:11px;
  background:transparent;color:var(--text-sec);font-size:13px;font-weight:550;line-height:1.2;
  white-space:nowrap;
  transition:color .17s ease,background .17s ease,border-color .17s ease,box-shadow .17s ease;
}
html.shopping-embedded .shopping-mode-switch>[data-list-mode-button] svg{
  display:block;width:17px;height:17px;flex:0 0 17px;
  fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;
}
html.shopping-embedded .shopping-mode-switch>[data-list-mode-button][aria-pressed="true"]{
  border-color:rgba(var(--accent-rgb),.26);
  background:rgba(var(--accent-rgb),.095);
  color:var(--accent);box-shadow:0 0 19px rgba(var(--accent-rgb),.075);
}
html.shopping-embedded .shopping-mode-switch>[data-list-mode-button]:hover,
html.shopping-embedded .shopping-mode-switch>[data-list-mode-button]:focus-visible{
  color:var(--accent);background:rgba(var(--accent-rgb),.075);
}
html.shopping-embedded .shopping-mode-switch>[data-list-mode-button]:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px;
}
html.shopping-embedded .wrap{padding-top:15px}
@media(max-width:380px){
  html.shopping-embedded .shopping-mode-switch{gap:4px}
  html.shopping-embedded .shopping-mode-switch>[data-list-mode-button]{
    flex:1 1 0;gap:5px;padding:9px 6px;font-size:11.5px;letter-spacing:-.1px;
  }
  html.shopping-embedded .shopping-mode-switch>[data-list-mode-button] svg{
    width:15px;height:15px;flex-basis:15px;
  }
}
@media(prefers-reduced-motion:reduce){
  html.shopping-embedded .shopping-mode-switch>[data-list-mode-button]{transition:none}
}
</style>
