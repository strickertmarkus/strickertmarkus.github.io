<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inköpslista</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0F1621;--bg2:#161E2F;--bg3:#1A2335;--border:rgba(255,255,255,0.07);--text:#E2EEFF;--text-sec:#7A8FA0;--text-dim:#3A4A60;--accent:#FBBF24;--radius:8px;}
    *{box-sizing:border-box;margin:0;padding:0;}
    html{scroll-behavior:smooth;}
    body{font-family:'Inter',sans-serif;background:var(--bg);background:linear-gradient(180deg, var(--bg) 0%, rgba(26,35,53,.15) 100%);color:var(--text);line-height:1.5;font-size:14px;min-height:100vh;}
    .wrap{max-width:600px;margin:0 auto;padding:16px;}
    header{display:flex;align-items:center;gap:12px;margin-bottom:20px;border-bottom:1px solid var(--border);padding-bottom:12px;}
    .logo{font-size:18px;font-weight:600;}
    .header-right{margin-left:auto;display:flex;gap:8px;}
    .dropdown-wrapper{position:relative;}
    .dropdown-btn{background:rgba(255,255,255,.04);border:1px solid var(--border);padding:6px 10px;border-radius:var(--radius);cursor:pointer;font-size:13px;color:var(--text-sec);transition:all .2s;}
    .dropdown-btn:hover{border-color:rgba(255,255,255,.15);color:var(--text);background:rgba(255,255,255,.08);}
    .dropdown-menu{display:none;position:absolute;top:calc(100% + 4px);right:0;background:rgba(22,30,47,.98);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 4px 12px rgba(0,0,0,.3);min-width:180px;z-index:100;backdrop-filter:blur(10px);}
    .dropdown-wrapper.open .dropdown-menu{display:block;}
    .dropdown-menu a{display:block;padding:8px 12px;text-decoration:none;color:var(--text-sec);border-bottom:1px solid #4a5568;transition:background .2s;font-size:13px;}
    .dropdown-menu a:last-child{border-bottom:none;}
    .dropdown-menu a:hover{background:rgba(255,255,255,.06);color:var(--text);}
    main{display:flex;flex-direction:column;gap:6px;}
    .category-title{font-weight:600;font-size:15px;color:var(--text);padding:8px 0;margin-top:12px;margin-bottom:4px;border-bottom:2px solid var(--accent);}
    .category-title.new-category{color:var(--text-dim);cursor:pointer;padding:6px 0;}
    .category-title.new-category:hover{color:var(--text);}
    .list-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:none;}
    .list-item input[type="checkbox"]{width:18px;height:18px;cursor:pointer;accent-color:var(--accent);flex-shrink:0;}
    .list-item label{flex:1;cursor:pointer;padding:2px 0;}
    .list-item label.done{text-decoration:line-through;color:var(--text-dim);}
    .list-item .item-actions{display:flex;gap:6px;}
    .item-actions button{background:none;border:none;color:var(--text-sec);cursor:pointer;font-size:18px;transition:color .2s;padding:4px 6px;line-height:1;}
    .item-actions button:hover{color:#EF4444;}
    .add-item-line{display:flex;align-items:center;gap:10px;padding:8px 0;color:var(--text-dim);}
    .add-item-line:hover{color:var(--text-sec);}
    .add-item-line input{flex:1;background:none;border:none;outline:none;color:var(--text);font-family:inherit;font-size:14px;padding:2px 0;}
    .add-item-line input::placeholder{color:var(--text-dim);}
    .section-title{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-sec);margin-top:20px;margin-bottom:8px;}
    .recipe-item{padding:10px 0;border-bottom:1px solid #4a5568;}
    .recipe-header{display:flex;align-items:center;gap:8px;cursor:pointer;padding:4px 0;}
    .recipe-toggle{font-size:12px;color:var(--text-sec);width:14px;transition:transform .2s;}
    .recipe-item.open .recipe-toggle{transform:rotate(90deg);}
    .recipe-name{flex:1;font-weight:500;color:var(--text);}
    .recipe-actions{opacity:0;display:flex;gap:6px;transition:opacity .2s;}
    .recipe-item:hover .recipe-actions{opacity:1;}
    .recipe-actions button{background:none;border:none;color:var(--text-sec);cursor:pointer;font-size:16px;transition:color .2s;padding:4px 6px;}
    .recipe-actions button:hover{color:#EF4444;}
    .recipe-items{display:none;padding-left:24px;margin-top:6px;margin-bottom:6px;}
    .recipe-item.open .recipe-items{display:flex;flex-direction:column;gap:6px;}
    .recipe-add-item{display:flex;gap:6px;}
    .recipe-add-item input{flex:1;padding:6px 8px;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:var(--radius);font-family:inherit;font-size:13px;outline:none;color:var(--text);}
    .recipe-add-item input::placeholder{color:var(--text-dim);}
    .recipe-add-item input:focus{border-color:var(--accent);background:rgba(255,255,255,.08);}
    .recipe-add-item button{padding:6px 10px;background:var(--accent);color:#0F1621;border:none;border-radius:var(--radius);cursor:pointer;font-weight:600;font-size:12px;transition:background .2s;}
    .recipe-add-item button:hover{background:#F9A948;}
    .recipe-ingredient{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13px;}
    .recipe-ingredient input[type="checkbox"]{width:16px;height:16px;}
    .empty-state{text-align:center;padding:20px;color:var(--text-dim);font-size:13px;}
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">Inköpslista</div>
    <div class="header-right">
      <div class="dropdown-wrapper">
        <button class="dropdown-btn">Listor</button>
        <div class="dropdown-menu" id="lists-menu"></div>
      </div>
      <div class="dropdown-wrapper">
        <button class="dropdown-btn">Recept</button>
        <div class="dropdown-menu" id="recipes-dropdown"></div>
      </div>
    </div>
  </header>

  <main>
    <div id="items-list"></div>

    <div class="section-title">Sparade Recept</div>
    <div id="recipes-list"></div>
  </main>
</div>

<script>
let recipeSessionStore = [];
let addingNewItem = false;
let addingNewCategory = false;
const deepClone = v => JSON.parse(JSON.stringify(v));
const S = {
  get: k => {
    if (k === 'recipes') return deepClone(recipeSessionStore);
    return JSON.parse(localStorage.getItem('sh_' + k) || '[]');
  },
  set: (k, v) => {
    if (k === 'recipes') {
      recipeSessionStore = deepClone(v);
      return;
    }
    localStorage.setItem('sh_' + k, JSON.stringify(v));
  }
};

let activeList = null;

document.addEventListener('DOMContentLoaded', () => {
  localStorage.removeItem('sh_recipes');
  recipeSessionStore = [];
  const lists = S.get('lists');
  if (!lists.length) {
    S.set('lists', [{id: 1, name: 'Huvudlista', createdAt: new Date().toISOString().slice(0,10), items: []}]);
  }
  activeList = S.get('lists')[0]?.id || 1;
  renderListsMenu();
  renderRecipesDropdown();
  renderItems();
  renderRecipes();
});

function renderListsMenu() {
  const lists = S.get('lists');
  const menu = document.getElementById('lists-menu');
  menu.innerHTML = lists.map(l => `<a href="#" onclick="selectList(${l.id}); return false;">${l.name}</a>`).join('') + 
    '<a href="#" onclick="createNewList(); return false;">+ Ny lista</a>';
}

function renderRecipesDropdown() {
  const recipes = S.get('recipes');
  const menu = document.getElementById('recipes-dropdown');
  menu.innerHTML = recipes.map(r => `<a href="#" onclick="addRecipeItems(${r.id}); return false;">Lägg till: ${r.name}</a>`).join('') +
    '<a href="#" onclick="createNewRecipe(); return false;">+ Nytt recept</a>';
}

function selectList(id) {
  activeList = id;
  renderListsMenu();
  renderItems();
}

function createNewList() {
  const name = prompt('Listans namn:');
  if (!name) return;
  const lists = S.get('lists');
  const id = Math.max(...lists.map(l => l.id || 0)) + 1;
  lists.push({id, name, createdAt: new Date().toISOString().slice(0,10), items: []});
  S.set('lists', lists);
  activeList = id;
  renderListsMenu();
  renderItems();
}

function createNewRecipe() {
  const name = prompt('Receptets namn:');
  if (!name) return;
  const recipes = S.get('recipes');
  const id = Math.max(...recipes.map(r => r.id || 0)) + 1;
  recipes.push({id, name, items: []});
  S.set('recipes', recipes);
  renderRecipesDropdown();
  renderRecipes();
}

function startAddItem() {
  if (addingNewItem) return;
  addingNewItem = true;
  renderItems();
  setTimeout(() => {
    const inp = document.getElementById('new-item-input');
    if (inp) inp.focus();
  }, 0);
}

function saveNewItem(event) {
  if (event && event.key && event.key !== 'Enter') return;
  if (event) event.preventDefault();
  const inp = document.getElementById('new-item-input');
  const text = inp.value.trim();
  if (text) {
    const lists = S.get('lists');
    const list = lists.find(l => l.id === activeList);
    if (list) {
      if (!list.items) list.items = [];
      list.items.push({id: Date.now(), type: 'item', text, checked: false});
      S.set('lists', lists);
    }
  }
  addingNewItem = false;
  renderItems();
}

function cancelAddItem() {
  addingNewItem = false;
  renderItems();
}

function startAddCategory() {
  if (addingNewCategory) return;
  addingNewCategory = true;
  renderItems();
  setTimeout(() => {
    const inp = document.getElementById('new-category-input');
    if (inp) inp.focus();
  }, 0);
}

function saveNewCategory(event) {
  if (event && event.key && event.key !== 'Enter') return;
  if (event) event.preventDefault();
  const inp = document.getElementById('new-category-input');
  const text = inp.value.trim();
  if (text) {
    const lists = S.get('lists');
    const list = lists.find(l => l.id === activeList);
    if (list) {
      if (!list.items) list.items = [];
      list.items.push({id: Date.now(), type: 'category', text});
      S.set('lists', lists);
    }
  }
  addingNewCategory = false;
  renderItems();
}

function cancelAddCategory() {
  addingNewCategory = false;
  renderItems();
}

function toggleItem(id, checked) {
  const lists = S.get('lists');
  const list = lists.find(l => l.id === activeList);
  const item = list?.items.find(i => i.id === id);
  if (item) item.checked = checked;
  S.set('lists', lists);
  renderItems();
}

function delItem(id) {
  const lists = S.get('lists');
  const list = lists.find(l => l.id === activeList);
  if (list) list.items = list.items.filter(i => i.id !== id);
  S.set('lists', lists);
  renderItems();
}

function deleteEmptyItem(id) {
  const lists = S.get('lists');
  const list = lists.find(l => l.id === activeList);
  const item = list?.items.find(i => i.id === id);
  if (item && !item.text.trim()) {
    delItem(id);
  }
}

function renderItems() {
  const lists = S.get('lists');
  const list = lists.find(l => l.id === activeList);
  const items = list?.items || [];
  const el = document.getElementById('items-list');
  if (!items.length && !addingNewItem && !addingNewCategory) {
    el.innerHTML = '<div class="empty-state">Klicka för att lägga till artikel eller rubrik</div>';
    return;
  }
  let html = '';
  items.forEach(i => {
    if (i.type === 'category') {
      html += `<div class="category-title">${i.text}</div>`;
    } else {
      html += `
        <div class="list-item">
          <input type="checkbox" ${i.checked ? 'checked' : ''} onchange="toggleItem(${i.id}, this.checked)">
          <label class="${i.checked ? 'done' : ''}" onclick="this.previousElementSibling.click()">${i.text}</label>
          <div class="item-actions">
            <button onclick="delItem(${i.id})">✕</button>
          </div>
        </div>
      `;
    }
  });
  if (addingNewCategory) {
    html += `
      <div class="category-title new-category">
        <input type="text" id="new-category-input" placeholder="Rubrik..." onkeydown="saveNewCategory(event)" onblur="cancelAddCategory()">
      </div>
    `;
  } else {
    html += `<div class="category-title new-category" onclick="startAddCategory()">+ Lägg till rubrik</div>`;
  }
  if (addingNewItem) {
    html += `
      <div class="add-item-line">
        <input type="checkbox" disabled>
        <input type="text" id="new-item-input" placeholder="Ny artikel..." onkeydown="saveNewItem(event)" onblur="cancelAddItem()">
      </div>
    `;
  } else {
    html += `
      <div class="add-item-line" onclick="startAddItem()">
        <input type="checkbox" disabled>
        <span>+ Lägg till artikel</span>
      </div>
    `;
  }
  el.innerHTML = html;
}

function addRecipeItems(recipeId) {
  const recipes = S.get('recipes');
  const recipe = recipes.find(r => r.id === recipeId);
  if (!recipe?.items?.length) return alert('Receptet har inga ingredienser');
  const lists = S.get('lists');
  const list = lists.find(l => l.id === activeList);
  if (!list) return;
  if (!list.items) list.items = [];
  recipe.items.forEach(ingr => {
    if (!list.items.find(i => i.text === ingr && i.type !== 'category')) {
      list.items.push({id: Date.now() + Math.random(), type: 'item', text: ingr, checked: false});
    }
  });
  S.set('lists', lists);
  renderItems();
}

function toggleRecipe(id) {
  const el = document.querySelector(`[data-recipe-id="${id}"]`);
  if (el) el.classList.toggle('open');
}

function delRecipe(id) {
  if (!confirm('Radera receptet?')) return;
  const recipes = S.get('recipes');
  S.set('recipes', recipes.filter(r => r.id !== id));
  renderRecipesDropdown();
  renderRecipes();
}

function saveRecipeItem(recipeId, event) {
  if (event.key !== 'Enter') return;
  event.preventDefault();
  const inp = event.target;
  const text = inp.value.trim();
  if (!text) return;
  const recipes = S.get('recipes');
  const recipe = recipes.find(r => r.id === recipeId);
  if (recipe) {
    if (!recipe.items) recipe.items = [];
    if (!recipe.items.includes(text)) {
      recipe.items.push(text);
    }
    S.set('recipes', recipes);
  }
  inp.value = '';
  renderRecipes();
}

function delRecipeItem(recipeId, index) {
  const recipes = S.get('recipes');
  const recipe = recipes.find(r => r.id === recipeId);
  if (recipe && recipe.items) {
    recipe.items.splice(index, 1);
    S.set('recipes', recipes);
    renderRecipes();
  }
}

function renderRecipes() {
  const recipes = S.get('recipes');
  const el = document.getElementById('recipes-list');
  if (!recipes.length) {
    el.innerHTML = '<div class="empty-state">Inga sparade recept ännu.</div>';
    return;
  }
  el.innerHTML = recipes.map(r => `
    <div class="recipe-item" data-recipe-id="${r.id}">
      <div class="recipe-header" onclick="toggleRecipe(${r.id})">
        <span class="recipe-toggle">›</span>
        <span class="recipe-name">${r.name}</span>
        <div class="recipe-actions">
          <button onclick="addRecipeItems(${r.id}); event.stopPropagation()">+</button>
          <button onclick="delRecipe(${r.id}); event.stopPropagation()">✕</button>
        </div>
      </div>
      <div class="recipe-items">
        ${(r.items || []).map((ing, idx) => `
          <div class="recipe-ingredient">
            <input type="checkbox">
            <label>${ing}</label>
            <button onclick="delRecipeItem(${r.id}, ${idx})" style="margin-left:auto;font-size:16px;padding:2px 4px;">✕</button>
          </div>
        `).join('')}
        <div class="recipe-add-item">
          <input type="text" placeholder="Lägg till ingrediens..." onkeydown="saveRecipeItem(${r.id}, event)">
          <button onclick="document.querySelector('[data-recipe-id=\\\"${r.id}\\\"] .recipe-add-item input').focus()">+</button>
        </div>
      </div>
    </div>
  `).join('');
}

document.addEventListener('click', e => {
  document.querySelectorAll('.dropdown-wrapper').forEach(w => {
    if (!w.contains(e.target)) w.classList.remove('open');
  });
});
document.querySelectorAll('.dropdown-btn').forEach(btn => {
  btn.addEventListener('click', e => {
    e.target.closest('.dropdown-wrapper').classList.toggle('open');
  });
});
</script>
</body>
</html>
