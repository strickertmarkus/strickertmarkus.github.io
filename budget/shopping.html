<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inköpslista — Familia Strickert</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <style>
    :root{--bg:#0F1621;--bg2:#161E2F;--bg3:#1A2335;--border:rgba(255,255,255,0.07);--text:#E2EEFF;--text-sec:#7A8FA0;--text-dim:#3A4A60;--accent:#FBBF24;--radius:12px;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html{scroll-behavior:smooth;}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;}
    body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 40% at 50% -5%,rgba(251,191,36,.06) 0%,transparent 60%);pointer-events:none;z-index:0;}
    .wrap{position:relative;z-index:1;}
    /* header */
    .app-header{padding:18px 16px;border-bottom:1px solid var(--border);background:rgba(15,22,33,.8);backdrop-filter:blur(10px);position:sticky;top:0;z-index:100;}
    .header-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px;}
    .h-logo{font-size:26px;line-height:1;}
    .h-title{flex:1;font-size:17px;font-weight:700;letter-spacing:-.5px;}
    .h-back{text-decoration:none;color:var(--text-sec);font-size:12px;font-weight:600;padding:6px 12px;border:1px solid var(--border);border-radius:8px;transition:all .2s;}
    .h-back:hover{color:var(--text);border-color:rgba(255,255,255,.15);background:rgba(255,255,255,.05);}
    /* layout */
    .main{max-width:1100px;margin:0 auto;padding:20px 16px 60px;display:grid;grid-template-columns:220px 1fr;gap:18px;}
    /* sidebar */
    .sidebar{background:rgba(22,30,47,.6);border:1px solid var(--border);border-radius:var(--radius);padding:14px;align-self:start;}
    .sb-head{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--text-dim);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;}
    .sb-btn{background:transparent;border:1px solid var(--accent);color:var(--accent);padding:3px 8px;border-radius:5px;font-size:11px;cursor:pointer;font-family:inherit;transition:all .2s;}
    .sb-btn:hover{background:rgba(251,191,36,.1);}
    .list-stack{display:flex;flex-direction:column;gap:5px;}
    .list-row{display:flex;align-items:center;gap:6px;padding:9px 11px;background:rgba(255,255,255,.04);border:1px solid transparent;border-radius:8px;cursor:pointer;font-size:13px;transition:all .2s;}
    .list-row:hover{background:rgba(255,255,255,.08);}
    .list-row.active{background:rgba(251,191,36,.15);border-color:var(--accent);color:var(--accent);font-weight:600;}
    .list-row span{flex:1;}
    .list-del{color:#EF4444;opacity:0;transition:opacity .2s;font-size:14px;}
    .list-row:hover .list-del{opacity:1;}
    .list-empty{font-size:12px;color:var(--text-dim);text-align:center;padding:14px 0;}
    /* main area */
    .content{display:flex;flex-direction:column;gap:14px;}
    /* panels */
    .panel{background:rgba(22,30,47,.6);border:1px solid var(--border);border-radius:var(--radius);padding:16px;}
    .panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
    .panel-title{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-sec);}
    .panel-btn{background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.4);color:var(--accent);padding:5px 11px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s;}
    .panel-btn:hover{background:rgba(251,191,36,.22);}
    /* recipes */
    .recipe-stack{display:flex;flex-direction:column;gap:7px;}
    .recipe-card{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:9px;overflow:hidden;}
    .recipe-top{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;transition:background .2s;}
    .recipe-top:hover{background:rgba(251,191,36,.06);}
    .recipe-icon{font-size:16px;}
    .recipe-name{flex:1;font-size:13px;font-weight:600;}
    .recipe-count{font-size:11px;color:var(--text-dim);}
    .recipe-del{color:#EF4444;opacity:0;transition:opacity .2s;font-size:14px;padding:0 4px;}
    .recipe-top:hover .recipe-del{opacity:1;}
    .recipe-toggle{font-size:10px;color:var(--text-dim);transition:transform .2s;}
    .recipe-card.open .recipe-toggle{transform:rotate(90deg);}
    .recipe-ingredients{display:none;flex-direction:column;gap:3px;padding:0 12px 10px 38px;}
    .recipe-card.open .recipe-ingredients{display:flex;}
    .ri-row{font-size:11px;color:var(--text-sec);display:flex;align-items:center;gap:6px;}
    .ri-row::before{content:'•';color:var(--accent);}
    /* add to list from recipe */
    .recipe-add-btn{font-size:11px;margin-top:6px;align-self:start;}
    /* items */
    .items-toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
    .t-btn{background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--text-sec);padding:6px 12px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s;}
    .t-btn:hover{background:rgba(255,255,255,.09);color:var(--text);}
    .t-btn.primary{background:var(--accent);color:var(--bg);border-color:var(--accent);}
    .t-btn.primary:hover{background:#F9A948;}
    .items-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
    .store-block{background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:9px;padding:11px;}
    .store-title{font-size:11px;font-weight:700;color:var(--accent);margin-bottom:7px;display:flex;justify-content:space-between;}
    .item-row{display:flex;align-items:center;gap:7px;padding:5px 6px;border-radius:6px;font-size:12px;transition:background .15s;}
    .item-row:hover{background:rgba(255,255,255,.05);}
    .item-cb{width:15px;height:15px;accent-color:var(--accent);cursor:pointer;flex-shrink:0;}
    .item-label{flex:1;cursor:pointer;}
    .item-label.done{text-decoration:line-through;color:var(--text-dim);}
    .item-del{color:#EF4444;opacity:0;transition:opacity .2s;font-size:13px;cursor:pointer;flex-shrink:0;}
    .item-row:hover .item-del{opacity:1;}
    .no-items{grid-column:1/-1;text-align:center;padding:24px;color:var(--text-dim);font-size:12px;}
    /* modal */
    .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;align-items:center;justify-content:center;}
    .modal.show{display:flex;}
    .mbox{background:var(--bg3);border:1px solid var(--border);border-radius:14px;padding:22px;width:90%;max-width:400px;max-height:90vh;overflow-y:auto;}
    .m-title{font-size:15px;font-weight:700;margin-bottom:14px;}
    .m-inp{width:100%;padding:9px 11px;background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--text);border-radius:8px;font-size:13px;font-family:inherit;margin-bottom:9px;}
    .m-inp:focus{outline:none;border-color:var(--accent);}
    .m-inp::placeholder{color:var(--text-dim);}
    .m-sel{width:100%;padding:9px 11px;background:rgba(15,22,33,.9);border:1px solid var(--border);color:var(--text);border-radius:8px;font-size:13px;font-family:inherit;margin-bottom:9px;}
    .m-row{display:flex;gap:8px;margin-top:14px;}
    .m-row button{flex:1;padding:10px;border:none;border-radius:8px;cursor:pointer;font-weight:700;font-size:13px;font-family:inherit;transition:all .2s;}
    .m-cancel{background:rgba(255,255,255,.07);color:var(--text);}
    .m-cancel:hover{background:rgba(255,255,255,.13);}
    .m-save{background:var(--accent);color:#0F1621;}
    .m-save:hover{background:#F9A948;}
    .m-note{font-size:11px;color:var(--text-dim);margin-bottom:8px;}
    /* responsive */
    @media(max-width:860px){.main{grid-template-columns:1fr;}.items-grid{grid-template-columns:1fr;}}
    @media(max-width:520px){.main{padding:14px 10px 50px;}.panel{padding:12px;}.h-title{font-size:15px;}}
  </style>
</head>
<body>
<div class="wrap">

<header class="app-header">
  <div class="header-inner">
    <span class="h-logo">🛒</span>
    <h1 class="h-title">Inköpslista</h1>
    <a href="index.html" class="h-back">← Hem</a>
  </div>
</header>

<main class="main">

  <!-- Sidebar: lists -->
  <aside class="sidebar">
    <div class="sb-head">Listor <button class="sb-btn" onclick="openModal('list-modal')">+ Ny</button></div>
    <div class="list-stack" id="list-stack"><div class="list-empty">Inga listor</div></div>
  </aside>

  <!-- Content -->
  <div class="content">

    <!-- Recipes panel -->
    <div class="panel">
      <div class="panel-head">
        <span class="panel-title">📋 Recept</span>
        <button class="panel-btn" onclick="openModal('recipe-modal')">+ Nytt recept</button>
      </div>
      <div class="recipe-stack" id="recipe-stack"><div style="font-size:12px;color:var(--text-dim);">Inga recept än.</div></div>
    </div>

    <!-- Items panel -->
    <div class="panel">
      <div class="panel-head">
        <span class="panel-title">🧺 Artiklar</span>
        <button class="panel-btn" onclick="openModal('item-modal')">+ Ny artikel</button>
      </div>
      <div class="items-toolbar">
        <button class="t-btn primary" onclick="autoSort()">🔄 Sortera butiksmässigt</button>
        <button class="t-btn" onclick="clearChecked()">✓ Rensa bockade</button>
      </div>
      <div class="items-grid" id="items-grid"><div class="no-items">Välj eller skapa en lista för att börja.</div></div>
    </div>

  </div>
</main>

</div><!-- .wrap -->

<!-- Modal: New list -->
<div class="modal" id="list-modal">
  <div class="mbox">
    <div class="m-title">Ny inköpslista</div>
    <input class="m-inp" id="list-name-inp" type="text" placeholder="T.ex. Veckans mat">
    <div class="m-row">
      <button class="m-cancel" onclick="closeModal('list-modal')">Avbryt</button>
      <button class="m-save" onclick="saveList()">Skapa</button>
    </div>
  </div>
</div>

<!-- Modal: New recipe -->
<div class="modal" id="recipe-modal">
  <div class="mbox">
    <div class="m-title">Nytt recept</div>
    <input class="m-inp" id="recipe-name-inp" type="text" placeholder="Receptnamn (t.ex. Pasta Carbonara)">
    <div class="m-note">Ingredienser (en per rad):</div>
    <div id="ing-stack"></div>
    <button class="t-btn" onclick="addIngRow()" style="width:100%;margin-bottom:10px;">+ Ingrediens</button>
    <div class="m-row">
      <button class="m-cancel" onclick="closeModal('recipe-modal')">Avbryt</button>
      <button class="m-save" onclick="saveRecipe()">Spara</button>
    </div>
  </div>
</div>

<!-- Modal: New item -->
<div class="modal" id="item-modal">
  <div class="mbox">
    <div class="m-title">Ny artikel</div>
    <input class="m-inp" id="item-text-inp" type="text" placeholder="Artikelnamn">
    <div class="m-note">Kopplat recept (valfritt):</div>
    <select class="m-sel" id="item-recipe-sel"><option value="">— Inget recept —</option></select>
    <div class="m-note">Butik/avdelning:</div>
    <select class="m-sel" id="item-store-sel"><option value="">— Välj befintlig —</option></select>
    <input class="m-inp" id="item-store-new" type="text" placeholder="Eller ange ny butik/avdelning">
    <div class="m-row">
      <button class="m-cancel" onclick="closeModal('item-modal')">Avbryt</button>
      <button class="m-save" onclick="saveItem()">Lägg till</button>
    </div>
  </div>
</div>

<script>
/* ── storage ── */
const S = {
  get: k => JSON.parse(localStorage.getItem('sh_' + k) || '[]'),
  set: (k, v) => localStorage.setItem('sh_' + k, JSON.stringify(v))
};

/* ── default ICA Maxi store order ── */
function defaultStores() {
  const d = S.get('stores');
  if (d.length) return;
  S.set('stores', [
    {id:1, name:'Frukt & Grönt', order:1},
    {id:2, name:'Bröd & Bakverk', order:2},
    {id:3, name:'Kött & Chark', order:3},
    {id:4, name:'Fisk & Skaldjur', order:4},
    {id:5, name:'Mejeri & Ägg', order:5},
    {id:6, name:'Ost & Delikatess', order:6},
    {id:7, name:'Torrvaror', order:7},
    {id:8, name:'Konserver', order:8},
    {id:9, name:'Drycker', order:9},
    {id:10, name:'Frysta varor', order:10},
    {id:11, name:'Städ & Tvätt', order:11},
    {id:12, name:'Hygien', order:12},
    {id:99, name:'Övrigt', order:99}
  ]);
}

let activeList = null;
let ingCount = 0;

/* ── init ── */
document.addEventListener('DOMContentLoaded', () => {
  defaultStores();
  renderLists();
  renderRecipes();
  const lists = S.get('lists');
  if (lists.length) { activeList = lists[0].id; renderLists(); renderItems(); }
});

/* ── modal helpers ── */
function openModal(id) { document.getElementById(id).classList.add('show'); }
function closeModal(id) { document.getElementById(id).classList.remove('show'); }
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.querySelectorAll('.modal.show').forEach(m => m.classList.remove('show'));
});
document.querySelectorAll('.modal').forEach(m => m.addEventListener('click', e => { if (e.target === m) m.classList.remove('show'); }));

/* ── lists ── */
function renderLists() {
  const lists = S.get('lists');
  const el = document.getElementById('list-stack');
  if (!lists.length) { el.innerHTML = '<div class="list-empty">Inga listor</div>'; return; }
  el.innerHTML = lists.map(l => `
    <div class="list-row${l.id===activeList?' active':''}" onclick="selectList(${l.id})">
      <span>${l.name}</span>
      <span class="list-del" onclick="delList(event,${l.id})">✕</span>
    </div>`).join('');
}

function selectList(id) { activeList = id; renderLists(); renderItems(); }

function saveList() {
  const name = document.getElementById('list-name-inp').value.trim();
  if (!name) return;
  const lists = S.get('lists');
  const id = Date.now();
  lists.push({ id, name, items: [] });
  S.set('lists', lists);
  activeList = id;
  renderLists(); renderItems();
  closeModal('list-modal');
  document.getElementById('list-name-inp').value = '';
}

function delList(e, id) {
  e.stopPropagation();
  if (!confirm('Ta bort listan?')) return;
  let lists = S.get('lists').filter(l => l.id !== id);
  S.set('lists', lists);
  if (activeList === id) activeList = lists[0]?.id || null;
  renderLists(); renderItems();
}

/* ── recipes ── */
function renderRecipes() {
  const recipes = S.get('recipes');
  const el = document.getElementById('recipe-stack');
  if (!recipes.length) { el.innerHTML = '<div style="font-size:12px;color:var(--text-dim);">Inga recept än.</div>'; return; }
  el.innerHTML = recipes.map(r => `
    <div class="recipe-card" id="rc${r.id}">
      <div class="recipe-top" onclick="toggleRecipe(${r.id})">
        <span class="recipe-icon">🍽️</span>
        <span class="recipe-name">${r.name}</span>
        <span class="recipe-count">${r.items.length} ing.</span>
        <span class="recipe-del" onclick="delRecipe(event,${r.id})">✕</span>
        <span class="recipe-toggle">›</span>
      </div>
      <div class="recipe-ingredients">
        ${r.items.map(i => `<div class="ri-row">${i}</div>`).join('')}
        <button class="panel-btn recipe-add-btn" onclick="addFromRecipe(${r.id})">+ Lägg till i lista</button>
      </div>
    </div>`).join('');
}

function toggleRecipe(id) { document.getElementById('rc'+id)?.classList.toggle('open'); }

function addIngRow() {
  const c = document.getElementById('ing-stack');
  const d = document.createElement('div');
  d.innerHTML = `<input class="m-inp ing-inp" type="text" placeholder="Ingrediens">`;
  c.appendChild(d);
}

function saveRecipe() {
  const name = document.getElementById('recipe-name-inp').value.trim();
  if (!name) return;
  const items = [...document.querySelectorAll('.ing-inp')].map(i => i.value.trim()).filter(Boolean);
  if (!items.length) { alert('Lägg till minst en ingrediens.'); return; }
  const recipes = S.get('recipes');
  recipes.push({ id: Date.now(), name, items });
  S.set('recipes', recipes);
  renderRecipes();
  closeModal('recipe-modal');
  document.getElementById('recipe-name-inp').value = '';
  document.getElementById('ing-stack').innerHTML = '';
}

function delRecipe(e, id) {
  e.stopPropagation();
  if (!confirm('Ta bort receptet?')) return;
  S.set('recipes', S.get('recipes').filter(r => r.id !== id));
  renderRecipes();
}

function addFromRecipe(recipeId) {
  if (!activeList) { alert('Välj en inköpslista först.'); return; }
  const recipe = S.get('recipes').find(r => r.id === recipeId);
  if (!recipe) return;
  const lists = S.get('lists');
  const list = lists.find(l => l.id === activeList);
  if (!list) return;
  recipe.items.forEach(ing => {
    list.items.push({ id: Date.now() + Math.random(), text: ing, store: '', checked: false, recipeId });
  });
  S.set('lists', lists);
  renderItems();
}

/* ── items ── */
function renderItems() {
  const el = document.getElementById('items-grid');
  if (!activeList) { el.innerHTML = '<div class="no-items">Välj eller skapa en lista för att börja.</div>'; return; }
  const lists = S.get('lists');
  const list = lists.find(l => l.id === activeList);
  if (!list || !list.items.length) { el.innerHTML = '<div class="no-items">Listan är tom. Lägg till artiklar!</div>'; return; }
  const stores = S.get('stores');
  // group by store
  const groups = {};
  list.items.forEach(item => {
    const sn = item.store || 'Övrigt';
    if (!groups[sn]) groups[sn] = [];
    groups[sn].push(item);
  });
  // sort store groups by order
  const sortedKeys = Object.keys(groups).sort((a, b) => {
    const oa = stores.find(s => s.name === a)?.order ?? 98;
    const ob = stores.find(s => s.name === b)?.order ?? 98;
    return oa - ob;
  });
  el.innerHTML = sortedKeys.map(store => `
    <div class="store-block">
      <div class="store-title">${store}<span style="font-size:10px;color:var(--text-dim);">${groups[store].length}</span></div>
      ${groups[store].map(item => `
        <div class="item-row">
          <input class="item-cb" type="checkbox" ${item.checked?'checked':''} onchange="toggleItem(${activeList},'${item.id}',this.checked)">
          <span class="item-label${item.checked?' done':''}" onclick="this.previousElementSibling.click()">${item.text}</span>
          <span class="item-del" onclick="delItem(${activeList},'${item.id}')">✕</span>
        </div>`).join('')}
    </div>`).join('');
}

function openItemModal() {
  if (!activeList) { alert('Skapa en lista först.'); return; }
  const recipes = S.get('recipes');
  const rs = document.getElementById('item-recipe-sel');
  rs.innerHTML = '<option value="">— Inget recept —</option>';
  recipes.forEach(r => { rs.innerHTML += `<option value="${r.id}">${r.name}</option>`; });
  const stores = S.get('stores');
  const ss = document.getElementById('item-store-sel');
  ss.innerHTML = '<option value="">— Välj befintlig —</option>';
  stores.forEach(s => { ss.innerHTML += `<option value="${s.name}">${s.name}</option>`; });
  openModal('item-modal');
}

// override the inline onclick
document.querySelector('[onclick="openModal(\'item-modal\')"]')?.removeAttribute('onclick');
document.addEventListener('DOMContentLoaded', () => {
  const btn = document.querySelector('.panel-btn[onclick*="item-modal"]');
  if (btn) btn.setAttribute('onclick', 'openItemModal()');
});

function saveItem() {
  const text = document.getElementById('item-text-inp').value.trim();
  if (!text) return;
  let store = document.getElementById('item-store-sel').value || document.getElementById('item-store-new').value.trim();
  // add new store to store list if needed
  if (store && !S.get('stores').find(s => s.name === store)) {
    const stores = S.get('stores');
    const maxOrder = Math.max(...stores.map(s => s.order), 0);
    stores.splice(stores.length - 1, 0, { id: Date.now(), name: store, order: maxOrder });
    S.set('stores', stores);
  }
  const lists = S.get('lists');
  const list = lists.find(l => l.id === activeList);
  if (!list) return;
  if (!list.items) list.items = [];
  list.items.push({ id: Date.now(), text, store, checked: false });
  S.set('lists', lists);
  renderItems();
  closeModal('item-modal');
  document.getElementById('item-text-inp').value = '';
  document.getElementById('item-store-new').value = '';
}

function toggleItem(listId, itemId, checked) {
  const lists = S.get('lists');
  const list = lists.find(l => l.id === listId);
  const item = list?.items.find(i => String(i.id) === String(itemId));
  if (item) item.checked = checked;
  S.set('lists', lists);
  renderItems();
}

function delItem(listId, itemId) {
  const lists = S.get('lists');
  const list = lists.find(l => l.id === listId);
  if (list) list.items = list.items.filter(i => String(i.id) !== String(itemId));
  S.set('lists', lists);
  renderItems();
}

function clearChecked() {
  const lists = S.get('lists');
  const list = lists.find(l => l.id === activeList);
  if (list) list.items = list.items.filter(i => !i.checked);
  S.set('lists', lists);
  renderItems();
}

function autoSort() {
  if (!activeList) { alert('Välj en lista först.'); return; }
  const lists = S.get('lists');
  const list = lists.find(l => l.id === activeList);
  if (!list?.items?.length) return;
  const stores = S.get('stores');
  list.items.sort((a, b) => {
    const oa = stores.find(s => s.name === (a.store || 'Övrigt'))?.order ?? 98;
    const ob = stores.find(s => s.name === (b.store || 'Övrigt'))?.order ?? 98;
    if (oa !== ob) return oa - ob;
    return (a.text || '').localeCompare(b.text || '', 'sv');
  });
  S.set('lists', lists);
  renderItems();
}
</script>
</body>
