<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inköpslista</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#ffffff;--text:#1a1a1a;--text-sec:#666;--accent:#fbbf24;--border:#e0e0e0;--radius:6px;}
    *{box-sizing:border-box;margin:0;padding:0;}
    html{scroll-behavior:smooth;}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);line-height:1.5;font-size:14px;}
    .wrap{max-width:600px;margin:0 auto;padding:16px;}
    header{display:flex;align-items:center;gap:12px;margin-bottom:20px;border-bottom:1px solid var(--border);padding-bottom:12px;}
    .logo{font-size:18px;font-weight:600;}
    .header-right{margin-left:auto;display:flex;gap:8px;}
    .dropdown-wrapper{position:relative;}
    .dropdown-btn{background:none;border:1px solid var(--border);padding:6px 10px;border-radius:var(--radius);cursor:pointer;font-size:13px;color:var(--text-sec);transition:all .2s;}
    .dropdown-btn:hover{border-color:var(--text-sec);color:var(--text);}
    .dropdown-menu{display:none;position:absolute;top:calc(100% + 4px);right:0;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 4px 12px rgba(0,0,0,.1);min-width:180px;z-index:100;}
    .dropdown-wrapper.open .dropdown-menu{display:block;}
    .dropdown-menu a{display:block;padding:8px 12px;text-decoration:none;color:var(--text-sec);border-bottom:1px solid #f0f0f0;transition:background .2s;font-size:13px;}
    .dropdown-menu a:last-child{border-bottom:none;}
    .dropdown-menu a:hover{background:#f5f5f5;color:var(--text);}
    main{display:flex;flex-direction:column;gap:16px;}
    .list-item{display:flex;align-items:flex-start;gap:8px;padding:10px 0;border-bottom:1px solid #f0f0f0;}
    .list-item input[type="checkbox"]{width:18px;height:18px;margin-top:2px;cursor:pointer;accent-color:var(--accent);flex-shrink:0;}
    .list-item label{flex:1;cursor:pointer;padding:2px 0;}
    .list-item label.done{text-decoration:line-through;color:var(--text-sec);}
    .list-item .item-actions{opacity:0;display:flex;gap:6px;transition:opacity .2s;}
    .list-item:hover .item-actions{opacity:1;}
    .item-actions button{background:none;border:none;color:var(--text-sec);cursor:pointer;font-size:12px;transition:color .2s;padding:2px 4px;}
    .item-actions button:hover{color:var(--text);}
    .input-row{display:flex;gap:6px;margin-bottom:14px;}
    .input-row input{flex:1;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius);font-family:inherit;font-size:14px;outline:none;}
    .input-row input:focus{border-color:var(--accent);}
    .input-row button{padding:8px 12px;background:var(--accent);color:#1a1a1a;border:none;border-radius:var(--radius);cursor:pointer;font-weight:500;font-size:13px;transition:background .2s;}
    .input-row button:hover{background:#f9a948;}
    .section-title{font-size:12px;font-weight:600;text-transform:uppercase;color:var(--text-sec);margin-top:20px;margin-bottom:8px;letter-spacing:.5px;}
    .recipe-item{padding:10px 0;border-bottom:1px solid #f0f0f0;}
    .recipe-header{display:flex;align-items:center;gap:8px;cursor:pointer;padding:4px 0;}
    .recipe-toggle{font-size:12px;color:var(--text-sec);width:14px;transition:transform .2s;}
    .recipe-item.open .recipe-toggle{transform:rotate(90deg);}
    .recipe-name{flex:1;font-weight:500;color:var(--text);}
    .recipe-actions{opacity:0;display:flex;gap:6px;transition:opacity .2s;}
    .recipe-item:hover .recipe-actions{opacity:1;}
    .recipe-actions button{background:none;border:none;color:var(--text-sec);cursor:pointer;font-size:12px;transition:color .2s;padding:2px 4px;}
    .recipe-actions button:hover{color:var(--text);}
    .recipe-items{display:none;padding-left:24px;margin-top:6px;}
    .recipe-item.open .recipe-items{display:block;}
    .recipe-items .list-item{padding:6px 0;border-bottom:none;}
    .recipe-items .list-item:last-child{border-bottom:none;}
    .empty-state{text-align:center;padding:20px;color:var(--text-sec);font-size:13px;}
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">📝 Inköpslista</div>
    <div class="header-right">
      <div class="dropdown-wrapper">
        <button class="dropdown-btn">☰ Listor</button>
        <div class="dropdown-menu" id="lists-menu"></div>
      </div>
      <div class="dropdown-wrapper">
        <button class="dropdown-btn">☰ Recept</button>
        <div class="dropdown-menu" id="recipes-dropdown"></div>
      </div>
    </div>
  </header>

  <main>
    <div class="input-row">
      <input type="text" id="item-input" placeholder="Lägg till artikel…">
      <button onclick="addItem()">Lägg till</button>
    </div>

    <div id="items-list"></div>

    <div class="section-title">Sparade Recept</div>
    <div id="recipes-list"></div>
  </main>
</div>

<script>
let recipeSessionStore = [];
const deepClone = v => JSON.parse(JSON.stringify(v));
const S = {
  get: k => {
    if (k === 'recipes') return deepClone(recipeSessionStore);
    return JSON.parse(localStorage.getItem('sh_' + k) || '[]');
  },
  set: (k, v) => {
    if (k === 'recipes') {
      recipeSessionStore = deepClone(v);
      return;
    }
    localStorage.setItem('sh_' + k, JSON.stringify(v));
  }
};

let activeList = null;

document.addEventListener('DOMContentLoaded', () => {
  localStorage.removeItem('sh_recipes');
  recipeSessionStore = [];
  const lists = S.get('lists');
  if (!lists.length) {
    S.set('lists', [{id: 1, name: 'Huvudlista', createdAt: new Date().toISOString().slice(0,10), items: []}]);
  }
  activeList = S.get('lists')[0]?.id || 1;
  renderListsMenu();
  renderRecipesDropdown();
  renderItems();
  renderRecipes();
});

function renderListsMenu() {
  const lists = S.get('lists');
  const menu = document.getElementById('lists-menu');
  menu.innerHTML = lists.map(l => `<a href="#" onclick="selectList(${l.id}); return false;">${l.name}</a>`).join('') + 
    '<a href="#" onclick="createNewList(); return false;">+ Ny lista</a>';
}

function renderRecipesDropdown() {
  const recipes = S.get('recipes');
  const menu = document.getElementById('recipes-dropdown');
  menu.innerHTML = recipes.map(r => `<a href="#" onclick="addRecipeItems(${r.id}); return false;">Lägg till: ${r.name}</a>`).join('') +
    '<a href="#" onclick="createNewRecipe(); return false;">+ Nytt recept</a>';
}

function selectList(id) {
  activeList = id;
  renderListsMenu();
  renderItems();
}

function createNewList() {
  const name = prompt('Listans namn:');
  if (!name) return;
  const lists = S.get('lists');
  const id = Math.max(...lists.map(l => l.id || 0)) + 1;
  lists.push({id, name, createdAt: new Date().toISOString().slice(0,10), items: []});
  S.set('lists', lists);
  activeList = id;
  renderListsMenu();
  renderItems();
}

function createNewRecipe() {
  const name = prompt('Receptets namn:');
  if (!name) return;
  const recipes = S.get('recipes');
  const id = Math.max(...recipes.map(r => r.id || 0)) + 1;
  recipes.push({id, name, items: []});
  S.set('recipes', recipes);
  renderRecipesDropdown();
  renderRecipes();
}

function addItem() {
  const inp = document.getElementById('item-input');
  const text = inp.value.trim();
  if (!text) return;
  const lists = S.get('lists');
  const list = lists.find(l => l.id === activeList);
  if (!list) return;
  if (!list.items) list.items = [];
  list.items.push({id: Date.now(), text, checked: false});
  S.set('lists', lists);
  inp.value = '';
  renderItems();
}

function toggleItem(id, checked) {
  const lists = S.get('lists');
  const list = lists.find(l => l.id === activeList);
  const item = list?.items.find(i => i.id === id);
  if (item) item.checked = checked;
  S.set('lists', lists);
  renderItems();
}

function delItem(id) {
  const lists = S.get('lists');
  const list = lists.find(l => l.id === activeList);
  if (list) list.items = list.items.filter(i => i.id !== id);
  S.set('lists', lists);
  renderItems();
}

function renderItems() {
  const lists = S.get('lists');
  const list = lists.find(l => l.id === activeList);
  const items = list?.items || [];
  const el = document.getElementById('items-list');
  if (!items.length) {
    el.innerHTML = '<div class="empty-state">Inga artiklar. Lägg till en ovan.</div>';
    return;
  }
  el.innerHTML = items.map(i => `
    <div class="list-item">
      <input type="checkbox" ${i.checked ? 'checked' : ''} onchange="toggleItem(${i.id}, this.checked)">
      <label class="${i.checked ? 'done' : ''}" onclick="this.previousElementSibling.click()">${i.text}</label>
      <div class="item-actions">
        <button onclick="delItem(${i.id})">×</button>
      </div>
    </div>
  `).join('');
}

function addRecipeItems(recipeId) {
  const recipes = S.get('recipes');
  const recipe = recipes.find(r => r.id === recipeId);
  if (!recipe?.items?.length) return alert('Receptet har ingen ingredienser');
  const lists = S.get('lists');
  const list = lists.find(l => l.id === activeList);
  if (!list) return;
  if (!list.items) list.items = [];
  recipe.items.forEach(ingr => {
    if (!list.items.find(i => i.text === ingr)) {
      list.items.push({id: Date.now() + Math.random(), text: ingr, checked: false});
    }
  });
  S.set('lists', lists);
  renderItems();
}

function toggleRecipe(id) {
  const el = document.querySelector(`[data-recipe-id="${id}"]`);
  if (el) el.classList.toggle('open');
}

function delRecipe(id) {
  if (!confirm('Radera receptet?')) return;
  const recipes = S.get('recipes');
  S.set('recipes', recipes.filter(r => r.id !== id));
  renderRecipesDropdown();
  renderRecipes();
}

function renderRecipes() {
  const recipes = S.get('recipes');
  const el = document.getElementById('recipes-list');
  if (!recipes.length) {
    el.innerHTML = '<div class="empty-state">Inga sparade recept ännu.</div>';
    return;
  }
  el.innerHTML = recipes.map(r => `
    <div class="recipe-item" data-recipe-id="${r.id}">
      <div class="recipe-header" onclick="toggleRecipe(${r.id})">
        <span class="recipe-toggle">›</span>
        <span class="recipe-name">${r.name}</span>
        <div class="recipe-actions">
          <button onclick="addRecipeItems(${r.id}); event.stopPropagation()">+</button>
          <button onclick="delRecipe(${r.id}); event.stopPropagation()">×</button>
        </div>
      </div>
      <div class="recipe-items">
        ${(r.items || []).map(ing => `
          <div class="list-item">
            <input type="checkbox">
            <label>${ing}</label>
          </div>
        `).join('')}
      </div>
    </div>
  `).join('');
}

document.addEventListener('click', e => {
  document.querySelectorAll('.dropdown-wrapper').forEach(w => {
    if (!w.contains(e.target)) w.classList.remove('open');
  });
});
document.querySelectorAll('.dropdown-btn').forEach(btn => {
  btn.addEventListener('click', e => {
    e.target.closest('.dropdown-wrapper').classList.toggle('open');
  });
});
</script>
</body>
</html>
