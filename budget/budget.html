<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Budgetplanerare</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
    --bg: #F0F2F5;
    --card: #FFFFFF;
    --text: #1A1A2E;
    --text-sec: #6B7280;
    --border: #E5E7EB;
    --income: #10B981;
    --income-light: #D1FAE5;
    --income-bg: #ECFDF5;
    --house: #3B6DE0;
    --house-light: #DBEAFE;
    --house-bg: #EFF6FF;
    --insurance: #A855F7;
    --insurance-light: #EDE9FE;
    --insurance-bg: #F5F3FF;
    --subs: #E8590C;
    --subs-light: #FED7AA;
    --subs-bg: #FFF7ED;
    --savings: #0EA5E9;
    --savings-light: #BAE6FD;
    --savings-bg: #F0F9FF;
    --misc: #F472B6;
    --misc-light: #FBCFE8;
    --misc-bg: #FDF2F8;
    --danger: #DC2626;
    --warning: #F59E0B;
}

html.dark-mode {
    --bg: #0F1219;
    --card: #1A1F2E;
    --text: #E2E8F0;
    --text-sec: #94A3B8;
    --border: #2A3041;
    --income: #34D399;
    --income-light: #065F46;
    --income-bg: #0D2818;
    --house: #60A5FA;
    --house-light: #1E3A5F;
    --house-bg: #0F1A2E;
    --insurance: #A78BFA;
    --insurance-light: #4C1D95;
    --insurance-bg: #1A0F2E;
    --subs: #E8590C;
    --subs-light: #7C2D12;
    --subs-bg: #1F1008;
    --savings: #0EA5E9;
    --savings-light: #155E75;
    --savings-bg: #0A1A20;
    --misc: #FBBF24;
    --misc-light: #eec451;
    --misc-bg: #1F0A18;
    --danger: #F87171;
    --warning: #FBBF24;
}

/* ── DARK MODE TRANSITIONS ──────────────────────── */
body, .kpi-card, .chart-card, .section-card, .item-input, .btn, .add-btn {
    transition: background-color 0.35s ease, color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
}

/* ── DARK MODE ELEMENT OVERRIDES ────────────────── */
html.dark-mode .header {
    background: linear-gradient(135deg, #0B0F1A 0%, #151C2C 100%);
    box-shadow: 0 4px 30px rgba(0,0,0,0.5);
}

html.dark-mode .kpi-card {
    box-shadow: 0 2px 12px rgba(0,0,0,0.3);
}
html.dark-mode .kpi-card:hover {
    box-shadow: 0 8px 28px rgba(0,0,0,0.45);
}

html.dark-mode .kpi-remain .kpi-label,
html.dark-mode .kpi-remain .kpi-value {
    color: #60A5FA;
}

html.dark-mode .chart-card {
    box-shadow: 0 2px 12px rgba(0,0,0,0.3);
}

html.dark-mode .section-card {
    box-shadow: 0 2px 12px rgba(0,0,0,0.3);
}

html.dark-mode .items-table tbody td {
    border-bottom-color: var(--border);
}

html.dark-mode .item-input {
    background: rgba(255,255,255,0.04);
    border-color: var(--border);
    color: var(--text);
}
html.dark-mode .item-input:focus {
    background: rgba(255,255,255,0.07);
    border-color: #FFFFFF;
    box-shadow: 0 0 0 3px rgba(255,255,255,0.15);
}
html.dark-mode .item-input.has-value {
    background: rgba(52,211,153,0.07);
    border-color: rgba(52,211,153,0.25);
}
html.dark-mode .item-input.input-ok {
    background: rgba(34, 197, 94, 0.12);
    border-color: rgba(34, 197, 94, 0.4);
}
html.dark-mode .item-input.input-warn {
    background: rgba(245, 158, 11, 0.12);
    border-color: rgba(245, 158, 11, 0.4);
    box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.15);
}
html.dark-mode .item-input.input-over {
    background: rgba(220, 38, 38, 0.12);
    border-color: rgba(220, 38, 38, 0.4);
    box-shadow: 0 0 0 2px rgba(220, 38, 38, 0.15);
}
html.dark-mode .item-input.input-sav-ok {
    background: rgba(34, 197, 94, 0.12);
    border-color: rgba(34, 197, 94, 0.4);
}
html.dark-mode .item-input.input-sav-over {
    background: rgba(14, 165, 233, 0.12);
    border-color: rgba(14, 165, 233, 0.4);
    box-shadow: 0 0 0 2px rgba(14, 165, 233, 0.15);
}
html.dark-mode .item-input::placeholder {
    color: #4A5568;
}

html.dark-mode .editable-field:hover {
    background: rgba(255,255,255,0.07);
}
html.dark-mode .editable-input {
    background: rgba(255,255,255,0.05);
    border-color: #3B82F6;
    color: var(--text);
}

html.dark-mode .add-btn {
    border-color: var(--border);
    color: var(--text-sec);
}
html.dark-mode .add-btn:hover {
    border-color: #3B82F6;
    color: #60A5FA;
    background: rgba(59,130,246,0.1);
}

html.dark-mode .btn-secondary {
    background: var(--card);
    color: var(--text);
    border-color: var(--border);
}
html.dark-mode .btn-secondary:hover {
    background: #1E2538;
    border-color: #3A4255;
}

html.dark-mode .btn-danger {
    background: var(--card);
    color: var(--danger);
    border-color: rgba(248,113,113,0.2);
}
html.dark-mode .btn-danger:hover {
    background: rgba(248,113,113,0.07);
}

html.dark-mode .btn-export {
    background: var(--card);
    color: #60A5FA;
    border-color: rgba(96, 165, 250, 0.2);
}
html.dark-mode .btn-export:hover {
    background: rgba(96, 165, 250, 0.07);
    border-color: rgba(96, 165, 250, 0.4);
}

html.dark-mode .btn-json-export {
    background: var(--card);
    color: #34D399;
    border-color: rgba(52, 211, 153, 0.2);
}
html.dark-mode .btn-json-export:hover {
    background: rgba(52, 211, 153, 0.07);
    border-color: rgba(52, 211, 153, 0.4);
}

html.dark-mode .btn-json-import {
    background: var(--card);
    color: #A78BFA;
    border-color: rgba(167, 139, 250, 0.2);
}
html.dark-mode .btn-json-import:hover {
    background: rgba(167, 139, 250, 0.07);
    border-color: rgba(167, 139, 250, 0.4);
}

html.dark-mode .delete-btn {
    color: #F87171;
}
html.dark-mode .delete-btn:hover {
    color: #EF4444;
}

html.dark-mode .section-header:hover {
    filter: brightness(1.1);
}

#dark-mode-btn:hover {
    background: rgba(255,255,255,0.25) !important;
    transform: scale(1.08);
}
html.dark-mode #dark-mode-btn {
    background: rgba(255,255,255,0.1) !important;
    border-color: rgba(255,255,255,0.2) !important;
}
html.dark-mode #dark-mode-btn:hover {
    background: rgba(255,255,255,0.2) !important;
}

body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    min-height: 100vh;
}

/* ── HEADER ─────────────────────────────────────── */
.header {
    background: linear-gradient(135deg, #1E293B 0%, #334155 100%);
    color: white;
    padding: 32px 0 28px;
    text-align: center;
    position: relative;
    z-index: 100;
    box-shadow: 0 4px 24px rgba(0,0,0,0.15);
}
.header h1 {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.5px;
    margin-bottom: 4px;
}
.header p {
    font-size: 13px;
    color: #94A3B8;
    font-weight: 400;
}

/* ── LAYOUT ─────────────────────────────────────── */
.container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 28px 12px 80px;
    display: block;
}

/* ── KPI CARDS ──────────────────────────────────── */
.kpi-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 28px;
}
.kpi-card {
    background: var(--card);
    border-radius: 14px;
    padding: 22px 20px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    border: 1px solid var(--border);
    text-align: center;
    transition: transform 0.2s, box-shadow 0.2s;
}
.kpi-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.08); }
.kpi-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 6px;
}
.kpi-value {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.5px;
}
.kpi-sub {
    font-size: 11px;
    color: var(--text-sec);
    margin-top: 4px;
}
.kpi-income .kpi-label { color: var(--income); }
.kpi-income .kpi-value { color: var(--income); }
.kpi-budget .kpi-label { color: var(--text-sec); }
.kpi-budget .kpi-value { color: var(--text); }
.kpi-spent .kpi-label { color: var(--danger); }
.kpi-spent .kpi-value { color: var(--danger); }
.kpi-remain .kpi-label { color: #2563EB; }
.kpi-remain .kpi-value { color: #2563EB; }

/* ── CHARTS ROW ─────────────────────────────────── */
.charts-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 28px;
}
.chart-card {
    background: var(--card);
    border-radius: 14px;
    padding: 24px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    border: 1px solid var(--border);
}
.chart-card h3 {
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 16px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
}
.chart-wrap {
    position: relative;
    width: 100%;
    height: 294px;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* ── SECTION CARDS ──────────────────────────────── */
.section-card {
    background: var(--card);
    border-radius: 14px;
    margin-bottom: 20px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    border: 1px solid var(--border);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-height: auto;
}
.section-header {
    padding: 18px 24px 18px 50px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    user-select: none;
    position: relative;
}
.section-header:hover { filter: brightness(0.97); }
.section-title {
    font-size: 16px;
    font-weight: 700;
    color: white;
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 150px;
}
.section-title .arrow {
    font-size: 12px;
    transition: transform 0.3s;
    opacity: 0.7;
}
.section-header.collapsed .arrow { transform: rotate(-90deg); }
.header-progress {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.section-body {
    padding: 0 24px 20px;
    overflow: hidden;
    transition: max-height 0.4s ease, padding 0.3s ease;
    flex: 1;
    display: flex;
    flex-direction: column;
}
.section-body.hidden {
    max-height: 0 !important;
    padding-top: 0;
    padding-bottom: 0;
}

/* ── PROGRESS BAR ───────────────────────────────── */
.progress-container {
    margin: 0;
    flex: 1;
}
.header-progress .progress-container {
    margin: 0;
}
.progress-info {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    margin-bottom: 4px;
    color: rgba(255,255,255,0.8);
    font-weight: 500;
}
.progress-bar {
    width: 100%;
    height: 24px;
    background: rgba(0,0,0,0.35);
    border-radius: 12px;
    overflow: hidden;
    border: 2px solid rgba(255,255,255,0.7);
    display: flex;
    position: relative;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
}
.progress-segment {
    height: 100%;
    transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    min-width: 0;
    border-right: none;
    opacity: 0.88;
}
.progress-segment:first-child { border-radius: 12px 0 0 12px; }
.progress-segment:last-child { border-radius: 0 12px 12px 0; }
.progress-segment:only-child { border-radius: 12px; }
.progress-pct {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 13px;
    font-weight: 900;
    color: white;
    text-shadow: 0 2px 4px rgba(0,0,0,0.6), 0 -1px 0 rgba(0,0,0,0.3);
    pointer-events: none;
    letter-spacing: 0.5px;
}

/* ── ITEMS TABLE ────────────────────────────────── */
.items-table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    margin-top: 12px;
}
.items-table {
    table-layout: auto;
}
.items-table thead th {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--text-sec);
    padding: 8px 6px;
    text-align: left;
    border-bottom: 2px solid var(--border);
    white-space: nowrap;
}
.items-table thead th:first-child {
    width: auto;
}
.items-table thead th:nth-child(2) {
    width: 70px;
    padding-left: 4px;
}
.items-table thead th:nth-child(3) {
    width: 90px;
}
.items-table thead th:nth-child(4) {
    width: 40px;
}
.items-table thead th:nth-child(2),
.items-table thead th:nth-child(3),
.items-table thead th:nth-child(4) { text-align: right; }
.items-table tbody td {
    padding: 10px 6px;
    font-size: 13px;
    border-bottom: 1px solid #F3F4F6;
    vertical-align: middle;
}
.items-table tbody tr:last-child td { border-bottom: none; }
.items-table tbody td:first-child {
    font-weight: 500;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 6px;
    word-break: break-word;
}
.editable-field {
    cursor: pointer;
    padding: 2px 4px;
    border-radius: 4px;
    transition: background 0.2s;
}
.editable-field:hover {
    background: rgba(0,0,0,0.05);
}
.editable-input {
    border: 2px solid #2563EB;
    border-radius: 4px;
    padding: 3px 5px;
    font-size: 13px;
    font-family: 'Inter', sans-serif;
    width: auto;
    min-width: 50px;
    max-width: 90px;
}
.delete-btn {
    background: none;
    border: none;
    color: #DC2626;
    cursor: pointer;
    font-size: 16px;
    padding: 0;
    line-height: 1;
    opacity: 0;
    transition: opacity 0.2s;
}
.items-table tbody tr:hover .delete-btn {
    opacity: 1;
}
.delete-btn:hover {
    color: #B91C1C;
}
.section-title-editable {
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 6px;
    transition: background 0.2s;
}
.section-title-editable:hover {
    background: rgba(255,255,255,0.15);
}
.items-table tbody td:nth-child(2) {
    text-align: right;
    color: var(--text-sec);
    font-weight: 500;
    font-variant-numeric: tabular-nums;
}
.items-table tbody td:nth-child(3) { text-align: right; }
.items-table tbody td:nth-child(4) {
    text-align: right;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    font-size: 12px;
}

.item-input {
    width: 70px;
    padding: 4px 6px;
    border: 1.5px solid var(--border);
    border-radius: 6px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 500;
    text-align: right;
    background: #FAFAFA;
    transition: border-color 0.2s, box-shadow 0.2s;
    font-variant-numeric: tabular-nums;
}
.item-input:focus {
    outline: none;
    border-color: #FFFFFF;
    box-shadow: 0 0 0 2px rgba(255,255,255,0.2);
}
.item-input.has-value { background: white; border-color: #A7F3D0; }
.item-input.input-ok { 
    border-color: #A7F3D0; 
    background: rgba(34, 197, 94, 0.08);
}
.item-input.input-warn { 
    border-color: #F59E0B; 
    background: rgba(245, 158, 11, 0.08);
    box-shadow: 0 0 0 2px rgba(245,158,11,0.12); 
}
.item-input.input-over { 
    border-color: #DC2626; 
    background: rgba(220, 38, 38, 0.08);
    box-shadow: 0 0 0 2px rgba(220,38,38,0.12); 
}
.item-input.input-sav-ok {
    border-color: #A7F3D0;
    background: rgba(34, 197, 94, 0.08);
}
.item-input.input-sav-over {
    border-color: #0EA5E9;
    background: rgba(14, 165, 233, 0.08);
    box-shadow: 0 0 0 2px rgba(14, 165, 233, 0.12);
}

.item-pct { font-size: 11px; }
.item-pct.ok { color: var(--income); }
.item-pct.warn { color: var(--warning); }
.item-pct.over { color: var(--danger); font-weight: 700; }
.item-pct.saving-ok { color: var(--income); }
.item-pct.saving-positive { color: #0EA5E9; font-weight: 700; }

.section-card[data-section-key="subscriptions"] .item-pct.warn { color: #DC2626; }
html.dark-mode .section-card[data-section-key="subscriptions"] .item-pct.warn { color: #FCA5A5; }

/* ── ADD / ACTIONS ──────────────────────────────── */
.add-row {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    align-items: center;
}
.add-btn {
    padding: 6px 14px;
    border: 1.5px dashed var(--border);
    border-radius: 8px;
    background: transparent;
    color: var(--text-sec);
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
}
.add-btn:hover {
    border-color: #93C5FD;
    color: #2563EB;
    background: #EFF6FF;
}

/* ── FOOTER ─────────────────────────────────────── */
.footer-actions {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-top: 32px;
}
.btn {
    padding: 12px 28px;
    border: none;
    border-radius: 10px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
}
.btn-primary {
    background: linear-gradient(135deg, #2563EB, #1D4ED8);
    color: white;
    box-shadow: 0 4px 12px rgba(37,99,235,0.3);
}
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(37,99,235,0.4); }
.btn-secondary {
    background: white;
    color: var(--text);
    border: 1.5px solid var(--border);
}
.btn-secondary:hover { background: #F9FAFB; border-color: #D1D5DB; }
.btn-danger {
    background: white;
    color: var(--danger);
    border: 1.5px solid #FECACA;
}
.btn-danger:hover { background: #FEF2F2; }
.btn-export {
    background: white;
    color: #2563EB;
    border: 1.5px solid #BFDBFE;
}
.btn-export:hover { background: #EFF6FF; border-color: #93C5FD; }
.btn-json-export {
    background: white;
    color: #059669;
    border: 1.5px solid #D1FAE5;
}
.btn-json-export:hover { background: #ECFDF5; border-color: #6EE7B7; }
.btn-json-import {
    background: white;
    color: #7c3aed;
    border: 1.5px solid #EDE9FE;
}
.btn-json-import:hover { background: #F5F3FF; border-color: #C4B5FD; }

.draggable-row {
    cursor: grab;
    position: relative;
    transition: transform 0.2s ease, opacity 0.2s ease, background-color 0.15s ease;
    user-select: none;
    -webkit-user-select: none;
}
.draggable-row:active {
    cursor: grabbing;
}
.draggable-row.dragging {
    opacity: 0.4;
    background-color: rgba(100, 149, 237, 0.15);
    cursor: grabbing;
}
.draggable-row.shift-down {
    transform: translateY(var(--row-height, 44px));
}
.draggable-row.shift-up {
    transform: translateY(calc(-1 * var(--row-height, 44px)));
}
.drag-placeholder {
    background: rgba(37, 99, 235, 0.1);
    border: 2px dashed #2563EB;
    height: 44px;
}
.drag-placeholder td {
    padding: 0 !important;
    border: none !important;
}

/* ── TABLE SCROLL WRAPPER ───────────────────────── */
.table-scroll-wrapper {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
}

/* ── SECTIONS GRID (moved from inline style) ───── */
#sections-container {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
}

/* ── RESPONSIVE ─────────────────────────────────── */
@media (min-width: 1600px) {
    .item-input { width: 140px; padding: 6px 8px; font-size: 13px; }
    .items-table tbody td:nth-child(2),
    .items-table tbody td:nth-child(3) { padding: 12px 8px; }
}

@media (max-width: 1200px) {

// ── DATA MODEL ─────────────────────────────────────────────

    },
];

// ── HELPERS ────────────────────────────────────────────────
const fmt = (v) => {
    const n = Math.round(v);
    return n.toLocaleString("sv-SE");
};
const pct = (spent, budget) => budget > 0 ? Math.round((spent / budget) * 100) : 0;
const isDarkMode = () => document.documentElement.classList.contains('dark-mode');
const hexToRgb = (hex) => {
    const r = parseInt(hex.slice(1,3), 16);
    const g = parseInt(hex.slice(3,5), 16);
    const b = parseInt(hex.slice(5,7), 16);
    return `${r},${g},${b}`;
};

function shadeColor(hex, amount) {
    let r = parseInt(hex.slice(1,3), 16);
    let g = parseInt(hex.slice(3,5), 16);
    let b = parseInt(hex.slice(5,7), 16);
    
    // Convert to HSL for better saturation control
    r /= 255;
    g /= 255;
    b /= 255;
    const max = Math.max(r, g, b);
    const min = Math.min(r, g, b);
    let h, s, l = (max + min) / 2;
    
    if (max === min) {
        h = s = 0;
    } else {
        const d = max - min;
        s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
        switch(max) {
            case r: h = ((g - b) / d + (g < b ? 6 : 0)) / 6; break;
            case g: h = ((b - r) / d + 2) / 6; break;
            case b: h = ((r - g) / d + 4) / 6; break;
        }
    }
    
    // Adjust saturation and lightness
    s = Math.min(1, s + 0.2);
    l = amount > 0 ? Math.min(1, l + 0.15) : Math.max(0.3, l - 0.15);
    
    // Convert back to RGB
    const c = (1 - Math.abs(2 * l - 1)) * s;
    const x = c * (1 - Math.abs((h * 6) % 2 - 1));
    const m = l - c / 2;
    let cr, cg, cb;
    
    if (h < 1/6) { cr = c; cg = x; cb = 0; }
    else if (h < 2/6) { cr = x; cg = c; cb = 0; }
    else if (h < 3/6) { cr = 0; cg = c; cb = x; }
    else if (h < 4/6) { cr = 0; cg = x; cb = c; }
    else if (h < 5/6) { cr = x; cg = 0; cb = c; }
    else { cr = c; cg = 0; cb = x; }
    
    r = Math.round((cr + m) * 255);
    g = Math.round((cg + m) * 255);
    b = Math.round((cb + m) * 255);
    
    return `rgb(${r},${g},${b})`;
}

// ── MONTH MANAGEMENT ───────────────────────────────────────
let currentMonth = new Date();
let monthlyData = {}; // Format: "2026-01" -> { sections: [...] }

function getMonthKey(date) {
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, '0');
    return `${year}-${month}`;
}

function getMonthDisplay(date) {
    const months = ["Januari", "Februari", "Mars", "April", "Maj", "Juni", "Juli", "Augusti", "September", "Oktober", "November", "December"];
    return `${months[date.getMonth()]} ${date.getFullYear()}`;
}

function getCurrentMonthSections() {
    const key = getMonthKey(currentMonth);
    if (!monthlyData[key]) {
        monthlyData[key] = { sections: JSON.parse(JSON.stringify(SECTIONS)) };
    }
    return monthlyData[key].sections;
}

function onMonthSelect() {
    // Month is already set by the dropdown click handler
    updateMonthDisplay();
    renderKPIs();
    renderSections();
    initCharts();
    saveLocal();
}

function openSetStartMonth() {
    // Allow user to select which month to use as the start/base month
    const [currentYear, currentMonth_num] = getMonthKey(currentMonth).split('-').map(Number);
    const selectedYear = prompt("Ange startår (ex: 2026):", currentYear.toString());
    
    if (selectedYear === null) return;  // User cancelled
    const year = parseInt(selectedYear);
    if (isNaN(year) || year < 1900 || year > 2100) {
        alert("Ogiltigt år");
        return;
    }
    
    const months = ["Januari", "Februari", "Mars", "April", "Maj", "Juni", "Juli", "Augusti", "September", "Oktober", "November", "December"];
    const monthName = prompt("Ange startmånad (ex: Mars):", months[currentMonth_num - 1]);
    
    if (monthName === null) return;  // User cancelled
    const monthIdx = months.findIndex(m => m.toLowerCase() === monthName.toLowerCase());
    if (monthIdx === -1) {
        alert("Ogiltig månad. Använd ett av: " + months.join(", "));
        return;
    }
    
    // Set as new start month
    currentMonth = new Date(year, monthIdx, 1);
    const newKey = getMonthKey(currentMonth);
    
    // Ensure this month exists in the data
    if (!monthlyData[newKey]) {
        monthlyData[newKey] = { sections: JSON.parse(JSON.stringify(SECTIONS)) };
    }
    
    updateMonthDisplay();
    renderKPIs();
    renderSections();
    initCharts();
    saveLocal();
}

function addNewMonth() {
    // Find the next month that doesn't already exist
    let nextDate = new Date(currentMonth);
    nextDate.setDate(1);
    
    // Keep incrementing until we find a month that doesn't exist
    let attempts = 0;
    while (attempts < 12) {  // Safety limit to prevent infinite loop
        nextDate.setMonth(nextDate.getMonth() + 1);
        const nextKey = getMonthKey(nextDate);
        
        if (!monthlyData[nextKey]) {
            // Found a month that doesn't exist - create it
            monthlyData[nextKey] = { sections: JSON.parse(JSON.stringify(SECTIONS)) };
            currentMonth = nextDate;
            updateMonthDisplay();
            refresh();
            saveLocal();
            return;
        }
        attempts++;
    }
    
    // Fallback (should rarely happen)
    alert("Could not create a new month");
}

function deleteCurrentMonth() {
    const currentKey = getMonthKey(currentMonth);
    let allKeys = Object.keys(monthlyData).sort();
    
    // Can't delete if only one month left
    if (allKeys.length <= 1) {
        alert("Du måste ha minst en månad");
        return;
    }
    
    // Confirm deletion
    if (!confirm(`Är du säker på att du vill radera ${getMonthDisplay(currentMonth)}?`)) {
        return;
    }
    
    // Find next month BEFORE deletion
    const currentIndex = allKeys.indexOf(currentKey);
    let nextKey;
    if (currentIndex > 0) {
        nextKey = allKeys[currentIndex - 1];
    } else if (currentIndex < allKeys.length - 1) {
        nextKey = allKeys[currentIndex + 1];
    } else {
        nextKey = allKeys[0];  // Fallback to first (should not happen if length > 1)
    }
    
    // Now delete
    delete monthlyData[currentKey];
    
    const [y, m] = nextKey.split('-').map(Number);
    currentMonth = new Date(y, m - 1, 1);
    updateMonthDisplay();
    refresh();
    saveLocal();
}

function updateMonthDisplay() {
    // Update dropdown
    const dropdown = document.getElementById("month-dropdown");
    const dropdownMenu = document.getElementById("month-dropdown-menu");
    dropdownMenu.innerHTML = "";
    const sortedMonths = Object.keys(monthlyData).sort();
    const selectedKey = getMonthKey(currentMonth);
    let selectedLabel = "Välj månad";
    
    sortedMonths.forEach(key => {
        const date = new Date(parseInt(key.split('-')[0]), parseInt(key.split('-')[1]) - 1, 1);
        const label = getMonthDisplay(date);
        if (key === selectedKey) selectedLabel = label;
        
        const item = document.createElement("div");
        item.className = "custom-dropdown-item" + (key === selectedKey ? " selected" : "");
        item.textContent = label;
        item.onclick = () => {
            currentMonth = date;
            onMonthSelect();
            dropdownMenu.classList.remove("active");
        };
        dropdownMenu.appendChild(item);
    });
    
    dropdown.textContent = selectedLabel;
}

// ── COMPUTE TOTALS ─────────────────────────────────────────
function computeTotals() {
    let totalIncome = 0, totalBudget = 0, totalSpent = 0;
    const sections = getCurrentMonthSections();
    sections.forEach(s => {
        if (s.isIncome) {
            totalIncome = s.items.reduce((sum, it) => sum + (it.actual || it.budget), 0);
        } else {
            totalBudget += s.items.reduce((sum, it) => sum + it.budget, 0);
            totalSpent += s.items.reduce((sum, it) => sum + it.actual, 0);
        }
    });
    return { totalIncome, totalBudget, totalSpent, remaining: totalIncome - totalSpent };
}

// ── RENDER KPIs ────────────────────────────────────────────
function renderKPIs() {
    const t = computeTotals();
    document.getElementById("kpi-income").textContent = fmt(t.totalIncome);
    document.getElementById("kpi-budget").textContent = fmt(t.totalBudget);
    document.getElementById("kpi-spent").textContent = fmt(t.totalSpent);
    document.getElementById("kpi-remain").textContent = fmt(t.remaining);

    const remainEl = document.getElementById("kpi-remain");
    if (t.remaining < 0) {
        remainEl.style.color = "var(--danger)";
    } else {
        remainEl.style.color = "#2563EB";
    }
}

            const totalActual = section.items.reduce((s, it) => s + it.actual, 0);
            const pctDisplay = pct(totalActual, totalBudget);

            let segmentsHTML = "";
            if (totalBudget > 0 && totalActual > 0) {
                const segPct = Math.min((totalActual / totalBudget) * 100, 100);
                segmentsHTML = `
                    <div class="progress-segment"
                         style="width:${segPct}%; background:${section.light};"

                    </div>
                `;
            }

            const overBudget = totalActual > totalBudget;
            const warningIcon = (overBudget && section.key !== 'savings') ? ' ⚠️' : '';

            progressDiv.innerHTML = `
                <div class="progress-info">
                    <span>${fmt(totalActual)} av ${fmt(totalBudget)}</span>
                    <span style="font-weight:700;">${pctDisplay}%${warningIcon}</span>
                </div>
                <div class="progress-bar" style="border-color: rgba(255,255,255,0.4)">
                    ${segmentsHTML}
                </div>
            `;
            header.appendChild(progressDiv);
        }

        card.appendChild(header);

        // Body
        const body = document.createElement("div");
        body.className = "section-body";
        body.style.background = isDarkMode()
            ? `linear-gradient(180deg, rgba(${hexToRgb(section.color)}, 0.08) 0%, rgba(${hexToRgb(section.color)}, 0.03) 100%)`
            : section.bg;

        // Items table
        const colActual = isIncome ? "Mottaget" : "Utgifter";
        const colBudget = isIncome ? "Förväntat" : "Budget";
        let tableHTML = `
            <table class="items-table">
                <thead>
                    <tr>
                        <th>Post</th>
                        <th>${colBudget}</th>
                        <th>${colActual}</th>
                        ${!isIncome ? '<th>%</th>' : ''}
                    </tr>
                </thead>
                <tbody>
        `;

        section.items.forEach((item, iIdx) => {
            const iPct = pct(item.actual, item.budget);

                // For savings: use saving-ok or saving-positive
                if (iPct >= 100) pctClass = "saving-positive";
                else pctClass = "saving-ok";
            } else {
                // For expenses: blue at exactly 100%, orange 80-99%, red >100%, green <80%
                if (iPct === 100) pctClass = "saving-positive";
                else if (iPct > 100) pctClass = "over";
                else if (iPct > 80) pctClass = "warn";

function buildProgressBar(section, sIdx) {
    const totalBudget = section.items.reduce((s, it) => s + it.budget, 0);
    const totalActual = section.items.reduce((s, it) => s + it.actual, 0);
    const usedPct = totalBudget > 0 ? Math.min((totalActual / totalBudget) * 100, 100) : 0;
    const overBudget = totalActual > totalBudget;

    let segmentsHTML = "";
    if (totalBudget > 0) {
        section.items.forEach((item, i) => {
            if (item.actual > 0) {
                const segPct = (item.actual / totalBudget) * 100;
                const shade = shadeColor(section.color, i * 18);
                segmentsHTML += `
                    <div class="progress-segment"
                         style="width:${segPct}%; background:${shade};"
                         title="${item.name}: ${fmt(item.actual)}">
                    </div>
                `;
            }
        });
    }

    const pctDisplay = pct(totalActual, totalBudget);
    const barBorder = overBudget ? `border-color: ${section.color}` : `border-color: ${section.color}40`;

    return `
        <div class="progress-container">
            <div class="progress-info">
                <span>${fmt(totalActual)} av ${fmt(totalBudget)} använt</span>
                <span style="color: ${overBudget ? 'var(--danger)' : section.color}; font-weight:700;">${pctDisplay}%</span>
            </div>
            <div class="progress-bar" style="${barBorder}">
                ${segmentsHTML}
            </div>
        </div>
    `;
}

// ── EVENT HANDLERS ─────────────────────────────────────────
function updateInputColor(input, sIdx, iIdx) {
    const sections = getCurrentMonthSections();
    const section = sections[sIdx];
    const budget = section.items[iIdx].budget;
    const val = parseFloat(input.value) || 0;
    const p = budget > 0 ? Math.round((val / budget) * 100) : 0;
    const isSavings = section.key === 'savings';
    
    // Remove all possible color classes from input
    input.classList.remove('input-ok', 'input-warn', 'input-over', 'input-sav-ok', 'input-sav-over');
    
    // Find and update the percentage badge
    const row = input.closest('tr');
    const pctBadge = row?.querySelector('.item-pct');
    if (pctBadge) {
        pctBadge.classList.remove('ok', 'warn', 'over', 'saving-ok', 'saving-positive');
        pctBadge.textContent = `${p}%`;
    }
    
    // Only apply colors if value is greater than 0 and budget is greater than 0
    if (val > 0 && budget > 0) {
        if (isSavings) {
            // For savings: blue at 100%+, green otherwise
            if (pctBadge) {
                if (p >= 100) pctBadge.classList.add('saving-positive');
                else pctBadge.classList.add('saving-ok');
            }
            if (p >= 100) input.classList.add('input-sav-over');
            else input.classList.add('input-sav-ok');
        } else {
            // For expenses: blue at exactly 100%, orange 80-99%, red >100%, green <80%
            if (pctBadge) {
                if (p === 100) pctBadge.classList.add('saving-positive');
                else if (p > 100) pctBadge.classList.add('over');
                else if (p > 80) pctBadge.classList.add('warn');
                else pctBadge.classList.add('ok');
            }
            if (p === 100) input.classList.add('input-sav-over');
            else if (p > 100) input.classList.add('input-over');
            else if (p > 80) input.classList.add('input-warn');
            else input.classList.add('input-ok');
        }
    }
}

function onActualChange(input) {
    const sIdx = parseInt(input.dataset.section);
    const iIdx = parseInt(input.dataset.item);
    const val = parseFloat(input.value) || 0;
    const sections = getCurrentMonthSections();
    sections[sIdx].items[iIdx].actual = val;
    refresh();
}

function addItem(sIdx) {
    const sections = getCurrentMonthSections();
    sections[sIdx].items.push({ name: "Ny post", budget: 0, actual: 0 });
    refresh();
}

function addNewSection() {
    const currentMonthKey = getMonthKey(currentMonth);
    const monthData = monthlyData[currentMonthKey];
    if (!monthData) return;
    
    const sections = monthData.sections;
    const customCount = sections.filter(s => s.key && s.key.startsWith('custom_')).length;
    
    const colorPalette = [
        { color: "#8B5CF6", light: "#EDE9FE", bg: "#F5F3FF" },
        { color: "#DB2777", light: "#FBCFE8", bg: "#FDF2F8" },
        { color: "#059669", light: "#D1FAE5", bg: "#ECFDF5" },
        { color: "#DC2626", light: "#FECACA", bg: "#FEE2E2" },
        { color: "#7C3AED", light: "#F3E8FF", bg: "#FAF5FF" },
        { color: "#0891B2", light: "#CFFAFE", bg: "#F0F9FF" },
    ];
    const colorSet = colorPalette[customCount % colorPalette.length];
    
    const newKey = `custom_${Date.now()}`;
    const newSection = {
        key: newKey,
        name: "Nytt avsnitt",
        color: colorSet.color,
        light: colorSet.light,
        bg: colorSet.bg,
        isIncome: false,
        items: [
            { name: "Post 1", budget: 0, actual: 0 }
        ]
    };
    sections.push(newSection);
    SECTIONS.push(newSection);
    refresh();
    saveLocal();
}

function deleteSection(sIdx) {
    if (confirm('Vill du ta bort detta avsnitt?')) {
        const sections = getCurrentMonthSections();
        const sectionToDelete = sections[sIdx];
        sections.splice(sIdx, 1);
        SECTIONS = SECTIONS.filter(s => s !== sectionToDelete);
        refresh();
    }
}

function editSectionName(element, sIdx) {
    const sections = getCurrentMonthSections();
    const currentName = sections[sIdx].name;
    const input = document.createElement("input");
    input.type = "text";
    input.className = "editable-input";
    input.value = currentName;
    element.replaceWith(input);
    input.focus();
    input.select();
    
    function saveEdit() {
        const newName = input.value.trim();
        if (newName && newName !== currentName) {
            sections[sIdx].name = newName;
            refresh();
        } else {
            refresh();
        }
    }
    
    input.onblur = saveEdit;
    input.onkeydown = (e) => {
        if (e.key === "Enter") saveEdit();
        if (e.key === "Escape") refresh();
    };
}

function editItemName(element, sIdx, iIdx) {
    const sections = getCurrentMonthSections();
    const currentName = sections[sIdx].items[iIdx].name;
    const input = document.createElement("input");
    input.type = "text";
    input.className = "editable-input";
    input.value = currentName;
    element.replaceWith(input);
    input.focus();
    input.select();
    
    function saveEdit() {
        const newName = input.value.trim();
        if (newName && newName !== currentName) {
            sections[sIdx].items[iIdx].name = newName;
        }
        refresh();
    }
    
    input.onblur = saveEdit;
    input.onkeydown = (e) => {
        if (e.key === "Enter") saveEdit();
        if (e.key === "Escape") refresh();
    };
}

function editBudget(element, sIdx, iIdx) {
    const sections = getCurrentMonthSections();
    const currentBudget = sections[sIdx].items[iIdx].budget;
    const input = document.createElement("input");
    input.type = "number";
    input.className = "editable-input";
    input.value = currentBudget;
    element.replaceWith(input);
    input.focus();
    input.select();
    
    function saveEdit() {
        const newBudget = Math.max(0, parseFloat(input.value) || 0);
        if (newBudget !== currentBudget) {
            sections[sIdx].items[iIdx].budget = newBudget;
        }
        refresh();
    }
    
    input.onblur = saveEdit;
    input.onkeydown = (e) => {
        if (e.key === "Enter") saveEdit();
        if (e.key === "Escape") refresh();
    };
}

function deleteItem(sIdx, iIdx) {
    const sections = getCurrentMonthSections();
    if (confirm(`Ta bort "${sections[sIdx].items[iIdx].name}"?`)) {
        sections[sIdx].items.splice(iIdx, 1);
        refresh();
    }
}

function refresh() {
    renderKPIs();
    renderSections();
    updateCharts();
    saveLocal();
}

// ── CHARTS ─────────────────────────────────────────────────
let pieChart, barChart;
let showComparisonMode = false;

function initCharts() {
    // Pre-populate legend to stabilize grid layout before chart animation
    renderPieLegend();

    // Use Chart.getChart to properly destroy any existing chart on these canvases
    const exPie = Chart.getChart("pieChart");
    if (exPie) exPie.destroy();
    const exBar = Chart.getChart("barChart");
    if (exBar) exBar.destroy();
    pieChart = null;
    barChart = null;
    
    const sections = getCurrentMonthSections();

    // Pie / Doughnut chart
    const pieCtx = document.getElementById("pieChart");
    if (!pieCtx) {
        console.error("pieChart canvas not found");
        return;
    }
    
    if (expenseSections.length === 0) {
        console.warn("No expense sections to display in charts");
        return;
    }
    
    const realData = expenseSections.map(s => s.items.reduce((sum, it) => sum + it.actual, 0));

    pieChart = new Chart(pieCtx, {
        type: "doughnut",
        data: {
            labels: expenseSections.map(s => s.name),
            datasets: [{
                data: expenseSections.map(() => 0),
                backgroundColor: expenseSections.map(s => s.color + '88'),
                borderColor: isDarkMode() ? "#1A1F2E" : "#FFFFFF",
                borderWidth: isDarkMode() ? 3 : 4,
                hoverBorderWidth: 0,
                hoverBorderColor: 'transparent',
                hoverOffset: 0,
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: true,
            cutout: "65%",
            animation: {
                duration: 800,
                easing: 'easeOutQuart'
            },
            plugins: {
                legend: { display: false },
                tooltip: {
                    callbacks: {
                        label: function(ctx) {
                            const total = ctx.dataset.data.reduce((a,b) => a + b, 0);
                            const val = ctx.parsed;
                            const p = total > 0 ? Math.round((val / total) * 100) : 0;
                            return ` ${ctx.label}: ${fmt(val)} (${p}%)`;
                        }
                    },
                    bodyFont: { family: "Inter" },
                    padding: 10,
                    cornerRadius: 8,
                }
            }
        },
        plugins: [{
            id: 'segmentGlow',
            afterDatasetDraw(chart) {
                if (chart._glowIndex == null || chart._glowIndex < 0) return;
                const meta = chart.getDatasetMeta(0);
                const arc = meta.data[chart._glowIndex];
                if (!arc) return;
                const ctx = chart.ctx;
                ctx.save();
                ctx.globalCompositeOperation = 'destination-over';
                ctx.shadowColor = chart._glowColor || 'rgba(255,255,255,0.5)';
                ctx.shadowBlur = 10;
                ctx.shadowOffsetX = 0;
                ctx.shadowOffsetY = 0;
                arc.draw(ctx);
                ctx.restore();
            }
        }]
    });

    // Bar chart
    const barCtx = document.getElementById("barChart");
    if (!barCtx) {
        console.error("barChart canvas not found");
        return;
    }
    
    // Get previous month data if available
    const allKeys = Object.keys(monthlyData).sort();
    const currentKey = getMonthKey(currentMonth);
    const currentIndex = allKeys.indexOf(currentKey);
    const previousKey = currentIndex > 0 ? allKeys[currentIndex - 1] : null;
    
    let previousExpenseData = [];
    if (previousKey) {
        const previousSections = monthlyData[previousKey].sections;
        const previousExpenseSections = previousSections.filter(s => !s.isIncome);
        previousExpenseData = expenseSections.map(sName => {
            const prevSection = previousExpenseSections.find(ps => ps.name === sName.name);
            return prevSection ? prevSection.items.reduce((sum, it) => sum + it.actual, 0) : 0;
        });
    }
    
    barChart = new Chart(barCtx, {
        type: "bar",
        data: {
            labels: expenseSections.map(s => s.name),
            datasets: [
                {
                    label: "Budget",
                    data: expenseSections.map(s => s.items.reduce((sum, it) => sum + it.budget, 0)),
                    backgroundColor: expenseSections.map(s => isDarkMode() ? s.color + '30' : s.light),
                    borderColor: expenseSections.map(s => isDarkMode() ? s.color + '60' : s.color),
                    borderWidth: 1.5,
                    borderRadius: 6,
                    barPercentage: 0.65,
                },
                {
                    label: "Utgifter",
                    data: expenseSections.map(s => s.items.reduce((sum, it) => sum + it.actual, 0)),
                    backgroundColor: expenseSections.map(s => s.color),
                    borderColor: expenseSections.map(s => shadeColor(s.color, -40)),
                    borderWidth: 1.5,
                    borderRadius: 6,
                    barPercentage: 0.75,
                },
                ...(previousKey ? [{
                    label: "Föregående månad",
                    data: previousExpenseData,
                    backgroundColor: expenseSections.map(s => shadeColor(s.color, -15)),
                    borderColor: expenseSections.map(s => shadeColor(s.color, -30)),
                    borderWidth: 1.5,
                    borderRadius: 6,
                    barPercentage: 0.65,
                }] : [])
            ]
        },
        options: {
            responsive: false,
            maintainAspectRatio: false,
            scales: {
                x: {
                    grid: { display: false },
                    ticks: { font: { size: 11, family: "Inter", weight: "500" }, color: isDarkMode() ? "#94A3B8" : "#6B7280" }
                },
                y: {
                    grid: { color: isDarkMode() ? "rgba(255,255,255,0.06)" : "#F3F4F6" },
                    ticks: {
                        font: { size: 11, family: "Inter" },
                        color: isDarkMode() ? "#64748B" : "#9CA3AF",
                        callback: (v) => v.toLocaleString("sv-SE")
                    }
                }
            },
            plugins: {
                legend: {
                    labels: {
                        padding: 16,
                        usePointStyle: true,
                        pointStyleWidth: 10,
                        font: { size: 11, family: "Inter", weight: "500" },
                        color: isDarkMode() ? "#E2E8F0" : "#374151",
                    }
                },
                tooltip: {
                    callbacks: { label: (ctx) => ` ${ctx.dataset.label}: ${fmt(ctx.parsed.y)}` },
                    bodyFont: { family: "Inter" },
                    padding: 10,
                    cornerRadius: 8,
                }
            }
        }
    });
    
    // Per-segment hover glow: highlight only the hovered segment
    const pieCanvas = document.getElementById("pieChart");
    // Use onmousemove/onmouseleave (not addEventListener) to prevent listener accumulation on re-init
    let hoveredSegment = -1;

    pieCanvas.onmousemove = (e) => {
        if (!pieChart || !pieChart.data || !pieChart.data.datasets[0]) return;
        const elements = pieChart.getElementsAtEventForMode(e, "nearest", { intersect: true }, true);
        const newHovered = elements.length > 0 ? elements[0].index : -1;
        if (newHovered !== hoveredSegment) {
            hoveredSegment = newHovered;
            const currentSections = getCurrentMonthSections().filter(s => !s.isIncome);
            const colors = currentSections.map((s, i) => {
                if (newHovered === -1) return s.color + '88';
                return i === newHovered ? s.color + 'CC' : s.color + '44';
            });
            pieChart.data.datasets[0].backgroundColor = colors;
            if (newHovered >= 0 && newHovered < currentSections.length) {
                const c = currentSections[newHovered].color;
                pieChart._glowIndex = newHovered;
                pieChart._glowColor = c + '90';
            } else {
                pieChart._glowIndex = -1;
            }
            pieChart.update({ animation: false });
        }
    };
    pieCanvas.onmouseleave = () => {
        if (!pieChart || !pieChart.data || !pieChart.data.datasets[0]) return;
        hoveredSegment = -1;
        const currentSections = getCurrentMonthSections().filter(s => !s.isIncome);
        pieChart.data.datasets[0].backgroundColor = currentSections.map(s => s.color + '88');
        pieChart._glowIndex = -1;
        pieChart.update({ animation: false });
    };

    // Animate in the real data after chart has settled into the layout
    setTimeout(() => {
        if (!pieChart) return;
        pieChart.data.datasets[0].data = realData;
        pieChart.update();
    }, 50);
}

// ── RENDER PIE LEGEND ──────────────────────────────────────
function renderPieLegend() {
    const sections = getCurrentMonthSections();
    const expenseSections = sections.filter(s => !s.isIncome);
    const legendContainer = document.getElementById("pie-legend");
    if (!legendContainer) return;
    
    legendContainer.innerHTML = "";
    expenseSections.forEach((section, idx) => {
        const total = expenseSections
            .reduce((sum, s) => sum + s.items.reduce((sum2, it) => sum2 + it.actual, 0), 0);
        const sectionTotal = section.items.reduce((sum, it) => sum + it.actual, 0);
        const pct = total > 0 ? Math.round((sectionTotal / total) * 100) : 0;
        
        const item = document.createElement("div");
        item.style.cssText = `display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 500; color: ${isDarkMode() ? '#E2E8F0' : '#374151'};`;
        item.innerHTML = `
            <div style="width: 14px; height: 14px; border-radius: 50%; background: ${section.color}; flex-shrink: 0;"></div>
            <span style="flex: 1;">${section.name}</span>
            <span style="color: ${isDarkMode() ? '#94A3B8' : '#6B7280'}; font-size: 12px;">${pct}%</span>
        `;
        legendContainer.appendChild(item);
    });
}

function updateCharts() {
    // Skip if charts haven't been initialized yet
    if (!pieChart || !barChart) return;
    
    const sections = getCurrentMonthSections();
    const expenseSections = sections.filter(s => !s.isIncome);
    pieChart.data.labels = expenseSections.map(s => s.name);
    pieChart.data.datasets[0].data = expenseSections.map(s => s.items.reduce((sum, it) => sum + it.actual, 0));
    pieChart.data.datasets[0].backgroundColor = expenseSections.map(s => s.color + '88');
    pieChart.data.datasets[0].borderColor = isDarkMode() ? "#1A1F2E" : "#FFFFFF";
    pieChart.data.datasets[0].hoverBorderColor = isDarkMode() ? "#2A3041" : "#FFFFFF";
    pieChart.update({ animation: { duration: 800 } });
    renderPieLegend();

    barChart.data.labels = expenseSections.map(s => s.name);
    barChart.data.datasets[0].data = expenseSections.map(s => s.items.reduce((sum, it) => sum + it.budget, 0));
    barChart.data.datasets[1].data = expenseSections.map(s => s.items.reduce((sum, it) => sum + it.actual, 0));
    barChart.data.datasets[0].backgroundColor = expenseSections.map(s => isDarkMode() ? s.color + '30' : s.light);
    barChart.data.datasets[0].borderColor = expenseSections.map(s => isDarkMode() ? s.color + '60' : s.color);
    barChart.data.datasets[1].backgroundColor = expenseSections.map(s => s.color);
    barChart.data.datasets[1].borderColor = expenseSections.map(s => shadeColor(s.color, -40));
    
    // Handle previous month data
    const allKeys = Object.keys(monthlyData).sort();
    const currentKey = getMonthKey(currentMonth);
    const currentIndex = allKeys.indexOf(currentKey);
    const previousKey = currentIndex > 0 ? allKeys[currentIndex - 1] : null;
    
    if (!previousKey && barChart.data.datasets.length > 2) {
        // Remove third dataset if no previous month
        barChart.data.datasets.pop();
    } else if (previousKey) {
        if (barChart.data.datasets.length === 2) {
            // Add third dataset if it doesn't exist
            const previousSections = monthlyData[previousKey].sections;
            const previousExpenseSections = previousSections.filter(s => !s.isIncome);
            barChart.data.datasets.push({
                label: "Föregående månad",
                data: expenseSections.map(sName => {
                    const prevSection = previousExpenseSections.find(ps => ps.name === sName.name);
                    return prevSection ? prevSection.items.reduce((sum, it) => sum + it.actual, 0) : 0;
                }),
                backgroundColor: expenseSections.map(s => shadeColor(s.color, -15)),
                borderColor: expenseSections.map(s => shadeColor(s.color, -30)),
            });
        }
    }
    
    barChart.update();
}

function saveLocalWithFeedback() {

function saveLocal() {
    const data = {
        currentMonth: currentMonth.toISOString(),
        monthlyData: Object.keys(monthlyData).reduce((acc, key) => {
            acc[key] = {
                sections: monthlyData[key].sections.map(s => ({
                    key: s.key,
                    name: s.name,
                    color: s.color,
                    light: s.light,
                    bg: s.bg,
                    isIncome: s.isIncome,
                    items: s.items.map(it => ({ name: it.name, budget: it.budget, actual: it.actual }))
                }))
            };
            return acc;
        }, {})
    };
    localStorage.setItem("budgetTracker", JSON.stringify(data));
}

function loadLocal() {
    const raw = localStorage.getItem("budgetTracker");
    if (!raw) return;
    try {
        const data = JSON.parse(raw);
        
        // Handle new format with months
        if (data.monthlyData) {
            Object.keys(data.monthlyData).forEach(monthKey => {
                monthlyData[monthKey] = {
                    sections: data.monthlyData[monthKey].sections.map(s => {
                        // Use stored metadata if available, otherwise fall back to template
                        const templateSection = SECTIONS.find(ts => ts.key === s.key);
                        return {
                            key: s.key,
                            name: s.name || (templateSection?.name || "Okänd"),
                            color: s.color || (templateSection?.color || "#999999"),
                            light: s.light || (templateSection?.light || "#EEEEEE"),
                            bg: s.bg || (templateSection?.bg || "#F9F9F9"),
                            isIncome: s.isIncome !== undefined ? s.isIncome : (templateSection?.isIncome || false),
                            items: s.items
                        };
                    })  
                };
            });
            if (data.currentMonth) {
                const tryMonth = new Date(data.currentMonth);
                const tryKey = getMonthKey(tryMonth);
                // Check if currentMonth still exists, if not use first available month
                if (monthlyData[tryKey]) {
                    currentMonth = tryMonth;
                } else {
                    const allKeys = Object.keys(monthlyData).sort();
                    if (allKeys.length > 0) {
                        const [y, m] = allKeys[0].split('-').map(Number);
                        currentMonth = new Date(y, m - 1, 1);
                    }
                }
            }
        } else {
            // Old format - convert to new format
            const monthKey = getMonthKey(new Date());
            monthlyData[monthKey] = {
                sections: data.map(s => {
                    const templateSection = SECTIONS.find(ts => ts.key === s.key);
                    return {
                        ...templateSection,
                        items: s.items
                    };
                })
            };
        }
        updateMonthDisplay();
    } catch(e) { 
        console.error("Failed to load data:", e);
    }
}

function resetAll() {
    if (!confirm("Vill du verkligen återställa all data? Alla värden kommer att sättas till 0.")) return;
    const sections = getCurrentMonthSections();
    sections.forEach(s => s.items.forEach(it => it.actual = 0));
    saveLocal();
    refresh();
}

// ── EXPORT TO XLSX ─────────────────────────────────────────
function exportXLSX() {
    const wb = XLSX.utils.book_new();
    const t = computeTotals();

    // Summary sheet
    const summaryData = [
        ["BUDGET TRACKER — MÅNADLIG SAMMANFATTNING"],
        [],
        ["Totala inkomster", t.totalIncome],
        ["Totalt budgeterat", t.totalBudget],
        ["Totalt utgifter", t.totalSpent],
        ["Återstår", t.remaining],
        [],
        ["AVSNITT", "BUDGETERAT", "UTGIFTER", "ÅTERSTÅR", "% ANVÄNT"],
    ];

    const sections = getCurrentMonthSections();
    sections.forEach(s => {
        if (s.isIncome) return;
        const b = s.items.reduce((sum, it) => sum + it.budget, 0);
        const a = s.items.reduce((sum, it) => sum + it.actual, 0);
        summaryData.push([s.name, b, a, b - a, b > 0 ? Math.round((a/b)*100) + "%" : "0%"]);
    });

    summaryData.push([]);
    summaryData.push(["DETAILED BREAKDOWN"]);
    summaryData.push([]);

    sections.forEach(s => {
        summaryData.push([s.name.toUpperCase()]);
        summaryData.push(["Post", "Budget", s.isIncome ? "Mottaget" : "Utgifter", s.isIncome ? "" : "%"]);
        s.items.forEach(it => {
            const p = it.budget > 0 ? Math.round((it.actual / it.budget) * 100) + "%" : "0%";
            summaryData.push([it.name, it.budget, it.actual, s.isIncome ? "" : p]);
        });
        summaryData.push([]);
    });

    const ws = XLSX.utils.aoa_to_sheet(summaryData);
    ws["!cols"] = [{ wch: 24 }, { wch: 14 }, { wch: 14 }, { wch: 14 }, { wch: 10 }];
    XLSX.utils.book_append_sheet(wb, ws, "Budget Summary");
    XLSX.writeFile(wb, "budget_tracker.xlsx");
}

// ── DRAG & DROP REORDERING ──────────────────────
let dragState = null;

function initDragAndDrop() {
    document.addEventListener('pointerdown', onDragPointerDown);
    document.addEventListener('touchstart', (e) => {
        // Prevent long-press context menu on mobile
        if (e.target.closest('.draggable-row') && !e.target.closest('input') && !e.target.closest('button') && !e.target.closest('.editable-field')) {
            // Allow a small delay so taps still work
        }
    }, { passive: true });
}

function onDragPointerDown(e) {
    // Don't interfere with inputs, buttons, or editable fields
    if (e.target.closest('input') || e.target.closest('button') || e.target.closest('.editable-field')) return;
    
    const row = e.target.closest('.draggable-row');
    if (!row) return;
    
    e.preventDefault();
    
    const tbody = row.closest('tbody');
    if (!tbody) return;
    
    const sectionIdx = parseInt(row.dataset.section);
    const itemIdx = parseInt(row.dataset.item);
    const rows = Array.from(tbody.querySelectorAll('.draggable-row'));
    const rowIndex = rows.indexOf(row);
    
    const rect = row.getBoundingClientRect();
    const rowHeight = rect.height;
    const startY = e.clientY;
    
    // Store initial positions of all rows
    const rowRects = rows.map(r => r.getBoundingClientRect());
    
    dragState = {
        row,
        tbody,
        sectionIdx,
        itemIdx,
        rowIndex,
        currentIndex: rowIndex,
        rows,
        rowHeight,
        rowRects,
        startY,
        offsetY: 0
    };
    
    // Visually mark as dragging
    row.classList.add('dragging');
    row.setPointerCapture(e.pointerId);
    
    document.addEventListener('pointermove', onDragPointerMove);
    document.addEventListener('pointerup', onDragPointerUp);
    document.addEventListener('pointercancel', onDragPointerUp);
}

function onDragPointerMove(e) {
    if (!dragState) return;
    e.preventDefault();
    
    const { row, rows, rowIndex, rowHeight, startY, rowRects } = dragState;
    const deltaY = e.clientY - startY;
    
    // Move the dragged row visually
    row.style.transform = `translateY(${deltaY}px)`;
    row.style.zIndex = '10';
    row.style.position = 'relative';
    
    // Calculate which position the dragged row is now at
    const draggedCenter = rowRects[rowIndex].top + rowRects[rowIndex].height / 2 + deltaY;
    
    // Find the new index based on where the dragged item center is
    let newIndex = rowIndex;
    for (let i = 0; i < rows.length; i++) {
        if (i === rowIndex) continue;
        const midPoint = rowRects[i].top + rowRects[i].height / 2;
        if (rowIndex < i && draggedCenter > midPoint) {
            newIndex = i;
        } else if (rowIndex > i && draggedCenter < midPoint) {
            newIndex = i;
            break;
        }
    }
    
    // Shift other rows to make space
    rows.forEach((r, i) => {
        if (i === rowIndex) return;
        r.classList.remove('shift-down', 'shift-up');
        r.style.setProperty('--row-height', rowHeight + 'px');
        
        if (rowIndex < newIndex) {
            // Dragging down: rows between old and new position shift up
            if (i > rowIndex && i <= newIndex) {
                r.classList.add('shift-up');
            }
        } else if (rowIndex > newIndex) {
            // Dragging up: rows between new and old position shift down
            if (i >= newIndex && i < rowIndex) {
                r.classList.add('shift-down');
            }
        }
    });
    
    dragState.currentIndex = newIndex;
}

function onDragPointerUp(e) {
    if (!dragState) return;
    
    const { row, rows, sectionIdx, itemIdx, rowIndex, currentIndex } = dragState;
    
    // Clean up visual states
    row.classList.remove('dragging');
    row.style.transform = '';
    row.style.zIndex = '';
    row.style.position = '';
    
    rows.forEach(r => {
        r.classList.remove('shift-down', 'shift-up');
    });
    
    document.removeEventListener('pointermove', onDragPointerMove);
    document.removeEventListener('pointerup', onDragPointerUp);
    document.removeEventListener('pointercancel', onDragPointerUp);
    
    // Actually reorder the data if position changed
    if (rowIndex !== currentIndex) {
        const section = SECTIONS[sectionIdx];
        if (section && section.items) {
            const item = section.items.splice(rowIndex, 1)[0];
            section.items.splice(currentIndex, 0, item);
            
            saveLocal();
            renderSections();
        }
    }
    
    dragState = null;
}

// ── JSON EXPORT/IMPORT ──────────────────────────
function exportJSON() {
    const data = {
        monthlyData: monthlyData,
        sections: SECTIONS,
        exportDate: new Date().toISOString()
    };
    
    const jsonString = JSON.stringify(data, null, 2);
    const blob = new Blob([jsonString], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = `budget_data_${new Date().toISOString().split('T')[0]}.json`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
    
    alert(`✅ Budget exporterad som JSON!\n\nFil: ${link.download}\n\nKopiera denna fil till din telefon för att importera data där.`);
}

function handleJSONImport(event) {
    const file = event.target.files[0];
    if (!file) return;
    
    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const data = JSON.parse(e.target.result);
            
            // Validate structure
            if (!data.monthlyData || !data.sections) {
                throw new Error("Ogiltig fil-format. Saknar monthlyData eller sections.");
            }
            
            // Import data
            monthlyData = data.monthlyData;
            SECTIONS = data.sections;
            saveLocal();
            
            alert(`✅ Budget importerad framgångsrikt!\n\nDatum för export: ${data.exportDate}`);
            location.reload();
        } catch (error) {
            alert(`❌ Fel vid import: ${error.message}\n\nKontrollera att filen är en giltig budget-export.`);
        }
    };
    reader.readAsText(file);
    
    // Reset input so same file can be imported again
    event.target.value = '';
}

// ── DARK MODE TOGGLE ─────────────────────────────
function toggleDarkMode() {
    const html = document.documentElement;
    const btn = document.getElementById('dark-mode-btn');
    
    html.classList.toggle('dark-mode');
    
    if (html.classList.contains('dark-mode')) {
        btn.textContent = '☀️';
        localStorage.setItem('darkMode', 'enabled');
    } else {
        btn.textContent = '🌙';
        localStorage.setItem('darkMode', 'disabled');
    }
    
    // Re-render everything with dark-mode-aware colors
    renderSections();
    renderKPIs();
    initCharts();
    updateCharts();
}

// Initialize dark mode from localStorage
function initDarkMode() {
    const darkMode = localStorage.getItem('darkMode');
    // Default to dark mode enabled
    if (darkMode === null || darkMode === 'enabled') {
        document.documentElement.classList.add('dark-mode');
        document.getElementById('dark-mode-btn').textContent = '☀️';
        localStorage.setItem('darkMode', 'enabled');
    } else {
        document.getElementById('dark-mode-btn').textContent = '🌙';
    }
}
