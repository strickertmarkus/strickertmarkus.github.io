name: Training checkpoint 5 heartbeat polish

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  implement-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Implement heartbeat polish
        run: python3 .github/cp5_heartbeat_polish.py

      - name: Syntax and regression tests
        run: |
          node --check budget/pulse-environment/environment.js
          node --check budget/exercise-pulse-flow-motion-v67.js
          node --test budget/tests/training-observatory-identity.test.cjs budget/tests/training-observatory-mobile.test.cjs budget/tests/training-shared-session.test.cjs
          git diff --check

      - name: Verify heartbeat ownership
        run: |
          grep -q 'observatoryHeartbeat 2.05s' budget/pulse-observatory/observatory.css
          grep -q 'observatory-brand-lockup' budget/exercise.html
          test "$(grep -o 'observatory-header-star' budget/exercise.html | wc -l)" -eq 1
          ! grep -q 'pf-header-ecg' budget/exercise-pulse-flow-motion-v67.js

      - name: Commit implementation and clean temporary files
        run: |
          git config user.name "strickertmarkus"
          git config user.email "markus.strickert@sigmatechnology.com"
          git rm -f .github/workflows/training-cp5-heartbeat-polish.yml .github/cp5_heartbeat_polish.py
          git add budget/exercise.html budget/pulse-observatory/observatory.css budget/tests/training-observatory-identity.test.cjs budget/tests/training-observatory-mobile.test.cjs
          git commit -m "Polish Observatory heartbeat identity"
          git push origin HEAD:main
