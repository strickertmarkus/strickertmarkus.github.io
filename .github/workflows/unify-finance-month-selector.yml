name: Unify finance month selector

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unify-finance-month-selector.yml'
      - '.github/scripts/unify_finance_month.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python3 .github/scripts/unify_finance_month.py

      - name: Verify JavaScript syntax
        run: node --check budget/finance-ui.js

      - name: Verify data layer untouched
        run: |
          if git diff --name-only | grep -E '^budget/(firebase-sync\.js|indexeddb-fallback\.js|budget-persistence-guard\.js)$'; then
            echo 'Data/persistence layer was modified unexpectedly.'
            exit 1
          fi

      - name: Verify intended changes
        run: |
          grep -q 'setBudgetMonthFromFinance' budget/budget.html
          grep -q 'setBudgetMonthFromFinance' budget/budget_maja.html
          grep -q 'months.filter(month => month <= selected)' budget/analytics.html
          grep -q 'months.filter(month => month <= selected)' budget/analytics_maja.html
          grep -q 'financeMonthKeys' budget/finance-ui.js
          grep -q 'finance-clean-v5' budget/familjebudget.html

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add budget/finance-ui.js budget/budget.html budget/budget_maja.html budget/analytics.html budget/analytics_maja.html budget/familjebudget.html
          git commit -m 'Unify finance month selector across views'
          git push
