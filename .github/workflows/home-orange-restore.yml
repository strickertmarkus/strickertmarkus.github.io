name: Home orange restore

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/home-orange-restore.yml'

permissions:
  contents: write

jobs:
  restore-home-orange:
    if: github.event.head_commit.message == 'Prepare Home orange restore'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore previous orange palette
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          const themePath = 'budget/home-calendar-theme-v12.js';
          let theme = fs.readFileSync(themePath, 'utf8');
          const replacements = [
            ['FBBF24', 'FB923C'],
            ['FCD34D', 'FDBA74'],
            ['251,191,36', '251,146,60']
          ];
          for (const [from, to] of replacements) {
            if (!theme.includes(from)) throw new Error(`Expected ${from} in ${themePath}`);
            theme = theme.replaceAll(from, to);
          }
          fs.writeFileSync(themePath, theme);

          const navPath = 'budget/nav-menu-motion.js';
          let nav = fs.readFileSync(navPath, 'utf8');
          const oldThemeVersion = 'home-calendar-theme-v12.js?v=20260902-home-calendar-theme-v16-amber-return';
          const newThemeVersion = 'home-calendar-theme-v12.js?v=20260902-home-calendar-theme-v17-orange-restore';
          if (!nav.includes(oldThemeVersion)) throw new Error(`Expected ${oldThemeVersion} in ${navPath}`);
          nav = nav.replace(oldThemeVersion, newThemeVersion);
          fs.writeFileSync(navPath, nav);

          const homePath = 'budget/home.html';
          let home = fs.readFileSync(homePath, 'utf8');
          const oldNavVersion = 'nav-menu-motion.js?v=20260902-nav-motion-v16-amber-return';
          const newNavVersion = 'nav-menu-motion.js?v=20260902-nav-motion-v17-orange-restore';
          if (!home.includes(oldNavVersion)) throw new Error(`Expected ${oldNavVersion} in ${homePath}`);
          home = home.replace(oldNavVersion, newNavVersion);
          fs.writeFileSync(homePath, home);
          NODE

      - name: Remove temporary workflow
        run: rm .github/workflows/home-orange-restore.yml

      - name: Commit restored orange palette
        shell: bash
        run: |
          git config user.name "strickertmarkus"
          git config user.email "markus.strickert@sigmatechnology.com"
          git add budget/home-calendar-theme-v12.js budget/nav-menu-motion.js budget/home.html .github/workflows/home-orange-restore.yml
          git diff --cached --check
          git commit -m "Restore previous Home orange palette"
          git push origin main
