name: Finance visual v10

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finance-visual-v10.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine finance visuals
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          ui = Path('budget/finance-ui.js')
          s = ui.read_text()

          # Darker Training-style header surface, including first-paint shell.
          old_bg = 'background:rgba(24,31,46,.94)!important'
          if s.count(old_bg) != 2:
              raise SystemExit(f'expected 2 finance header background matches, found {s.count(old_bg)}')
          s = s.replace(old_bg, 'background:rgba(13,17,23,.96)!important')

          # Bring month selector slightly closer to title/name.
          if s.count('top:60px!important') != 2:
              raise SystemExit(f'expected 2 month top matches, found {s.count("top:60px!important")}')
          s = s.replace('top:60px!important', 'top:55px!important')

          old_month = "color:#8CC0FF!important;font:760 15px/1 Inter,sans-serif!important;letter-spacing:-.15px!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:clip!important;text-align:center!important;box-shadow:none!important;text-shadow:0 2px 12px rgba(96,165,250,.18)!important;"
          new_month = "color:#FB923C!important;font:700 15px/1 Inter,sans-serif!important;letter-spacing:-.12px!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:clip!important;text-align:center!important;box-shadow:none!important;text-shadow:0 2px 12px rgba(251,146,60,.16)!important;"
          if old_month not in s:
              raise SystemExit('month text style not found')
          s = s.replace(old_month, new_month, 1)

          old_interact = "#month-dropdown:hover{color:#B8D8FF!important}html.finance-ui-clean-v1 body .header #month-dropdown:active{color:#60A5FA!important;opacity:.86!important}"
          new_interact = "#month-dropdown:hover{color:#FDBA74!important}html.finance-ui-clean-v1 body .header #month-dropdown:active{color:#F97316!important;opacity:.88!important}"
          if old_interact not in s:
              raise SystemExit('month interaction style not found')
          s = s.replace(old_interact, new_interact, 1)

          old_anim = ".container.finance-arrival-clean-v1>*{transform-origin:top center;animation:financeArrivalCleanV1 .30s cubic-bezier(.16,1,.3,1) both;will-change:transform}.container.finance-arrival-clean-v1>*:nth-child(2){animation-delay:.025s}.container.finance-arrival-clean-v1>*:nth-child(3){animation-delay:.05s}.container.finance-arrival-clean-v1>*:nth-child(4){animation-delay:.075s}.container.finance-arrival-clean-v1>*:nth-child(n+5){animation-delay:.10s}' +\n      '@keyframes financeArrivalCleanV1{0%{transform:translateY(-12px) scale(.995)}72%{transform:translateY(1px) scale(1.001)}100%{transform:translateY(0) scale(1)}}"
          new_anim = ".container.finance-arrival-clean-v1>*{transform-origin:top center;animation:financeArrivalCleanV1 .44s cubic-bezier(.22,1,.36,1) both;will-change:transform}.container.finance-arrival-clean-v1>*:nth-child(2){animation-delay:.035s}.container.finance-arrival-clean-v1>*:nth-child(3){animation-delay:.07s}.container.finance-arrival-clean-v1>*:nth-child(4){animation-delay:.105s}.container.finance-arrival-clean-v1>*:nth-child(n+5){animation-delay:.14s}' +\n      '@keyframes financeArrivalCleanV1{0%{transform:translateY(-16px) scale(.988,.976)}55%{transform:translateY(2.5px) scale(1.002,1.006)}76%{transform:translateY(-1px) scale(.9995,.998)}100%{transform:translateY(0) scale(1)}}"
          if old_anim not in s:
              raise SystemExit('finance arrival animation block not found')
          s = s.replace(old_anim, new_anim, 1)

          old_timeout = "setTimeout(function () { container.classList.remove('finance-arrival-clean-v1'); }, 650);"
          new_timeout = "setTimeout(function () { container.classList.remove('finance-arrival-clean-v1'); }, 900);"
          if old_timeout not in s:
              raise SystemExit('arrival cleanup timeout not found')
          s = s.replace(old_timeout, new_timeout, 1)
          ui.write_text(s)

          # Make the budget wheel a little more vivid and round each arc subtly.
          for name in ['budget/budget.html', 'budget/budget_maja.html']:
              p = Path(name)
              t = p.read_text()

              replacements = [
                  ("backgroundColor: expenseSections.map(s => s.color + '88'),", "backgroundColor: expenseSections.map(s => s.color + 'A8'),"),
                  ("if (newHovered === -1) return s.color + '88';", "if (newHovered === -1) return s.color + 'A8';"),
                  ("return i === newHovered ? s.color + 'CC' : s.color + '44';", "return i === newHovered ? s.color + 'E8' : s.color + '55';"),
                  ("pieChart.data.datasets[0].backgroundColor = currentSections.map(s => s.color + '88');", "pieChart.data.datasets[0].backgroundColor = currentSections.map(s => s.color + 'A8');"),
                  ("pieChart.data.datasets[0].backgroundColor = expenseSections.map(s => s.color + '88');", "pieChart.data.datasets[0].backgroundColor = expenseSections.map(s => s.color + 'A8');"),
              ]
              for old, new in replacements:
                  if old not in t:
                      raise SystemExit(f'{name}: expected wheel style fragment not found: {old}')
                  t = t.replace(old, new)

              needle = "                hoverOffset: 0,\n"
              if needle not in t:
                  raise SystemExit(f'{name}: doughnut hoverOffset not found')
              t = t.replace(needle, needle + "                borderRadius: 5,\n", 1)
              p.write_text(t)

          pages = [
              'budget/budget.html',
              'budget/budget_maja.html',
              'budget/analytics.html',
              'budget/analytics_maja.html',
              'budget/familjebudget.html',
          ]
          for name in pages:
              p = Path(name)
              t = p.read_text()
              oldv = 'finance-ui.js?v=20260830-finance-clean-v9'
              newv = 'finance-ui.js?v=20260830-finance-clean-v10'
              if oldv not in t:
                  raise SystemExit(f'{name}: v9 finance loader not found')
              p.write_text(t.replace(oldv, newv, 1))
          PY
      - name: Verify JavaScript syntax
        run: node --check budget/finance-ui.js
      - name: Verify visual scope
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          echo "$changed"
          while IFS= read -r f; do
            case "$f" in
              budget/finance-ui.js|budget/budget.html|budget/budget_maja.html|budget/analytics.html|budget/analytics_maja.html|budget/familjebudget.html) ;;
              '') ;;
              *) echo "Unexpected changed file: $f" >&2; exit 1 ;;
            esac
          done <<< "$changed"
          grep -q "borderRadius: 5" budget/budget.html
          grep -q "borderRadius: 5" budget/budget_maja.html
          grep -q "color:#FB923C" budget/finance-ui.js
          grep -q "finance-clean-v10" budget/familjebudget.html
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "strickertmarkus"
          git config user.email "markus.strickert@sigmatechnology.com"
          git add budget/finance-ui.js budget/budget.html budget/budget_maja.html budget/analytics.html budget/analytics_maja.html budget/familjebudget.html
          git commit -m "Refine finance header wheel and transitions"
          git push
