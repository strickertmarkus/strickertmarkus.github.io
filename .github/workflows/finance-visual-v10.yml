name: Finance visual v10

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finance-visual-v10.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep budget wheel vibrancy consistent
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          for name in ['budget/budget.html', 'budget/budget_maja.html']:
              p = Path(name)
              s = p.read_text()
              replacements = [
                  ("if (newHovered === -1) return s.color + '88';", "if (newHovered === -1) return s.color + 'A0';"),
                  ("pieChart.data.datasets[0].backgroundColor = currentSections.map(s => s.color + '88');", "pieChart.data.datasets[0].backgroundColor = currentSections.map(s => s.color + 'A0');"),
                  ("pieChart.data.datasets[0].backgroundColor = expenseSections.map(s => s.color + '88');", "pieChart.data.datasets[0].backgroundColor = expenseSections.map(s => s.color + 'A0');"),
              ]
              for old, new in replacements:
                  if old not in s:
                      raise SystemExit(f'{name}: expected wheel reset fragment not found: {old}')
                  s = s.replace(old, new)
              p.write_text(s)
          PY
      - name: Verify wheel styling
        shell: bash
        run: |
          grep -q "backgroundColor: expenseSections.map(s => s.color + 'A0')" budget/budget.html
          grep -q "borderRadius: 4" budget/budget.html
          grep -q "spacing: 1" budget/budget.html
          ! grep -q "currentSections.map(s => s.color + '88')" budget/budget.html
          ! grep -q "currentSections.map(s => s.color + '88')" budget/budget_maja.html
          ! grep -q "backgroundColor = expenseSections.map(s => s.color + '88')" budget/budget.html
          ! grep -q "backgroundColor = expenseSections.map(s => s.color + '88')" budget/budget_maja.html
      - name: Verify scoped changes
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          echo "$changed"
          while IFS= read -r f; do
            case "$f" in
              budget/budget.html|budget/budget_maja.html) ;;
              '') ;;
              *) echo "Unexpected changed file: $f" >&2; exit 1 ;;
            esac
          done <<< "$changed"
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "strickertmarkus"
          git config user.email "markus.strickert@sigmatechnology.com"
          git add budget/budget.html budget/budget_maja.html
          git commit -m "Keep budget wheel colors vivid after interaction"
          git push
