name: Training CP8 toggle alignment

on:
  push:
    branches:
      - checkpoint/training-observatory-cp8-toggle-alignment-work

permissions:
  contents: write

jobs:
  migrate-test-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: checkpoint/training-observatory-cp8-toggle-alignment-work
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply toggle alignment and switch cancellation fix
        run: python .github/training_cp8_toggle_align.py
      - name: JavaScript syntax checks
        run: |
          node --check budget/training-zen-nav.js
          node --check budget/training-overview-mode.js
          node --check budget/firebase-sync.js
      - name: Run complete training regression suite
        run: node --test budget/tests/training-*.test.cjs
      - name: Run Zen regression suite
        run: node --test budget/tests/zen.test.cjs budget/tests/zen-session-oasis.test.cjs
      - name: Verify structural ownership
        run: |
          test "$(grep -c 'overviewSlot.appendChild(overviewToggle)' budget/training-zen-nav.js)" -eq 1
          grep -Fq 'grid-template-columns:minmax(0,1fr) 42px' budget/training-zen-nav.css
          grep -Fq 'grid-template-columns:minmax(0,1fr) 40px' budget/training-zen-nav.css
          grep -Fq '20260916-main-cp8-toggle-align-1' budget/exercise.html
          grep -Fq '20260916-main-cp8-toggle-align-1' budget/zen.html
          ! grep -Fq 'Compact uses one header symbol toggle' budget/tests/training-wellness-shell.test.cjs
          git diff --check
      - name: Commit verified implementation and remove temporary files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/training_cp8_toggle_align.py .github/workflows/training-cp8-toggle-alignment.yml
          git add -A
          git diff --cached --check
          git commit -m 'Align wellness toggles and stabilize mode switching'
          git push origin HEAD:checkpoint/training-observatory-cp8-toggle-alignment-work
