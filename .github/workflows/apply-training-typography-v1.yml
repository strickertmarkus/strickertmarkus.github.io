name: Apply training typography v1
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-training-typography-v1.yml'
      - '.github/scripts/apply_training_typography_v1.py'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply typography profile
        run: python3 .github/scripts/apply_training_typography_v1.py
      - name: Validate syntax and selectors
        run: |
          node --check budget/exercise-hype-timer-layout-v1.js
          grep -q "session-typography-v1" budget/exercise.html
          grep -q "font-weight:300 !important" budget/exercise-hype-timer-layout-v1.js
          grep -q "#session-modal.show #session-current-ex" budget/exercise-hype-timer-layout-v1.js
      - name: Commit tested typography
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add budget/exercise-hype-timer-layout-v1.js budget/auth-config.js budget/auth-gate.js budget/exercise.html
          git diff --cached --quiet || git commit -m 'Match training typography to Pulse modes'
          git push
