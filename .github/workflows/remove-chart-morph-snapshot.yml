name: Remove chart morph snapshot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-chart-morph-snapshot.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply chart morph cleanup
        run: python3 .github/scripts/remove_chart_morph_snapshot.py

      - name: Verify JavaScript
        run: node --check budget/finance-ui.js

      - name: Verify cleanup
        shell: bash
        run: |
          grep -q "el.querySelector('canvas')" budget/finance-ui.js
          if grep -q "opacity:0!important;animation:none!important;mix-blend-mode:normal!important" budget/finance-ui.js; then
            echo "Old hidden-snapshot workaround still present" >&2
            exit 1
          fi
          grep -q "finance-ui.js?v=20260830-finance-final-v3" budget/budget.html
          grep -q "finance-ui.js?v=20260830-finance-final-v3" budget/budget_maja.html
          grep -q "finance-ui.js?v=20260830-finance-final-v3" budget/analytics.html
          grep -q "finance-ui.js?v=20260830-finance-final-v3" budget/analytics_maja.html
          grep -q "finance-ui.js?v=20260830-finance-final-v3" budget/familjebudget.html
          grep -q "borderRadius: 6" budget/budget.html
          grep -q "borderRadius: 6" budget/budget_maja.html
          git diff --quiet -- budget/firebase-sync.js budget/indexeddb-fallback.js budget/budget-persistence-guard.js

          changed="$(git diff --name-only)"
          echo "$changed"
          while IFS= read -r f; do
            case "$f" in
              budget/finance-ui.js|budget/budget.html|budget/budget_maja.html|budget/analytics.html|budget/analytics_maja.html|budget/familjebudget.html) ;;
              '') ;;
              *) echo "Unexpected changed file: $f" >&2; exit 1 ;;
            esac
          done <<< "$changed"

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "strickertmarkus"
          git config user.email "markus.strickert@sigmatechnology.com"
          git add budget/finance-ui.js budget/budget.html budget/budget_maja.html budget/analytics.html budget/analytics_maja.html budget/familjebudget.html
          git commit -m "Exclude charts from finance morph"
          git push
