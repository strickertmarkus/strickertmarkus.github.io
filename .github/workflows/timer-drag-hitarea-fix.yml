name: Timer drag hit-area fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/timer-drag-hitarea-fix.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply hit-area patch
        run: python3 .github/scripts/timer_drag_hitarea_fix.py
      - name: Validate timer script
        run: node --check budget/exercise-timer-focus.js
      - name: Validate input hardening
        run: |
          grep -q "final18-hitarea" budget/exercise.html
          grep -q "resolveGestureRing" budget/exercise-timer-focus.js
          grep -q "session-cardio-countdown.show #session-countdown-ring \*" budget/exercise-timer-focus.js
          grep -q "touchmove" budget/exercise-timer-focus.js
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add budget/exercise-timer-focus.js budget/exercise.html budget/auth-config.js budget/auth-gate.js budget/exercise-pulse-flow-canvas-glow-v131.js
          git diff --cached --quiet || git commit -m 'Keep timer swipe armed after collapse'
          git push
