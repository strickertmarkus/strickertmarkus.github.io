name: Training planner and bodyweight verification
on:
  push:
    paths:
      - 'budget/archive/exercise.html'
      - 'budget/training-month-planner.js'
      - 'budget/training-pulse-embedded.css'
      - 'budget/pulse-builder-ui.*'
      - 'budget/tests/training-planner*'
      - '.github/workflows/training-planner-verify.yml'
  workflow_dispatch:
jobs:
  planner:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps webkit
      - name: Verify saved plans and responsive UI
        run: |
          python3 -m http.server 4173 --directory . >/tmp/planner-http.log 2>&1 &
          node --test budget/tests/training-planner-bodyweight.test.cjs
          node budget/tests/training-planner-bodyweight-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: training-planner-screenshots
          path: test-results/training-planner
