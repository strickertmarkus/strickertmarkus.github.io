name: Observatory checkpoint 1
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/observatory-checkpoint1.yml
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply canonical Observatory migration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('budget/tools/observatory_checkpoint1.py')
          s=p.read_text()
          old="ids = re.findall(r'\\bid=\"([^\"]+)\"', s)"
          new="ids = [value for value in re.findall(r'\\bid=\"([^\"]+)\"', s) if re.fullmatch(r'[A-Za-z][A-Za-z0-9_.:-]*', value)]"
          if old not in s:
              raise SystemExit('literal-id validator anchor missing')
          p.write_text(s.replace(old,new,1))
          PY
          python3 budget/tools/observatory_checkpoint1.py
      - name: Verify JavaScript syntax
        run: |
          node --check budget/training-overview-mode.js
          node --check budget/pulse-environment/environment.js
      - name: Verify canonical DOM and runtime boundaries
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('budget/exercise.html').read_text()
          ids=[value for value in re.findall(r'\bid="([^"]+)"',html) if re.fullmatch(r'[A-Za-z][A-Za-z0-9_.:-]*',value)]
          dups=sorted({x for x in ids if ids.count(x)>1})
          assert not dups, dups
          assert html.count('id="week-grid"')==1
          assert html.count('id="log-body"')==1
          assert html.count('id="session-modal"')==1
          assert html.count('function getWorkouts()')==1
          assert html.count('function getPlannedSessions()')==1
          assert 'pulse-environment/training.js' not in html
          assert 'pulse-environment/training.css' not in html
          assert 'pulse-observatory/training.css' not in html
          assert 'data-training-overview="observatory"' in html
          print('canonical DOM/runtime verification PASS')
          PY
          ! grep -q 'setInterval(' budget/training-overview-mode.js
          ! grep -q 'setInterval(' budget/pulse-environment/environment.js
      - name: Verify repository rules and checklist state
        run: |
          test -f AGENTS.md
          grep -q 'checkpoint/training-observatory-pre-migration-2026-09-15' budget/TRAINING-OBSERVATORY-MIGRATION-CHECKLIST.md
          grep -q 'Implementation checkpoint: Observatory is default' budget/TRAINING-OBSERVATORY-MIGRATION-CHECKLIST.md
      - name: Commit checkpoint 1
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add budget/exercise.html budget/training-overview-mode.js budget/pulse-environment/environment.js budget/TRAINING-OBSERVATORY-MIGRATION-CHECKLIST.md
          git diff --cached --check
          git diff --cached --quiet || git commit -m 'Promote Observatory to canonical training overview'
          git push
