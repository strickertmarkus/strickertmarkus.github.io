name: Shopping functionality and responsive verification
on:
  push:
    paths:
      - 'budget/shopping*'
      - 'budget/home*'
      - 'budget/auth-gate.js'
      - 'budget/calendar-*.js'
      - 'budget/family-todos-ui-v1.js'
      - 'budget/tests/home-boot-browser.cjs'
      - 'budget/tests/shopping*'
      - '.github/workflows/shopping-verify.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and shell checks
        run: |
          for file in budget/shopping*.js; do node --check "$file"; done
          node --test budget/tests/shopping-shell-v1.test.cjs budget/tests/shopping-recipe-sync.test.cjs
      - name: Install browsers
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps webkit chromium
      - name: Home mobile sections and boot checks
        run: |
          python3 -m http.server 4173 >/tmp/shopping-http.log 2>&1 &
          node budget/tests/home-boot-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-mobile-preview
          path: test-results/shopping/home-*.png
      - name: Shopping functionality and responsive checks
        run: node budget/tests/shopping-interactions.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shopping-screenshots
          path: test-results/shopping
