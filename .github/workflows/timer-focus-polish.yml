name: Timer focus polish
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/timer-focus-polish.yml'
      - '.github/scripts/timer_focus_polish.py'
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply timer polish
        run: python3 .github/scripts/timer_focus_polish.py
      - name: Validate syntax
        run: node --check budget/exercise-timer-focus.js
      - name: Validate focused changes
        run: |
          grep -q "translateX(-7px)" budget/exercise-timer-focus.js
          grep -q "installImmediateFocusSync" budget/exercise-timer-focus.js
          grep -q "final20-polish" budget/exercise.html
          grep -q "touchstart" budget/exercise-timer-focus.js
          grep -q "touchmove" budget/exercise-timer-focus.js
      - name: Commit tested polish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add budget/exercise-timer-focus.js budget/exercise.html budget/auth-config.js budget/auth-gate.js
          git diff --cached --quiet || git commit -m 'Polish compact timer alignment and focus handoff'
          git push
