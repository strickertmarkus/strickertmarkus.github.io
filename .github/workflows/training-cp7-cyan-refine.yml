name: Training CP7 active cyan refinement

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refine-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refine semantic state mapping
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, got {count}")
              return text.replace(old, new, 1)

          def sub_once(text, pattern, replacement, label):
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.MULTILINE)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, got {count}")
              return updated

          env_path = Path('budget/pulse-environment/environment.js')
          env = env_path.read_text()
          env = sub_once(env, r"^\s*if \(Number\.isFinite\(value\) && value > 0\) return 'current';\n", '', 'partial goal progress mapping')
          env = replace_once(env,
            "    setObservatoryState(document.querySelector('.observatory-metrics .stat-week'), weekCount >= weeklyGoal ? 'goal-achieved' : weekCount > 0 ? 'current' : 'pending');",
            "    setObservatoryState(document.querySelector('.observatory-metrics .stat-week'), weekCount >= weeklyGoal ? 'goal-achieved' : 'pending');",
            'weekly metric mapping')
          env = replace_once(env,
            "    setObservatoryState(document.querySelector('.observatory-metrics .stat-duration'), duration > 0 ? 'current' : 'pending');",
            "    setObservatoryState(document.querySelector('.observatory-metrics .stat-duration'), duration > 0 ? 'completed' : 'pending');",
            'duration metric mapping')
          env = replace_once(env,
            "    setObservatoryState(document.getElementById('observatory-progress'), weekCount >= weeklyGoal ? 'goal-achieved' : weekCount > 0 ? 'current' : 'pending');",
            "    setObservatoryState(document.getElementById('observatory-progress'), weekCount >= weeklyGoal ? 'goal-achieved' : 'pending');",
            'overview progress mapping')
          env = sub_once(env,
            r"      const state = day\.classList\.contains\('done'\)\n\s*\? 'completed'\n\s*: \(day\.classList\.contains\('is-selected'\) \|\| day\.classList\.contains\('today'\)\)\n\s*\? 'current'\n\s*: 'pending';",
            "      const state = (day.classList.contains('is-selected') || day.classList.contains('today'))\n        ? 'current'\n        : day.classList.contains('done')\n          ? 'completed'\n          : 'pending';",
            'active day precedence')
          env_path.write_text(env)

          html_path = Path('budget/exercise.html')
          html = html_path.read_text()
          html = replace_once(html,
            'pulse-environment/environment.js?v=20260915-main-cp7-state-1',
            'pulse-environment/environment.js?v=20260915-main-cp7-state-2',
            'environment cache key')
          html_path.write_text(html)

          test_path = Path('budget/tests/training-observatory-state.test.cjs')
          test = test_path.read_text()
          marker = "test('pending dims decoration rather than readable text', () => {\n"
          extra = """test('cyan current state is reserved for active context rather than partial progress', () => {
            assert.doesNotMatch(environment, /value > 0\\) return 'current'/);
            assert.doesNotMatch(environment, /weekCount > 0 \\? 'current'/);
            assert.match(environment, /stat-duration'\\), duration > 0 \\? 'completed' : 'pending'/);
            assert.match(environment, /is-selected'\\) \\|\\| day\\.classList\\.contains\\('today'\\)[\\s\\S]*\\? 'current'[\\s\\S]*day\\.classList\\.contains\\('done'\\)[\\s\\S]*\\? 'completed'/);
            assert.match(environment, /start, start\\.dataset\\.planState === 'planned' \\? 'current' : 'pending'/);
          });

          """
          test = replace_once(test, marker, extra + marker, 'active cyan regression test')
          test = replace_once(test,
            "assert.match(html, /pulse-environment\\/environment\\.js\\?v=20260915-main-cp7-state-1/);",
            "assert.match(html, /pulse-environment\\/environment\\.js\\?v=20260915-main-cp7-state-2/);",
            'environment cache test')
          test_path.write_text(test)

          checklist_path = Path('budget/TRAINING-OBSERVATORY-MIGRATION-CHECKLIST.md')
          checklist = checklist_path.read_text()
          anchor = "Implementation checkpoint: `pulse-environment/environment.js` derives presentation-only semantic state from the canonical workout/goal DOM and existing truth (`done`, today/selected, progress width and metric values). `pulse-observatory/observatory.css` owns the four state token families. The collapsed week, metrics, Next Workout cue and goal accents consume those tokens, while `training-week-orbit.css` consumes the same variables instead of maintaining per-class glow constants. Pending changes decoration only; readable text opacity is not reduced."
          replacement = anchor + "\n\nVisual refinement: `current`/cyan is reserved for active context (selected/today day and the planned Next Workout action). Partial goal/week progress stays `pending` until achieved, while accumulated completed activity uses `completed`; this keeps cyan intentional instead of appearing across unrelated progress values."
          checklist = replace_once(checklist, anchor, replacement, 'CP7 refinement note')
          checklist_path.write_text(checklist)
          PY
      - name: Syntax and training regression tests
        run: |
          node --check budget/pulse-environment/environment.js
          node --test budget/tests/training-*.test.cjs
          git diff --check
      - name: Verify active cyan ownership
        run: |
          grep -F "weekCount >= weeklyGoal ? 'goal-achieved' : 'pending'" budget/pulse-environment/environment.js
          grep -F "duration > 0 ? 'completed' : 'pending'" budget/pulse-environment/environment.js
          grep -F "start.dataset.planState === 'planned' ? 'current' : 'pending'" budget/pulse-environment/environment.js
          ! grep -F "weekCount > 0 ? 'current'" budget/pulse-environment/environment.js
          ! grep -F "value > 0) return 'current'" budget/pulse-environment/environment.js
      - name: Commit refinement and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/training-cp7-cyan-refine.yml
          git add budget/pulse-environment/environment.js budget/exercise.html budget/tests/training-observatory-state.test.cjs budget/TRAINING-OBSERVATORY-MIGRATION-CHECKLIST.md
          git commit -m "Refine Observatory active cyan hierarchy"
          git push origin HEAD:main
