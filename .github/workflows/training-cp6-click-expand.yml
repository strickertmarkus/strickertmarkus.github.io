name: Training CP6 click-expand migration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Replace drag orbit with click-only control
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, got {count}')
              return text.replace(old, new, 1)

          js = r'''/* Checkpoint 6 — one canonical weekly plan with a reversible click-expanded Observatory orbit. */
          (function () {
            'use strict';

            const reduced = matchMedia('(prefers-reduced-motion: reduce)');
            let weekOrbitProgress = 0;
            let weekOrbitLayout = null;
            let weekOrbitRaf = 0;
            let weekOrbitAnimation = null;
            let weekOrbitShell = null;
            let weekOrbitToggle = null;

            function overviewMode() {
              const explicit = document.documentElement.dataset.trainingOverview;
              if (explicit) return explicit;
              return document.body && document.body.classList.contains('pulse-observatory') ? 'observatory' : 'compact';
            }

            function orbitAvailable() { return overviewMode() === 'observatory'; }
            function clamp01(value) { return Math.max(0, Math.min(1, value)); }
            function mix(from, to, progress) { return from + (to - from) * progress; }
            function easeOutCubic(value) { return 1 - Math.pow(1 - value, 3); }

            function clearOrbitInlineStyles(layout) {
              if (!layout) return;
              layout.days.forEach(day => {
                day.style.removeProperty('--week-orbit-x');
                day.style.removeProperty('--week-orbit-y');
                day.style.removeProperty('--week-orbit-width');
                day.style.removeProperty('--week-orbit-height');
                day.style.removeProperty('--week-orbit-radius');
                day.style.removeProperty('--week-orbit-node-progress');
              });
              layout.grid.style.removeProperty('height');
              layout.grid.style.removeProperty('--week-orbit-progress');
              layout.shell.style.removeProperty('--week-orbit-progress');
              layout.shell.style.removeProperty('--week-orbit-diameter');
              layout.shell.style.removeProperty('--week-orbit-center-y');
              layout.grid.classList.remove('week-orbit-layout');
            }

            function deactivateOrbitLayout() {
              clearOrbitInlineStyles(weekOrbitLayout);
              weekOrbitLayout = null;
            }

            function captureOrbitLayout() {
              const grid = document.getElementById('week-grid');
              if (!grid || !weekOrbitShell) return null;
              const days = Array.from(grid.querySelectorAll('.week-day'));
              if (days.length !== 7) return null;

              if (weekOrbitLayout && weekOrbitLayout.days.length === days.length && weekOrbitLayout.days.every((day, index) => day === days[index])) {
                return weekOrbitLayout;
              }

              deactivateOrbitLayout();
              const gridRect = grid.getBoundingClientRect();
              const bases = days.map(day => {
                const rect = day.getBoundingClientRect();
                return {
                  x: rect.left - gridRect.left + rect.width / 2,
                  y: rect.top - gridRect.top + rect.height / 2,
                  width: rect.width,
                  height: rect.height
                };
              });
              const collapsedHeight = Math.max(gridRect.height, Math.max.apply(null, bases.map(base => base.y + base.height / 2)));
              weekOrbitLayout = { grid, shell: weekOrbitShell, days, bases, collapsedHeight };
              grid.classList.add('week-orbit-layout');
              grid.style.height = collapsedHeight + 'px';
              return weekOrbitLayout;
            }

            function updateOrbitControl() {
              if (!weekOrbitToggle) return;
              const destination = weekOrbitAnimation ? weekOrbitAnimation.to : weekOrbitProgress;
              const expanded = destination >= .5;
              weekOrbitToggle.setAttribute('aria-expanded', String(expanded));
              weekOrbitToggle.setAttribute('aria-label', expanded ? 'Fäll ihop veckoplanens orbitvy' : 'Expandera veckoplanen till orbitvy');
            }

            function renderOrbitProgress() {
              if (!weekOrbitLayout && weekOrbitProgress > 0) captureOrbitLayout();
              const layout = weekOrbitLayout;
              if (!layout) {
                updateOrbitControl();
                return;
              }

              const progress = clamp01(weekOrbitProgress);
              const gridRect = layout.grid.getBoundingClientRect();
              const width = Math.max(1, gridRect.width || layout.shell.clientWidth || 1);
              const expandedHeight = Math.min(430, Math.max(286, width * .92));
              const nodeSize = width < 340 ? 48 : width < 430 ? 52 : 58;
              const radius = Math.min(width * .39, expandedHeight * .39);
              const centerX = width / 2;
              const centerY = expandedHeight / 2;

              layout.grid.style.height = mix(layout.collapsedHeight, expandedHeight, progress) + 'px';
              layout.grid.style.setProperty('--week-orbit-progress', progress.toFixed(4));
              layout.shell.style.setProperty('--week-orbit-progress', progress.toFixed(4));
              layout.shell.style.setProperty('--week-orbit-diameter', (radius * 2) + 'px');
              layout.shell.style.setProperty('--week-orbit-center-y', centerY + 'px');

              layout.days.forEach((day, index) => {
                const angle = (-90 + index * 360 / 7) * Math.PI / 180;
                const targetX = centerX + radius * Math.cos(angle);
                const targetY = centerY + radius * Math.sin(angle);
                const base = layout.bases[index];
                day.style.setProperty('--week-orbit-x', mix(base.x, targetX, progress) + 'px');
                day.style.setProperty('--week-orbit-y', mix(base.y, targetY, progress) + 'px');
                day.style.setProperty('--week-orbit-width', mix(base.width, nodeSize, progress) + 'px');
                day.style.setProperty('--week-orbit-height', mix(base.height, nodeSize, progress) + 'px');
                day.style.setProperty('--week-orbit-radius', (progress * 50) + '%');
                day.style.setProperty('--week-orbit-node-progress', progress.toFixed(4));
              });

              const section = layout.grid.closest('.observatory-week');
              if (section) {
                section.dataset.weekOrbitState = weekOrbitAnimation ? 'settling' : progress >= .999 ? 'expanded' : progress <= .001 ? 'collapsed' : 'transitioning';
              }
              updateOrbitControl();
            }

            function requestOrbitFrame() {
              if (!weekOrbitRaf) weekOrbitRaf = requestAnimationFrame(orbitFrame);
            }

            function orbitFrame(now) {
              weekOrbitRaf = 0;
              if (!weekOrbitAnimation) {
                renderOrbitProgress();
                return;
              }
              if (!weekOrbitAnimation.startedAt) weekOrbitAnimation.startedAt = now;
              const elapsed = now - weekOrbitAnimation.startedAt;
              const raw = Math.min(1, elapsed / weekOrbitAnimation.duration);
              weekOrbitProgress = mix(weekOrbitAnimation.from, weekOrbitAnimation.to, easeOutCubic(raw));
              renderOrbitProgress();
              if (raw < 1) {
                requestOrbitFrame();
                return;
              }
              const target = weekOrbitAnimation.to;
              weekOrbitAnimation = null;
              weekOrbitProgress = target;
              renderOrbitProgress();
              if (target === 0) deactivateOrbitLayout();
            }

            function settleOrbit(target, immediate) {
              target = target ? 1 : 0;
              if (target && !orbitAvailable()) return;
              if (target && !captureOrbitLayout()) return;
              weekOrbitAnimation = null;
              if (immediate || reduced.matches) {
                weekOrbitProgress = target;
                renderOrbitProgress();
                if (!target) deactivateOrbitLayout();
                return;
              }
              weekOrbitAnimation = {
                from: weekOrbitProgress,
                to: target,
                duration: 320,
                startedAt: 0
              };
              requestOrbitFrame();
            }

            function recaptureOrbitAfterLayoutChange() {
              const progress = weekOrbitProgress;
              if (!weekOrbitLayout && progress <= 0) return;
              if (weekOrbitLayout) {
                clearOrbitInlineStyles(weekOrbitLayout);
                weekOrbitLayout = null;
              }
              if (progress > 0 && orbitAvailable()) {
                captureOrbitLayout();
                weekOrbitProgress = progress;
                renderOrbitProgress();
              }
            }

            function install() {
              const grid = document.getElementById('week-grid');
              weekOrbitShell = document.querySelector('[data-week-orbit-shell]');
              weekOrbitToggle = document.querySelector('[data-week-orbit-toggle]');
              if (!grid || !weekOrbitShell || !weekOrbitToggle) return;

              weekOrbitToggle.addEventListener('click', function () {
                settleOrbit(weekOrbitProgress < .5, false);
              });

              new MutationObserver(function () {
                if (weekOrbitProgress > 0) recaptureOrbitAfterLayoutChange();
              }).observe(grid, { childList: true });

              window.addEventListener('resize', function () {
                if (weekOrbitProgress > 0 && orbitAvailable()) recaptureOrbitAfterLayoutChange();
              }, { passive: true });

              window.addEventListener('training-overview-change', function () {
                if (!orbitAvailable() && weekOrbitProgress > 0) settleOrbit(0, true);
              });

              updateOrbitControl();
            }

            if (document.readyState !== 'complete') document.addEventListener('DOMContentLoaded', install, { once: true });
            else install();
          })();
          '''
          js = '\n'.join(line[10:] if line.startswith('          ') else line for line in js.splitlines()) + '\n'
          Path('budget/training-week-orbit.js').write_text(js)

          css = r'''/* Checkpoint 6 — one weekly plan, reversible click-expanded Observatory orbit. */
          html[data-training-overview="compact"] .week-orbit-toggle,
          html[data-training-overview="compact"] .week-orbit-geometry{display:none!important}

          html[data-training-overview="observatory"] #pulse-home .observatory-week{
            --week-orbit-progress:0;
            position:relative;
          }

          html[data-training-overview="observatory"] #pulse-home .observatory-week-title-row{
            display:flex;
            align-items:center;
            gap:10px;
            min-width:0;
          }

          html[data-training-overview="observatory"] #pulse-home .week-orbit-toggle{
            width:34px;
            height:34px;
            flex:0 0 34px;
            display:grid;
            place-items:center;
            padding:0;
            border:1px solid #f0a9c32b;
            border-radius:50%;
            background:#ff78920a;
            color:#d4b7c7;
            box-shadow:inset 0 1px 0 #ffeaf20a,0 0 16px #ff557809;
            cursor:pointer;
            -webkit-tap-highlight-color:transparent;
            transition:color .22s,border-color .22s,background .22s,box-shadow .22s,transform .22s;
          }

          html[data-training-overview="observatory"] #pulse-home .week-orbit-toggle:hover,
          html[data-training-overview="observatory"] #pulse-home .week-orbit-toggle:focus-visible{
            color:#ffe6ef;
            border-color:#ffb0c55c;
            background:#ff789218;
            box-shadow:inset 0 1px 0 #ffeaf20e,0 0 22px #ff55781c;
            outline:none;
          }

          html[data-training-overview="observatory"] #pulse-home .week-orbit-toggle[aria-expanded="true"]{
            color:#ffd7e3;
            border-color:#ffb8cd62;
            background:#ff789216;
            box-shadow:inset 0 0 12px #ffbdd00a,0 0 22px #ff55781c;
          }

          html[data-training-overview="observatory"] #pulse-home .week-orbit-expand-symbol{
            width:16px;
            height:16px;
            overflow:visible;
            stroke:currentColor;
            stroke-width:1.45;
            stroke-linecap:round;
            stroke-linejoin:round;
            transition:transform .28s cubic-bezier(.16,1,.3,1);
          }
          html[data-training-overview="observatory"] #pulse-home .week-orbit-toggle[aria-expanded="true"] .week-orbit-expand-symbol{
            transform:scale(.88) rotate(90deg);
          }

          html[data-training-overview="observatory"] #pulse-home .week-orbit-shell{
            position:relative;
            isolation:isolate;
            overflow:visible;
            min-width:0;
          }

          html[data-training-overview="observatory"] #pulse-home .week-orbit-geometry{
            position:absolute;
            z-index:0;
            left:50%;
            top:var(--week-orbit-center-y,50%);
            width:var(--week-orbit-diameter,260px);
            height:var(--week-orbit-diameter,260px);
            transform:translate(-50%,-50%);
            opacity:var(--week-orbit-progress,0);
            pointer-events:none;
            overflow:visible;
          }
          html[data-training-overview="observatory"] #pulse-home .week-orbit-ring{
            fill:none;
            stroke:#ff91ad2f;
            stroke-width:.55;
            vector-effect:non-scaling-stroke;
          }
          html[data-training-overview="observatory"] #pulse-home .week-orbit-ring-outer{
            stroke:#ff78964a;
            filter:drop-shadow(0 0 4px #ff547b38);
          }
          html[data-training-overview="observatory"] #pulse-home .week-orbit-ring-inner{
            stroke:#d9a2d321;
            stroke-dasharray:1.5 5;
          }
          html[data-training-overview="observatory"] #pulse-home .week-orbit-trace{
            fill:none;
            stroke:#ff5d8457;
            stroke-width:.85;
            stroke-linecap:round;
            filter:drop-shadow(0 0 3px #ff476a45);
          }
          html[data-training-overview="observatory"] #pulse-home .week-orbit-trace-secondary{
            stroke:#8ad7df33;
            filter:drop-shadow(0 0 3px #54d5e02e);
          }
          html[data-training-overview="observatory"] #pulse-home .week-orbit-center-symbol{
            fill:none;
            stroke:#ffd2df;
            stroke-width:1.15;
            stroke-linecap:round;
            stroke-linejoin:round;
            vector-effect:non-scaling-stroke;
            opacity:var(--week-orbit-progress,0);
            filter:drop-shadow(0 0 3px #ffb2c8) drop-shadow(0 0 9px #ff5c8a77);
          }

          html[data-training-overview="observatory"] #pulse-home .observatory-week #week-grid.week-orbit-layout{
            display:block!important;
            position:relative!important;
            align-content:start!important;
            overflow:visible!important;
            margin:0!important;
            padding:0!important;
            z-index:1;
          }

          html[data-training-overview="observatory"] #pulse-home .observatory-week #week-grid.week-orbit-layout .week-day{
            position:absolute!important;
            left:var(--week-orbit-x)!important;
            top:var(--week-orbit-y)!important;
            width:var(--week-orbit-width)!important;
            height:var(--week-orbit-height)!important;
            min-width:0!important;
            min-height:0!important;
            transform:translate(-50%,-50%)!important;
            border-radius:var(--week-orbit-radius)!important;
            padding:7px 4px!important;
            gap:2px!important;
            justify-content:center!important;
            overflow:visible!important;
            transition:color .2s,box-shadow .2s,border-color .2s,background .2s!important;
            will-change:left,top,width,height,border-radius;
            z-index:2;
          }

          html[data-training-overview="observatory"] #pulse-home .observatory-week #week-grid.week-orbit-layout .week-day::before{
            content:'';
            position:absolute;
            inset:-1px;
            border-radius:inherit;
            border:1px solid #d88da52a;
            background:radial-gradient(circle at 35% 28%,#ff9bb217,#2c172410 60%,transparent 78%);
            box-shadow:0 0 18px #ff55750c,inset 0 0 14px #ffb0c408;
            opacity:var(--week-orbit-node-progress,0);
            pointer-events:none;
            z-index:-1;
          }

          html[data-training-overview="observatory"] #pulse-home .observatory-week #week-grid.week-orbit-layout .week-day.is-selected::before{
            border-color:#ffc1d58e;
            box-shadow:0 0 19px #ff66843f,inset 0 0 15px #ffbad21a;
            background:radial-gradient(circle at 35% 28%,#ffb0c525,#3a1c2c18 64%,transparent 80%);
          }
          html[data-training-overview="observatory"] #pulse-home .observatory-week #week-grid.week-orbit-layout .week-day.done::before{
            border-color:#ff8ba758;
            box-shadow:0 0 15px #ff4f7130,inset 0 0 12px #ff9bb012;
          }
          html[data-training-overview="observatory"] #pulse-home .observatory-week #week-grid.week-orbit-layout .week-day.today::before{
            border-color:#8be1e978;
            box-shadow:0 0 16px #53d8e838,inset 0 0 12px #83e8ec10;
          }
          html[data-training-overview="observatory"] #pulse-home .observatory-week #week-grid.week-orbit-layout .week-day.pending::before{
            border-color:#c98ca41f;
            box-shadow:0 0 10px #ff55750a;
          }

          html[data-training-overview="observatory"] #pulse-home .observatory-week #week-grid.week-orbit-layout .wd-week,
          html[data-training-overview="observatory"] #pulse-home .observatory-week #week-grid.week-orbit-layout .wd-type{
            position:absolute!important;
            left:50%;
            transform:translateX(-50%);
            width:max-content;
            max-width:calc(100% - 8px);
            opacity:calc(1 - var(--week-orbit-node-progress,0));
            pointer-events:none;
            white-space:nowrap;
            overflow:hidden;
            text-overflow:ellipsis;
          }
          html[data-training-overview="observatory"] #pulse-home .observatory-week #week-grid.week-orbit-layout .wd-week{top:4px}
          html[data-training-overview="observatory"] #pulse-home .observatory-week #week-grid.week-orbit-layout .wd-type{bottom:4px}
          html[data-training-overview="observatory"] #pulse-home .observatory-week #week-grid.week-orbit-layout .wd-name{
            font-size:9px!important;
            letter-spacing:.35px!important;
            color:#cbb4c5!important;
            line-height:1!important;
          }
          html[data-training-overview="observatory"] #pulse-home .observatory-week #week-grid.week-orbit-layout .wd-date{
            font-size:18px!important;
            font-weight:500!important;
            color:#f7e3eb!important;
            line-height:1!important;
          }
          html[data-training-overview="observatory"] #pulse-home .observatory-week #week-grid.week-orbit-layout .wd-status{
            position:absolute!important;
            top:3px!important;
            right:5px!important;
            font-size:9px!important;
            line-height:1!important;
            z-index:2;
          }

          html[data-training-overview="observatory"] #pulse-home .observatory-week[data-week-orbit-state="expanded"] .week-orbit-shell::before{
            content:'';
            position:absolute;
            left:50%;
            top:var(--week-orbit-center-y,50%);
            width:min(70vw,330px);
            aspect-ratio:1;
            transform:translate(-50%,-50%);
            border-radius:50%;
            background:radial-gradient(circle,#ff55700d 0%,#ff4f7511 26%,#a31e5010 50%,transparent 72%);
            filter:blur(13px);
            pointer-events:none;
            z-index:-1;
          }

          @media (max-width:760px){
            html[data-training-overview="observatory"] #pulse-home .observatory-week-title-row{gap:8px}
            html[data-training-overview="observatory"] #pulse-home .week-orbit-toggle{width:32px;height:32px;flex-basis:32px}
            html[data-training-overview="observatory"] #pulse-home .week-orbit-expand-symbol{width:15px;height:15px}
            html[data-training-overview="observatory"] #pulse-home .observatory-week #week-grid.week-orbit-layout .week-day{padding:6px 3px!important}
            html[data-training-overview="observatory"] #pulse-home .observatory-week #week-grid.week-orbit-layout .wd-date{font-size:16px!important}
          }

          @media (prefers-reduced-motion:reduce){
            html[data-training-overview="observatory"] #pulse-home .week-orbit-expand-symbol,
            html[data-training-overview="observatory"] #pulse-home .observatory-week #week-grid.week-orbit-layout .week-day{
              transition:none!important;
            }
          }
          '''
          css = '\n'.join(line[10:] if line.startswith('          ') else line for line in css.splitlines()) + '\n'
          Path('budget/training-week-orbit.css').write_text(css)

          html_path = Path('budget/exercise.html')
          html = html_path.read_text()
          old_header = '<div class="section-hdr fade-in"><h2>Veckoplan</h2><div style="display:flex;gap:8px"><button class="btn-sm" onclick="openPlanModal()">Redigera</button><button class="btn-sm" onclick="openTemplateModal()">Mallpass</button></div></div>'
          new_header = '''<div class="section-hdr fade-in">
              <div class="observatory-week-title-row">
                <button type="button" class="week-orbit-toggle observatory-only" data-week-orbit-toggle aria-expanded="false" aria-label="Expandera veckoplanen till orbitvy"><svg class="week-orbit-expand-symbol" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><path d="M9 4H4v5M15 4h5v5M9 20H4v-5M15 20h5v-5"/></svg></button>
                <h2>Veckoplan</h2>
              </div>
              <div style="display:flex;gap:8px"><button class="btn-sm" onclick="openPlanModal()">Redigera</button><button class="btn-sm" onclick="openTemplateModal()">Mallpass</button></div>
            </div>'''
          html = replace_once(html, old_header, new_header, 'weekly header')
          old_grid = '<div class="week-grid fade-in" id="week-grid" aria-label="Välj dag i veckoplanen"></div>'
          new_grid = '''<div class="week-orbit-shell" data-week-orbit-shell>
              <svg class="week-orbit-geometry observatory-only" viewBox="0 0 100 100" fill="none" aria-hidden="true" focusable="false">
                <circle class="week-orbit-ring week-orbit-ring-outer" cx="50" cy="50" r="44"/>
                <circle class="week-orbit-ring week-orbit-ring-inner" cx="50" cy="50" r="35"/>
                <path class="week-orbit-trace" d="M18 72C29 89 60 96 82 74"/>
                <path class="week-orbit-trace week-orbit-trace-secondary" d="M18 28C30 10 62 5 83 27"/>
                <g class="week-orbit-center-symbol" transform="translate(38 38)"><path d="M12 1.8C13.3 7.15 16.85 10.7 22.2 12C16.85 13.3 13.3 16.85 12 22.2C10.7 16.85 7.15 13.3 1.8 12C7.15 10.7 10.7 7.15 12 1.8Z"/></g>
              </svg>
              <div class="week-grid fade-in" id="week-grid" aria-label="Välj dag i veckoplanen"></div>
            </div>'''
          html = replace_once(html, old_grid, new_grid, 'weekly orbit shell')
          html = replace_once(html, 'training-week-orbit.css?v=20260915-main-cp6-1', 'training-week-orbit.css?v=20260915-main-cp6-click-2', 'orbit css cache')
          html = replace_once(html, 'training-week-orbit.js?v=20260915-main-cp6-1', 'training-week-orbit.js?v=20260915-main-cp6-click-2', 'orbit js cache')
          html_path.write_text(html)

          checklist_path = Path('budget/TRAINING-OBSERVATORY-MIGRATION-CHECKLIST.md')
          checklist = checklist_path.read_text()
          start = checklist.index('# Checkpoint 6 — Expandable weekly plan: linear → Observatory orbit')
          end = checklist.index('# Checkpoint 7 — Achievement / inactive visual hierarchy', start)
          replacement = '''# Checkpoint 6 — Expandable weekly plan: linear → Observatory orbit

          Goal: the weekly plan expands from its normal linear layout into an Observatory orbit through one small explicit expand control, and collapses through the same control.

          This interaction reuses the **real seven weekly-plan nodes**. There is no second interactive weekly plan and no drag/pointer-capture system.

          - [x] Keep one owner/state: `weekOrbitProgress` from `0` (collapsed/linear) to `1` (expanded/orbit).
          - [x] Put one small expand-icon control at the left of the weekly-plan header, aligned with `Redigera` and `Mallpass`.
          - [x] Clicking the control animates the seven real day nodes between the linear layout and the orbit.
          - [x] The same control collapses the expanded orbit and updates its accessible label/state.
          - [x] Use Reactor's orbit geometry only as a mathematical/reference source, not Reactor's visual theme.
          - [x] Use Observatory thin orbital traces and rose/cyan atmospheric hierarchy.
          - [x] Replace decorative random dots/plus marks with the canonical Pulse Observatory star geometry in the orbit centre.
          - [x] Planned/completed/current days remain semantically distinguishable in both states.
          - [x] Avoid cloning live interactive nodes; the existing `#week-grid .week-day` nodes move in place.
          - [x] Keep at most one request-animation-frame owner during the click transition; no permanent polling loop.
          - [x] Remove drag, pointer capture, click-suppression and drag-affordance code completely.
          - [x] Normal vertical page scrolling remains untouched because the orbit has no gesture capture.
          - [x] Tapping a day still opens/selects the intended plan in both collapsed and orbit state.
          - [x] Week navigation and builder editing still operate on the same source data.
          - [ ] Test repeated expand/collapse cycles on a physical iPhone/Safari.
          - [x] Respect reduced motion: state switching is immediate without the continuous morph.

          Implementation checkpoint: `training-week-orbit.js` owns only click expansion state, layout interpolation and one temporary animation-frame loop. `exercise.html` owns the small header control and the single static orbit shell around the canonical `week-grid`; `training-week-orbit.css` owns the scoped presentation. Drag/pointer infrastructure from the first CP6 iteration has been deleted.

          Verification: Node syntax + all `budget/tests/training-*.test.cjs`, one canonical `week-grid`, no `cloneNode`, no pointer-capture/drag listeners, one orbit `requestAnimationFrame` owner, reduced-motion instant path, day-state styling, week rerender recapture, overview-switch cleanup, current cache keys and `git diff --check`.

          **Checkpoint exit condition:** one weekly plan, two geometries, one compact click control, no stale cloned or gesture state.

          ---

          '''
          replacement = '\n'.join(line[10:] if line.startswith('          ') else line for line in replacement.splitlines())
          checklist = checklist[:start] + replacement + checklist[end:]
          checklist_path.write_text(checklist)

          test = r'''const test = require('node:test');
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');

          const root = path.join(__dirname, '..');
          const read = relative => fs.readFileSync(path.join(root, relative), 'utf8');

          const orbit = read('training-week-orbit.js');
          const orbitCss = read('training-week-orbit.css');
          const html = read('exercise.html');
          const starPath = 'M12 1.8C13.3 7.15 16.85 10.7 22.2 12C16.85 13.3 13.3 16.85 12 22.2C10.7 16.85 7.15 13.3 1.8 12C7.15 10.7 10.7 7.15 12 1.8Z';

          test('weekly orbit keeps one progress state and one temporary animation-frame owner', () => {
            assert.match(orbit, /let weekOrbitProgress = 0;/);
            assert.match(orbit, /function orbitFrame\(now\)/);
            assert.equal((orbit.match(/requestAnimationFrame\(orbitFrame\)/g) || []).length, 1);
            assert.doesNotMatch(orbit, /setInterval\(/);
          });

          test('orbit reuses the canonical week grid and never clones interactive day nodes', () => {
            assert.match(orbit, /const grid = document\.getElementById\('week-grid'\);/);
            assert.match(orbit, /Array\.from\(grid\.querySelectorAll\('\.week-day'\)\)/);
            assert.doesNotMatch(orbit, /cloneNode\(/);
            assert.equal((html.match(/id="week-grid"/g) || []).length, 1);
            assert.match(html, /data-week-orbit-shell/);
          });

          test('CP6 uses one small click-only expand control in the weekly header', () => {
            const week = html.slice(html.indexOf('<section class="observatory-week"'), html.indexOf('<hr class="rule compact-only">'));
            assert.match(week, /observatory-week-title-row/);
            assert.match(week, /class="week-orbit-toggle observatory-only"/);
            assert.match(week, /class="week-orbit-expand-symbol"/);
            assert.ok(week.indexOf('week-orbit-toggle') < week.indexOf('<h2>Veckoplan</h2>'));
            assert.match(orbit, /weekOrbitToggle\.addEventListener\('click'/);
            assert.doesNotMatch(orbit, /pointerdown|pointermove|pointerup|pointercancel|setPointerCapture|releasePointerCapture|weekOrbitDrag|SuppressClick/);
            assert.doesNotMatch(orbitCss, /touch-action:none|data-dragging|week-orbit-grip|week-orbit-chevron/);
          });

          test('click animation remains reversible and reduced motion takes the instant path', () => {
            assert.match(orbit, /settleOrbit\(weekOrbitProgress < \.5, false\)/);
            assert.match(orbit, /aria-expanded/);
            assert.match(orbit, /if \(immediate \|\| reduced\.matches\)/);
            assert.match(orbitCss, /@media \(prefers-reduced-motion:reduce\)/);
          });

          test('week rerenders and overview switches cannot leave stale orbit layout', () => {
            assert.match(orbit, /recaptureOrbitAfterLayoutChange/);
            assert.match(orbit, /MutationObserver\(function \(\) \{\s*if \(weekOrbitProgress > 0\) recaptureOrbitAfterLayoutChange\(\);/);
            assert.match(orbit, /if \(!orbitAvailable\(\) && weekOrbitProgress > 0\) settleOrbit\(0, true\)/);
          });

          test('orbit visual language preserves day semantics and uses the canonical Observatory star in the centre', () => {
            assert.match(orbitCss, /week-day\.is-selected::before/);
            assert.match(orbitCss, /week-day\.done::before/);
            assert.match(orbitCss, /week-day\.today::before/);
            assert.match(orbitCss, /week-day\.pending::before/);
            assert.match(orbitCss, /week-orbit-trace-secondary/);
            assert.match(orbitCss, /week-orbit-center-symbol/);
            assert.match(html, new RegExp(starPath.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')));
            assert.doesNotMatch(html, /week-orbit-stars|week-orbit-axis/);
          });

          test('orbit stylesheet is Observatory-scoped and structurally balanced', () => {
            assert.match(orbitCss, /html\[data-training-overview="observatory"\]/);
            assert.match(orbitCss, /html\[data-training-overview="compact"\] \.week-orbit-toggle/);
            const opens = (orbitCss.match(/\{/g) || []).length;
            const closes = (orbitCss.match(/\}/g) || []).length;
            assert.equal(opens, closes);
          });

          test('production page loads the click-only CP6 assets with current cache keys', () => {
            assert.match(html, /training-week-orbit\.css\?v=20260915-main-cp6-click-2/);
            assert.match(html, /training-week-orbit\.js\?v=20260915-main-cp6-click-2/);
          });
          '''
          test = '\n'.join(line[10:] if line.startswith('          ') else line for line in test.splitlines()) + '\n'
          Path('budget/tests/training-week-orbit.test.cjs').write_text(test)
          PY

      - name: Syntax and training regression tests
        run: |
          node --check budget/training-week-orbit.js
          node --check budget/pulse-environment/environment.js
          node --test budget/tests/training-*.test.cjs
          git diff --check

      - name: Verify obsolete drag code is gone
        run: |
          test "$(grep -o 'id="week-grid"' budget/exercise.html | wc -l)" -eq 1
          test "$(grep -o 'requestAnimationFrame(orbitFrame)' budget/training-week-orbit.js | wc -l)" -eq 1
          ! grep -Eq 'pointerdown|pointermove|pointerup|pointercancel|setPointerCapture|releasePointerCapture|weekOrbitDrag|SuppressClick' budget/training-week-orbit.js
          ! grep -Eq 'week-orbit-grip|week-orbit-chevron|data-dragging|touch-action:none|week-orbit-stars|week-orbit-axis' budget/training-week-orbit.css budget/exercise.html
          grep -q 'week-orbit-center-symbol' budget/exercise.html
          grep -q 'training-week-orbit.js?v=20260915-main-cp6-click-2' budget/exercise.html

      - name: Commit click-only CP6 and remove temporary workflow
        run: |
          git config user.name "strickertmarkus"
          git config user.email "markus.strickert@sigmatechnology.com"
          git rm -f .github/workflows/training-cp6-click-expand.yml
          git add budget/training-week-orbit.js budget/training-week-orbit.css budget/exercise.html budget/TRAINING-OBSERVATORY-MIGRATION-CHECKLIST.md budget/tests/training-week-orbit.test.cjs
          git commit -m "Simplify Observatory weekly orbit control"
          git push origin HEAD:main
