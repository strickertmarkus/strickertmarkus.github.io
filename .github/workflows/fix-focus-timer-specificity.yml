name: Fix focus timer specificity
on:
  push:
    paths:
      - '.github/workflows/fix-focus-timer-specificity.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix focus timer specificity and cache
        shell: bash
        run: |
          set -euo pipefail
          old='20260914-timer-focus-final2'
          new='20260914-timer-focus-final3'
          python3 -c "from pathlib import Path; p=Path('budget/exercise-timer-focus.js'); s=p.read_text(); oldsel='html.cardio-focus-active #session-modal.show'; newsel='html.cardio-focus-active body #session-modal.pulse-flow-v58.show.cardio-countdown-active:not(.session-overview-mode)'; assert oldsel in s; p.write_text(s.replace(oldsel,newsel))"
          sed -i "s/${old}/${new}/g" budget/exercise.html budget/auth-config.js budget/auth-gate.js budget/exercise-pulse-flow-canvas-glow-v131.js
          node --check budget/exercise-timer-focus.js
          grep -q 'html.cardio-focus-active body #session-modal.pulse-flow-v58.show.cardio-countdown-active:not(.session-overview-mode) #session-countdown-ring' budget/exercise-timer-focus.js
          grep -q "exercise-timer-focus.js?v=${new}" budget/exercise.html
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-focus-timer-specificity.yml
          git add budget/exercise-timer-focus.js budget/exercise.html budget/auth-config.js budget/auth-gate.js budget/exercise-pulse-flow-canvas-glow-v131.js
          git commit -m 'Fix focus timer size specificity'
          git push
