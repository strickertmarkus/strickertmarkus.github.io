name: Hamburger morph preview
on:
  push:
    branches: [main]
    paths: ['budget/nav-menu-motion.js', 'budget/tests/menu-morph-browser.cjs', '.github/workflows/menu-morph-verify.yml']
  workflow_dispatch:
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright
          npx playwright install --with-deps webkit
      - run: |
          python3 -m http.server 4173 >/tmp/morph-http.log 2>&1 &
          node budget/tests/menu-morph-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: menu-morph
          path: test-results/menu-morph/
