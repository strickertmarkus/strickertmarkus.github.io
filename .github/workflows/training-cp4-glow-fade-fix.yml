name: Training checkpoint 4 glow fade fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/training-cp4-glow-fade-fix.yml'

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply structural Observatory atmosphere fade
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          css_path = Path('budget/pulse-observatory/observatory.css')
          css = css_path.read_text()

          old_atmosphere = "#pulse-home .observatory-stage::before{content:'';position:absolute;inset:-60px -7vw -35px;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at 66% 68%,#ffafbb22 0%,#ff446a24 12%,#a9194421 32%,transparent 66%);animation:observatoryAtmosphere 10s ease-in-out infinite}"
          new_atmosphere = "#pulse-home .observatory-stage::before{content:'';position:absolute;inset:-70px -10vw -150px;z-index:-1;pointer-events:none;background:radial-gradient(ellipse 68% 58% at 62% 55%,#ffafbb18 0%,#ff446a1b 18%,#a9194414 42%,transparent 76%);-webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 8%,#000 70%,rgba(0,0,0,.7) 82%,rgba(0,0,0,.25) 92%,transparent 100%);mask-image:linear-gradient(to bottom,transparent 0%,#000 8%,#000 70%,rgba(0,0,0,.7) 82%,rgba(0,0,0,.25) 92%,transparent 100%);animation:observatoryAtmosphere 10s ease-in-out infinite}"
          css = replace_once(css, old_atmosphere, new_atmosphere, 'single atmosphere owner')

          old_cardio = '#pulse-home .observatory-stage[data-workout-kind="cardio"]::before{background:radial-gradient(ellipse at 66% 68%,#ffb9c52b 0%,#ff3f6d30 14%,#b51b4a23 38%,transparent 68%)}'
          new_cardio = '#pulse-home .observatory-stage[data-workout-kind="cardio"]::before{background:radial-gradient(ellipse 68% 58% at 62% 55%,#ffb9c51d 0%,#ff3f6d20 18%,#b51b4a15 42%,transparent 76%)}'
          css = replace_once(css, old_cardio, new_cardio, 'cardio atmosphere intensity')

          old_strength = '#pulse-home .observatory-stage[data-workout-kind="strength"]::before{background:radial-gradient(ellipse at 64% 68%,#ffb39d28 0%,#ff516f28 16%,#93183f20 40%,transparent 70%)}'
          new_strength = '#pulse-home .observatory-stage[data-workout-kind="strength"]::before{background:radial-gradient(ellipse 68% 58% at 62% 55%,#ffb39d1b 0%,#ff516f1d 18%,#93183f14 42%,transparent 76%)}'
          css = replace_once(css, old_strength, new_strength, 'strength atmosphere intensity')
          css_path.write_text(css)

          html_path = Path('budget/exercise.html')
          html = html_path.read_text()
          html = replace_once(
              html,
              'pulse-observatory/observatory.css?v=20260915-main-cp4-structural-1',
              'pulse-observatory/observatory.css?v=20260915-main-cp4-glow-fade-1',
              'Observatory CSS cache version'
          )
          html_path.write_text(html)

          test_path = Path('budget/tests/training-observatory-mobile.test.cjs')
          test = test_path.read_text()
          old_test = """test('hero atmosphere is owned by the whole Observatory stage, not the pass field', () => {\n  assert.match(css, /observatory-stage::before\\{[^}]*radial-gradient/);\n  assert.doesNotMatch(css, /observatory-scene::before\\{/);\n  assert.match(css, /observatory-stage\\[data-workout-kind=\"cardio\"\\]::before/);\n  assert.match(environment, /stage\\.dataset\\.workoutKind = kind/);\n});\n\ntest('production page cache-busts the structural Observatory assets', () => {\n  assert.match(html, /pulse-observatory\\/observatory\\.css\\?v=20260915-main-cp4-structural-1/);\n  assert.match(html, /pulse-environment\\/environment\\.css\\?v=20260915-main-cp4-structural-1/);\n  assert.match(html, /pulse-environment\\/environment\\.js\\?v=20260915-main-cp4-structural-1/);\n});\n"""
          new_test = """test('hero atmosphere is owned by the whole Observatory stage and fades before its paint box ends', () => {\n  assert.match(css, /observatory-stage::before\\{[^}]*radial-gradient/);\n  assert.match(css, /observatory-stage::before\\{[^}]*inset:-70px -10vw -150px/);\n  assert.match(css, /observatory-stage::before\\{[^}]*-webkit-mask-image:linear-gradient\\(to bottom,[^}]*transparent 100%\\)/);\n  assert.match(css, /observatory-stage::before\\{[^}]*mask-image:linear-gradient\\(to bottom,[^}]*transparent 100%\\)/);\n  assert.doesNotMatch(css, /observatory-scene::before\\{/);\n  assert.match(css, /observatory-stage\\[data-workout-kind=\"cardio\"\\]::before/);\n  assert.match(environment, /stage\\.dataset\\.workoutKind = kind/);\n});\n\ntest('production page cache-busts the current Observatory composition', () => {\n  assert.match(html, /pulse-observatory\\/observatory\\.css\\?v=20260915-main-cp4-glow-fade-1/);\n  assert.match(html, /pulse-environment\\/environment\\.css\\?v=20260915-main-cp4-structural-1/);\n  assert.match(html, /pulse-environment\\/environment\\.js\\?v=20260915-main-cp4-structural-1/);\n});\n"""
          test = replace_once(test, old_test, new_test, 'atmosphere regression tests')
          test_path.write_text(test)
          PY
      - name: Verify Observatory mobile composition
        run: node --test budget/tests/training-observatory-mobile.test.cjs
      - name: Re-run shared session contract
        run: node --test budget/tests/training-shared-session.test.cjs
      - name: Commit glow fix
        run: |
          git config user.name "strickertmarkus"
          git config user.email "markus.strickert@sigmatechnology.com"
          git add budget/pulse-observatory/observatory.css budget/exercise.html budget/tests/training-observatory-mobile.test.cjs
          git diff --cached --check
          git commit -m "Smooth Observatory atmosphere fade"
          git push origin HEAD:main
