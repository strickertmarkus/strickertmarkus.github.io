name: Apply Budget blue theme v7

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-budget-blue-theme-v7.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply stronger Budget blue theme
        run: python3 .github/scripts/apply_budget_blue_theme_v7.py

      - name: Verify finance UI JavaScript
        run: node --check budget/finance-ui.js

      - name: Verify theme and wheel scope
        shell: bash
        run: |
          grep -q "accent: '#2563EB'.*rgb: '37,99,235'.*bgAlpha: '.16'.*headerAlpha: '.11'.*borderAlpha: '.32'.*glowAlpha: '.14'" budget/finance-ui.js
          grep -q "accent: '#4ADE80'.*rgb: '74,222,128'.*bgAlpha: '.085'" budget/finance-ui.js
          grep -q "accent: '#FB923C'.*rgb: '251,146,60'.*bgAlpha: '.085'" budget/finance-ui.js
          grep -q 'data-finance-view=\\"budget\\".*#pieChart.*drop-shadow' budget/finance-ui.js
          grep -q "hoverBorderColor: isDarkMode() ? 'rgba(125,211,252,0.70)' : '#2563EB'" budget/budget.html
          grep -q "hoverBorderColor: isDarkMode() ? 'rgba(125,211,252,0.70)' : '#2563EB'" budget/budget_maja.html
          for f in budget/budget.html budget/budget_maja.html budget/analytics.html budget/analytics_maja.html budget/familjebudget.html; do
            grep -q 'finance-theme-blue-v7' "$f"
          done
          git diff --quiet -- budget/firebase-sync.js budget/indexeddb-fallback.js budget/budget-persistence-guard.js
          changed="$(git diff --name-only)"
          echo "$changed"
          while IFS= read -r f; do
            case "$f" in
              budget/finance-ui.js|budget/budget.html|budget/budget_maja.html|budget/analytics.html|budget/analytics_maja.html|budget/familjebudget.html) ;;
              '') ;;
              *) echo "Unexpected changed file: $f" >&2; exit 1 ;;
            esac
          done <<< "$changed"

      - name: Commit Budget blue theme
        shell: bash
        run: |
          git config user.name "strickertmarkus"
          git config user.email "markus.strickert@sigmatechnology.com"
          git add budget/finance-ui.js budget/budget.html budget/budget_maja.html budget/analytics.html budget/analytics_maja.html budget/familjebudget.html
          git commit -m "Strengthen Budget blue theme and wheel accent"
          git push
