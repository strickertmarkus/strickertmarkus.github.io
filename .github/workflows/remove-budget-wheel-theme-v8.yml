name: Remove Budget wheel theme v8

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-budget-wheel-theme-v8.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove wheel theme effect and increase segment contrast
        run: python3 .github/scripts/remove_budget_wheel_theme_v8.py

      - name: Verify finance UI JavaScript
        run: node --check budget/finance-ui.js

      - name: Verify scoped changes
        shell: bash
        run: |
          grep -q "accent: '#2563EB'.*rgb: '37,99,235'.*bgAlpha: '.16'.*headerAlpha: '.11'.*borderAlpha: '.32'.*glowAlpha: '.14'" budget/finance-ui.js
          ! grep -Fq 'html[data-finance-view="budget"].finance-ui-clean-v1 body #pieChart' budget/finance-ui.js
          for f in budget/budget.html budget/budget_maja.html; do
            test "$(grep -Fc "expenseSections.map(s => s.color + 'C0')" "$f")" -eq 2
            grep -Fq 'hoverBorderWidth: 0' "$f"
            grep -Fq "hoverBorderColor: 'transparent'" "$f"
            ! grep -Fq "rgba(125,211,252,0.70)" "$f"
            grep -Fq 'finance-theme-blue-v8' "$f"
          done
          for f in budget/analytics.html budget/analytics_maja.html budget/familjebudget.html; do
            grep -Fq 'finance-theme-blue-v8' "$f"
          done
          git diff --quiet -- budget/firebase-sync.js budget/indexeddb-fallback.js budget/budget-persistence-guard.js
          changed="$(git diff --name-only)"
          echo "$changed"
          while IFS= read -r f; do
            case "$f" in
              budget/finance-ui.js|budget/budget.html|budget/budget_maja.html|budget/analytics.html|budget/analytics_maja.html|budget/familjebudget.html) ;;
              '') ;;
              *) echo "Unexpected changed file: $f" >&2; exit 1 ;;
            esac
          done <<< "$changed"

      - name: Commit wheel contrast refinement
        shell: bash
        run: |
          git config user.name "strickertmarkus"
          git config user.email "markus.strickert@sigmatechnology.com"
          git add budget/finance-ui.js budget/budget.html budget/budget_maja.html budget/analytics.html budget/analytics_maja.html budget/familjebudget.html
          git commit -m "Remove Budget wheel theme effect and boost segment contrast"
          git push
