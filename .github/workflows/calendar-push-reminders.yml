name: Calendar push reminders

on:
  workflow_dispatch:
  # One morning run every day, including when nobody has the page open.
  # 08:17 UTC = 09:17 CET / 10:17 CEST, always the day before the due date.
  schedule:
    - cron: '17 8 * * *'

concurrency:
  group: family-push-reminders
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      TZ: Europe/Stockholm

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check sender credential
        shell: bash
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "Missing repository secret FIREBASE_SERVICE_ACCOUNT_JSON" >&2
            exit 1
          fi

      - name: Install Firebase Admin SDK
        run: npm install --no-save --no-package-lock firebase-admin@13

      - name: Check to-do reminder date rules
        run: node --test budget/tests/todo-push-reminders.test.mjs

      - name: Send due calendar and to-do reminders
        run: node budget/push-worker.mjs
