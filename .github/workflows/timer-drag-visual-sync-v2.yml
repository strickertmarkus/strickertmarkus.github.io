name: Timer drag visual sync v2
on:
  push:
    paths:
      - '.github/workflows/timer-drag-visual-sync-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply timer drag visual sync patch
        run: python3 .github/scripts/timer_drag_visual_sync.py
      - name: Validate timer script
        run: |
          node --check budget/exercise-timer-focus.js
          grep -q 'final7-dragfix' budget/exercise.html
      - name: Commit timer fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add budget/exercise-timer-focus.js budget/exercise.html budget/auth-config.js budget/auth-gate.js budget/exercise-pulse-flow-canvas-glow-v131.js
          git commit -m 'Fix cardio timer drag animation sync'
          git push
