name: Restore Home event modal v3

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/restore-home-event-modal-v3.yml'

permissions:
  contents: write

jobs:
  restore-home-event-modal:
    if: github.event.head_commit.message == 'Prepare Home event modal v3 restore'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore native end-date toggle and harden loader
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          const homePath = 'budget/home.html';
          let home = fs.readFileSync(homePath, 'utf8');

          const oldRows = `    <div class="form-row">
      <div class="form-group">
        <label>Datum</label>
        <input type="text" id="ev-date" lang="sv-SE" data-picker="date" placeholder="YYYY-MM-DD">
      </div>
      <div class="form-group">
        <label>Tid (valfri)</label>
        <input type="text" id="ev-time" lang="sv-SE" data-picker="time" placeholder="TT:MM">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Sluttid (valfri)</label>
        <input type="text" id="ev-end-time" lang="sv-SE" data-picker="time" placeholder="TT:MM">
      </div>
      <div class="form-group">
        <label>Slutdatum för upprepning (valfritt)</label>
        <input type="text" id="ev-repeat-until" lang="sv-SE" data-picker="date" placeholder="YYYY-MM-DD">
      </div>
    </div>`;

          const newRows = `    <div class="form-row">
      <div class="form-group">
        <label>Datum</label>
        <input type="text" id="ev-date" lang="sv-SE" data-picker="date" placeholder="YYYY-MM-DD">
      </div>
      <div class="form-group">
        <label>Tid (valfri)</label>
        <input type="text" id="ev-time" lang="sv-SE" data-picker="time" placeholder="TT:MM">
      </div>
    </div>
    <div id="event-end-toggle-v2" class="event-end-toggle-v2">
      <div class="event-end-toggle-v2-copy">
        <strong>Slutdatum / sluttid</strong>
        <span>Aktivera om händelsen har ett slut.</span>
      </div>
      <button type="button" id="event-end-switch-v2" class="event-end-switch-v2" aria-pressed="false" aria-label="Aktivera slutdatum och sluttid"></button>
    </div>
    <div id="event-end-panel-v2" hidden>
      <div class="form-group">
        <label>Slutdatum</label>
        <input type="text" id="ev-end-date" lang="sv-SE" data-picker="date" placeholder="YYYY-MM-DD">
      </div>
      <div class="form-group">
        <label>Sluttid</label>
        <input type="text" id="ev-end-time" lang="sv-SE" data-picker="time" placeholder="TT:MM">
      </div>
    </div>
    <div class="form-row calendar-repeat-row-v2">
      <div class="form-group">
        <label>Slutdatum för upprepning (valfritt)</label>
        <input type="text" id="ev-repeat-until" lang="sv-SE" data-picker="date" placeholder="YYYY-MM-DD">
      </div>
    </div>`;

          if (!home.includes(oldRows)) throw new Error('Could not find old Home event date/time rows');
          home = home.replace(oldRows, newRows);

          const authRegex = /auth-gate\.js\?v=[^\"']+/;
          if (!authRegex.test(home)) throw new Error('Could not find auth-gate loader in home.html');
          home = home.replace(authRegex, 'auth-gate.js?v=20260902-home-event-modal-v3');
          fs.writeFileSync(homePath, home);

          const uiPath = 'budget/calendar-ui-v2.js';
          let ui = fs.readFileSync(uiPath, 'utf8');

          const ensureStart = `  function ensureEndControls() {
    if (document.getElementById('event-end-toggle-v2')) return;
    var dateInput = document.getElementById('ev-date');`;
          const ensureReplacement = `  function bindEndSwitch() {
    var btn = document.getElementById('event-end-switch-v2');
    if (!btn || btn.__calendarUiV2Bound) return;
    btn.__calendarUiV2Bound = true;
    btn.addEventListener('click', function () {
      setEndEnabled(this.getAttribute('aria-pressed') !== 'true');
      if (this.getAttribute('aria-pressed') === 'true') {
        var startDate = document.getElementById('ev-date');
        var endDate = document.getElementById('ev-end-date');
        if (endDate && !endDate.value && startDate) endDate.value = startDate.value;
      }
    });
  }

  function ensureEndControls() {
    if (document.getElementById('event-end-toggle-v2')) {
      bindEndSwitch();
      initDatePicker(document.getElementById('ev-end-date'));
      return;
    }
    var dateInput = document.getElementById('ev-date');`;
          if (!ui.includes(ensureStart)) throw new Error('Could not find ensureEndControls start');
          ui = ui.replace(ensureStart, ensureReplacement);

          const oldListener = `    document.getElementById('event-end-switch-v2').addEventListener('click', function () {
      setEndEnabled(this.getAttribute('aria-pressed') !== 'true');
      if (this.getAttribute('aria-pressed') === 'true') {
        var startDate = document.getElementById('ev-date');
        var endDate = document.getElementById('ev-end-date');
        if (endDate && !endDate.value && startDate) endDate.value = startDate.value;
      }
    });

    initDatePicker(document.getElementById('ev-end-date'));`;
          const newListener = `    bindEndSwitch();
    initDatePicker(document.getElementById('ev-end-date'));`;
          if (!ui.includes(oldListener)) throw new Error('Could not find old end-switch listener');
          ui = ui.replace(oldListener, newListener);

          const oldBindings = `    bindEventFunctions();
    bindRangeExpansion();
    bindTimeFormatting();
    bindMonthNavigationRefresh();`;
          const newBindings = `    bindEventFunctions();
    bindRangeExpansion();
    bindTimeFormatting();
    [120, 400, 900].forEach(function (delay) {
      setTimeout(function () {
        bindEventFunctions();
        bindRangeExpansion();
        bindTimeFormatting();
      }, delay);
    });
    bindMonthNavigationRefresh();`;
          if (!ui.includes(oldBindings)) throw new Error('Could not find calendar runtime bindings');
          ui = ui.replace(oldBindings, newBindings);
          fs.writeFileSync(uiPath, ui);

          const authPath = 'budget/auth-gate.js';
          let auth = fs.readFileSync(authPath, 'utf8');
          const oldVersion = /var calendarAssetsVersion = '[^']+';/;
          if (!oldVersion.test(auth)) throw new Error('Could not find calendarAssetsVersion');
          auth = auth.replace(oldVersion, "var calendarAssetsVersion = '20260902-event-modal-v3';");
          fs.writeFileSync(authPath, auth);
          NODE

      - name: Remove temporary workflow
        run: rm .github/workflows/restore-home-event-modal-v3.yml

      - name: Validate and commit
        shell: bash
        run: |
          git config user.name "strickertmarkus"
          git config user.email "markus.strickert@sigmatechnology.com"
          git add budget/home.html budget/calendar-ui-v2.js budget/auth-gate.js .github/workflows/restore-home-event-modal-v3.yml
          git diff --cached --check
          git commit -m "Restore Home event modal end-date toggle"
          git push origin main
