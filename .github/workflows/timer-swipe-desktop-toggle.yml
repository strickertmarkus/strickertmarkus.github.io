name: Timer swipe and desktop toggle
on:
  push:
    paths:
      - '.github/workflows/timer-swipe-desktop-toggle.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace double tap with swipe and desktop SVG
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('budget/exercise-timer-focus.js')
          s = p.read_text()

          s = s.replace("  var lastTapAt = 0;\n  var lastManualToggleAt = 0;\n", "  var gesture = null;\n  var suppressTimerClickUntil = 0;\n")

          old_css = """      #session-countdown-ring {\n        touch-action:manipulation;\n        -webkit-tap-highlight-color:transparent;\n      }\n"""
          new_css = """      #session-countdown-ring {\n        touch-action:manipulation;\n        -webkit-tap-highlight-color:transparent;\n      }\n      .cardio-desktop-toggle {\n        appearance:none;\n        position:absolute;\n        top:-7px;\n        right:-7px;\n        z-index:30;\n        width:30px;\n        height:30px;\n        display:grid;\n        place-items:center;\n        padding:0;\n        border:1px solid rgba(248,113,113,.28);\n        border-radius:10px;\n        background:rgba(13,9,13,.84);\n        color:#FCA5A5;\n        box-shadow:0 5px 18px rgba(0,0,0,.24),inset 0 1px rgba(255,255,255,.035);\n        cursor:pointer;\n        -webkit-tap-highlight-color:transparent;\n      }\n      .cardio-desktop-toggle:hover {\n        border-color:rgba(248,113,113,.52);\n        background:rgba(49,17,24,.92);\n        box-shadow:0 0 18px rgba(239,68,68,.14),inset 0 1px rgba(255,255,255,.045);\n      }\n      .cardio-desktop-toggle:active { transform:scale(.94); }\n      .cardio-desktop-toggle svg { width:16px;height:16px;display:block; }\n      html.cardio-focus-active #session-countdown-ring .cardio-desktop-toggle {\n        top:7px;\n        right:7px;\n      }\n      @media (hover:none),(pointer:coarse) {\n        #session-countdown-ring { touch-action:none; }\n        .cardio-desktop-toggle { display:none!important; }\n      }\n      @media (hover:hover) and (pointer:fine) {\n        .cardio-focus-close { display:none!important; }\n      }\n"""
          if old_css not in s:
              raise SystemExit('inline timer css block not found')
          s = s.replace(old_css, new_css, 1)

          anchor = """  function setFocus(visible) {\n"""
          helpers = r'''  function isTouchLike() {
    try {
      return !!((window.matchMedia && window.matchMedia('(pointer:coarse)').matches) || Number(navigator.maxTouchPoints) > 0);
    } catch (_) {
      return Number(navigator.maxTouchPoints) > 0;
    }
  }

  function desktopIcon(expanded) {
    if (expanded) {
      return '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
        '<path d="M9 3v6H3"></path><path d="M15 3v6h6"></path><path d="M9 21v-6H3"></path><path d="M15 21v-6h6"></path>' +
        '<path d="M9 9 4 4M15 9l5-5M9 15l-5 5M15 15l5 5"></path></svg>';
    }
    return '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M9 9H3V3"></path><path d="M15 9h6V3"></path><path d="M9 15H3v6"></path><path d="M15 15h6v6"></path>' +
      '<path d="M9 9 3 3M15 9l6-6M9 15l-6 6M15 15l6 6"></path></svg>';
  }

  function ensureDesktopToggle() {
    var ring = document.getElementById('session-countdown-ring');
    if (!ring) return null;
    var button = ring.querySelector('.cardio-desktop-toggle');
    if (!button) {
      button = document.createElement('button');
      button.type = 'button';
      button.className = 'cardio-desktop-toggle';
      button.addEventListener('pointerdown',function (event) { event.stopPropagation(); });
      button.addEventListener('click',function (event) {
        event.preventDefault();
        event.stopPropagation();
        toggleFocus();
      });
      ring.appendChild(button);
    }
    var expanded = document.documentElement.classList.contains('cardio-focus-active');
    var state = expanded ? 'collapse' : 'expand';
    if (button.dataset.state !== state) {
      button.dataset.state = state;
      button.innerHTML = desktopIcon(expanded);
      button.setAttribute('aria-label',expanded ? 'Minska timer' : 'Förstora timer');
      button.title = expanded ? 'Minska timer' : 'Förstora timer';
    }
    return button;
  }

'''
          if anchor not in s:
              raise SystemExit('setFocus anchor not found')
          s = s.replace(anchor, helpers + anchor, 1)

          old_double = r'''  function installDoubleTap() {
    document.addEventListener('pointerup',function (event) {
      var target = event.target && event.target.closest ? event.target.closest('#session-countdown-ring') : null;
      if (!target) return;
      var now = Date.now();
      if (now - lastTapAt > 0 && now - lastTapAt <= 360) {
        lastTapAt = 0;
        toggleFocus();
      } else {
        lastTapAt = now;
      }
    },true);

    /* Desktop/mouse fallback. Ignore it when the pointer double-tap handler
       already performed the same toggle. */
    document.addEventListener('dblclick',function (event) {
      var target = event.target && event.target.closest ? event.target.closest('#session-countdown-ring') : null;
      if (!target || Date.now() - lastManualToggleAt < 450) return;
      toggleFocus();
    },true);
  }
'''
          new_gesture = r'''  function installTimerGestures() {
    document.addEventListener('pointerdown',function (event) {
      if (!isTouchLike() || event.isPrimary === false) return;
      var target = event.target && event.target.closest ? event.target.closest('#session-countdown-ring') : null;
      if (!target || (event.target && event.target.closest && event.target.closest('.cardio-desktop-toggle'))) return;
      gesture = {
        pointerId:event.pointerId,
        startX:event.clientX,
        startY:event.clientY,
        lastX:event.clientX,
        lastY:event.clientY
      };
    },true);

    document.addEventListener('pointermove',function (event) {
      if (!gesture || event.pointerId !== gesture.pointerId) return;
      gesture.lastX = event.clientX;
      gesture.lastY = event.clientY;
      var dx = gesture.lastX - gesture.startX;
      var dy = gesture.lastY - gesture.startY;
      if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx) * 1.15 && event.cancelable) event.preventDefault();
    },{capture:true,passive:false});

    document.addEventListener('pointerup',function (event) {
      if (!gesture || event.pointerId !== gesture.pointerId) return;
      var dx = event.clientX - gesture.startX;
      var dy = event.clientY - gesture.startY;
      var vertical = Math.abs(dy) >= 42 && Math.abs(dy) > Math.abs(dx) * 1.25;
      var expanded = document.documentElement.classList.contains('cardio-focus-active');
      var handled = vertical && ((!expanded && dy < 0) || (expanded && dy > 0));
      gesture = null;
      if (!handled) return;

      suppressTimerClickUntil = Date.now() + 650;
      if (event.cancelable) event.preventDefault();
      event.stopImmediatePropagation();
      if (expanded) collapseFocus();
      else expandFocus();
    },true);

    document.addEventListener('pointercancel',function (event) {
      if (gesture && event.pointerId === gesture.pointerId) gesture = null;
    },true);

    /* A completed swipe can still synthesize a click in Mobile Safari. Consume
       only that click; ordinary taps continue to the existing pause handler. */
    document.addEventListener('click',function (event) {
      if (Date.now() > suppressTimerClickUntil) return;
      var target = event.target && event.target.closest ? event.target.closest('#session-countdown-ring') : null;
      if (!target) return;
      event.preventDefault();
      event.stopImmediatePropagation();
      suppressTimerClickUntil = 0;
    },true);
  }
'''
          if old_double not in s:
              raise SystemExit('double tap block not found')
          s = s.replace(old_double, new_gesture, 1)

          sync_anchor = """    var overlay = ensureFocusChrome();\n    var plus = ensureInlinePlus();\n"""
          sync_repl = """    var overlay = ensureFocusChrome();\n    var plus = ensureInlinePlus();\n    var desktopToggle = ensureDesktopToggle();\n"""
          if sync_anchor not in s:
              raise SystemExit('syncCardio anchor not found')
          s = s.replace(sync_anchor, sync_repl, 1)

          not_timed = """      if (plus) plus.classList.remove('show');\n      setFocus(false);\n      return;\n"""
          not_timed_repl = """      if (plus) plus.classList.remove('show');\n      if (desktopToggle) desktopToggle.hidden = true;\n      setFocus(false);\n      return;\n"""
          if not_timed not in s:
              raise SystemExit('not timed block not found')
          s = s.replace(not_timed, not_timed_repl, 1)

          token_anchor = """    var token = cardioToken(state,exercise);\n"""
          token_repl = """    if (desktopToggle) { desktopToggle.hidden = false; ensureDesktopToggle(); }\n\n    var token = cardioToken(state,exercise);\n"""
          s = s.replace(token_anchor, token_repl, 1)

          s = s.replace("    installDoubleTap();\n", "    installTimerGestures();\n")

          p.write_text(s)

          version_old = '20260914-timer-focus-final3'
          version_new = '20260914-timer-focus-final4-swipe'
          for name in ['budget/exercise.html','budget/auth-config.js','budget/auth-gate.js','budget/exercise-pulse-flow-canvas-glow-v131.js']:
            q = Path(name)
            text = q.read_text()
            if version_old not in text:
              raise SystemExit(f'cache id not found in {name}')
            q.write_text(text.replace(version_old,version_new))
          PY

          node --check budget/exercise-timer-focus.js
          grep -q 'installTimerGestures' budget/exercise-timer-focus.js
          ! grep -q 'installDoubleTap' budget/exercise-timer-focus.js
          grep -q '20260914-timer-focus-final4-swipe' budget/exercise.html
      - name: Commit interaction update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/timer-swipe-desktop-toggle.yml
          git add budget/exercise-timer-focus.js budget/exercise.html budget/auth-config.js budget/auth-gate.js budget/exercise-pulse-flow-canvas-glow-v131.js
          git commit -m 'Use swipe gesture for cardio timer focus'
          git push
