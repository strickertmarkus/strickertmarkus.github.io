name: Travel planner verification
on:
  push:
    branches: [main]
    paths: ['budget/travel*', 'budget/tests/travel*', 'budget/family-todos-ui-v1.js', '.github/workflows/travel-verify.yml']
  workflow_dispatch:
jobs:
  travel:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check budget/travel.js
          node --check budget/travel-store.js
          node --test budget/tests/travel.test.cjs
      - run: |
          npm install --no-save playwright
          npx playwright install --with-deps webkit chromium
      - run: |
          python3 -m http.server 4173 >/tmp/travel-http.log 2>&1 &
          sleep 2
          node budget/tests/travel-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: travel-ui
          path: test-results/travel/
