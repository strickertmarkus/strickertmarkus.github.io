name: Refine finance month v7

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-finance-month-v7.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refine finance month controls
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('budget/finance-ui.js')
          s = p.read_text()

          old = "html.finance-ui-clean-v1 body .header #month-dropdown{appearance:none!important;height:40px!important;width:154px!important;min-width:154px!important;margin:0!important;padding:0 22px 0 8px!important;border:0!important;border-radius:0!important;background:transparent!important;background-image:none!important;color:#F0F6FC!important;font:760 15px/1 Inter,sans-serif!important;letter-spacing:-.15px!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:clip!important;text-align:center!important;box-shadow:none!important;transform:none!important;cursor:pointer!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;transition:color .15s,opacity .15s!important}"
          new = "html.finance-ui-clean-v1 body .header #month-dropdown{appearance:none!important;height:40px!important;width:154px!important;min-width:154px!important;margin:0!important;padding:0 22px 0 8px!important;border:0!important;border-radius:0!important;background:transparent!important;background-image:none!important;color:#93C5FD!important;font:760 15px/1 Inter,sans-serif!important;letter-spacing:-.15px!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:clip!important;text-align:center!important;box-shadow:none!important;text-shadow:0 2px 12px rgba(96,165,250,.18)!important;transform:none!important;cursor:pointer!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;transition:color .15s,opacity .15s!important}"
          if old not in s: raise SystemExit('month dropdown style not found')
          s = s.replace(old, new, 1)

          old = "html.finance-ui-clean-v1 body .header #month-dropdown:hover{color:#FFFFFF!important}html.finance-ui-clean-v1 body .header #month-dropdown:active{color:#93C5FD!important;opacity:.82!important}"
          new = "html.finance-ui-clean-v1 body .header #month-dropdown:hover{color:#BFDBFE!important}html.finance-ui-clean-v1 body .header #month-dropdown:active{color:#60A5FA!important;opacity:.82!important}"
          if old not in s: raise SystemExit('month interaction style not found')
          s = s.replace(old, new, 1)

          old = ".finance-month-arrow-clean-v1{appearance:none!important;width:32px!important;height:32px!important;flex:0 0 32px!important;margin:0!important;padding:0!important;border:0!important;border-radius:50%!important;background:transparent!important;color:#94A3B8!important;display:flex!important;align-items:center!important;justify-content:center!important;cursor:pointer!important;box-shadow:none!important;transition:color .15s,background .15s,transform .1s!important;-webkit-tap-highlight-color:transparent}.finance-month-arrow-clean-v1 svg{width:18px!important;height:18px!important;fill:none!important;stroke:currentColor!important;stroke-width:2!important;stroke-linecap:round!important;stroke-linejoin:round!important}"
          new = ".finance-month-arrow-clean-v1{appearance:none!important;width:32px!important;height:32px!important;flex:0 0 32px!important;margin:0!important;padding:0!important;border:1px solid rgba(255,255,255,.08)!important;border-radius:8px!important;background:rgba(255,255,255,.04)!important;color:#F0F6FC!important;display:flex!important;align-items:center!important;justify-content:center!important;cursor:pointer!important;font:500 14px/1 Inter,sans-serif!important;box-shadow:none!important;transition:background .2s!important;-webkit-tap-highlight-color:transparent}"
          if old not in s: raise SystemExit('arrow base style not found')
          s = s.replace(old, new, 1)

          old = ".finance-month-arrow-clean-v1:hover:not(:disabled){color:#E2E8F0!important;background:rgba(255,255,255,.055)!important}.finance-month-arrow-clean-v1:active:not(:disabled){color:#93C5FD!important;background:rgba(96,165,250,.10)!important;transform:scale(.90)}.finance-month-arrow-clean-v1:disabled{opacity:.18!important;cursor:default!important}"
          new = ".finance-month-arrow-clean-v1:hover:not(:disabled){background:rgba(255,255,255,.07)!important}.finance-month-arrow-clean-v1:active:not(:disabled){background:rgba(255,255,255,.07)!important}.finance-month-arrow-clean-v1:disabled{opacity:.22!important;cursor:default!important}"
          if old not in s: raise SystemExit('arrow interaction style not found')
          s = s.replace(old, new, 1)

          old = ".finance-month-arrow-clean-v1{width:31px!important;height:31px!important;flex-basis:31px!important;border-radius:50%!important}.finance-month-arrow-clean-v1 svg{width:17px!important;height:17px!important}"
          new = ".finance-month-arrow-clean-v1{width:32px!important;height:32px!important;flex-basis:32px!important;border-radius:8px!important;font-size:14px!important}"
          if old not in s: raise SystemExit('mobile arrow style not found')
          s = s.replace(old, new, 1)

          old = ".finance-month-arrow-clean-v1{width:29px!important;height:29px!important;flex-basis:29px!important}"
          new = ".finance-month-arrow-clean-v1{width:32px!important;height:32px!important;flex-basis:32px!important}"
          if old not in s: raise SystemExit('small mobile arrow style not found')
          s = s.replace(old, new, 1)

          old = "button.innerHTML = '<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"' + (delta < 0 ? 'm14.5 6-6 6 6 6' : 'm9.5 6 6 6-6 6') + '\"/></svg>';"
          new = "button.textContent = glyph;"
          if old not in s: raise SystemExit('arrow markup not found')
          s = s.replace(old, new, 1)

          p.write_text(s)

          pages = [
              'budget/budget.html',
              'budget/budget_maja.html',
              'budget/analytics.html',
              'budget/analytics_maja.html',
              'budget/familjebudget.html',
          ]
          for name in pages:
              q = Path(name)
              text = q.read_text()
              oldv = 'finance-ui.js?v=20260830-finance-clean-v6'
              newv = 'finance-ui.js?v=20260830-finance-clean-v7'
              if oldv not in text:
                  raise SystemExit(f'cache version not found in {name}')
              q.write_text(text.replace(oldv, newv, 1))
          PY
      - name: Verify JavaScript syntax
        run: node --check budget/finance-ui.js
      - name: Verify scoped changes
        run: |
          git diff --check
          git diff --name-only
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "budget/analytics.html budget/analytics_maja.html budget/budget.html budget/budget_maja.html budget/familjebudget.html budget/finance-ui.js "
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add budget/finance-ui.js budget/budget.html budget/budget_maja.html budget/analytics.html budget/analytics_maja.html budget/familjebudget.html
          git commit -m "Match finance month arrows to home"
          git push
