name: Timer drag canonical fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/timer-drag-canonical-fix.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply canonical drag patch
        run: python3 .github/scripts/timer_drag_canonical_fix.py
      - name: Validate scripts
        run: |
          node --check budget/exercise-timer-focus.js
          node --check budget/exercise-pulse-flow-canvas-glow-v130.js
      - name: Commit tested timer drag fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add budget/exercise-timer-focus.js budget/exercise-pulse-flow-canvas-glow-v130.js budget/exercise.html budget/auth-config.js budget/auth-gate.js budget/exercise-pulse-flow-canvas-glow-v131.js
          git diff --cached --quiet || git commit -m 'Use canonical bidirectional timer drag'
          git push
