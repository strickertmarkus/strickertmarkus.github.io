name: Zen planning and editable PR verification
on:
  push:
    branches: [codex/zen-plans-pr, main]
    paths: ['budget/training-zen-plans.*', 'budget/tests/training-zen-plans-browser.cjs', '.github/workflows/training-zen-plans-verify.yml']
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps webkit
      - run: |
          python3 -m http.server 4173 >/tmp/zen-plans-http.log 2>&1 &
          node budget/tests/training-zen-plans-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zen-plans-review
          path: test-results/zen-plans
