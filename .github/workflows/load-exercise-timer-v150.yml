name: Load exercise timer v150
on:
  push:
    paths:
      - '.github/workflows/load-exercise-timer-v150.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Load stable exact-scale timer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('budget/exercise.html')
          s=p.read_text()
          old='20260914-timer-focus-v148-rollback1'
          new='20260914-timer-focus-v150-stable-scale'
          s=s.replace(old,new)
          needle='  <script defer src="exercise-timer-focus-v148.js?v='+new+'"></script>\n'
          line='  <script defer src="exercise-timer-focus-v150.js?v='+new+'"></script>\n'
          if line not in s:
              if needle not in s:
                  raise SystemExit('v148 loader line not found')
              s=s.replace(needle,needle+line,1)
          p.write_text(s)

          for name in ['budget/auth-config.js','budget/auth-gate.js']:
              q=Path(name)
              t=q.read_text()
              t=t.replace('20260914-timer-focus-v148-rollback1',new)
              q.write_text(t)
          PY
          node --check budget/exercise-timer-focus-v150.js
      - name: Commit loader and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/load-exercise-timer-v150.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add budget/exercise.html budget/auth-config.js budget/auth-gate.js budget/exercise-timer-focus-v150.js .github/workflows/load-exercise-timer-v150.yml
          git commit -m 'Use exact compact timer in cardio focus mode'
          git push
