name: Finalize morph snapshots

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-morph-snapshots.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply final morph cleanup
        run: python3 .github/scripts/finalize_morph_snapshots.py

      - name: Verify JavaScript
        run: node --check budget/finance-ui.js

      - name: Verify final morph architecture
        shell: bash
        run: |
          grep -q ":root{view-transition-name:none}" budget/finance-ui.js
          grep -q "::view-transition-old(\*),::view-transition-new(\*)" budget/finance-ui.js
          grep -q "el.querySelector('canvas')" budget/finance-ui.js
          if grep -q "::view-transition-old(root)" budget/finance-ui.js; then
            echo "Root snapshot CSS still present" >&2
            exit 1
          fi
          if grep -q "opacity:0!important" budget/finance-ui.js; then
            echo "Hidden old-snapshot workaround still present" >&2
            exit 1
          fi
          grep -q "finance-ui.js?v=20260830-finance-final-v4" budget/budget.html
          grep -q "finance-ui.js?v=20260830-finance-final-v4" budget/budget_maja.html
          grep -q "finance-ui.js?v=20260830-finance-final-v4" budget/analytics.html
          grep -q "finance-ui.js?v=20260830-finance-final-v4" budget/analytics_maja.html
          grep -q "finance-ui.js?v=20260830-finance-final-v4" budget/familjebudget.html
          git diff --quiet -- budget/firebase-sync.js budget/indexeddb-fallback.js budget/budget-persistence-guard.js

          changed="$(git diff --name-only)"
          echo "$changed"
          while IFS= read -r f; do
            case "$f" in
              budget/finance-ui.js|budget/budget.html|budget/budget_maja.html|budget/analytics.html|budget/analytics_maja.html|budget/familjebudget.html) ;;
              '') ;;
              *) echo "Unexpected changed file: $f" >&2; exit 1 ;;
            esac
          done <<< "$changed"

      - name: Commit final morph cleanup
        shell: bash
        run: |
          git config user.name "strickertmarkus"
          git config user.email "markus.strickert@sigmatechnology.com"
          git add budget/finance-ui.js budget/budget.html budget/budget_maja.html budget/analytics.html budget/analytics_maja.html budget/familjebudget.html
          git commit -m "Remove root finance transition snapshot"
          git push
