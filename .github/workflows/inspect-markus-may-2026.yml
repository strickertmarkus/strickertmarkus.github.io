name: Import Markus May 2026 budget

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  import:
    if: github.event.head_commit.message == 'Import Markus May 2026 budget'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Firebase Admin SDK
        run: npm install --no-save --no-package-lock firebase-admin@13
      - name: Import Markus May 2026
        shell: bash
        run: |
          node <<'NODE'
          const admin = require('firebase-admin');
          const rawCredential = process.env.FIREBASE_SERVICE_ACCOUNT_JSON;
          if (!rawCredential) throw new Error('Missing FIREBASE_SERVICE_ACCOUNT_JSON');
          const credential = JSON.parse(rawCredential);
          admin.initializeApp({
            credential: admin.credential.cert(credential),
            databaseURL: 'https://frick-budget-default-rtdb.europe-west1.firebasedatabase.app'
          });

          const expectedIncome = 44687.26;
          const expectedExpenses = 44711.40;
          const expectedRemaining = -24.14;

          const values = {
            income: {
              'Lön (netto)': 38302.16,
              'Barnbidrag': 1325,
              'Swish': 796.10,
              'Nordea Hus': 4264
            },
            house: {
              'Huskontot': 17658,
              'Ica-kortet': 6201,
              'Barnbidrag': 1325,
              'Barnbidrag Ica-kort': 1325
            },
            insurances: {
              'Sjukförsäkring': 148,
              'CSN': 1360
            },
            subscriptions: {
              'Spotify': 219,
              'Youtube': 199,
              'Copilot': 94.41
            },
            savings: {
              'Lysa': 3000,
              'Barnspar': 1000
            },
            misc: {
              'Utemat': 1623.69,
              'Småköp': 726.11,
              'Parkering': 50.80,
              'Till hemmet': 7315.25,
              'Till Barnen': 469.14,
              'Swish': 497,
              'Övrigt': 1500
            }
          };

          function round2(n) { return Math.round((n + Number.EPSILON) * 100) / 100; }

          function setItem(section, name, actual) {
            let item = (section.items || []).find(i => i.name === name);
            if (!item) {
              item = { name, budget: 0, actual: 0 };
              section.items = section.items || [];
              section.items.push(item);
            }
            item.actual = actual;
          }

          function totals(may) {
            let income = 0;
            let expenses = 0;
            for (const section of may.sections) {
              const sum = (section.items || []).reduce((acc, item) => acc + Number(item.actual || 0), 0);
              if (section.isIncome || section.key === 'income') income += sum;
              else expenses += sum;
            }
            return {
              income: round2(income),
              expenses: round2(expenses),
              remaining: round2(income - expenses)
            };
          }

          (async () => {
            const ref = admin.database().ref('budgetTracker');
            const snap = await ref.get();
            if (!snap.exists()) throw new Error('budgetTracker missing');
            const raw = snap.val();
            const wasString = typeof raw === 'string';
            const data = wasString ? JSON.parse(raw) : raw;
            const may = data?.monthlyData?.['2026-05'];
            if (!may?.sections) throw new Error('2026-05 missing in budgetTracker');

            // The pasted CSV is authoritative for Markus May: clear old actuals first.
            for (const section of may.sections) {
              for (const item of (section.items || [])) item.actual = 0;
            }

            for (const [sectionKey, items] of Object.entries(values)) {
              const section = may.sections.find(s => s.key === sectionKey);
              if (!section) throw new Error(`Missing section ${sectionKey}`);
              for (const [name, actual] of Object.entries(items)) setItem(section, name, actual);
            }

            const calculated = totals(may);
            if (Math.abs(calculated.income - expectedIncome) > 0.001 ||
                Math.abs(calculated.expenses - expectedExpenses) > 0.001 ||
                Math.abs(calculated.remaining - expectedRemaining) > 0.001) {
              throw new Error(`Unexpected totals before write: ${JSON.stringify(calculated)}`);
            }

            await ref.set(wasString ? JSON.stringify(data) : data);

            const verifySnap = await ref.get();
            const verifyRaw = verifySnap.val();
            const verifyData = typeof verifyRaw === 'string' ? JSON.parse(verifyRaw) : verifyRaw;
            const verified = totals(verifyData.monthlyData['2026-05']);
            if (Math.abs(verified.income - expectedIncome) > 0.001 ||
                Math.abs(verified.expenses - expectedExpenses) > 0.001 ||
                Math.abs(verified.remaining - expectedRemaining) > 0.001) {
              throw new Error(`Firebase verification failed: ${JSON.stringify(verified)}`);
            }

            console.log('WRITE_VERIFIED', JSON.stringify(verified));
            console.log('CATEGORY_TOTALS', JSON.stringify(values));
            await admin.app().delete();
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
