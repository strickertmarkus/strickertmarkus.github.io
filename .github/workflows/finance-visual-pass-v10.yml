name: Finance visual pass v10

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finance-visual-pass-v10.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply finance visual pass
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('budget/finance-ui.js')
          s = p.read_text()

          old_bg = 'background:rgba(24,31,46,.94)!important'
          if s.count(old_bg) != 2:
              raise SystemExit(f'expected 2 old header backgrounds, found {s.count(old_bg)}')
          s = s.replace(old_bg, 'background:rgba(13,17,23,.96)!important')

          old_shadow = 'box-shadow:0 8px 28px rgba(0,0,0,.32)!important'
          if s.count(old_shadow) != 2:
              raise SystemExit(f'expected 2 old header shadows, found {s.count(old_shadow)}')
          s = s.replace(old_shadow, 'box-shadow:0 7px 26px rgba(0,0,0,.44)!important')

          old_nav = "html.finance-ui-clean-v1 body .header>#month-nav{position:absolute!important;left:50%!important;right:auto!important;top:60px!important;bottom:auto!important;"
          new_nav = "html.finance-ui-clean-v1 body .header>#month-nav{position:absolute!important;left:50%!important;right:auto!important;top:54px!important;bottom:auto!important;"
          if old_nav not in s:
              raise SystemExit('desktop month nav position not found')
          s = s.replace(old_nav, new_nav, 1)

          old_mobile_nav = "html.finance-ui-clean-v1 body .header>#month-nav{top:60px!important;bottom:auto!important;"
          new_mobile_nav = "html.finance-ui-clean-v1 body .header>#month-nav{top:54px!important;bottom:auto!important;"
          if old_mobile_nav not in s:
              raise SystemExit('mobile month nav position not found')
          s = s.replace(old_mobile_nav, new_mobile_nav, 1)

          old_month = "color:#8CC0FF!important;font:760 15px/1 Inter,sans-serif!important;letter-spacing:-.15px!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:clip!important;text-align:center!important;box-shadow:none!important;text-shadow:0 2px 12px rgba(96,165,250,.18)!important;"
          new_month = "color:#FB923C!important;font:680 15px/1 Inter,sans-serif!important;letter-spacing:-.10px!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:clip!important;text-align:center!important;box-shadow:none!important;text-shadow:0 2px 10px rgba(251,146,60,.14)!important;"
          if old_month not in s:
              raise SystemExit('month base style not found')
          s = s.replace(old_month, new_month, 1)

          old_interact = "html.finance-ui-clean-v1 body .header #month-dropdown:hover{color:#B8D8FF!important}html.finance-ui-clean-v1 body .header #month-dropdown:active{color:#60A5FA!important;opacity:.86!important}"
          new_interact = "html.finance-ui-clean-v1 body .header #month-dropdown:hover{color:#FDBA74!important}html.finance-ui-clean-v1 body .header #month-dropdown:active{color:#F97316!important;opacity:.88!important}"
          if old_interact not in s:
              raise SystemExit('month interaction style not found')
          s = s.replace(old_interact, new_interact, 1)

          old_anim = ".container.finance-arrival-clean-v1>*{transform-origin:top center;animation:financeArrivalCleanV1 .30s cubic-bezier(.16,1,.3,1) both;will-change:transform}.container.finance-arrival-clean-v1>*:nth-child(2){animation-delay:.025s}.container.finance-arrival-clean-v1>*:nth-child(3){animation-delay:.05s}.container.finance-arrival-clean-v1>*:nth-child(4){animation-delay:.075s}.container.finance-arrival-clean-v1>*:nth-child(n+5){animation-delay:.10s}"
          new_anim = ".container.finance-arrival-clean-v1>*{transform-origin:top center;animation:financeArrivalCleanV1 .42s cubic-bezier(.16,1,.3,1) both;will-change:transform}.container.finance-arrival-clean-v1>*:nth-child(2){animation-delay:.035s}.container.finance-arrival-clean-v1>*:nth-child(3){animation-delay:.07s}.container.finance-arrival-clean-v1>*:nth-child(4){animation-delay:.105s}.container.finance-arrival-clean-v1>*:nth-child(n+5){animation-delay:.14s}"
          if old_anim not in s:
              raise SystemExit('arrival animation rule not found')
          s = s.replace(old_anim, new_anim, 1)

          old_keyframes = "@keyframes financeArrivalCleanV1{0%{transform:translateY(-12px) scale(.995)}72%{transform:translateY(1px) scale(1.001)}100%{transform:translateY(0) scale(1)}}"
          new_keyframes = "@keyframes financeArrivalCleanV1{0%{transform:translateY(-18px) scaleX(.985) scaleY(.965)}48%{transform:translateY(3px) scaleX(1.006) scaleY(1.012)}72%{transform:translateY(-1.5px) scaleX(.998) scaleY(.996)}88%{transform:translateY(.5px) scaleX(1.001) scaleY(1.002)}100%{transform:translateY(0) scale(1)}}"
          if old_keyframes not in s:
              raise SystemExit('arrival keyframes not found')
          s = s.replace(old_keyframes, new_keyframes, 1)

          old_timeout = "setTimeout(function () { container.classList.remove('finance-arrival-clean-v1'); }, 650);"
          new_timeout = "setTimeout(function () { container.classList.remove('finance-arrival-clean-v1'); }, 800);"
          if old_timeout not in s:
              raise SystemExit('arrival cleanup timeout not found')
          s = s.replace(old_timeout, new_timeout, 1)

          p.write_text(s)

          # Make the doughnut/budget wheel a touch more vivid and soften arc ends.
          for name in ['budget/budget.html', 'budget/budget_maja.html']:
              f = Path(name)
              text = f.read_text()
              old = "                backgroundColor: expenseSections.map(s => s.color + '88'),\n                borderColor: isDarkMode() ? \"#1A1F2E\" : \"#FFFFFF\",\n                borderWidth: isDarkMode() ? 3 : 4,\n                hoverBorderWidth: 0,\n                hoverBorderColor: 'transparent',\n                hoverOffset: 0,\n"
              new = "                backgroundColor: expenseSections.map(s => s.color + 'A0'),\n                borderColor: isDarkMode() ? \"#1A1F2E\" : \"#FFFFFF\",\n                borderWidth: isDarkMode() ? 3 : 4,\n                borderRadius: 4,\n                spacing: 1,\n                hoverBorderWidth: 0,\n                hoverBorderColor: 'transparent',\n                hoverOffset: 0,\n"
              if text.count(old) != 1:
                  raise SystemExit(f'expected one budget wheel dataset in {name}, found {text.count(old)}')
              f.write_text(text.replace(old, new, 1))

          pages = [
              'budget/budget.html',
              'budget/budget_maja.html',
              'budget/analytics.html',
              'budget/analytics_maja.html',
              'budget/familjebudget.html',
          ]
          for name in pages:
              f = Path(name)
              text = f.read_text()
              oldv = 'finance-ui.js?v=20260830-finance-clean-v9'
              newv = 'finance-ui.js?v=20260830-finance-clean-v10'
              if text.count(oldv) != 1:
                  raise SystemExit(f'finance v9 loader count in {name}: {text.count(oldv)}')
              f.write_text(text.replace(oldv, newv, 1))
          PY

      - name: Verify JavaScript syntax
        run: node --check budget/finance-ui.js

      - name: Verify visual changes only
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          echo "$changed"
          while IFS= read -r f; do
            case "$f" in
              budget/finance-ui.js|budget/budget.html|budget/budget_maja.html|budget/analytics.html|budget/analytics_maja.html|budget/familjebudget.html) ;;
              '') ;;
              *) echo "Unexpected changed file: $f" >&2; exit 1 ;;
            esac
          done <<< "$changed"
          grep -q "color:#FB923C!important;font:680 15px" budget/finance-ui.js
          grep -q "financeArrivalCleanV1 .42s" budget/finance-ui.js
          grep -q "backgroundColor: expenseSections.map(s => s.color + 'A0')" budget/budget.html
          grep -q "borderRadius: 4" budget/budget.html
          grep -q "backgroundColor: expenseSections.map(s => s.color + 'A0')" budget/budget_maja.html

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "strickertmarkus"
          git config user.email "markus.strickert@sigmatechnology.com"
          git add budget/finance-ui.js budget/budget.html budget/budget_maja.html budget/analytics.html budget/analytics_maja.html budget/familjebudget.html
          git commit -m "Refine finance motion header and budget wheel"
          git push
