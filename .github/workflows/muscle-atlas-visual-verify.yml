name: Still atlas mobile visual verification
on:
  push:
    branches: [main]
    paths:
      - 'budget/pulse-exercise-guide.html'
      - 'budget/pulse-muscle-atlas-stills.js'
      - 'budget/assets/atlas-stills-v1/**'
      - 'scripts/verify-atlas-stills.cjs'
      - '.github/workflows/muscle-atlas-visual-verify.yml'
  workflow_dispatch:
jobs:
  verify-atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps webkit
      - run: python3 -m http.server 4173 >/tmp/atlas-server.log 2>&1 &
      - run: node scripts/verify-atlas-stills.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-stills-mobile-screenshots
          path: test-results/atlas-stills-ui/
