name: Pulse Flow layout verification
on:
  push:
    branches: [main, codex/silver-all-exercises]
    paths:
      - 'budget/pulse-exercise-guide.html'
      - 'budget/pulse-flow-layout.css'
      - 'budget/pulse-explore-entry.css'
      - 'budget/pulse-living-anatomy.css'
      - 'budget/pulse-living-anatomy.js'
      - 'budget/assets/atlas-art-v1/**'
      - 'scripts/verify-flow-layout.cjs'
      - 'budget/pulse-muscle-map.*'
      - 'budget/assets/muscle-map-v1/**'
      - '.github/workflows/muscle-atlas-visual-verify.yml'
  workflow_dispatch:
jobs:
  verify-atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps webkit
      - run: python3 -m http.server 4173 >/tmp/atlas-server.log 2>&1 &
      - run: node scripts/verify-flow-layout.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flow-layout-screenshots
          path: test-results/flow-layout/

