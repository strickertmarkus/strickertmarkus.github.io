name: Training checkpoint 5 Observatory identity

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Implement checkpoint 5
        run: python3 .github/cp5_observatory_identity.py
      - name: Syntax and regression tests
        run: |
          node --check budget/pulse-environment/environment.js
          node --check budget/exercise-pulse-flow-motion-v67.js
          node --check budget/exercise-pulse-flow-ecg-glow-v104.js
          node --check budget/exercise-pulse-flow-canvas-glow-v130.js
          node --check budget/exercise-pulse-flow-canvas-glow-v131.js
          node --test budget/tests/training-observatory-identity.test.cjs budget/tests/training-observatory-mobile.test.cjs budget/tests/training-shared-session.test.cjs
          git diff --check
      - name: Verify single identity and action owners
        run: |
          test "$(grep -o 'id="reactor-start"' budget/exercise.html | wc -l)" -eq 1
          ! grep -q 'pf-header-ecg' budget/exercise-pulse-flow-motion-v67.js
          ! grep -q 'pf-header-ecg' budget/exercise-pulse-flow-ecg-glow-v104.js
          ! grep -q 'pf-header-ecg' budget/exercise-pulse-flow-canvas-glow-v130.js
          ! grep -q 'pf-header-ecg' budget/exercise-pulse-flow-canvas-glow-v131.js
          grep -q 'observatory-identity-motion' budget/pulse-environment/environment.js
      - name: Commit checkpoint 5 and remove temporary workflow
        run: |
          git config user.name "strickertmarkus"
          git config user.email "markus.strickert@sigmatechnology.com"
          git rm .github/workflows/training-cp5-observatory-identity.yml .github/cp5_observatory_identity.py
          git add -A
          git commit -m "Implement Observatory checkpoint 5 identity and next action"
          git push origin HEAD:main
