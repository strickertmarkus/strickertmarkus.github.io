name: Refine finance header v6

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-finance-header-v6.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refine finance header
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('budget/finance-ui.js')
          s = p.read_text()

          replacements = [
            (
              "'html.finance-ui-clean-v1 body .header>h1{position:absolute!important;left:16px!important;top:14px!important;transform:none!important;width:max-content!important;max-width:calc(100% - 86px)!important;margin:0!important;font-size:21px!important;font-weight:800!important;letter-spacing:-.45px!important;line-height:1.1!important;white-space:nowrap!important;text-align:left!important}' +",
              "'html.finance-ui-clean-v1 body .header>h1{position:absolute!important;left:50%!important;top:14px!important;transform:translateX(-50%)!important;width:max-content!important;max-width:calc(100% - 112px)!important;margin:0!important;font-size:21px!important;font-weight:800!important;letter-spacing:-.45px!important;line-height:1.1!important;white-space:nowrap!important;text-align:center!important}' +"
            ),
            (
              "'html.finance-ui-clean-v1 body .header>p{position:absolute!important;left:16px!important;top:40px!important;transform:none!important;margin:0!important;font-size:11px!important;line-height:1.2!important;white-space:nowrap!important;text-align:left!important}' +",
              "'html.finance-ui-clean-v1 body .header>p{position:absolute!important;left:50%!important;top:40px!important;transform:translateX(-50%)!important;margin:0!important;font-size:11px!important;line-height:1.2!important;white-space:nowrap!important;text-align:center!important}' +"
            ),
            (
              "'html.finance-ui-clean-v1 body .header>#month-nav>.custom-dropdown-wrapper{position:relative!important;display:block!important;flex:0 0 148px!important;width:148px!important;height:40px!important}' +",
              "'html.finance-ui-clean-v1 body .header>#month-nav>.custom-dropdown-wrapper{position:relative!important;display:block!important;flex:0 0 154px!important;width:154px!important;height:40px!important}' +"
            ),
            (
              "'html.finance-ui-clean-v1 body .header>#month-nav>.custom-dropdown-wrapper::after{content:\"\";position:absolute;right:13px;top:16px;width:5px;height:5px;border-right:1.5px solid #64748B;border-bottom:1.5px solid #64748B;transform:rotate(45deg);pointer-events:none;z-index:2}' +",
              "'html.finance-ui-clean-v1 body .header>#month-nav>.custom-dropdown-wrapper::after{content:\"\";position:absolute;right:10px;top:16px;width:5px;height:5px;border-right:1.5px solid #64748B;border-bottom:1.5px solid #64748B;transform:rotate(45deg);pointer-events:none;z-index:2}' +"
            ),
            (
              "'html.finance-ui-clean-v1 body .header #month-dropdown{appearance:none!important;height:40px!important;width:148px!important;min-width:148px!important;margin:0!important;padding:0 26px 0 14px!important;border:1px solid rgba(255,255,255,.18)!important;border-radius:12px!important;background:rgba(255,255,255,.07)!important;background-image:none!important;color:#F0F6FC!important;font:750 13px/1 Inter,sans-serif!important;letter-spacing:-.1px!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:clip!important;text-align:center!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 4px 14px rgba(0,0,0,.15)!important;transform:none!important;cursor:pointer!important;backdrop-filter:blur(12px)!important;-webkit-backdrop-filter:blur(12px)!important}' +",
              "'html.finance-ui-clean-v1 body .header #month-dropdown{appearance:none!important;height:40px!important;width:154px!important;min-width:154px!important;margin:0!important;padding:0 22px 0 8px!important;border:0!important;border-radius:0!important;background:transparent!important;background-image:none!important;color:#F0F6FC!important;font:760 15px/1 Inter,sans-serif!important;letter-spacing:-.15px!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:clip!important;text-align:center!important;box-shadow:none!important;transform:none!important;cursor:pointer!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;transition:color .15s,opacity .15s!important}' +"
            ),
            (
              "'html.finance-ui-clean-v1 body .header #month-dropdown:active{background:rgba(255,255,255,.055)!important}' +",
              "'html.finance-ui-clean-v1 body .header #month-dropdown:hover{color:#FFFFFF!important}html.finance-ui-clean-v1 body .header #month-dropdown:active{color:#93C5FD!important;opacity:.82!important}' +"
            ),
            (
              "'.finance-month-arrow-clean-v1{appearance:none!important;width:36px!important;height:36px!important;flex:0 0 36px!important;margin:0!important;padding:0!important;border:1px solid rgba(255,255,255,.14)!important;border-radius:10px!important;background:rgba(255,255,255,.055)!important;color:#A8B3C4!important;display:flex!important;align-items:center!important;justify-content:center!important;cursor:pointer!important;font:500 23px/1 Inter,sans-serif!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 3px 10px rgba(0,0,0,.12)!important;-webkit-tap-highlight-color:transparent}' +",
              "'.finance-month-arrow-clean-v1{appearance:none!important;width:32px!important;height:32px!important;flex:0 0 32px!important;margin:0!important;padding:0!important;border:0!important;border-radius:50%!important;background:transparent!important;color:#94A3B8!important;display:flex!important;align-items:center!important;justify-content:center!important;cursor:pointer!important;box-shadow:none!important;transition:color .15s,background .15s,transform .1s!important;-webkit-tap-highlight-color:transparent}.finance-month-arrow-clean-v1 svg{width:18px!important;height:18px!important;fill:none!important;stroke:currentColor!important;stroke-width:2!important;stroke-linecap:round!important;stroke-linejoin:round!important}' +"
            ),
            (
              "'.finance-month-arrow-clean-v1:active:not(:disabled){background:rgba(96,165,250,.12)!important;border-color:rgba(96,165,250,.28)!important;transform:scale(.94)}.finance-month-arrow-clean-v1:disabled{opacity:.22!important;cursor:default!important}' +",
              "'.finance-month-arrow-clean-v1:hover:not(:disabled){color:#E2E8F0!important;background:rgba(255,255,255,.055)!important}.finance-month-arrow-clean-v1:active:not(:disabled){color:#93C5FD!important;background:rgba(96,165,250,.10)!important;transform:scale(.90)}.finance-month-arrow-clean-v1:disabled{opacity:.18!important;cursor:default!important}' +"
            ),
            (
              "html.finance-ui-clean-v1 body .header>h1{left:12px!important;top:13px!important;transform:none!important;font-size:20px!important;max-width:calc(100% - 86px)!important;text-align:left!important}html.finance-ui-clean-v1 body .header>p{left:12px!important;top:39px!important;transform:none!important;font-size:11px!important;text-align:left!important}",
              "html.finance-ui-clean-v1 body .header>h1{left:50%!important;top:13px!important;transform:translateX(-50%)!important;font-size:20px!important;max-width:calc(100% - 112px)!important;text-align:center!important}html.finance-ui-clean-v1 body .header>p{left:50%!important;top:39px!important;transform:translateX(-50%)!important;font-size:11px!important;text-align:center!important}"
            ),
            (
              "html.finance-ui-clean-v1 body .header>#month-nav>.custom-dropdown-wrapper{height:40px!important;width:142px!important;flex-basis:142px!important}",
              "html.finance-ui-clean-v1 body .header>#month-nav>.custom-dropdown-wrapper{height:40px!important;width:150px!important;flex-basis:150px!important}"
            ),
            (
              "html.finance-ui-clean-v1 body .header>#month-nav>.custom-dropdown-wrapper::after{right:12px!important;top:16px!important;width:5px!important;height:5px!important}",
              "html.finance-ui-clean-v1 body .header>#month-nav>.custom-dropdown-wrapper::after{right:9px!important;top:16px!important;width:5px!important;height:5px!important}"
            ),
            (
              "html.finance-ui-clean-v1 body .header #month-dropdown{height:40px!important;width:142px!important;min-width:142px!important;padding:0 25px 0 13px!important;font-size:13px!important;border-radius:12px!important}.finance-month-arrow-clean-v1{width:35px!important;height:35px!important;flex-basis:35px!important;border-radius:10px!important;font-size:22px!important}",
              "html.finance-ui-clean-v1 body .header #month-dropdown{height:40px!important;width:150px!important;min-width:150px!important;padding:0 21px 0 7px!important;font-size:14px!important;border-radius:0!important}.finance-month-arrow-clean-v1{width:31px!important;height:31px!important;flex-basis:31px!important;border-radius:50%!important}.finance-month-arrow-clean-v1 svg{width:17px!important;height:17px!important}"
            ),
            (
              "html.finance-ui-clean-v1 body .header>#month-nav>.custom-dropdown-wrapper{width:132px!important;flex-basis:132px!important}html.finance-ui-clean-v1 body .header #month-dropdown{width:132px!important;min-width:132px!important;font-size:12px!important}.finance-month-arrow-clean-v1{width:33px!important;flex-basis:33px!important}",
              "html.finance-ui-clean-v1 body .header>#month-nav>.custom-dropdown-wrapper{width:140px!important;flex-basis:140px!important}html.finance-ui-clean-v1 body .header #month-dropdown{width:140px!important;min-width:140px!important;font-size:13px!important}.finance-month-arrow-clean-v1{width:29px!important;height:29px!important;flex-basis:29px!important}"
            ),
            (
              "    button.textContent = glyph;",
              "    button.innerHTML = '<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"' + (delta < 0 ? 'm14.5 6-6 6 6 6' : 'm9.5 6 6 6-6 6') + '\"/></svg>';"
            )
          ]

          for old, new in replacements:
              if old not in s:
                  raise SystemExit('Expected finance-ui fragment not found:\n' + old[:160])
              s = s.replace(old, new, 1)

          p.write_text(s)

          pages = [
              'budget/budget.html', 'budget/budget_maja.html',
              'budget/analytics.html', 'budget/analytics_maja.html',
              'budget/familjebudget.html'
          ]
          for page in pages:
              q = Path(page)
              text = q.read_text()
              old = 'finance-ui.js?v=20260830-finance-clean-v5'
              new = 'finance-ui.js?v=20260830-finance-clean-v6'
              if old not in text:
                  raise SystemExit(f'Missing cache marker in {page}')
              q.write_text(text.replace(old, new, 1))
          PY

      - name: Verify JavaScript syntax
        run: node --check budget/finance-ui.js

      - name: Verify scoped changes
        run: |
          changed="$(git diff --name-only)"
          echo "$changed"
          test "$(echo "$changed" | grep -vE '^(budget/finance-ui.js|budget/(budget|budget_maja|analytics|analytics_maja|familjebudget)\.html)$' | wc -l)" -eq 0
          grep -q 'finance-clean-v6' budget/budget.html
          grep -q 'finance-clean-v6' budget/analytics.html
          grep -q 'finance-clean-v6' budget/familjebudget.html
          grep -q "button.innerHTML = '<svg" budget/finance-ui.js

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add budget/finance-ui.js budget/budget.html budget/budget_maja.html budget/analytics.html budget/analytics_maja.html budget/familjebudget.html
          git commit -m "Refine centered finance month header"
          git push
