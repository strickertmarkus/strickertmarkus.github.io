name: Reapply Markus May 2026 budget

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  reapply:
    if: github.event.head_commit.message == 'Reapply Markus May 2026 budget'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Firebase Admin SDK
        run: npm install --no-save --no-package-lock firebase-admin@13
      - name: Reapply and verify Markus May 2026
        shell: bash
        run: |
          node <<'NODE'
          const admin = require('firebase-admin');
          const rawCredential = process.env.FIREBASE_SERVICE_ACCOUNT_JSON;
          if (!rawCredential) throw new Error('Missing FIREBASE_SERVICE_ACCOUNT_JSON');
          const credential = JSON.parse(rawCredential);
          admin.initializeApp({
            credential: admin.credential.cert(credential),
            databaseURL: 'https://frick-budget-default-rtdb.europe-west1.firebasedatabase.app'
          });

          const values = {
            income: {
              'Lön (netto)': 38302.16,
              'Barnbidrag': 1325,
              'Swish': 796.10,
              'Nordea Privat': 0,
              'Nordea Hus': 4264
            },
            house: {
              'Huskontot': 17658,
              'Ica-kortet': 7526,
              'Barnbidrag': 1325
            },
            insurances: {
              'Sjukförsäkring': 148,
              'CSN': 1360
            },
            subscriptions: {
              'Spotify': 219,
              'Youtube': 199,
              'Nordea': 0,
              'Copilot': 94.41,
              'Pluralsight': 0
            },
            savings: {
              'Lysa': 3000,
              'Avanza': 0,
              'Nordea sparkonto': 0,
              'Barnspar': 1000,
              'Semesterfond': 0
            },
            misc: {
              'Utemat': 1623.69,
              'Småköp': 726.11,
              'Gåvor': 0,
              'Parkering': 50.80,
              'Psykolog': 0,
              'Barnspar': 0,
              'Till hemmet': 7315.25,
              'Till Barnen': 469.14,
              'Egenvård': 0,
              'Utlägg Jobb': 0,
              'Swish': 497,
              'Övrigt': 1500
            }
          };

          const expected = { income: 44687.26, expenses: 44711.40, remaining: -24.14 };
          const round2 = n => Math.round((n + Number.EPSILON) * 100) / 100;

          function setItem(section, name, actual) {
            let item = (section.items || []).find(i => i.name === name);
            if (!item) {
              item = { name, budget: 0, actual: 0 };
              section.items = section.items || [];
              section.items.push(item);
            }
            item.actual = actual;
          }

          function applyValues(may) {
            for (const section of may.sections || []) {
              for (const item of (section.items || [])) item.actual = 0;
            }
            for (const [sectionKey, entries] of Object.entries(values)) {
              const section = may.sections.find(s => s.key === sectionKey);
              if (!section) throw new Error(`Missing section ${sectionKey}`);
              for (const [name, actual] of Object.entries(entries)) setItem(section, name, actual);
            }
          }

          function calc(may) {
            let income = 0, expenses = 0;
            for (const section of may.sections || []) {
              const sum = (section.items || []).reduce((a, i) => a + Number(i.actual || 0), 0);
              if (section.isIncome || section.key === 'income') income += sum;
              else expenses += sum;
            }
            return { income: round2(income), expenses: round2(expenses), remaining: round2(income - expenses) };
          }

          function assertTotals(label, actual) {
            for (const key of Object.keys(expected)) {
              if (Math.abs(actual[key] - expected[key]) > 0.001) {
                throw new Error(`${label}: ${JSON.stringify(actual)}`);
              }
            }
          }

          async function readBudget(ref) {
            const snap = await ref.get();
            if (!snap.exists()) throw new Error('budgetTracker missing');
            const raw = snap.val();
            return { raw, wasString: typeof raw === 'string', data: typeof raw === 'string' ? JSON.parse(raw) : raw };
          }

          async function writeCorrect(ref) {
            const current = await readBudget(ref);
            const may = current.data?.monthlyData?.['2026-05'];
            if (!may?.sections) throw new Error('2026-05 missing in budgetTracker');
            applyValues(may);
            assertTotals('before-write', calc(may));
            await ref.set(current.wasString ? JSON.stringify(current.data) : current.data);
          }

          (async () => {
            const ref = admin.database().ref('budgetTracker');
            await writeCorrect(ref);

            let immediate = await readBudget(ref);
            assertTotals('immediate-verify', calc(immediate.data.monthlyData['2026-05']));

            await new Promise(r => setTimeout(r, 35000));
            let delayed = await readBudget(ref);
            let delayedTotals = calc(delayed.data.monthlyData['2026-05']);

            // If an already-open stale client raced the first write, repair once more.
            if (Object.keys(expected).some(k => Math.abs(delayedTotals[k] - expected[k]) > 0.001)) {
              console.log('STALE_CLIENT_OVERWRITE_DETECTED', JSON.stringify(delayedTotals));
              await writeCorrect(ref);
              await new Promise(r => setTimeout(r, 15000));
              delayed = await readBudget(ref);
              delayedTotals = calc(delayed.data.monthlyData['2026-05']);
            }

            assertTotals('final-verify', delayedTotals);
            console.log('WRITE_VERIFIED_FINAL', JSON.stringify(delayedTotals));
            console.log('MAPPING', JSON.stringify(values));
            await admin.app().delete();
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
