name: Timer drag release fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/timer-drag-release-fix.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply release-slot patch
        run: python3 .github/scripts/timer_drag_release_fix.py
      - name: Validate timer script
        run: node --check budget/exercise-timer-focus.js
      - name: Validate expected cleanup
        run: |
          grep -q "parentHeight:lastCompactRect.parentHeight" budget/exercise-timer-focus.js
          grep -q "setPointerCapture" budget/exercise-timer-focus.js
          grep -q "lostpointercapture" budget/exercise-timer-focus.js
          grep -q "final16-release-slot" budget/exercise.html
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add budget/exercise-timer-focus.js budget/exercise.html budget/auth-config.js budget/auth-gate.js budget/exercise-pulse-flow-canvas-glow-v131.js
          git diff --cached --quiet || git commit -m 'Stabilize timer collapse release'
          git push
