name: Timer drag clean anchor
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/timer-drag-clean-anchor.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply clean timer anchor patch
        run: python3 .github/scripts/timer_drag_clean_anchor.py
      - name: Validate timer script
        run: node --check budget/exercise-timer-focus.js
      - name: Commit clean timer anchor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add budget/exercise-timer-focus.js budget/exercise.html budget/auth-config.js budget/auth-gate.js budget/exercise-pulse-flow-canvas-glow-v131.js
          git diff --cached --quiet || git commit -m 'Use stable compact anchor for timer drag'
          git push
