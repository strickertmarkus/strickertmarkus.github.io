name: Fix exercise v149 loading
on:
  push:
    paths:
      - '.github/workflows/fix-exercise-v149-loading.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix v149 observer loop and bust caches
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('budget/exercise-timer-focus-v149.js')
          s = p.read_text()
          old = "    overlay.classList.add('cardio-focus-live-v149');"
          new = "    if (!overlay.classList.contains('cardio-focus-live-v149')) overlay.classList.add('cardio-focus-live-v149');"
          if old not in s:
              raise SystemExit('v149 class-add target not found')
          s = s.replace(old, new, 1)

          old = "  function sync() {\n    if (!ensureStructure()) return;"
          new = "  function sync() {\n    /* The observer watches overlay.class. Do not write that same attribute\n       from its callback: Safari can otherwise enter a self-triggering\n       MutationObserver loop and starve page initialization. */\n    if (!overlay || !overlay.isConnected) {\n      if (!ensureStructure()) return;\n    }"
          if old not in s:
              raise SystemExit('v149 sync target not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          oldv = '20260914-timer-focus-v149-live'
          newv = '20260914-timer-focus-v149b-stable'
          for name in ['budget/exercise.html','budget/auth-config.js','budget/auth-gate.js','budget/exercise-pulse-flow-canvas-glow-v131.js']:
              q = Path(name)
              t = q.read_text()
              if oldv in t:
                  q.write_text(t.replace(oldv,newv))
          PY
          node --check budget/exercise-timer-focus-v149.js
      - name: Commit fix and remove one-shot workflow
        run: |
          rm .github/workflows/fix-exercise-v149-loading.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add budget/exercise-timer-focus-v149.js budget/exercise.html budget/auth-config.js budget/auth-gate.js budget/exercise-pulse-flow-canvas-glow-v131.js .github/workflows/fix-exercise-v149-loading.yml
          git commit -m 'Fix exercise loading loop in live timer'
          git push