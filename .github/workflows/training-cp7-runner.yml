name: Training CP7 runner

on:
  push:
    paths:
      - '.github/workflows/training-cp7-runner.yml'

permissions:
  contents: write

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Implement CP7 semantic state hierarchy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/cp7_migrate.py')
          source = path.read_text()
          old = "obs = replace_once(obs, metric_anchor, metric_state, 'metric and goal semantic styling')"
          new = """if metric_anchor not in obs:\n    raise SystemExit('metric and goal semantic styling: desktop anchor missing')\nobs = obs.replace(metric_anchor, metric_state, 1)"""
          if source.count(old) != 1:
              raise SystemExit('CP7 metric migration patch did not match exactly once')
          path.write_text(source.replace(old, new, 1))
          PY
          python3 .github/cp7_migrate.py
      - name: Syntax and training regression tests
        run: |
          node --check budget/pulse-environment/environment.js
          node --check budget/training-week-orbit.js
          node --test budget/tests/training-*.test.cjs
          git diff --check
      - name: Verify CP7 structure
        run: |
          test "$(grep -c "const observatoryStates = new Set" budget/pulse-environment/environment.js)" -eq 1
          ! grep -Eq 'week-day\.(is-selected|done|today|pending)::before' budget/training-week-orbit.css
          grep -q -- '--obs-achieved-glow:0 0 18px' budget/pulse-observatory/observatory.css
          grep -q '20260915-main-cp7-state-1' budget/exercise.html
      - name: Commit CP7 and remove temporary migration files
        run: |
          rm .github/workflows/training-cp7-state-hierarchy.yml .github/workflows/training-cp7-runner.yml .github/cp7_migrate.py
          git config user.name "strickertmarkus"
          git config user.email "markus.strickert@sigmatechnology.com"
          git add budget .github/workflows/training-cp7-state-hierarchy.yml .github/workflows/training-cp7-runner.yml .github/cp7_migrate.py
          git commit -m "Unify Observatory semantic state hierarchy"
          git push origin HEAD:main
