name: Training CP7 runner

on:
  push:
    paths:
      - '.github/workflows/training-cp7-runner.yml'

permissions:
  contents: write

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run stored CP7 migration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          source = Path('.github/workflows/training-cp7-state-hierarchy.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY", start)
          code = textwrap.dedent(source[start:end])
          exec(compile(code, 'cp7-migration.py', 'exec'))
          PY
      - name: Syntax and training regression tests
        run: |
          node --check budget/pulse-environment/environment.js
          node --check budget/training-week-orbit.js
          node --test budget/tests/training-*.test.cjs
          git diff --check
      - name: Verify CP7 structure
        run: |
          test "$(grep -c "const observatoryStates = new Set" budget/pulse-environment/environment.js)" -eq 1
          ! grep -Eq 'week-day\.(is-selected|done|today|pending)::before' budget/training-week-orbit.css
          grep -q -- '--obs-achieved-glow:0 0 18px' budget/pulse-observatory/observatory.css
          grep -q '20260915-main-cp7-state-1' budget/exercise.html
      - name: Commit CP7 and remove temporary workflows
        run: |
          rm .github/workflows/training-cp7-state-hierarchy.yml .github/workflows/training-cp7-runner.yml
          git config user.name "strickertmarkus"
          git config user.email "markus.strickert@sigmatechnology.com"
          git add budget .github/workflows/training-cp7-state-hierarchy.yml .github/workflows/training-cp7-runner.yml
          git commit -m "Unify Observatory semantic state hierarchy"
          git push origin HEAD:main
