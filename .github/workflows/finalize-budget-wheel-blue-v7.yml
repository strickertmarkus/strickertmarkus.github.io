name: Finalize Budget wheel blue v7

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-budget-wheel-blue-v7.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Finalize Budget wheel accent
        run: python3 .github/scripts/finalize_budget_wheel_blue_v7.py

      - name: Verify scoped changes
        shell: bash
        run: |
          for f in budget/budget.html budget/budget_maja.html; do
            grep -Fq "hoverBorderWidth: isDarkMode() ? 4 : 5" "$f"
            test "$(grep -Fc "rgba(125,211,252,0.70)" "$f")" -ge 2
            grep -q 'finance-theme-blue-v7' "$f"
          done
          git diff --quiet -- budget/firebase-sync.js budget/indexeddb-fallback.js budget/budget-persistence-guard.js budget/finance-ui.js budget/analytics.html budget/analytics_maja.html budget/familjebudget.html
          changed="$(git diff --name-only)"
          echo "$changed"
          while IFS= read -r f; do
            case "$f" in
              budget/budget.html|budget/budget_maja.html) ;;
              '') ;;
              *) echo "Unexpected changed file: $f" >&2; exit 1 ;;
            esac
          done <<< "$changed"

      - name: Commit wheel accent finalizer
        shell: bash
        run: |
          git config user.name "strickertmarkus"
          git config user.email "markus.strickert@sigmatechnology.com"
          git add budget/budget.html budget/budget_maja.html
          git commit -m "Keep Budget wheel accent through chart updates"
          git push
