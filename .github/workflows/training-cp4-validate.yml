name: Training checkpoint 4 validation

on:
  push:
    branches: [main]
    paths:
      - 'budget/pulse-observatory/observatory.css'
      - 'budget/exercise.html'
      - 'budget/pulse-environment/environment.js'
      - 'budget/tests/training-observatory-mobile.test.cjs'
      - 'budget/tests/training-shared-session.test.cjs'
      - '.github/workflows/training-cp4-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Observatory mobile composition
        run: node --test budget/tests/training-observatory-mobile.test.cjs
      - name: Re-run shared session contract
        run: node --test budget/tests/training-shared-session.test.cjs
