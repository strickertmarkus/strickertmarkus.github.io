name: Training CP11 release candidate gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/training-cp11-release-gate.yml'
      - 'budget/**'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Static Training and Zen regression
        run: |
          node --test budget/tests/training-*.test.cjs budget/tests/zen*.test.cjs
          node --check budget/exercise-dashboard.js
          node --check budget/training-zen-nav.js
          node --check budget/exercise-motion-v1.js
          node --check budget/exercise-timer-focus.js
          node --check budget/exercise-reload-recovery.js
          node --check budget/auth-config.js
          node --check budget/auth-gate.js
          git diff --check HEAD^ HEAD

      - name: Install WebKit
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps webkit

      - name: Serve repository
        run: |
          python3 -m http.server 4173 --directory . >/tmp/training-cp11-http.log 2>&1 &
          sleep 2

      - name: Exercise release candidate in iPhone WebKit
        run: |
          cat > /tmp/training-cp11-e2e.cjs <<'EOF'
          const { webkit } = require(process.cwd() + '/node_modules/playwright');
          const assert = require('node:assert/strict');

          const firebaseStub=`(function(){
            if(window.firebase)return;
            function snap(v){return {exists:function(){return v!=null},val:function(){return v==null?null:v}}}
            function ref(path){return {set:function(){return Promise.resolve()},update:function(){return Promise.resolve()},remove:function(){return Promise.resolve()},get:function(){return Promise.resolve(snap(null))},once:function(){return Promise.resolve(snap(null))},on:function(e,cb){if(cb)setTimeout(function(){cb(snap(null))},0);return cb},off:function(){},child:function(n){return ref(String(path||'')+'/'+n)}}}
            var db={ref:ref}; function database(){return db}; database.ServerValue={TIMESTAMP:Date.now()};
            var authObj={currentUser:{uid:'cp11'},setPersistence:function(){return Promise.resolve()},onAuthStateChanged:function(cb){var u=this.currentUser;setTimeout(function(){cb(u)},0);return function(){}},signInWithEmailAndPassword:function(){return Promise.resolve({user:this.currentUser})},createUserWithEmailAndPassword:function(){return Promise.resolve({user:this.currentUser})},signOut:function(){return Promise.resolve()}};
            function auth(){return authObj}; auth.Auth={Persistence:{LOCAL:'local'}};
            window.firebase={apps:[{}],initializeApp:function(){return {}},app:function(){return {}},auth:auth,database:database};
          })();`;

          async function routes(page){
            await page.route('https://www.gstatic.com/firebasejs/**',r=>r.fulfill({status:200,contentType:'application/javascript',body:firebaseStub}));
            await page.route('**/firebase-sync.js*',r=>r.fulfill({status:200,contentType:'application/javascript',body:'window.__cp11FirebaseSyncStub=true;'}));
            await page.route('https://fonts.googleapis.com/**',r=>r.fulfill({status:200,contentType:'text/css',body:''}));
            await page.route('https://fonts.gstatic.com/**',r=>r.abort());
          }
          async function seed(page){
            await page.addInitScript(()=>{
              const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
              const a=new Date(),b=new Date(a.getFullYear(),a.getMonth(),a.getDate()+1),today=iso(a),tomorrow=iso(b);
              localStorage.setItem('ex_wk','[]');
              localStorage.setItem('ex_goals',JSON.stringify({weeklyWk:4,runDistanceGoal:10,vo2Goal:45}));
              localStorage.setItem('ex_plannedSessions',JSON.stringify({
                [today]:{type:'CP11 Styrka',exercises:[{kind:'strength',name:'Testpress',sets:2,reps:8,weight:20}]},
                [tomorrow]:{type:'CP11 Kondition',exercises:[{kind:'cardio',name:'Testlöpning',distance:3,time:20}]}
              }));
              window.__CP11={today,tomorrow,overview:[]};
              const observe=()=>{if(!document.documentElement)return requestAnimationFrame(observe);window.__CP11.overview.push(document.documentElement.dataset.trainingOverview||'');new MutationObserver(()=>window.__CP11.overview.push(document.documentElement.dataset.trainingOverview||'')).observe(document.documentElement,{attributes:true,attributeFilter:['data-training-overview']})};observe();
            });
          }
          async function ready(page){
            await page.waitForFunction(()=>window.__trainingOverviewModeInstalled===true&&window.__wellnessShellInstalled===true&&typeof window.startWorkoutSessionForDate==='function'&&document.querySelectorAll('#week-grid .week-day').length===7&&document.querySelector('[data-wellness-kind-switch="true"]'),null,{timeout:20000});
            await page.waitForTimeout(400);
          }
          async function noOverflow(page,label){
            const s=await page.evaluate(()=>{
              const cw=document.documentElement.clientWidth;
              const offenders=Array.from(document.querySelectorAll('body *')).map(el=>{
                const r=el.getBoundingClientRect();
                const cs=getComputedStyle(el);
                return {tag:el.tagName,id:el.id||'',cls:String(el.className||'').slice(0,120),left:Math.round(r.left),right:Math.round(r.right),width:Math.round(r.width),position:cs.position,overflowX:cs.overflowX};
              }).filter(x=>x.width>0&&(x.right>cw+1||x.left<-1)).sort((a,b)=>(b.right-cw)-(a.right-cw)).slice(0,20);
              return {sw:document.documentElement.scrollWidth,cw,bw:document.body.scrollWidth,offenders};
            });
            if(s.sw>s.cw+1||s.bw>s.cw+1)console.log('CP11_OVERFLOW '+label+' '+JSON.stringify(s));
            assert.ok(s.sw<=s.cw+1,`${label}: html overflow ${s.sw}>${s.cw}`);assert.ok(s.bw<=s.cw+1,`${label}: body overflow ${s.bw}>${s.cw}`);
          }
          async function overview(page,mode){
            await page.evaluate(m=>window.setTrainingOverviewMode(m),mode);await page.waitForFunction(m=>document.documentElement.dataset.trainingOverview===m,mode);await page.waitForTimeout(260);
          }
          async function wellness(page,name){
            await page.locator(`[data-wellness-destination="${name}"]`).first().click();
            if(name==='training')await page.waitForFunction(()=>document.documentElement.dataset.wellnessMode==='training');
            else await page.waitForFunction(n=>document.documentElement.dataset.wellnessMode==='zen'&&document.body.dataset.kind===n,name);
            await page.waitForTimeout(220);
          }

          (async()=>{
            const browser=await webkit.launch();
            const context=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true,userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1'});
            const page=await context.newPage(),errors=[];
            page.on('pageerror',e=>errors.push('pageerror: '+e.message));page.on('console',m=>{if(m.type()==='error')errors.push('console: '+m.text())});
            await routes(page);await seed(page);
            const url='http://127.0.0.1:4173/budget/exercise.html';

            await page.goto(url,{waitUntil:'domcontentloaded'});
            assert.equal(await page.evaluate(()=>document.documentElement.dataset.trainingOverview),'observatory');
            await ready(page);assert.ok(!(await page.evaluate(()=>window.__CP11.overview)).includes('compact'));await noOverflow(page,'cold 390');
            await page.reload({waitUntil:'domcontentloaded'});assert.equal(await page.evaluate(()=>document.documentElement.dataset.trainingOverview),'observatory');await ready(page);assert.ok(!(await page.evaluate(()=>window.__CP11.overview)).includes('compact'));

            const nav0=await page.evaluate(()=>performance.getEntriesByType('navigation').length);
            await page.evaluate(()=>{document.documentElement.style.scrollBehavior='auto';window.scrollTo(0,Math.min(420,document.documentElement.scrollHeight-window.innerHeight))});await page.waitForTimeout(60);const y0=await page.evaluate(()=>window.scrollY);
            const scrollTrace=[];for(let i=0;i<3;i++){await overview(page,'compact');scrollTrace.push(await page.evaluate(()=>({mode:document.documentElement.dataset.trainingOverview,y:window.scrollY,h:document.documentElement.scrollHeight})));await overview(page,'observatory');scrollTrace.push(await page.evaluate(()=>({mode:document.documentElement.dataset.trainingOverview,y:window.scrollY,h:document.documentElement.scrollHeight})))}
            const y1=await page.evaluate(()=>window.scrollY);console.log('CP11_SCROLL '+JSON.stringify({y0,y1,trace:scrollTrace}));
            assert.ok(Math.abs(y1-y0)<=3,`overview scroll drift ${y0}->${y1}`);assert.equal(await page.evaluate(()=>performance.getEntriesByType('navigation').length),nav0);

            await page.evaluate(()=>window.scrollTo(0,0));const week0=await page.locator('#week-grid .week-day').allTextContents(),orbit=page.locator('[data-week-orbit-toggle]');
            for(let i=0;i<3;i++){await orbit.click();await page.waitForFunction(()=>document.querySelector('[data-week-orbit-toggle]').getAttribute('aria-expanded')==='true');assert.deepEqual(await page.locator('#week-grid .week-day').allTextContents(),week0);await orbit.click();await page.waitForFunction(()=>document.querySelector('[data-week-orbit-toggle]').getAttribute('aria-expanded')==='false')}

            const data=await page.evaluate(()=>window.__CP11);
            await page.locator('#week-grid .week-day',{hasText:'CP11 Styrka'}).click();await page.waitForFunction(()=>document.getElementById('day-modal').classList.contains('show'));await page.evaluate(()=>window.closeModal('day-modal'));
            await page.evaluate(d=>window.openDayWorkoutBuilder('Idag',d),data.today);await page.waitForFunction(()=>document.getElementById('day-workout-modal').classList.contains('show'));await page.locator('#day-workout-type').fill('CP11 Redigerat');assert.equal(await page.evaluate(()=>window.persistDayWorkoutPlan({})),true);assert.equal(await page.evaluate(d=>window.getPlannedSessions()[d].type,data.today),'CP11 Redigerat');await page.evaluate(()=>window.closeModal('day-workout-modal'));

            await overview(page,'observatory');await page.evaluate(d=>window.startWorkoutSessionForDate(d),data.today);await page.waitForFunction(()=>document.getElementById('session-modal').classList.contains('show'));const a=await page.evaluate(()=>({type:window.sessionState.type,kind:window.sessionState.exercises[0].kind,name:window.sessionState.exercises[0].name}));
            await page.locator('[data-wellness-destination="stretch"]').first().click();await page.waitForTimeout(100);assert.notEqual(await page.evaluate(()=>document.documentElement.dataset.wellnessMode),'zen');assert.match(await page.locator('.wellness-mode-notice').innerText(),/Avsluta det pågående träningspasset/);await page.evaluate(()=>window.stopSessionMode(false));
            await overview(page,'compact');await page.evaluate(d=>window.startWorkoutSessionForDate(d),data.today);await page.waitForFunction(()=>document.getElementById('session-modal').classList.contains('show'));const b=await page.evaluate(()=>({type:window.sessionState.type,kind:window.sessionState.exercises[0].kind,name:window.sessionState.exercises[0].name}));assert.deepEqual(b,a);await page.evaluate(()=>window.stopSessionMode(false));

            await overview(page,'observatory');await page.evaluate(d=>window.startWorkoutSessionForDate(d),data.tomorrow);await page.waitForFunction(()=>document.getElementById('session-modal').classList.contains('show'));assert.equal(await page.evaluate(()=>window.sessionState.exercises[0].kind),'cardio');await page.setViewportSize({width:844,height:390});await page.waitForTimeout(160);await noOverflow(page,'landscape session');await page.setViewportSize({width:390,height:844});await page.evaluate(()=>window.stopSessionMode(false));

            const wc=await page.evaluate(()=>window.getWorkouts().length);await page.evaluate(d=>window.startWorkoutSessionForDate(d),data.today);await page.waitForFunction(()=>document.getElementById('session-modal').classList.contains('show'));await page.evaluate(()=>{window.sessionState.passStartedAt=Date.now()-65000;window.saveSessionWorkout()});await page.waitForFunction(()=>!document.getElementById('session-modal').classList.contains('show'));assert.equal(await page.evaluate(()=>window.getWorkouts().length),wc+1);assert.equal(await page.evaluate(()=>document.documentElement.dataset.trainingOverview),'observatory');

            const nav1=await page.evaluate(()=>performance.getEntriesByType('navigation').length);await wellness(page,'stretch');assert.ok(await page.locator('#wellness-zen-surface').isVisible());await wellness(page,'meditation');await wellness(page,'training');await wellness(page,'stretch');await page.evaluate(()=>history.back());await page.waitForFunction(()=>document.documentElement.dataset.wellnessMode==='training');await page.evaluate(()=>history.forward());await page.waitForFunction(()=>document.documentElement.dataset.wellnessMode==='zen'&&document.body.dataset.kind==='stretch');await wellness(page,'training');assert.equal(await page.evaluate(()=>performance.getEntriesByType('navigation').length),nav1);

            for(const width of [320,375,390,768,1440]){await page.setViewportSize({width,height:width<500?844:900});await page.waitForTimeout(100);await noOverflow(page,`${width}px Training`)}
            await page.setViewportSize({width:390,height:844});await wellness(page,'stretch');await noOverflow(page,'390 Stretch');await wellness(page,'meditation');await noOverflow(page,'390 Meditation');await wellness(page,'training');
            await page.emulateMedia({reducedMotion:'reduce'});await overview(page,'compact');await overview(page,'observatory');await wellness(page,'stretch');await wellness(page,'training');

            const maja=await context.newPage(),majaErrors=[];maja.on('pageerror',e=>majaErrors.push(e.message));maja.on('console',m=>{if(m.type()==='error')majaErrors.push(m.text())});await routes(maja);await seed(maja);await maja.goto(url+'?user=maja',{waitUntil:'domcontentloaded'});await ready(maja);await wellness(maja,'stretch');assert.equal(await maja.evaluate(()=>new URLSearchParams(location.search).get('user')),'maja');await wellness(maja,'training');assert.equal(await maja.evaluate(()=>new URLSearchParams(location.search).get('user')),'maja');assert.deepEqual(majaErrors,[]);await maja.close();

            const audit=await page.evaluate(()=>{const rows=performance.getEntriesByType('resource');const local=rows.filter(e=>{try{const u=new URL(e.name);return u.origin===location.origin&&u.pathname.endsWith('.js')}catch(_){return false}});const names=[...new Set(local.map(e=>new URL(e.name).pathname.split('/').pop()))].sort();const m=window.__exerciseLoaderMetricsV2||{};return {manifestCount:m.manifestCount||0,bundleMs:m.bundleReadyAt&&m.preloadStartedAt?Math.round(m.bundleReadyAt-m.preloadStartedAt):null,localScriptRequests:local.length,uniqueLocalScripts:names.length,scriptNames:names}});console.log('CP11_LOADER_AUDIT '+JSON.stringify(audit));assert.equal(audit.manifestCount,27);assert.ok(audit.uniqueLocalScripts>=27);
            assert.deepEqual(errors,[],'Browser errors: '+errors.join(' | '));await browser.close();console.log('Training CP11 WebKit release gate passed');
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node /tmp/training-cp11-e2e.cjs
