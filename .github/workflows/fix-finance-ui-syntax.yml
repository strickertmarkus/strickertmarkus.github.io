name: Refresh finance UI cache

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-finance-ui-syntax.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify finance UI syntax
        run: node --check budget/finance-ui.js
      - name: Bust finance UI cache on finance pages
        shell: python
        run: |
          from pathlib import Path
          pages = [
              'budget/budget.html',
              'budget/budget_maja.html',
              'budget/analytics.html',
              'budget/analytics_maja.html',
              'budget/familjebudget.html',
          ]
          old = 'finance-ui.js?v=20260830-finance-clean-v1'
          new = 'finance-ui.js?v=20260830-finance-clean-v2'
          for name in pages:
              p = Path(name)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'{old} not found in {name}')
              p.write_text(s.replace(old, new))
      - name: Verify data layer untouched
        run: |
          git diff --quiet -- budget/firebase-sync.js budget/indexeddb-fallback.js budget/budget-persistence-guard.js
      - name: Commit cache refresh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add budget/budget.html budget/budget_maja.html budget/analytics.html budget/analytics_maja.html budget/familjebudget.html
          git commit -m 'Refresh clean finance UI cache'
          git push
