name: Consolidate timer focus v2
on:
  push:
    paths:
      - '.github/workflows/consolidate-exercise-timer-focus-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consolidate timer focus files
        shell: bash
        run: |
          set -euo pipefail
          old='20260914-timer-focus-v151c-safari'
          new='20260914-timer-focus-final'

          sed -i '/exercise-timer-focus-v146\.js/d;/exercise-timer-focus-v147\.js/d;/exercise-timer-focus-v148\.js/d;/exercise-timer-focus-v151\.js/d' budget/exercise.html
          sed -i "/auth-gate\.js?v=${old}/a\\  <script defer src=\"exercise-timer-focus.js?v=${new}\"></script>" budget/exercise.html
          sed -i "s/${old}/${new}/g" budget/exercise.html budget/auth-config.js budget/auth-gate.js

          sed -i '/  function loadTimerFocus() {/,/  function install() {/c\
            function loadTimerFocus() {\
              if (document.querySelector("script[data-exercise-timer-focus-final]")) return;\
              if (window.__exerciseTimerFocusInstalled) return;\
              var script = document.createElement("script");\
              script.src = "exercise-timer-focus.js?v=20260914-timer-focus-final";\
              script.async = false;\
              script.setAttribute("data-exercise-timer-focus-final","true");\
              document.head.appendChild(script);\
            }\
          \
            function install() {' budget/exercise-pulse-flow-canvas-glow-v131.js
          sed -i '/loadTimerFocusFix();/d;/loadTimerFocusPolish();/d' budget/exercise-pulse-flow-canvas-glow-v131.js

          git rm -f budget/exercise-timer-focus-v145.js budget/exercise-timer-focus-v146.js budget/exercise-timer-focus-v147.js budget/exercise-timer-focus-v148.js budget/exercise-timer-focus-v149.js budget/exercise-timer-focus-v150.js budget/exercise-timer-focus-v151.js

          node --check budget/exercise-timer-focus.js
          node --check budget/exercise-pulse-flow-canvas-glow-v131.js
          grep -q 'exercise-timer-focus.js?v=20260914-timer-focus-final' budget/exercise.html
          ! grep -q 'exercise-timer-focus-v1' budget/exercise.html
          ! grep -q 'loadTimerFocusFix' budget/exercise-pulse-flow-canvas-glow-v131.js
          ! grep -q 'loadTimerFocusPolish' budget/exercise-pulse-flow-canvas-glow-v131.js

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/consolidate-exercise-timer-focus.yml .github/workflows/consolidate-exercise-timer-focus-v2.yml
          git add budget/exercise.html budget/auth-config.js budget/auth-gate.js budget/exercise-pulse-flow-canvas-glow-v131.js budget/exercise-timer-focus.js
          git commit -m 'Consolidate cardio focus timer and add double tap'
          git push
