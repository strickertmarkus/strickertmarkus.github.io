name: Training CP8 Zen header restoration

on:
  push:
    branches:
      - checkpoint/training-observatory-cp8-zen-header-restore-work
    paths:
      - '.github/workflows/training-cp8-zen-header-restore.yml'
      - '.github/training-cp8-zen-header-restore.py'

jobs:
  restore-test-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: checkpoint/training-observatory-cp8-zen-header-restore-work
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply structural Zen header restoration
        run: python .github/training-cp8-zen-header-restore.py
      - name: Syntax and training regression tests
        run: |
          node --check budget/training-zen-nav.js
          node --check budget/firebase-sync.js
          node --test budget/tests/training-*.test.cjs
          git diff --check
      - name: Verify ownership and cleanup
        run: |
          grep -F 'background:transparent!important' budget/training-zen-nav.css
          grep -F 'height:92px!important' budget/training-zen-nav.css
          grep -F 'height:24px !important' budget/firebase-sync.js
          grep -F 'training-zen-nav.css?v=20260916-main-cp8-zen-header-restore-1' budget/exercise.html
          grep -F 'firebase-sync.js?v=20260916-profile-toggle-compact-1' budget/exercise.html
          ! grep -F 'background:rgba(7,27,23,.86)!important' budget/training-zen-nav.css
      - name: Commit verified restoration and remove temporary files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/training-cp8-zen-header-restore.yml .github/training-cp8-zen-header-restore.py
          git add budget/training-zen-nav.css budget/firebase-sync.js budget/exercise.html budget/zen.html budget/tests/training-wellness-shell.test.cjs
          git commit -m 'Restore original Zen header composition'
          git push origin HEAD:checkpoint/training-observatory-cp8-zen-header-restore-work
