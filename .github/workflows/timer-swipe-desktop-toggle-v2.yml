name: Timer swipe and desktop toggle v2
on:
  push:
    paths:
      - '.github/workflows/timer-swipe-desktop-toggle-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply interaction patch
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d | python3
          node --check budget/exercise-timer-focus.js
          grep -q 'installTimerGestures' budget/exercise-timer-focus.js
          ! grep -q 'installDoubleTap' budget/exercise-timer-focus.js
          grep -q '20260914-timer-focus-final4-swipe' budget/exercise.html
      - name: Commit interaction update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/timer-swipe-desktop-toggle.yml .github/workflows/timer-swipe-desktop-toggle-v2.yml
          git add budget/exercise-timer-focus.js budget/exercise.html budget/auth-config.js budget/auth-gate.js budget/exercise-pulse-flow-canvas-glow-v131.js
          git commit -m 'Use swipe gesture for cardio timer focus'
          git push
