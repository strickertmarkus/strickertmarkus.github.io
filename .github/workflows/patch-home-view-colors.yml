name: Patch Home calendar view colors

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/patch-home-view-colors.yml'

permissions:
  contents: write

jobs:
  patch-home-colors:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Home colors
        run: node budget/patch-home-view-colors.mjs

      - name: Commit Home colors
        run: |
          git config user.name "strickertmarkus"
          git config user.email "markus.strickert@sigmatechnology.com"
          git add budget/home-calendar-theme-v12.js budget/nav-menu-motion.js
          git diff --cached --check
          git commit -m "Swap Home day and month view themes"
          git push origin main
