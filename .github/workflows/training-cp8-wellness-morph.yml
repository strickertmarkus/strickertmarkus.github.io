name: Training CP8 wellness morph

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Implement shared Training Zen wellness shell
        run: |
          cat > budget/training-zen-nav.js <<'EOF'
          (function(){
            'use strict';
            if(window.__wellnessShellInstalled)return;
            window.__wellnessShellInstalled=true;

            var canonical=/\/exercise\.html$/.test(location.pathname);
            var directZen=/\/zen\.html$/.test(location.pathname);
            var reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)');
            var trainingMain=document.getElementById('pulse-home');
            var header=document.querySelector('.app-header, .zen-header');
            var zenHost=null,zenLoadPromise=null,zenStyleLinks=[],zenTools=null,zenBrand=null;
            var mode='training',switchToken=0;
            var scrollPositions={training:window.scrollY||0,zen:0};
            var trainingTitle=document.title;
            var trainingTheme='#0F1219';

            function profileQuery(){return new URLSearchParams(location.search).get('user')==='maja'?'maja':'';}
            function modeURL(next){
              var url=new URL(location.href);
              if(canonical){
                if(next==='zen')url.searchParams.set('wellness','zen');
                else url.searchParams.delete('wellness');
              }else{
                url=new URL('exercise.html',location.href);
                if(profileQuery())url.searchParams.set('user','maja');
                if(next==='zen')url.searchParams.set('wellness','zen');
              }
              return url;
            }
            function hrefFor(next){return modeURL(next).href;}
            function ensureThemeMeta(){
              var meta=document.querySelector('meta[name="theme-color"]');
              if(!meta){meta=document.createElement('meta');meta.name='theme-color';meta.content=trainingTheme;document.head.appendChild(meta);}
              return meta;
            }
            function setNotice(message){
              var node=document.querySelector('.wellness-mode-notice');
              if(!node)return;
              node.textContent=message||'';
              node.hidden=!message;
              if(message)window.setTimeout(function(){if(node.textContent===message){node.hidden=true;node.textContent='';}},4200);
            }
            function mountNav(){
              if(!header)return null;
              var existing=header.querySelector('.wellness-nav');
              if(existing)return existing;
              var nav=document.createElement('nav');
              nav.className='wellness-nav';
              nav.setAttribute('aria-label','Träning och återhämtning');
              nav.innerHTML='<a data-destination="training" href="'+hrefFor('training')+'"><span class="wellness-symbol" aria-hidden="true">◆⌁</span>Träning</a><a data-destination="zen" href="'+hrefFor('zen')+'"><span class="wellness-symbol" aria-hidden="true">✧≈</span>Zen</a><span class="wellness-mode-notice" role="status" aria-live="polite" hidden></span>';
              var anchor=header.querySelector('.streak-badge, .zen-header-end');
              header.insertBefore(nav,anchor||null);
              return nav;
            }
            function updateNav(next){
              document.querySelectorAll('.wellness-nav [data-destination]').forEach(function(link){link.setAttribute('aria-current',link.dataset.destination===next?'page':'false');});
            }
            function ensureSharedHeaderZenTools(){
              if(!canonical||!header)return;
              var brand=header.querySelector('.brand');
              if(brand&&!brand.querySelector('.wellness-zen-brand')){
                zenBrand=document.createElement('a');
                zenBrand.className='wellness-zen-brand';
                zenBrand.href='home.html';
                zenBrand.hidden=true;
                zenBrand.setAttribute('aria-label','Startsida');
                zenBrand.innerHTML='<span aria-hidden="true">✧</span><span>ZEN<small>STRETCH &amp; MEDITATION</small></span>';
                brand.appendChild(zenBrand);
              }else if(brand)zenBrand=brand.querySelector('.wellness-zen-brand');
              zenTools=document.createElement('div');
              zenTools.className='wellness-zen-tools';
              zenTools.hidden=true;
              zenTools.innerHTML='<span id="profile-name">Din profil</span><button class="icon-button" id="settings-open" type="button" aria-label="Inställningar och sparad data">⋯</button>';
              var anchor=header.querySelector('.streak-badge');
              header.insertBefore(zenTools,anchor||null);
            }
            function loadStyles(doc){
              var promises=[];
              Array.prototype.forEach.call(doc.querySelectorAll('link[rel="stylesheet"]'),function(source){
                var href=source.getAttribute('href')||'';
                var absolute=new URL(href,location.href);
                var file=absolute.pathname.split('/').pop();
                var isZen=/^zen.*\.css$/i.test(file);
                var isFont=absolute.hostname==='fonts.googleapis.com';
                if(!isZen&&!isFont)return;
                if(document.querySelector('link[data-wellness-asset="'+absolute.href.replace(/"/g,'')+'"]'))return;
                var link=document.createElement('link');
                link.rel='stylesheet';link.href=absolute.href;link.dataset.wellnessAsset=absolute.href;
                if(isZen){link.media='not all';zenStyleLinks.push(link);}
                promises.push(new Promise(function(resolve){link.addEventListener('load',resolve,{once:true});link.addEventListener('error',resolve,{once:true});}));
                document.head.appendChild(link);
              });
              return Promise.all(promises);
            }
            function loadScripts(doc){
              var sources=Array.prototype.map.call(doc.querySelectorAll('script[src]'),function(script){return script.getAttribute('src')||'';}).filter(function(src){
                var file=new URL(src,location.href).pathname.split('/').pop().split('?')[0];
                return file==='zen.js'||/^zen-.*\.js$/i.test(file);
              });
              return sources.reduce(function(chain,src){
                return chain.then(function(){return new Promise(function(resolve,reject){
                  var absolute=new URL(src,location.href).href;
                  if(document.querySelector('script[data-wellness-asset="'+absolute.replace(/"/g,'')+'"]')){resolve();return;}
                  var script=document.createElement('script');script.src=absolute;script.dataset.wellnessAsset=absolute;script.async=false;
                  script.onload=resolve;script.onerror=function(){reject(new Error('Kunde inte ladda Zen-modulen '+src));};document.body.appendChild(script);
                });});
              },Promise.resolve());
            }
            function extractZenSurface(doc){
              var host=document.createElement('section');
              host.id='wellness-zen-surface';host.className='wellness-zen-surface';host.hidden=true;host.setAttribute('aria-label','Zen');
              ['.landscape','#zen-main'].forEach(function(selector){var node=doc.querySelector(selector);if(node)host.appendChild(document.importNode(node,true));});
              Array.prototype.forEach.call(doc.querySelectorAll('dialog,#toast'),function(node){host.appendChild(document.importNode(node,true));});
              if(!host.querySelector('#zen-main'))throw new Error('Zen-ytan saknar huvudvyn.');
              trainingMain.insertAdjacentElement('afterend',host);
              return host;
            }
            function ensureZenLoaded(){
              if(zenLoadPromise)return zenLoadPromise;
              zenLoadPromise=fetch('zen.html',{credentials:'same-origin'}).then(function(response){if(!response.ok)throw new Error('Zen kunde inte laddas.');return response.text();}).then(function(html){
                var doc=new DOMParser().parseFromString(html,'text/html');
                zenHost=extractZenSurface(doc);
                ensureThemeMeta();
                document.body.dataset.kind=doc.body.dataset.kind||'stretch';
                return loadStyles(doc).then(function(){return loadScripts(doc);});
              }).catch(function(error){zenLoadPromise=null;if(zenHost){zenHost.remove();zenHost=null;}throw error;});
              return zenLoadPromise;
            }
            function toggleZenStyles(active){zenStyleLinks.forEach(function(link){link.media=active?'all':'not all';});}
            function trainingSessionActive(){var modal=document.getElementById('session-modal');return !!(modal&&modal.classList.contains('show'));}
            function zenSessionActive(){return document.body.classList.contains('in-session');}
            function canLeave(next){
              if(mode==='training'&&next==='zen'&&trainingSessionActive()){setNotice('Avsluta det pågående träningspasset innan du byter till Zen.');return false;}
              if(mode==='zen'&&next==='training'&&zenSessionActive()){setNotice('Avsluta eller lämna Zen-passet till startsidan innan du byter till Träning.');return false;}
              return true;
            }
            function applyMode(next){
              var zen=next==='zen';
              toggleZenStyles(zen);
              document.documentElement.dataset.wellnessMode=next;
              document.body.classList.toggle('wellness-zen-active',zen);
              trainingMain.hidden=zen;
              if(zenHost)zenHost.hidden=!zen;
              if(zenTools)zenTools.hidden=!zen;
              if(zenBrand)zenBrand.hidden=!zen;
              var trainingBrand=header&&header.querySelector('.brand-text');if(trainingBrand)trainingBrand.hidden=zen;
              var streak=header&&header.querySelector('.streak-badge');if(streak)streak.hidden=zen;
              ensureThemeMeta().content=zen?(document.body.dataset.kind==='meditation'?'#a7c3bd':'#091d18'):trainingTheme;
              document.title=zen?'Zen · Stretch och meditation':trainingTitle;
              updateNav(next);
              mode=next;
            }
            function swap(next){
              scrollPositions[mode]=window.scrollY||0;
              var apply=function(){applyMode(next);};
              if(reduced&&reduced.matches){apply();return Promise.resolve();}
              if(typeof document.startViewTransition==='function'){
                var transition=document.startViewTransition(apply);
                return transition.finished.catch(function(){});
              }
              document.documentElement.classList.add('wellness-shell-switching');
              apply();
              var target=next==='zen'?zenHost:trainingMain;
              if(target)target.classList.add('wellness-surface-enter');
              return new Promise(function(resolve){window.setTimeout(function(){document.documentElement.classList.remove('wellness-shell-switching');if(target)target.classList.remove('wellness-surface-enter');resolve();},460);});
            }
            function historyFor(next,action){
              if(action==='none')return;
              var url=modeURL(next);
              if(action==='replace')history.replaceState({wellnessMode:next},'',url.href);
              else history.pushState({wellnessMode:next},'',url.href);
            }
            function requestMode(next,options){
              options=options||{};next=next==='zen'?'zen':'training';
              if(next===mode&&!options.force){updateNav(next);return Promise.resolve(true);}
              if(!canLeave(next))return Promise.resolve(false);
              var token=++switchToken;
              var ready=next==='zen'?ensureZenLoaded():Promise.resolve();
              return ready.then(function(){
                if(token!==switchToken)return false;
                return swap(next).then(function(){
                  if(token!==switchToken)return false;
                  historyFor(next,options.history||'push');
                  requestAnimationFrame(function(){window.scrollTo(0,scrollPositions[next]||0);});
                  window.dispatchEvent(new CustomEvent('wellness-mode-change',{detail:{mode:next}}));
                  return true;
                });
              }).catch(function(){setNotice('Zen kunde inte laddas. Försök igen.');return false;});
            }

            var nav=mountNav();
            if(!canonical){updateNav(directZen?'zen':'training');return;}
            if(!trainingMain||!header)return;
            ensureSharedHeaderZenTools();
            document.documentElement.dataset.wellnessMode='training';
            updateNav('training');
            if(nav)nav.addEventListener('click',function(event){var link=event.target.closest('[data-destination]');if(!link||!nav.contains(link))return;event.preventDefault();requestMode(link.dataset.destination);});
            window.addEventListener('popstate',function(){var next=new URLSearchParams(location.search).get('wellness')==='zen'?'zen':'training';requestMode(next,{history:'none'});});
            window.setWellnessMode=function(next){return requestMode(next);};
            if(new URLSearchParams(location.search).get('wellness')==='zen')requestMode('zen',{history:'none',force:true});
          })();
          EOF

          cat > budget/training-zen-nav.css <<'EOF'
          .wellness-nav{display:inline-flex;align-items:center;gap:4px;padding:4px;border:1px solid #91b8b326;border-radius:999px;background:#08171bcc;box-shadow:inset 0 1px 0 #ffffff08,0 5px 24px #00000012;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);flex-shrink:0;font-family:Inter,system-ui,sans-serif;position:relative}
          .wellness-nav a{display:flex;align-items:center;justify-content:center;gap:9px;min-height:37px;padding:0 17px;border:1px solid transparent;border-radius:999px;color:#a4b5ba;text-decoration:none;font-size:12px;font-weight:600;transition:background .45s,color .45s,box-shadow .45s}
          .wellness-nav a:hover{color:#f2ffe8;background:#ffffff0a}
          .wellness-nav a:focus-visible{outline:2px solid #d3f5ad;outline-offset:3px}
          .wellness-nav .wellness-symbol{font-size:21px;line-height:1;font-weight:300;letter-spacing:-3px;padding-right:3px;text-shadow:0 0 18px currentColor}
          .wellness-nav a[aria-current="page"]{color:#ddf9ff;background:linear-gradient(120deg,#22d3ee28,#22d3ee0d);border-color:#67e8f926;box-shadow:0 0 16px #22d3ee08}
          .wellness-nav a[data-destination="zen"][aria-current="page"]{color:#ecf7df;background:linear-gradient(120deg,#a8d67d30,#b3deee13);border-color:#b0ddb133;box-shadow:0 0 24px #ade79412}
          .wellness-mode-notice{position:absolute;left:50%;top:calc(100% + 9px);transform:translateX(-50%);width:max-content;max-width:min(330px,82vw);padding:8px 11px;border:1px solid #e8c7a22b;border-radius:10px;background:#161a1eea;color:#eadfd6;font-size:10px;font-weight:500;line-height:1.35;box-shadow:0 10px 28px #0007;z-index:1200}
          .wellness-zen-brand{display:flex;align-items:center;gap:9px;color:#eaf5da;text-decoration:none;font-family:Manrope,Inter,system-ui,sans-serif;font-size:15px;font-weight:600;letter-spacing:1.5px}
          .wellness-zen-brand>span:first-child{font-size:25px;color:#d4eea7;text-shadow:0 0 18px #bde78c66}
          .wellness-zen-brand small{display:block;margin-top:1px;color:#93ad96;font-size:7px;font-weight:600;letter-spacing:1.5px}
          .wellness-zen-tools{display:flex;align-items:center;gap:9px;color:#b7c9b4;font:500 11px/1.2 Manrope,Inter,system-ui,sans-serif}
          .wellness-zen-tools .icon-button{width:36px;height:36px;border:1px solid #b6d89b2a;border-radius:50%;background:#d4eea708;color:#dff4bd;font-size:20px;line-height:1}
          .wellness-zen-surface{position:relative;isolation:isolate;min-height:100vh;view-transition-name:wellness-surface}
          #pulse-home{view-transition-name:wellness-surface}
          html[data-wellness-mode="zen"] #pulse-header{background:rgba(7,27,23,.86)!important;border-bottom-color:#b4df9b20!important;box-shadow:0 10px 32px #04100d35!important}
          html[data-wellness-mode="zen"] .wellness-nav{border-color:#a9d49528;background:#071b17d9}
          html[data-wellness-mode="zen"] .nav-dropdown-wrapper{opacity:.62}
          .wellness-surface-enter{animation:wellnessSurfaceIn .44s cubic-bezier(.16,1,.3,1)}
          @keyframes wellnessSurfaceIn{from{opacity:0;transform:translateY(10px) scale(.992);filter:blur(3px)}to{opacity:1;transform:none;filter:none}}
          ::view-transition-old(wellness-surface){animation:wellnessSurfaceOld .42s cubic-bezier(.4,0,.2,1)}
          ::view-transition-new(wellness-surface){animation:wellnessSurfaceNew .52s cubic-bezier(.16,1,.3,1)}
          @keyframes wellnessSurfaceOld{to{opacity:0;transform:scale(.99) translateY(-5px);filter:blur(2px)}}
          @keyframes wellnessSurfaceNew{from{opacity:0;transform:scale(.992) translateY(8px);filter:blur(3px)}}
          @media(max-width:760px){
            .app-header:has(>.wellness-nav){flex-wrap:wrap}
            .app-header>.wellness-nav{order:4;flex-basis:100%;width:100%;justify-content:center}
            .app-header>.wellness-nav a{flex:1;min-height:34px}
            .wellness-nav a{padding:0 13px}
            #pulse-header .wellness-zen-tools{grid-column:2;grid-row:2;justify-self:end}
            #pulse-header .wellness-zen-brand{min-width:0}
            #pulse-header .wellness-zen-brand small{font-size:6px;letter-spacing:1px}
          }
          @media(prefers-reduced-motion:reduce){
            .wellness-nav a,.wellness-surface-enter{transition:none!important;animation:none!important}
            ::view-transition-old(wellness-surface),::view-transition-new(wellness-surface){animation:none!important}
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path
          def once(text,old,new,label):
              c=text.count(old)
              if c!=1: raise SystemExit(f'{label}: expected 1 match, got {c}')
              return text.replace(old,new,1)
          for rel in ['budget/exercise.html','budget/zen.html']:
              p=Path(rel);s=p.read_text()
              s=s.replace('training-zen-nav.css?v=20260910','training-zen-nav.css?v=20260915-main-cp8-wellness-1')
              s=s.replace('training-zen-nav.js?v=20260910','training-zen-nav.js?v=20260915-main-cp8-wellness-1')
              p.write_text(s)
          p=Path('budget/TRAINING-OBSERVATORY-MIGRATION-CHECKLIST.md');s=p.read_text()
          start=s.index('# Checkpoint 8 — Training ↔ Zen becomes an in-page morph')
          end=s.index('\n---\n\n# Checkpoint 9',start)
          section=s[start:end].replace('- [ ]','- [x]')
          note='''\n\nImplementation checkpoint: `training-zen-nav.js` is now the shared wellness-shell controller on the canonical `exercise.html` route. Training remains mounted; Zen is fetched from the existing `zen.html` source only on first use, its main/landscape/dialog surface is imported without the standalone Zen header, and only Zen-local CSS/JS assets are lazy-loaded. The shared training header owns the Training/Zen navigation plus Zen profile/settings tools, so the mounted surface does not create a second header. Live Training or live Zen sessions block a mode change with a non-destructive status message.\n\nHistory policy: `?wellness=zen` represents the Zen surface; Training is the canonical URL without that parameter. `history.pushState` is used for user switches and `popstate` restores the corresponding mounted surface. Existing query parameters, including `?user=maja` and overview selection, are preserved. The controller uses `document.startViewTransition()` where available and a CSS entrance morph otherwise; reduced-motion switches immediately.\n\nVerification: controller syntax, all `budget/tests/training-*.test.cjs` plus existing `budget/tests/zen*.test.cjs`, lazy Zen-only asset filtering, no iframe/second full-document mount, one shared header, active-session guards, profile/history preservation, current cache keys and `git diff --check`.\n'''
          marker='\n\n**Checkpoint exit condition:**'
          section=section.replace(marker,note+marker,1)
          p.write_text(s[:start]+section+s[end:])
          PY

          cat > budget/tests/training-wellness-shell.test.cjs <<'EOF'
          const test=require('node:test');
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const path=require('node:path');
          const root=path.join(__dirname,'..');
          const read=p=>fs.readFileSync(path.join(root,p),'utf8');
          const shell=read('training-zen-nav.js');
          const css=read('training-zen-nav.css');
          const exercise=read('exercise.html');
          const zen=read('zen.html');
          const store=read('zen-store.js');

          test('CP8 uses one canonical in-page wellness shell without iframe or duplicate full documents',()=>{
            assert.match(shell,/canonical=\/\\\/exercise\\\.html\$\//);
            assert.match(shell,/fetch\('zen\.html'/);
            assert.match(shell,/extractZenSurface\(doc\)/);
            assert.match(shell,/\['\.landscape','#zen-main'\]/);
            assert.doesNotMatch(shell,/iframe|srcdoc/);
            assert.doesNotMatch(shell,/querySelector\('\.zen-header'\).*importNode/s);
          });

          test('Zen heavy assets are lazy loaded once and remain domain scoped',()=>{
            assert.match(shell,/zenLoadPromise/);
            assert.match(shell,/file==='zen\.js'\|\|\/\^zen-\.\*\\\.js\$/);
            assert.match(shell,/\^zen\.\*\\\.css\$/);
            assert.doesNotMatch(shell,/firebase-app-compat|auth-config\.js|auth-gate\.js/);
            assert.match(store,/firebase\.database\(\)\.ref\('zen_v1\//);
            assert.doesNotMatch(store,/weekPlans|plannedSessions|exerciseSessions/);
          });

          test('Training stays mounted while Zen is toggled and the shared header supplies Zen tools',()=>{
            assert.match(shell,/trainingMain\.hidden=zen/);
            assert.match(shell,/zenHost\.hidden=!zen/);
            assert.match(shell,/wellness-zen-tools/);
            assert.match(shell,/id="profile-name"/);
            assert.match(shell,/id="settings-open"/);
            assert.match(css,/wellness-zen-surface/);
            assert.equal((shell.match(/createElement\('header'\)/g)||[]).length,0);
          });

          test('live sessions cannot be silently destroyed by a wellness switch',()=>{
            assert.match(shell,/session-modal/);
            assert.match(shell,/classList\.contains\('show'\)/);
            assert.match(shell,/classList\.contains\('in-session'\)/);
            assert.match(shell,/Avsluta det pågående träningspasset/);
            assert.match(shell,/Avsluta eller lämna Zen-passet/);
          });

          test('wellness switching has view transition, CSS fallback and reduced-motion path',()=>{
            assert.match(shell,/document\.startViewTransition/);
            assert.match(shell,/wellness-shell-switching/);
            assert.match(shell,/prefers-reduced-motion: reduce/);
            assert.match(css,/wellnessSurfaceIn/);
            assert.match(css,/::view-transition-old\(wellness-surface\)/);
            assert.match(css,/@media\(prefers-reduced-motion:reduce\)/);
          });

          test('profile query and intentional browser history survive in-page switching',()=>{
            assert.match(shell,/searchParams\.set\('wellness','zen'\)/);
            assert.match(shell,/searchParams\.delete\('wellness'\)/);
            assert.match(shell,/history\.pushState/);
            assert.match(shell,/addEventListener\('popstate'/);
            assert.match(shell,/get\('user'\)===['"]maja['"]/);
          });

          test('production pages cache-bust the CP8 shared controller',()=>{
            for(const source of [exercise,zen]){
              assert.match(source,/training-zen-nav\.css\?v=20260915-main-cp8-wellness-1/);
              assert.match(source,/training-zen-nav\.js\?v=20260915-main-cp8-wellness-1/);
            }
          });
          EOF
      - name: Syntax and regression tests
        run: |
          node --check budget/training-zen-nav.js
          node --check budget/zen.js
          node --check budget/zen-store.js
          node --check budget/zen-scene-runtime.js
          node --test budget/tests/training-*.test.cjs budget/tests/zen*.test.cjs
          git diff --check
      - name: Verify CP8 ownership
        run: |
          grep -F "document.startViewTransition" budget/training-zen-nav.js
          grep -F "history.pushState" budget/training-zen-nav.js
          grep -F "fetch('zen.html'" budget/training-zen-nav.js
          ! grep -E "iframe|srcdoc" budget/training-zen-nav.js
          grep -F "data-wellness-mode" budget/training-zen-nav.css
          grep -F "[x] Design a shared \`wellness\` shell/controller" budget/TRAINING-OBSERVATORY-MIGRATION-CHECKLIST.md
      - name: Commit CP8 and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/training-cp8-wellness-morph.yml
          git add budget/training-zen-nav.js budget/training-zen-nav.css budget/exercise.html budget/zen.html budget/TRAINING-OBSERVATORY-MIGRATION-CHECKLIST.md budget/tests/training-wellness-shell.test.cjs
          git commit -m "Implement checkpoint 8 in-page Training Zen morph"
          git push origin HEAD:main
