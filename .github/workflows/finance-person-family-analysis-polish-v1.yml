name: Finance person family analysis polish v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finance-person-family-analysis-polish-v1.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply finance polish
        run: python3 .github/scripts/finance_person_family_analysis_polish_v1.py

      - name: Verify JavaScript
        run: |
          node --check budget/finance-ui.js
          node --check budget/nav-menu-motion.js

      - name: Verify scoped changes
        shell: bash
        run: |
          grep -Fq 'body .header>p{view-transition-name:finance-person' budget/finance-ui.js
          ! grep -Fq "sub.style.viewTransitionName = 'finance-person'" budget/finance-ui.js
          grep -Fq '<p>Markus</p>' budget/budget.html
          grep -Fq '<p>Maja</p>' budget/budget_maja.html
          grep -Fq '<p>Markus</p>' budget/analytics.html
          grep -Fq '<p>Maja</p>' budget/analytics_maja.html

          grep -Fq -- '--accent: #FB923C;' budget/familjebudget.html
          grep -Fq -- '--accent-bg: #1F1008;' budget/familjebudget.html
          grep -Fq 'background: rgba(251,146,60,0.09)' budget/familjebudget.html
          grep -Fq 'loan: dark ? "#FB923C" : "#F97316"' budget/familjebudget.html
          grep -Fq 'house: dark ? "#FBBF24" : "#F59E0B"' budget/familjebudget.html
          grep -Fq 'savings: dark ? "#FDBA74" : "#FB923C"' budget/familjebudget.html

          python3 - <<'PY'
          from pathlib import Path
          for name in ['analytics.html','analytics_maja.html']:
              s = Path('budget', name).read_text()
              assert s.index('savingsCategoryChart') < s.index('id="goals-container"'), name
              assert s.count('id="goals-container"') == 1, name
          PY

          for f in budget/budget.html budget/budget_maja.html budget/analytics.html budget/analytics_maja.html budget/familjebudget.html; do
            grep -Fq 'finance-ui.js?v=20260831-finance-theme-blue-v11-person-first-paint' "$f"
          done

          git diff --quiet -- budget/firebase-sync.js budget/indexeddb-fallback.js budget/budget-persistence-guard.js
          git diff --quiet -- budget/nav-menu-motion.js

          changed="$(git diff --name-only)"
          echo "$changed"
          while IFS= read -r f; do
            case "$f" in
              budget/finance-ui.js|budget/budget.html|budget/budget_maja.html|budget/analytics.html|budget/analytics_maja.html|budget/familjebudget.html) ;;
              '') ;;
              *) echo "Unexpected changed file: $f" >&2; exit 1 ;;
            esac
          done <<< "$changed"

      - name: Commit finance polish
        shell: bash
        run: |
          git config user.name "strickertmarkus"
          git config user.email "markus.strickert@sigmatechnology.com"
          git add budget/finance-ui.js budget/budget.html budget/budget_maja.html budget/analytics.html budget/analytics_maja.html budget/familjebudget.html
          git commit -m "Polish person morph and family analysis layout"
          git push
