name: Load exercise timer v151
on:
  push:
    paths:
      - '.github/workflows/load-exercise-timer-v151.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Load native-resolution focus timer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          version = '20260914-timer-focus-v151-native'

          p = Path('budget/exercise.html')
          s = p.read_text()
          s = s.replace('auth-config.js?v=20260914-timer-focus-v150-stable-scale', f'auth-config.js?v={version}')
          s = s.replace('auth-gate.js?v=20260914-timer-focus-v150-stable-scale', f'auth-gate.js?v={version}')
          s = s.replace('exercise-timer-focus-v146.js?v=20260914-timer-focus-v150-stable-scale', f'exercise-timer-focus-v146.js?v={version}')
          s = s.replace('exercise-timer-focus-v147.js?v=20260914-timer-focus-v150-stable-scale', f'exercise-timer-focus-v147.js?v={version}')
          s = s.replace('exercise-timer-focus-v148.js?v=20260914-timer-focus-v150-stable-scale', f'exercise-timer-focus-v148.js?v={version}')
          s = s.replace('  <script defer src="exercise-timer-focus-v150.js?v=20260914-timer-focus-v150-stable-scale"></script>\n', '')
          marker = f'  <script defer src="exercise-timer-focus-v148.js?v={version}"></script>\n'
          if 'exercise-timer-focus-v151.js' not in s:
              if marker not in s:
                  raise SystemExit('v148 loader marker not found in exercise.html')
              s = s.replace(marker, marker + f'  <script defer src="exercise-timer-focus-v151.js?v={version}"></script>\n')
          p.write_text(s)

          for filename, oldvar in [('budget/auth-config.js','exerciseFastVersion'),('budget/auth-gate.js','exerciseAssetsVersion')]:
              p = Path(filename)
              s = p.read_text()
              import re
              s2, n = re.subn(rf"var {oldvar} = '[^']+';", f"var {oldvar} = '{version}';", s, count=1)
              if n != 1:
                  raise SystemExit(f'could not update {oldvar} in {filename}')
              p.write_text(s2)
          PY

          node --check budget/exercise-timer-focus-v151.js
          grep -q 'exercise-timer-focus-v151.js?v=20260914-timer-focus-v151-native' budget/exercise.html
          if grep -q 'exercise-timer-focus-v150.js' budget/exercise.html; then
            echo 'v150 still loaded from exercise.html' >&2
            exit 1
          fi
      - name: Commit loader and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/load-exercise-timer-v151.yml
          git add budget/exercise.html budget/auth-config.js budget/auth-gate.js .github/workflows/load-exercise-timer-v151.yml
          git commit -m 'Render cardio focus timer at native resolution'
          git push
