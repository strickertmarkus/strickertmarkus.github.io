name: Apply calendar push v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-calendar-push-v1.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply calendar push integration
        run: python3 .github/scripts/apply_calendar_push_v1.py

      - name: Verify JavaScript and scoped changes
        shell: bash
        run: |
          node --check budget/push-notifications.js
          node --check budget/firebase-messaging-sw.js
          node --check budget/push-worker.mjs
          grep -Fq 'firebase-messaging-compat.js' budget/home.html
          grep -Fq 'manifest.webmanifest?v=20260831-push-v1' budget/home.html
          grep -Fq 'push-notifications.js?v=20260831-push-v1' budget/home.html
          grep -Fq 'reminderMinutes:' budget/home.html
          grep -Fq 'reminderMinutes:' budget/calendar.html
          git diff --quiet -- budget/firebase-sync.js budget/indexeddb-fallback.js budget/budget-persistence-guard.js budget/finance-ui.js
          changed="$(git diff --name-only)"
          echo "$changed"
          test "$changed" = $'budget/calendar.html\nbudget/home.html'

      - name: Commit calendar push integration
        shell: bash
        run: |
          git config user.name "strickertmarkus"
          git config user.email "markus.strickert@sigmatechnology.com"
          git add budget/home.html budget/calendar.html
          git commit -m "Connect calendar events to push reminders"
          git push
