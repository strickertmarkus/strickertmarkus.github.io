name: Training CP7 symbol-only cyan refinement

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refine-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply symbol-only cyan hierarchy
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, got {count}")
              return text.replace(old, new, 1)

          obs_path = Path('budget/pulse-observatory/observatory.css')
          obs = obs_path.read_text()
          obs = replace_once(obs,
            '--obs-pending-accent:#9b7b8a;--obs-pending-border:#c59aaa24;--obs-pending-fill:#b8869a0b;--obs-pending-glow:0 0 0 transparent;--obs-pending-decoration:.38;\n --obs-current-accent:#9be4e9;--obs-current-border:#8adfe76b;--obs-current-fill:#67dce914;--obs-current-glow:0 0 12px #56d9e532;--obs-current-decoration:.82;',
            '--obs-pending-accent:#c59aaa;--obs-pending-border:#c59aaa2e;--obs-pending-fill:#b8869a0c;--obs-pending-glow:0 0 0 transparent;--obs-pending-decoration:.5;\n --obs-current-accent:#ffb8cb;--obs-current-border:#ffa1bb65;--obs-current-fill:#ff769912;--obs-current-glow:0 0 12px #ff5c8830;--obs-current-decoration:.9;',
            'pink state tokens')
          obs = replace_once(obs, 'color:#ffd1dc;flex:0 0 28px', 'color:#9be4e9;flex:0 0 28px', 'header star cyan')
          obs = replace_once(obs,
            '@keyframes observatoryHeartbeat{0%,18%,100%{transform:translateY(0) scale(1) rotate(0deg);opacity:.72;filter:drop-shadow(0 0 4px #ff70985a)}3%{transform:translateY(-.2px) scale(1.16) rotate(-.6deg);opacity:1;filter:drop-shadow(0 0 5px #ffd0dd) drop-shadow(0 0 15px #ff4d8199)}6%{transform:translateY(.1px) scale(.98) rotate(.3deg);opacity:.82;filter:drop-shadow(0 0 4px #ff709866)}9%{transform:translateY(-.1px) scale(1.085) rotate(.4deg);opacity:.98;filter:drop-shadow(0 0 5px #ffd0dc) drop-shadow(0 0 11px #ff5c8985)}13%{transform:translateY(0) scale(1) rotate(0deg);opacity:.74;filter:drop-shadow(0 0 4px #ff70985a)}32%{transform:translateY(-.35px) scale(1.008) rotate(.25deg);opacity:.77;filter:drop-shadow(0 0 5px #ff7d9d61)}50%{transform:translateY(.2px) scale(.998) rotate(-.2deg);opacity:.70;filter:drop-shadow(0 0 3.5px #ff709850)}68%{transform:translateY(-.25px) scale(1.006) rotate(.18deg);opacity:.76;filter:drop-shadow(0 0 4.5px #ff78995c)}86%{transform:translateY(.1px) scale(1) rotate(-.12deg);opacity:.71;filter:drop-shadow(0 0 3.5px #ff709852)}}',
            '@keyframes observatoryHeartbeat{0%,18%,100%{transform:translateY(0) scale(1) rotate(0deg);opacity:.72;filter:drop-shadow(0 0 4px #56d9e55a)}3%{transform:translateY(-.2px) scale(1.16) rotate(-.6deg);opacity:1;filter:drop-shadow(0 0 5px #c8f7fa) drop-shadow(0 0 15px #56d9e599)}6%{transform:translateY(.1px) scale(.98) rotate(.3deg);opacity:.82;filter:drop-shadow(0 0 4px #56d9e566)}9%{transform:translateY(-.1px) scale(1.085) rotate(.4deg);opacity:.98;filter:drop-shadow(0 0 5px #d5fbfd) drop-shadow(0 0 11px #56d9e585)}13%{transform:translateY(0) scale(1) rotate(0deg);opacity:.74;filter:drop-shadow(0 0 4px #56d9e55a)}32%{transform:translateY(-.35px) scale(1.008) rotate(.25deg);opacity:.77;filter:drop-shadow(0 0 5px #67e0e861)}50%{transform:translateY(.2px) scale(.998) rotate(-.2deg);opacity:.70;filter:drop-shadow(0 0 3.5px #56d9e550)}68%{transform:translateY(-.25px) scale(1.006) rotate(.18deg);opacity:.76;filter:drop-shadow(0 0 4.5px #67e0e85c)}86%{transform:translateY(.1px) scale(1) rotate(-.12deg);opacity:.71;filter:drop-shadow(0 0 3.5px #56d9e552)}}',
            'header heartbeat cyan')
          obs = replace_once(obs, '#pulse-home .observatory-kicker>.observatory-star-glyph{width:27px;height:27px;color:#ffd1dc;filter:drop-shadow(0 0 8px #ff628e66)}', '#pulse-home .observatory-kicker>.observatory-star-glyph{width:27px;height:27px;color:#9be4e9;filter:drop-shadow(0 0 8px #56d9e566)}', 'kicker star cyan')
          obs = replace_once(obs, '#pulse-home .observatory-next-cue .observatory-star-glyph{width:25px;height:25px;filter:drop-shadow(0 0 8px #ff699066)}', '#pulse-home .observatory-next-cue .observatory-star-glyph{width:25px;height:25px;color:#9be4e9;filter:drop-shadow(0 0 8px #56d9e566)}', 'next cue star cyan')
          obs = replace_once(obs, '#pulse-home .observatory-kicker{display:flex;align-items:center;gap:13px;font-size:10px;letter-spacing:2.6px;color:#c49eae}', '#pulse-home .observatory-kicker{display:flex;align-items:center;gap:13px;font-size:10px;letter-spacing:2.6px;color:#c49eae}\nhtml[data-training-overview="observatory"] .training-overview-option[data-overview-mode="observatory"] .training-overview-option-icon{color:#9be4e9;text-shadow:0 0 18px #56d9e56e}', 'mode switch symbol cyan')
          obs = replace_once(obs, 'filter:drop-shadow(0 0 4px #ff709852)!important', 'filter:drop-shadow(0 0 4px #56d9e552)!important', 'reduced motion cyan')
          obs_path.write_text(obs)

          env_css_path = Path('budget/pulse-environment/environment.css')
          env_css = env_css_path.read_text()
          env_css = replace_once(env_css,
            '#pulse-home .progress-bar{background:linear-gradient(90deg,var(--obs-state-fill,#ab3b67),var(--obs-state-accent,#ffb4cd))!important;box-shadow:var(--obs-state-glow,0 0 16px #ff6b9344)!important;border-radius:5px!important;opacity:var(--obs-state-decoration,1)}\n#pulse-home .progress-marker{background:var(--obs-state-accent,#ffe3ef)!important;border-color:var(--obs-state-border,#ffb4cd)!important;box-shadow:var(--obs-state-glow,0 0 10px #ff6c98)!important;opacity:var(--obs-state-decoration,1)}',
            '#pulse-home .progress-bar{background:linear-gradient(90deg,#a73761,#ffb4cd)!important;box-shadow:0 0 16px #ff6b9344!important;border-radius:5px!important}\n#pulse-home .progress-marker{background:#ffe3ef!important;border-color:#ffb4cd!important;box-shadow:0 0 10px #ff6c98!important}',
            'fixed pink goal progress')
          env_css = replace_once(env_css, "#pulse-home .record-group-toggle-v52>span:first-child::before{content:'✧';color:#ffc3de;text-shadow:0 0 13px #ff638d;margin-right:12px;font-size:20px}", "#pulse-home .record-group-toggle-v52>span:first-child::before{content:'✧';color:#9be4e9;text-shadow:0 0 13px #56d9e5;margin-right:12px;font-size:20px}", 'record symbol cyan')
          env_css_path.write_text(env_css)

          html_path = Path('budget/exercise.html')
          html = html_path.read_text()
          html = replace_once(html, 'pulse-environment/environment.css?v=20260915-main-cp7-state-1', 'pulse-environment/environment.css?v=20260915-main-cp7-symbol-cyan-1', 'environment css cache')
          html = replace_once(html, 'pulse-observatory/observatory.css?v=20260915-main-cp7-state-1', 'pulse-observatory/observatory.css?v=20260915-main-cp7-symbol-cyan-1', 'observatory css cache')
          html_path.write_text(html)

          test_path = Path('budget/tests/training-observatory-state.test.cjs')
          test = test_path.read_text()
          test = replace_once(test, "test('cyan current state is reserved for active context rather than partial progress', () => {", "test('current state is reserved for active context rather than partial progress', () => {", 'state test title')
          test = replace_once(test,
            "test('active and achieved states use bounded OLED-friendly glow tokens', () => {\n  assert.match(observatoryCss, /--obs-current-glow:0 0 12px/);\n  assert.match(observatoryCss, /--obs-completed-glow:0 0 14px/);\n  assert.match(observatoryCss, /--obs-achieved-glow:0 0 18px/);\n});",
            "test('active and achieved states use bounded OLED-friendly glow tokens', () => {\n  assert.match(observatoryCss, /--obs-current-glow:0 0 12px/);\n  assert.match(observatoryCss, /--obs-completed-glow:0 0 14px/);\n  assert.match(observatoryCss, /--obs-achieved-glow:0 0 18px/);\n});\n\ntest('cyan is reserved for Observatory identity symbols while semantic data states stay pink', () => {\n  assert.match(observatoryCss, /--obs-current-accent:#ffb8cb/);\n  assert.doesNotMatch(observatoryCss, /--obs-current-accent:#9be4e9/);\n  assert.match(observatoryCss, /observatory-header-star\\{[^}]*color:#9be4e9/);\n  assert.match(observatoryCss, /observatory-kicker>\\.observatory-star-glyph\\{[^}]*color:#9be4e9/);\n  assert.match(observatoryCss, /observatory-next-cue \\.observatory-star-glyph\\{[^}]*color:#9be4e9/);\n  assert.match(observatoryCss, /data-overview-mode=\\\"observatory\\\"\\] \\.training-overview-option-icon\\{color:#9be4e9/);\n  assert.match(environmentCss, /record-group-toggle-v52>span:first-child::before\\{[^}]*color:#9be4e9/);\n});",
            'symbol cyan test')
          test = replace_once(test,
            "  assert.match(environmentCss, /progress-bar\\{[^}]*var\\(--obs-state-glow/);\n  assert.match(environmentCss, /progress-marker\\{[^}]*var\\(--obs-state-accent/);",
            "  assert.match(environmentCss, /progress-bar\\{[^}]*linear-gradient\\(90deg,#a73761,#ffb4cd\\)/);\n  assert.match(environmentCss, /progress-marker\\{[^}]*background:#ffe3ef/);\n  assert.doesNotMatch(environmentCss, /progress-bar\\{[^}]*var\\(--obs-state/);\n  assert.doesNotMatch(environmentCss, /progress-marker\\{[^}]*var\\(--obs-state/);",
            'goal progress assertions')
          test = replace_once(test, 'pulse-environment\\/environment\\.css\\?v=20260915-main-cp7-state-1', 'pulse-environment\\/environment\\.css\\?v=20260915-main-cp7-symbol-cyan-1', 'state env cache test')
          test = replace_once(test, 'pulse-observatory\\/observatory\\.css\\?v=20260915-main-cp7-state-1', 'pulse-observatory\\/observatory\\.css\\?v=20260915-main-cp7-symbol-cyan-1', 'state obs cache test')
          test_path.write_text(test)

          for rel in ['budget/tests/training-observatory-mobile.test.cjs','budget/tests/training-observatory-identity.test.cjs']:
              p = Path(rel)
              data = p.read_text()
              data = data.replace('pulse-environment\\/environment\\.css\\?v=20260915-main-cp7-state-1', 'pulse-environment\\/environment\\.css\\?v=20260915-main-cp7-symbol-cyan-1')
              data = data.replace('pulse-observatory\\/observatory\\.css\\?v=20260915-main-cp7-state-1', 'pulse-observatory\\/observatory\\.css\\?v=20260915-main-cp7-symbol-cyan-1')
              p.write_text(data)

          checklist_path = Path('budget/TRAINING-OBSERVATORY-MIGRATION-CHECKLIST.md')
          checklist = checklist_path.read_text()
          old = 'Visual refinement: `current`/cyan is reserved for active context (selected/today day and the planned Next Workout action). Partial goal/week progress stays `pending` until achieved, while accumulated completed activity uses `completed`; this keeps cyan intentional instead of appearing across unrelated progress values.'
          new = 'Visual refinement: semantic `current` remains reserved for active context, but cyan is no longer a data/status hue. Pending/current/completed/achieved data stay within the Observatory pink hierarchy; cyan is reserved for Observatory identity glyphs such as the header/kicker star, the Next Workout star and the Observatory mode symbol. Goal progress bars keep their pink Observatory color independently of semantic state so partial progress does not read as disabled/grey.'
          checklist = replace_once(checklist, old, new, 'CP7 visual refinement note')
          checklist_path.write_text(checklist)
          PY
      - name: Syntax and training regression tests
        run: |
          node --check budget/pulse-environment/environment.js
          node --test budget/tests/training-*.test.cjs
          git diff --check
      - name: Verify symbol-only cyan ownership
        run: |
          grep -F -- '--obs-current-accent:#ffb8cb' budget/pulse-observatory/observatory.css
          grep -F 'color:#9be4e9' budget/pulse-observatory/observatory.css
          grep -F 'linear-gradient(90deg,#a73761,#ffb4cd)' budget/pulse-environment/environment.css
          ! grep -F 'progress-bar{background:linear-gradient(90deg,var(--obs-state' budget/pulse-environment/environment.css
          grep -F 'cp7-symbol-cyan-1' budget/exercise.html
      - name: Commit refinement and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/training-cp7-symbol-cyan.yml
          git add budget/pulse-observatory/observatory.css budget/pulse-environment/environment.css budget/exercise.html budget/tests/training-observatory-state.test.cjs budget/tests/training-observatory-mobile.test.cjs budget/tests/training-observatory-identity.test.cjs budget/TRAINING-OBSERVATORY-MIGRATION-CHECKLIST.md
          git commit -m "Reserve Observatory cyan for identity symbols"
          git push origin HEAD:main
