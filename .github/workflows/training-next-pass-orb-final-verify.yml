name: Training Observatory next-pass final verification

on:
  push:
    branches:
      - checkpoint/training-observatory-next-pass-orb-validated-work

permissions:
  contents: write

jobs:
  verify-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: checkpoint/training-observatory-next-pass-orb-validated-work
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax checks
        run: |
          node --check budget/pulse-environment/environment.js
          node --check budget/training-overview-mode.js
      - name: Run training regression suite
        run: node --test budget/tests/training-*.test.cjs
      - name: Verify action ownership and diff hygiene
        run: |
          test "$(grep -o 'id="reactor-start"' budget/exercise.html | wc -l)" -eq 1
          test "$(grep -o 'id="reactor-build"' budget/exercise.html | wc -l)" -eq 1
          ! grep -q 'id="reactor-configure"' budget/exercise.html
          ! grep -q 'reactor-configure' budget/pulse-environment/environment.js
          ! grep -q 'observatory-action' budget/exercise.html
          ! grep -q 'observatory-action' budget/pulse-observatory/observatory.css
          git diff --check HEAD~1 HEAD
      - name: Remove temporary verification workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/training-next-pass-orb-final-verify.yml
          git commit -m 'Remove temporary Observatory verification workflow'
          git push origin HEAD:checkpoint/training-observatory-next-pass-orb-validated-work
