name: Training CP9 verification

on:
  push:
    paths:
      - 'budget/exercise.html'
      - 'budget/pulse-environment/**'
      - 'budget/pulse-observatory/**'
      - 'budget/training-*.js'
      - 'budget/training-*.css'
      - 'budget/tests/training-*.test.cjs'
      - '.github/workflows/training-cp9-verification.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check canonical JavaScript syntax
        run: |
          node --check budget/pulse-environment/environment.js
          node --check budget/training-overview-mode.js
          node --check budget/training-week-orbit.js
          node --check budget/training-zen-nav.js
          node --check budget/tests/training-shared-session.test.cjs
      - name: Run training regression tests
        run: node --test budget/tests/training-*.test.cjs
