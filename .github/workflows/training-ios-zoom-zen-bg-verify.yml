name: Training iOS zoom and Zen canvas verification

on:
  push:
    branches: [main, work/observatory-polish-20260919, feature/training-only-accounts-20260920]
    paths:
      - '.github/workflows/training-ios-zoom-zen-bg-verify.yml'
      - 'budget/training-zen-nav.css'
      - 'budget/training-zen-nav.js'
      - 'budget/auth-config.js'
      - 'budget/auth-gate.js'
      - 'budget/pulse-environment/environment.css'
      - 'budget/exercise.html'
      - 'budget/exercise-dashboard.js'
      - 'budget/pulse-observatory/observatory.css'
      - 'budget/training-week-orbit.css'
      - 'budget/zen.html'
      - 'budget/tests/**'
      - 'budget/zen.css'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Static Training and Zen regression
        run: |
          node --test budget/tests/navigation-symbols.test.cjs budget/tests/training-*.test.cjs budget/tests/zen*.test.cjs
          node --check budget/training-zen-nav.js
          node --check budget/auth-config.js
          node --check budget/auth-gate.js
          git diff --check HEAD^ HEAD

      - name: Install WebKit
        run: |
          npm install --no-save playwright chart.js@4.4.4
          npx playwright install --with-deps webkit

      - name: Serve repository
        run: |
          python3 -m http.server 4173 --directory . >/tmp/training-ios-http.log 2>&1 &
          sleep 2

      - name: Verify all four modes in iPhone-like WebKit
        run: |
          cat > /tmp/training-ios-e2e.cjs <<'EOF'
          const {webkit}=require(process.cwd()+'/node_modules/playwright');
          const assert=require('node:assert/strict');

          const firebaseStub=`(function(){
            if(window.firebase)return;
            function snap(v){return{exists:()=>v!=null,val:()=>v==null?null:v}}
            function ref(path){return{
              set:()=>Promise.resolve(),update:()=>Promise.resolve(),remove:()=>Promise.resolve(),
              get:()=>Promise.resolve(snap(String(path||'').startsWith('app_roles/')?'family':null)),once:()=>Promise.resolve(snap(null)),
              on:(e,cb)=>{if(cb)setTimeout(()=>cb(snap(null)),0);return cb},off:()=>{},
              child:n=>ref(String(path||'')+'/'+n)
            }}
            var db={ref};function database(){return db}database.ServerValue={TIMESTAMP:Date.now()};
            var authObj={currentUser:{uid:'ios-zoom-test'},setPersistence:()=>Promise.resolve(),
              onAuthStateChanged:function(cb){setTimeout(()=>cb(this.currentUser),0);return()=>{}},
              signInWithEmailAndPassword:function(){return Promise.resolve({user:this.currentUser})},
              createUserWithEmailAndPassword:function(){return Promise.resolve({user:this.currentUser})},
              signOut:()=>Promise.resolve()};
            function auth(){return authObj}auth.Auth={Persistence:{LOCAL:'local'}};
            window.firebase={apps:[{}],initializeApp:()=>({}),app:()=>({}),auth,database};
          })();`;
          const chartSource=require('node:fs').readFileSync(process.cwd()+'/node_modules/chart.js/dist/chart.umd.js','utf8');

          async function route(page){
            await page.route('https://www.gstatic.com/firebasejs/**',r=>r.fulfill({status:200,contentType:'application/javascript',body:firebaseStub}));
            await page.route('**/firebase-sync.js*',r=>r.fulfill({status:200,contentType:'application/javascript',body:'window.__iosZoomSyncStub=true;'}));
            await page.route('https://cdn.jsdelivr.net/npm/chart.js**',r=>r.fulfill({status:200,contentType:'application/javascript',body:chartSource}));
            await page.route('https://fonts.googleapis.com/**',r=>r.fulfill({status:200,contentType:'text/css',body:''}));
            await page.route('https://fonts.gstatic.com/**',r=>r.abort());
          }

          async function editableAudit(page,label){
            const result=await page.evaluate(()=>{
              const excluded=new Set(['hidden','checkbox','radio','range','color','file','button','submit','reset','image']);
              const nodes=[...document.querySelectorAll('input,select,textarea,[contenteditable]:not([contenteditable="false"])')].filter(el=>{
                if(document.documentElement.dataset.wellnessMode==='zen'&&!el.closest('#wellness-zen-surface'))return false;
                if(el.tagName==='INPUT'&&excluded.has((el.type||'text').toLowerCase()))return false;
                return true;
              });
              return {
                total:nodes.length,
                state:{mode:document.documentElement.dataset.trainingOverview,wellness:document.documentElement.dataset.wellnessMode,envDisabled:document.getElementById('training-observatory-environment').disabled,coarse:matchMedia('(pointer:coarse)').matches},
                bad:nodes.map(el=>({
                  tag:el.tagName.toLowerCase(),
                  id:el.id||'',
                  cls:typeof el.className==='string'?el.className:'',
                  type:el.type||'',
                  font:parseFloat(getComputedStyle(el).fontSize)||0
                })).filter(x=>x.font<15.99)
              };
            });
            assert.ok(result.total>0,label+' contained no editable controls to audit');
            assert.deepEqual(result.bad,[],label+' has editable controls below 16px: '+JSON.stringify(result));
          }

          async function canvasAudit(page,label,expected){
            const colors=await page.evaluate(()=>({
              html:getComputedStyle(document.documentElement).backgroundColor,
              body:getComputedStyle(document.body).backgroundColor,
              inline:document.documentElement.style.backgroundColor,
              mode:document.documentElement.dataset.wellnessMode,
              kind:document.body.dataset.kind
            }));
            assert.equal(colors.mode,'zen',label+' did not enter Zen mode');
            assert.equal(colors.kind,label.toLowerCase(),label+' body kind mismatch');
            assert.equal(colors.body,expected,label+' body canvas regressed');
            assert.equal(colors.html,expected,label+' root canvas regressed');
          }

          (async()=>{
            const browser=await webkit.launch();
            const context=await browser.newContext({
              viewport:{width:390,height:844},isMobile:true,hasTouch:true,
              userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1'
            });
            const page=await context.newPage(),errors=[];
            page.on('pageerror',e=>errors.push('pageerror: '+e.message));
            page.on('console',m=>{if(m.type()==='error')errors.push('console: '+m.text())});
            await route(page);
            await page.addInitScript(()=>{
              localStorage.setItem('ex_wk','[]');
              localStorage.setItem('ex_plannedSessions','{}');
              localStorage.setItem('ex_templates','[]');
              localStorage.setItem('ex_goals',JSON.stringify({weeklyWk:4,runDistanceGoal:10,vo2Goal:45}));
            });

            await page.goto('http://127.0.0.1:4173/budget/exercise.html',{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>window.__exerciseLoaderMetricsV2&&window.__exerciseLoaderMetricsV2.bundleReadyAt&&typeof window.setTrainingOverviewMode==='function'&&typeof window.setWellnessMode==='function',null,{timeout:20000});
            await page.waitForTimeout(700);

            require('node:fs').mkdirSync('test-results/observatory',{recursive:true});
            async function shot(name){
              const file='test-results/observatory/'+name+'.png';
              if(name.includes('builder')){
                await page.waitForFunction(()=>!document.documentElement.dataset.exerciseMorph);
                await page.waitForFunction(()=>document.querySelector('#day-workout-modal .modal').getAnimations().every(a=>a.playState==='finished'||a.playState==='idle'));
                const modalStyle=await page.locator('#day-workout-modal .modal').evaluate(n=>({opacity:getComputedStyle(n).opacity,filter:getComputedStyle(n).filter}));
                assert.ok(Number(modalStyle.opacity)>.99,'builder remains transparent: '+JSON.stringify(modalStyle));
                await page.screenshot({path:file});
                return;
              }
              if(name==='orbit-mobile'){
                await page.locator('#pulse-week').scrollIntoViewIfNeeded();
                await page.waitForTimeout(600);
                await page.locator('#pulse-week').screenshot({path:file});
                return;
              }
              if(name==='expanded-log-mobile'){
                await page.locator('#pulse-log').scrollIntoViewIfNeeded();
                await page.waitForTimeout(600);
                await page.screenshot({path:file});
                return;
              }
              if(name==='chart-touch-mobile'){
                await page.screenshot({path:file});
                return;
              }
              // Reveal scroll-triggered content using the actual page interaction.
              for(const selector of ['#pulse-week','.observatory-metrics','#pulse-goals','#pulse-progress','#pulse-records','#pulse-log']){
                await page.locator(selector).scrollIntoViewIfNeeded();
                await page.waitForTimeout(600);
              }
              await page.evaluate(()=>window.scrollTo({top:0,behavior:'instant'}));
              await page.screenshot({path:file,fullPage:true});
            }
            async function overviewAudit(label){
              const result=await page.evaluate(()=>{
                const main=document.querySelector('#pulse-home');
                const orb=document.querySelector('#reactor-start');
                const week=document.querySelector('#pulse-week');
                const metrics=document.querySelector('.observatory-metrics');
                const header=document.querySelector('#pulse-header');
                const columns=getComputedStyle(document.querySelector('.observatory-metrics .stats-row')).gridTemplateColumns.split(' ').length;
                return {width:innerWidth,scroll:document.documentElement.scrollWidth,
                  mainLeft:main.getBoundingClientRect().left,headerLeft:header.getBoundingClientRect().left,navLeft:document.querySelector('.wellness-kind-switch').getBoundingClientRect().left,
                  orbFont:parseFloat(getComputedStyle(orb.querySelector('.observatory-next-orb-label')).fontSize),
                  columns,weekTop:week.getBoundingClientRect().top,metricsTop:metrics.getBoundingClientRect().top,
                  badText:[...document.querySelectorAll('.observatory-metrics .stat-label,.observatory-metrics .stat-sub')].some(n=>parseFloat(getComputedStyle(n).fontSize)<12)};
              });
              assert.ok(result.scroll<=result.width+1,label+' page overflows: '+JSON.stringify(result));
              assert.ok(Math.abs(result.mainLeft-result.headerLeft)<1,label+' gutters differ');
              assert.ok(Math.abs(result.mainLeft-result.navLeft)<1,label+' navigation gutter differs');
              assert.ok(result.orbFont>=14,label+' orb label is too small');
              assert.equal(result.badText,false,label+' metrics text is too small');
              if(result.width<=760){assert.equal(result.columns,2);assert.ok(result.weekTop<result.metricsTop,label+' week must precede metrics')}
            }
            for(const width of [320,390,1440]){
              await page.setViewportSize({width,height:width>760?1000:844});
              await page.waitForTimeout(350);
              await overviewAudit('empty '+width);
              await shot('empty-'+width);
            }
            await page.setViewportSize({width:390,height:844});
            await page.locator('#reactor-start').click();
            assert.equal(await page.locator('#reactor-start-notice').isVisible(),true);
            assert.equal(await page.locator('#session-modal').evaluate(n=>n.classList.contains('show')),false);
            await page.locator('#reactor-build').click();
            await page.waitForSelector('#day-workout-modal.show');
            await shot('builder-mobile');
            await page.locator('#day-workout-modal .modal-close').click();

            await page.evaluate(()=>{
              const date=todayISO();
              const strength={kind:'strength',name:'Knäböj med kontrollerad excentrisk fas',sets:3,reps:8,weight:60};
              const run={kind:'cardio',name:'Löpning',time:30,distance:5};
              savePlannedSessions({[date]:{type:'Helkropp med rörlighet och kontrollerat tempo',exercises:[strength,run]}});
              saveWorkouts([
                {id:101,date:shiftISODate(date,-2),type:'Kondition',duration:30,hrAvg:145,hrMin:95,hrMax:170,vo2:48,exercises:[run]},
                {id:102,date,type:'Helkropp',duration:45,hrAvg:125,hrMin:80,hrMax:150,vo2:49,exercises:[strength]}
              ]);
              refreshAll();
            });
            await page.waitForFunction(()=>document.querySelector('#reactor-start').dataset.planState==='planned');
            assert.equal(await page.locator('#reactor-action').textContent(),'Redigera pass');
            assert.equal(await page.locator('#week-grid .today').getAttribute('aria-current'),'date');
            assert.equal(await page.locator('#week-grid .today.done .wd-status').isVisible(),true);
            for(const width of [320,390,1440]){
              await page.setViewportSize({width,height:width>760?1000:844});
              await page.waitForTimeout(500);
              await overviewAudit('populated '+width);
              await shot('populated-'+width);
            }
            await page.setViewportSize({width:390,height:844});
            await page.locator('[data-week-orbit-toggle]').click();
            await page.waitForFunction(()=>document.querySelector('#pulse-week').dataset.weekOrbitState==='expanded',null,{timeout:5000});
            assert.equal(await page.locator('[data-week-orbit-toggle]').getAttribute('aria-expanded'),'true');
            await shot('orbit-mobile');
            await page.locator('[data-week-orbit-toggle]').click();
            await page.waitForFunction(()=>!document.querySelector('#week-grid').classList.contains('week-orbit-layout'),null,{timeout:5000});
            assert.equal(await page.locator('#week-grid').evaluate(n=>n.classList.contains('week-orbit-layout')),false);
            await page.locator('#reactor-build').click();
            await page.waitForSelector('#day-workout-modal.show');
            await shot('planned-builder-mobile');
            await page.locator('#day-workout-modal .modal-close').click();
            await page.locator('#log-body .log-main-row').first().click();
            await page.waitForTimeout(400);
            await shot('expanded-log-mobile');
            const charts=await page.evaluate(()=>['chart-sessions','chart-bw','chart-hr-combined'].map(id=>{
              const chart=Chart.getChart(document.getElementById(id));
              return {id,color:chart.data.datasets[0].borderColor,touch:chart.options.events.includes('touchstart')};
            }));
            assert.deepEqual(charts.map(c=>c.color),['#70aaff','#65d7a5','#ef646f']);
            assert.ok(charts.every(c=>c.touch));
            await page.locator('#chart-sessions').tap();
            await shot('chart-touch-mobile');
            await page.emulateMedia({reducedMotion:'reduce'});
            await page.locator('[data-week-orbit-toggle]').click();
            assert.equal(await page.locator('[data-week-orbit-toggle]').getAttribute('aria-expanded'),'true');
            await page.locator('[data-week-orbit-toggle]').click();
            await page.emulateMedia({reducedMotion:'no-preference'});

            assert.equal(await page.getAttribute('html','data-training-overview'),'observatory');
            await editableAudit(page,'Pulse / Observatory');

            await page.evaluate(()=>window.setTrainingOverviewMode('compact'));
            await page.waitForFunction(()=>document.documentElement.dataset.trainingOverview==='compact');
            await page.waitForTimeout(320);
            await editableAudit(page,'Compact');

            await page.evaluate(async()=>{await window.setWellnessMode('stretch')});
            await page.waitForFunction(()=>document.documentElement.dataset.wellnessMode==='zen'&&document.body.dataset.kind==='stretch');
            await page.waitForTimeout(400);
            await editableAudit(page,'Stretch');
            await canvasAudit(page,'Stretch','rgb(9, 29, 24)');

            await page.evaluate(async()=>{await window.setWellnessMode('meditation')});
            await page.waitForFunction(()=>document.body.dataset.kind==='meditation');
            await page.waitForTimeout(300);
            await editableAudit(page,'Meditation');
            await canvasAudit(page,'Meditation','rgb(167, 195, 189)');

            await page.setViewportSize({width:320,height:700});
            await editableAudit(page,'Meditation 320px');
            await canvasAudit(page,'Meditation','rgb(167, 195, 189)');
            await page.evaluate(async()=>{await window.setWellnessMode('stretch')});
            await page.waitForFunction(()=>document.body.dataset.kind==='stretch');
            await editableAudit(page,'Stretch 320px');
            await canvasAudit(page,'Stretch','rgb(9, 29, 24)');

            await page.setViewportSize({width:375,height:812});
            await page.evaluate(async()=>{await window.setWellnessMode('training')});
            await page.waitForFunction(()=>document.documentElement.dataset.wellnessMode==='training');
            await page.evaluate(()=>window.setTrainingOverviewMode('observatory'));
            await page.waitForFunction(()=>document.documentElement.dataset.trainingOverview==='observatory');
            await page.waitForTimeout(320);
            await editableAudit(page,'Pulse / Observatory 375px');
            await page.evaluate(()=>window.setTrainingOverviewMode('compact'));
            await page.waitForFunction(()=>document.documentElement.dataset.trainingOverview==='compact');
            await page.waitForTimeout(320);
            await editableAudit(page,'Compact 375px');

            assert.deepEqual(errors,[],'browser errors: '+errors.join(' | '));
            await browser.close();
            console.log('All-mode iOS focus and Zen canvas WebKit verification passed');
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node /tmp/training-ios-e2e.cjs

      - name: Save Observatory visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observatory-visual-review
          path: test-results/observatory/
          if-no-files-found: warn
