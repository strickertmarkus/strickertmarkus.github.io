name: Restore event modal
on:
  push:
    branches: [main]
    paths: ['.github/workflows/restore-event-modal.yml']
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh calendar UI cache keys
        run: |
          sed -i "s/var calendarAssetsVersion = '20260901-creation-push-v1';/var calendarAssetsVersion = '20260902-event-modal-restore-v1';/" budget/auth-gate.js
          sed -i -E 's#auth-gate\.js\?v=[^\"]+#auth-gate.js?v=20260902-event-modal-restore-v1#' budget/home.html budget/calendar.html
          grep -q 'event-end-toggle-v2' budget/calendar-ui-v2.js
          grep -q '20260902-event-modal-restore-v1' budget/home.html
          git diff --check
      - name: Commit
        run: |
          git config user.name strickertmarkus
          git config user.email markus.strickert@sigmatechnology.com
          git add budget/auth-gate.js budget/home.html budget/calendar.html
          git commit -m 'Restore calendar event end-date toggle'
          git push origin main
