name: Roll back exercise v149
on:
  push:
    paths:
      - '.github/workflows/rollback-exercise-v149.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove v149 and restore v148 cache path
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          version_old='20260914-timer-focus-v149b-stable'
          version_new='20260914-timer-focus-v148-rollback1'
          for p in [Path('budget/exercise.html'), Path('budget/auth-config.js'), Path('budget/auth-gate.js')]:
              s=p.read_text()
              s=s.replace(version_old, version_new)
              if p.name == 'exercise.html':
                  lines=[ln for ln in s.splitlines() if 'exercise-timer-focus-v149.js' not in ln]
                  s='\n'.join(lines)+'\n'
              p.write_text(s)
          PY
          node --check budget/auth-config.js
          node --check budget/auth-gate.js
          grep -q 'exercise-timer-focus-v148.js?v=20260914-timer-focus-v148-rollback1' budget/exercise.html
          ! grep -q 'exercise-timer-focus-v149.js' budget/exercise.html
      - name: Commit rollback and remove workflow
        shell: bash
        run: |
          rm .github/workflows/rollback-exercise-v149.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add budget/exercise.html budget/auth-config.js budget/auth-gate.js .github/workflows/rollback-exercise-v149.yml
          git commit -m 'Roll back unstable live cardio timer'
          git push origin HEAD:main
