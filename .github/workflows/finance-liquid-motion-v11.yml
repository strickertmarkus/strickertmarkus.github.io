name: Finance liquid motion v11

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finance-liquid-motion-v11.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refine finance page motion
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          ui = Path('budget/finance-ui.js')
          s = ui.read_text()

          mark_pattern = r"  function markTransition\(nextView, nextUser\) \{\n    try \{ sessionStorage\.setItem\(TRANSITION_KEY, JSON\.stringify\(\{ view: nextView, user: nextUser, at: Date\.now\(\) \}\)\); \} catch \(_\) \{\}\n  \}\n"
          mark_replacement = "  function transitionDirection(nextView) {\n    var order = { budget: 0, analysis: 1, family: 2 };\n    if (nextView === view) return 0;\n    return order[nextView] > order[view] ? 1 : -1;\n  }\n\n  function markTransition(nextView, nextUser) {\n    var direction = transitionDirection(nextView);\n    try { sessionStorage.setItem(TRANSITION_KEY, JSON.stringify({ view: nextView, user: nextUser, direction: direction, at: Date.now() })); } catch (_) {}\n    return direction;\n  }\n"
          s, n = re.subn(mark_pattern, lambda m: mark_replacement, s, count=1)
          if n != 1:
              raise SystemExit('markTransition block not found')

          nav_pattern = r"  function navigate\(nextView, nextUser\) \{\n    var href = route\(nextView, nextUser\);\n    if \(location\.pathname\.toLowerCase\(\)\.endsWith\('/' \+ href\.toLowerCase\(\)\)\) return;\n    flushBudget\(\);\n    markTransition\(nextView, nextUser\);\n    location\.assign\(href\);\n  \}\n"
          nav_replacement = "  var financeNavigating = false;\n\n  function navigate(nextView, nextUser) {\n    var href = route(nextView, nextUser);\n    if (location.pathname.toLowerCase().endsWith('/' + href.toLowerCase()) || financeNavigating) return;\n    financeNavigating = true;\n    flushBudget();\n    var direction = markTransition(nextView, nextUser);\n    var container = document.querySelector('.container');\n    var reduceMotion = false;\n    try { reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (_) {}\n    if (!container || reduceMotion) {\n      location.assign(href);\n      return;\n    }\n    container.style.setProperty('--finance-exit-x', direction > 0 ? '-5px' : (direction < 0 ? '5px' : '0px'));\n    container.classList.add('finance-departing-clean-v1');\n    setTimeout(function () { location.assign(href); }, 145);\n  }\n"
          s, n = re.subn(nav_pattern, lambda m: nav_replacement, s, count=1)
          if n != 1:
              raise SystemExit('navigate block not found')

          css_start = s.find("      '.container.finance-arrival-clean-v1>*{")
          css_end = s.find("      '@keyframes financeMonthMenuInCleanV1", css_start)
          if css_start < 0 or css_end < 0:
              raise SystemExit('old finance arrival CSS block not found')
          new_css = "      '.container.finance-departing-clean-v1{transform-origin:center top;pointer-events:none;animation:financeDepartCleanV1 .14s cubic-bezier(.32,.72,0,1) both;will-change:transform,filter}' +\n      '.container.finance-arrival-clean-v1{transform-origin:center top;animation:financeArrivalCleanV1 .52s cubic-bezier(.22,.78,.2,1) both;will-change:transform,filter}' +\n      '@keyframes financeDepartCleanV1{0%{transform:translate3d(0,0,0) scale(1);filter:blur(0)}100%{transform:translate3d(var(--finance-exit-x,0px),1px,0) scale(.996);filter:blur(1.2px)}}' +\n      '@keyframes financeArrivalCleanV1{0%{transform:translate3d(var(--finance-enter-x,0px),4px,0) scale(.992);filter:blur(2.4px)}42%{filter:blur(.65px)}100%{transform:translate3d(0,0,0) scale(1);filter:blur(0)}}' +\n"
          s = s[:css_start] + new_css + s[css_end:]

          fn_start = s.find('  function animateArrival() {')
          fn_end = s.find('  function prefetch() {', fn_start)
          if fn_start < 0 or fn_end < 0:
              raise SystemExit('animateArrival function not found')
          new_arrival = "  function animateArrival() {\n    var fresh = false;\n    var direction = 0;\n    try {\n      var data = JSON.parse(sessionStorage.getItem(TRANSITION_KEY) || 'null');\n      fresh = !!(data && Date.now() - Number(data.at || 0) < 5000);\n      direction = fresh ? Number(data.direction || 0) : 0;\n      sessionStorage.removeItem(TRANSITION_KEY);\n    } catch (_) {}\n    if (!fresh) return;\n    var container = document.querySelector('.container');\n    if (!container) return;\n    container.style.setProperty('--finance-enter-x', direction > 0 ? '10px' : (direction < 0 ? '-10px' : '0px'));\n    requestAnimationFrame(function () {\n      container.classList.add('finance-arrival-clean-v1');\n      setTimeout(function () {\n        container.classList.remove('finance-arrival-clean-v1');\n        container.style.removeProperty('--finance-enter-x');\n      }, 620);\n    });\n  }\n\n"
          s = s[:fn_start] + new_arrival + s[fn_end:]

          old_reduce = "@media(prefers-reduced-motion:reduce){.container.finance-arrival-clean-v1>*{animation:none!important}}"
          new_reduce = "@media(prefers-reduced-motion:reduce){.container.finance-arrival-clean-v1,.container.finance-departing-clean-v1{animation:none!important;filter:none!important;transform:none!important}}"
          if old_reduce not in s:
              raise SystemExit('reduced motion rule not found')
          s = s.replace(old_reduce, new_reduce, 1)
          ui.write_text(s)

          pages = ['budget/budget.html','budget/budget_maja.html','budget/analytics.html','budget/analytics_maja.html','budget/familjebudget.html']
          for name in pages:
              p = Path(name)
              t = p.read_text()
              old = 'finance-ui.js?v=20260830-finance-clean-v10'
              new = 'finance-ui.js?v=20260830-finance-clean-v11'
              if old not in t:
                  raise SystemExit(f'{name}: v10 loader not found')
              p.write_text(t.replace(old, new, 1))
          PY

      - name: Verify JavaScript syntax
        run: node --check budget/finance-ui.js

      - name: Verify liquid motion scope
        shell: bash
        run: |
          grep -q "financeDepartCleanV1 .14s" budget/finance-ui.js
          grep -q "financeArrivalCleanV1 .52s" budget/finance-ui.js
          grep -q "blur(2.4px)" budget/finance-ui.js
          grep -q "finance-clean-v11" budget/budget.html
          grep -q "finance-clean-v11" budget/analytics.html
          grep -q "finance-clean-v11" budget/familjebudget.html
          if grep -q "scaleX(.985)" budget/finance-ui.js; then exit 1; fi
          changed="$(git diff --name-only)"
          echo "$changed"
          while IFS= read -r f; do
            case "$f" in
              budget/finance-ui.js|budget/budget.html|budget/budget_maja.html|budget/analytics.html|budget/analytics_maja.html|budget/familjebudget.html) ;;
              '') ;;
              *) echo "Unexpected changed file: $f" >&2; exit 1 ;;
            esac
          done <<< "$changed"

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "strickertmarkus"
          git config user.email "markus.strickert@sigmatechnology.com"
          git add budget/finance-ui.js budget/budget.html budget/budget_maja.html budget/analytics.html budget/analytics_maja.html budget/familjebudget.html
          git commit -m "Smooth finance page transitions"
          git push
