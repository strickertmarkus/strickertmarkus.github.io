name: Training picker Pulse verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/training-picker-pulse-verify.yml'
      - 'budget/exercise.html'
      - 'budget/pulse-environment/environment.css'
      - 'budget/tests/training-exercise-name-picker.test.cjs'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static regression
        run: |
          node --test budget/tests/training-*.test.cjs budget/tests/zen*.test.cjs
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('budget/exercise.html','utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)].map(m=>m[1]).filter(Boolean).sort((a,b)=>b.length-a.length);
          fs.writeFileSync('/tmp/exercise-inline.js',scripts[0]||'');
          NODE
          node --check /tmp/exercise-inline.js
          git diff --check HEAD^ HEAD
      - name: Install WebKit
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps webkit
      - name: Serve repository
        run: |
          python3 -m http.server 4173 --directory . >/tmp/picker-pulse-http.log 2>&1 &
          sleep 2
      - name: Pulse picker WebKit interaction
        run: |
          cat > /tmp/picker-pulse-e2e.cjs <<'EOF'
          const {webkit}=require(process.cwd()+'/node_modules/playwright');
          const assert=require('node:assert/strict');
          const firebaseStub=`(function(){if(window.firebase)return;function snap(v){return{exists:()=>v!=null,val:()=>v==null?null:v}}function ref(path){return{set:()=>Promise.resolve(),update:()=>Promise.resolve(),remove:()=>Promise.resolve(),get:()=>Promise.resolve(snap(null)),once:()=>Promise.resolve(snap(null)),on:(e,cb)=>{if(cb)setTimeout(()=>cb(snap(null)),0);return cb},off:()=>{},child:n=>ref(String(path||'')+'/'+n)}}var db={ref};function database(){return db}database.ServerValue={TIMESTAMP:Date.now()};var authObj={currentUser:{uid:'picker-pulse-test'},setPersistence:()=>Promise.resolve(),onAuthStateChanged:function(cb){setTimeout(()=>cb(this.currentUser),0);return()=>{}},signInWithEmailAndPassword:function(){return Promise.resolve({user:this.currentUser})},createUserWithEmailAndPassword:function(){return Promise.resolve({user:this.currentUser})},signOut:()=>Promise.resolve()};function auth(){return authObj}auth.Auth={Persistence:{LOCAL:'local'}};window.firebase={apps:[{}],initializeApp:()=>({}),app:()=>({}),auth,database}})();`;
          const chartStub=`(function(){var charts=new Map();function Chart(ctx,cfg){this.canvas=ctx&&ctx.canvas?ctx.canvas:ctx;this.ctx=ctx;this.data=cfg&&cfg.data||{};this.options=cfg&&cfg.options||{};this.scales={};this.destroy=()=>{if(this.canvas)charts.delete(this.canvas)};this.update=()=>{};this.resize=()=>{};this.getDatasetMeta=()=>({data:[]});if(this.canvas)charts.set(this.canvas,this)}Chart.getChart=c=>charts.get(c)||null;Chart.register=()=>{};window.Chart=Chart})();`;
          async function route(page){
            await page.route('https://www.gstatic.com/firebasejs/**',r=>r.fulfill({status:200,contentType:'application/javascript',body:firebaseStub}));
            await page.route('**/firebase-sync.js*',r=>r.fulfill({status:200,contentType:'application/javascript',body:'window.__pickerPulseSyncStub=true;'}));
            await page.route('https://cdn.jsdelivr.net/npm/chart.js**',r=>r.fulfill({status:200,contentType:'application/javascript',body:chartStub}));
            await page.route('https://fonts.googleapis.com/**',r=>r.fulfill({status:200,contentType:'text/css',body:''}));
            await page.route('https://fonts.gstatic.com/**',r=>r.abort());
          }
          (async()=>{
            const browser=await webkit.launch();
            const context=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true,userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1'});
            const page=await context.newPage(),errors=[];
            page.on('pageerror',e=>errors.push('pageerror: '+e.message));
            page.on('console',m=>{if(m.type()==='error')errors.push('console: '+m.text())});
            await route(page);
            await page.addInitScript(()=>{
              localStorage.setItem('ex_wk',JSON.stringify([
                {id:1,date:'2026-09-10',type:'Bröst + Triceps',exercises:[{kind:'strength',name:'Hantelpress',sets:3,reps:10,weight:24}]},
                {id:2,date:'2026-09-11',type:'Kondition',exercises:[{kind:'cardio',name:'Löpning',distance:5,time:28}]}
              ]));
              localStorage.setItem('ex_plannedSessions','{}');
              localStorage.setItem('ex_templates','[]');
              localStorage.setItem('ex_goals',JSON.stringify({weeklyWk:4,runDistanceGoal:10,vo2Goal:45}));
            });
            await page.goto('http://127.0.0.1:4173/budget/exercise.html',{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>typeof window.getExerciseNameCatalog==='function'&&window.__exerciseLoaderMetricsV2&&window.__exerciseLoaderMetricsV2.bundleReadyAt,null,{timeout:20000});
            await page.waitForTimeout(600);
            assert.equal(await page.getAttribute('html','data-training-overview'),'observatory');

            await page.evaluate(()=>{
              window.openDayWorkoutBuilder('Tor','2026-10-01');
              document.getElementById('day-workout-type').value='Bröst + Triceps';
              document.getElementById('day-workout-ex-list').innerHTML='';
              window.addDayWorkoutExRow();
            });
            await page.waitForFunction(()=>document.getElementById('day-workout-modal').classList.contains('show'));
            const modal=page.locator('#day-workout-modal .modal');
            const input=page.locator('#day-workout-ex-list .dw-name').first();
            await modal.evaluate(el=>{el.scrollTop=Math.min(80,el.scrollHeight-el.clientHeight)});
            const scrollBefore=await modal.evaluate(el=>el.scrollTop);
            await page.evaluate(()=>{
              window.__pickerRects=[];
              const p=document.getElementById('exercise-name-picker-v1');
              new MutationObserver(()=>{
                if(p.classList.contains('show')){
                  const r=p.getBoundingClientRect();
                  window.__pickerRects.push({x:r.x,y:r.y,w:r.width,h:r.height});
                  requestAnimationFrame(()=>{const r2=p.getBoundingClientRect();window.__pickerRects.push({x:r2.x,y:r2.y,w:r2.width,h:r2.height})});
                }
              }).observe(p,{attributes:true,attributeFilter:['class']});
            });
            await input.click();
            await page.waitForFunction(()=>document.getElementById('exercise-name-picker-v1').classList.contains('show'));
            await page.waitForTimeout(90);
            const scrollAfter=await modal.evaluate(el=>el.scrollTop);
            assert.ok(Math.abs(scrollAfter-scrollBefore)<1,'readonly picker tap changed modal scroll position');

            const theme=await page.evaluate(()=>{
              const picker=document.getElementById('exercise-name-picker-v1');
              const kicker=picker.querySelector('.exercise-name-picker-kicker-v1');
              const s=getComputedStyle(picker),k=getComputedStyle(kicker);
              const r=picker.getBoundingClientRect();
              return {border:s.borderColor,bg:s.backgroundImage,kicker:k.color,rect:{x:r.x,y:r.y,w:r.width,h:r.height},frames:window.__pickerRects};
            });
            assert.equal(theme.kicker,'rgb(255, 175, 196)');
            assert.ok(theme.bg.includes('rgb(255, 89, 124)'),'Pulse pink glow missing');
            assert.ok(theme.rect.x>=0&&theme.rect.x+theme.rect.w<=390.5&&theme.rect.y>=0&&theme.rect.y+theme.rect.h<=844.5);
            assert.ok(theme.frames.length>=2,'picker visibility frame samples missing');
            const first=theme.frames[0],last=theme.frames[theme.frames.length-1];
            assert.ok(Math.abs(first.x-last.x)<.6&&Math.abs(first.y-last.y)<.6,'picker geometry jumps while appearing');

            await page.evaluate(()=>{
              document.getElementById('day-workout-type').value='Kondition';
              document.getElementById('day-workout-ex-list').innerHTML='';
              window.addDayWorkoutExRow();
              delete document.documentElement.dataset.exerciseMorph;
            });
            const cardio=page.locator('#day-workout-ex-list .dw-name').first();
            await cardio.click();
            await page.locator('#exercise-name-picker-v1 .exercise-name-picker-option-v1',{hasText:'Löpning'}).click();
            assert.equal(await page.evaluate(()=>document.documentElement.dataset.exerciseMorph||''),'','picker selection started whole-builder morph');
            assert.equal(await cardio.inputValue(),'Löpning');

            await page.setViewportSize({width:320,height:700});
            await page.evaluate(()=>{
              document.getElementById('day-workout-type').value='Bröst + Triceps';
              document.getElementById('day-workout-ex-list').innerHTML='';
              window.addDayWorkoutExRow();
            });
            const small=page.locator('#day-workout-ex-list .dw-name').first();
            await small.click();
            const r=await page.locator('#exercise-name-picker-v1').boundingBox();
            assert.ok(r.x>=0&&r.x+r.width<=320.5&&r.y>=0&&r.y+r.height<=700.5,'picker escaped 320px viewport');
            assert.deepEqual(errors,[],'browser errors: '+errors.join(' | '));
            await browser.close();
            console.log('Pulse picker WebKit interaction passed');
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node /tmp/picker-pulse-e2e.cjs
