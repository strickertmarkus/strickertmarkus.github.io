name: Timer drag rearm fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/timer-drag-rearm-fix.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply rearm patch
        run: python3 .github/scripts/timer_drag_rearm_fix.py
      - name: Validate timer script
        run: node --check budget/exercise-timer-focus.js
      - name: Validate gesture cleanup
        run: |
          grep -q "final17-rearm" budget/exercise.html
          grep -q "rearmCompact" budget/exercise-timer-focus.js
          grep -q "dragAnimationFrame = 0" budget/exercise-timer-focus.js
          ! grep -q "setPointerCapture" budget/exercise-timer-focus.js
          ! grep -q "lostpointercapture" budget/exercise-timer-focus.js
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add budget/exercise-timer-focus.js budget/exercise.html budget/auth-config.js budget/auth-gate.js budget/exercise-pulse-flow-canvas-glow-v131.js
          git diff --cached --quiet || git commit -m 'Rearm timer swipe after collapse'
          git push
