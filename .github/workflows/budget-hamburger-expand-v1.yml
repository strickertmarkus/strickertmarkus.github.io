name: Budget hamburger expand v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/budget-hamburger-expand-v1.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply Budget hamburger animation
        run: python3 .github/scripts/budget_hamburger_expand_v1.py

      - name: Verify scoped change
        shell: bash
        run: |
          grep -Fq 'transform-origin: 100% 0%' budget/budget.html
          grep -Fq 'clip-path: inset(0 0 68% 56% round 12px)' budget/budget.html
          grep -Fq 'visibility: hidden' budget/budget.html
          grep -Fq 'pointer-events: none' budget/budget.html
          grep -Fq '.nav-dropdown-menu.show > :nth-child(9)' budget/budget.html
          grep -Fq '@media (prefers-reduced-motion: reduce)' budget/budget.html
          ! grep -Fq '@keyframes navDropIn' budget/budget.html
          git diff --quiet -- budget/firebase-sync.js budget/indexeddb-fallback.js budget/budget-persistence-guard.js budget/finance-ui.js budget/budget_maja.html budget/analytics.html budget/analytics_maja.html budget/familjebudget.html
          changed="$(git diff --name-only)"
          test "$changed" = 'budget/budget.html'

      - name: Commit Budget hamburger animation
        shell: bash
        run: |
          git config user.name "strickertmarkus"
          git config user.email "markus.strickert@sigmatechnology.com"
          git add budget/budget.html
          git commit -m "Prototype expanding Budget hamburger menu"
          git push
