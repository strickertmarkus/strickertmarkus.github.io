              'The new movement starts with its own fresh circular countdown');
            await page.locator('[data-zen-step="0"]').click();
            assert.equal(await page.locator('#zen-total-progress').getAttribute('aria-valuenow'),'0');
            assert.equal(await page.locator('#zen-session-title').textContent(),stretchFirst);
            await page.locator('[data-action="pause-zen"]').click();
            assert.equal(await page.locator('#zen-breath').textContent(),'PAUSAD');
            const pausedArc=await page.locator('#zen-step-arc').evaluate(el=>el.style.strokeDashoffset);
            const pausedTime=await page.locator('#zen-clock').textContent();
            await page.waitForTimeout(850);
            assert.equal(await page.locator('#zen-step-arc').evaluate(el=>el.style.strokeDashoffset),pausedArc,
              'Pause freezes the step dial');
            assert.equal(await page.locator('#zen-clock').textContent(),pausedTime,
              'Pause freezes the current movement countdown');
            await page.locator('[data-action="finish-zen"]').click();
            await page.locator('[data-view="meditation"]').click();
            await page.locator('[data-zen-index="1"]').click();
            await page.waitForSelector('#zen-session:not([hidden])');
            assert.equal(await page.locator('#zen-session').getAttribute('data-kind'),'meditation');
            assert.equal(await page.locator('#zen-clock').textContent(),'02:00');
            assert.equal(await page.locator('#zen-step-total').textContent(),'AV 02:00');
            assert.equal(await page.locator('#zen-total-time').textContent(),'00:00 / 10:00');
            assert.equal(await page.locator('#zen-total-progress').getAttribute('aria-valuenow'),'0');
            assert.equal(await page.locator('#zen-step-arc').evaluate(el=>getComputedStyle(el).stroke),
              'rgb(245, 219, 162)','Meditation arc should inherit the warm meditation accent');
            for(const width of [320,390,430]){
              await page.setViewportSize({width,height:844});
              await auditNoHorizontalScroll('Meditationsläge '+width+'px');
              await auditZenDial('Meditationsläge '+width+'px');
              if(width===320||width===390)await page.screenshot({path:'test-results/ingemar-demo/meditation-session-'+width+'.png'});
            }
            await page.setViewportSize({width:390,height:844});
