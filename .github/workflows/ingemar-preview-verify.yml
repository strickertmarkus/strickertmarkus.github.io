name: Ingemar demo preview verification

on:
  push:
    branches: [main]
    paths:
      - 'budget/ingemar-preview.html'
      - 'budget/ingemar-preview-modes.css'
      - 'budget/ingemar-zen-visuals.js'
      - 'budget/ingemar-session/exercise.html'
      - 'budget/tests/ingemar-preview.test.cjs'
      - '.github/workflows/ingemar-preview-verify.yml'
  workflow_dispatch:

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate standalone source
        run: node --test budget/tests/ingemar-preview.test.cjs
      - name: Install WebKit
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps webkit
      - name: Serve preview
        run: |
          python3 -m http.server 4173 --directory . >/tmp/ingemar-preview-http.log 2>&1 &
          sleep 2
      - name: Test mobile and desktop interactions
        run: |
          cat > /tmp/ingemar-preview-e2e.cjs <<'EOF'
          const {webkit}=require(process.cwd()+'/node_modules/playwright');
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          (async()=>{
            const browser=await webkit.launch();
            const context=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
            const page=await context.newPage(),errors=[],firebaseRequests=[];
            page.on('pageerror',e=>errors.push(e.message));
            page.on('request',r=>{if(/firebase|firestore|googleapis\.com\/identitytoolkit/.test(r.url()))firebaseRequests.push(r.url());});
            await page.route('https://fonts.googleapis.com/**',r=>r.fulfill({status:200,contentType:'text/css',body:''}));
            await page.route('https://fonts.gstatic.com/**',r=>r.abort());
            fs.mkdirSync('test-results/ingemar-demo',{recursive:true});
            await page.goto('http://127.0.0.1:4173/budget/ingemar-preview.html');
            await page.waitForSelector('[data-choice="Push"]');
            async function waitAnimationFrames(count=4){
              await page.evaluate(count=>new Promise(resolve=>{
                let seen=0;function frame(){seen++;if(seen>=count)resolve();else requestAnimationFrame(frame);}requestAnimationFrame(frame);
              }),count);
            }
            async function auditTrainingFlowHome(){
              for(const width of [320,390,430,768,1440]){
                await page.setViewportSize({width,height:width===1440?960:844});
                const visual=await page.locator('.training-flow-visual').evaluate(el=>{
                  const r=el.getBoundingClientRect();return {left:r.left,right:r.right,width:innerWidth,height:r.height};
                });
                assert.ok(visual.left>=-1&&visual.right<=visual.width+1&&visual.height>150,
                  'Training animated hero must fit viewport '+width+'px: '+JSON.stringify(visual));
              }
              await page.setViewportSize({width:390,height:844});
            }
            assert.equal(await page.title(),'Ingemars träning · Förhandsvisning');
            assert.equal(await page.locator('.training-flow-visual').count(),1);
            assert.equal(await page.locator('.training-flow-visual').evaluate(el=>getComputedStyle(el).color),'rgb(204, 67, 84)');
            const trainingTrace=page.locator('.training-flow-visual .zen-flow-trace');
            assert.match(await trainingTrace.evaluate(el=>getComputedStyle(el).animationName),/zenFlowSweep/);
            const trainingTraceOffsets=[];
            for(let i=0;i<5;i++){await waitAnimationFrames(4);trainingTraceOffsets.push(await trainingTrace.evaluate(el=>getComputedStyle(el).strokeDashoffset));}
            assert.ok(new Set(trainingTraceOffsets).size>=4,'Training homepage red flow line must animate like Stretch/Meditation: '+JSON.stringify(trainingTraceOffsets));
            await auditTrainingFlowHome();
            await page.waitForSelector('#pp-volume-chart svg');
            assert.equal(await page.locator('#pp-volume-chart .pp-line').count(),2,'Push/Pull volume chart should render two trend lines');
            assert.equal(await page.locator('#pp-volume-chart .pp-area').count(),2,'Telemetry chart should render soft area depth under both lines');
            assert.equal(await page.locator('#pp-volume-chart .pp-node-halo').count(),16,'Eight weeks across two series should have glowing telemetry nodes');
            assert.equal(await page.locator('#pp-volume-chart [data-chart-point][aria-pressed="true"]').count(),1,'Latest week should be selected by default');
            await page.locator('#pp-volume-chart [data-chart-point="2"]').click();
            assert.match(await page.locator('#pp-volume-chart-inspect').textContent(),/v\d+ · Push: .* · Pull: /,'Tapped volume chart must reveal both actual series values');
            await page.locator('#pp-exercise-chart [data-chart-point="3"]').click();
            assert.match(await page.locator('#pp-exercise-chart-inspect').textContent(),/v\d+ · Bänkpress: .* · Sittande rodd: /,'Tapped exercise chart must show both compared exercises');
            await page.locator('#bars [data-bar-index="1"]').click();
            assert.match(await page.locator('#bars-inspect').textContent(),/v\d+ · \d+ pass/,'Tapped training bar must reveal the exact week count');

            assert.equal(await page.locator('#pp-exercise-pills button').count(),3,'Push should expose three demo exercises');
            assert.equal(await page.locator('#pp-exercise-title').textContent(),'Bänkpress');
            assert.equal(await page.locator('#pp-exercise-compare').textContent(),'Jämför med Sittande rodd');
            assert.equal(await page.locator('#pp-exercise-chart .pp-line').count(),2,'Exercise chart should show selected and counter exercise');
            assert.equal(await page.locator('#pp-exercise-chart .pp-line.primary').count(),1);
            assert.equal(await page.locator('#pp-exercise-chart .pp-line.comparison').count(),1);
            await page.locator('[data-analytics-type="Pull"]').click();
            assert.equal(await page.locator('#pp-exercise-title').textContent(),'Latsdrag');
            assert.equal(await page.locator('#pp-exercise-compare').textContent(),'Jämför med Axelpress');
            assert.equal(await page.locator('#pp-exercise-chart .pp-line').count(),2,'Pull exercise chart should retain its Push counter line');
            assert.equal(await page.locator('#pp-exercise-pills button').count(),3,'Pull should expose three demo exercises');
            await page.locator('[data-analytics-metric="e1rm"]').click();
            assert.match(await page.locator('#pp-exercise-now').textContent(),/kg$/,'Estimated 1RM should be displayed in kg');
            await page.locator('[data-analytics-type="Push"]').click();
            await page.locator('[data-analytics-metric="volume"]').click();
            async function auditNoHorizontalScroll(label){
              const result=await page.evaluate(()=>{
                const width=innerWidth, selectors='main,header .inner,.hero,.stats,.choices,.week,.history,.pp-analytics,.pp-chart,.pp-summary-grid,.pp-load-row,.pp-exercise-panel,#week-planner,#week-planner .week-planner-nav,#week-planner .week-template-tools,#week-planner .week-planner-day,#week-planner .week-day-card-top,#week-planner .week-day-editor,#week-planner .week-day-type-grid,#week-planner .week-exercise-grid,.pp-chart-shell,dialog[open],dialog[open] .modal-body,dialog[open] .exercise-card,.mode-screen:not([hidden]),.family-session-frame,.mode-topbar,.zen-layout,.zen-scenery,.zen-workspace,.zen-focus-grid,.zen-focus-card,.zen-journey-card';
                const candidates=[...document.querySelectorAll(selectors)].filter(el=>el.getClientRects().length>0 && getComputedStyle(el).visibility!=='hidden');
                const invalid=candidates.map(el=>{
                  const box=el.getBoundingClientRect();
                  const overflow=getComputedStyle(el).overflowX;
                  return {selector:el.tagName.toLowerCase()+(el.id?'#'+el.id:'.'+String(el.className).trim().replace(/\s+/g,'.')),
                    left:box.left,right:box.right,scroll:el.scrollWidth,client:el.clientWidth,
                    clipped:overflow==='hidden'||overflow==='clip'};
                }).filter(v=>v.left<-1||v.right>width+1||(!v.clipped&&v.scroll>v.client+1));
                return {width,html:document.documentElement.scrollWidth,body:document.body.scrollWidth,invalid:invalid.slice(0,12)};
              });
              assert.ok(result.html<=result.width+1&&result.body<=result.width+1&&result.invalid.length===0,
                label+' horizontally overflows: '+JSON.stringify(result));
            }
            for(const width of [320,360,390,430,768,1440]){
              await page.setViewportSize({width,height:width===1440?960:844});
              await auditNoHorizontalScroll('Startsida '+width+'px');
              await page.screenshot({path:'test-results/ingemar-demo/overview-'+width+'.png',fullPage:true});
            }
            await page.setViewportSize({width:390,height:844});
            const preWeekState=await page.evaluate(()=>localStorage.getItem('ingemar-pulse-demo-v1'));
            await page.locator('[data-action="plan-week"]').click();
            assert.equal(await page.locator('#week-planner').evaluate(el=>el.open),true);
            assert.equal(await page.locator('#week-planner-days .week-planner-day').count(),7,'Week planner should show all seven days together');
            assert.match(await page.locator('#week-planner-label').textContent(),/^Vecka \d+$/);
            assert.match(await page.locator('#week-planner-summary').textContent(),/\d+ pass planerade/);
            assert.equal(await page.locator('[data-week-source]').count(),0,'Daily dropdowns are intentionally removed from the primary planning flow');
            await auditNoHorizontalScroll('Veckoplanerare 390px');

            await page.locator('[data-week-toggle-day="0"]').click();
            assert.equal(await page.locator('[data-week-day="0"] .week-day-editor').isVisible(),true,'Snabbplanera should expose obvious controls in the day card');
            await page.locator('[data-week-type="0:Pull"]').click();
            assert.equal(await page.locator('[data-week-day="0"]').getAttribute('data-week-plan-type'),'Pull');
            assert.equal(await page.locator('[data-week-day="0"] [data-week-type="0:Pull"]').getAttribute('aria-pressed'),'true');
            assert.equal(await page.locator('[data-week-day="0"] [data-week-exercise="0:'+encodeURIComponent('Latsdrag')+'"]').getAttribute('aria-pressed'),'true');

            await page.locator('[data-week-day="0"] [data-week-exercise="0:'+encodeURIComponent('Hantelcurl')+'"]').click();
            assert.equal(await page.locator('[data-week-day="0"] [data-week-exercise="0:'+encodeURIComponent('Hantelcurl')+'"]').getAttribute('aria-pressed'),'false','Exercise chips toggle directly');
            await page.locator('[data-week-day="0"] [data-week-exercise="0:'+encodeURIComponent('Hantelcurl')+'"]').click();
            assert.equal(await page.locator('[data-week-day="0"] [data-week-exercise="0:'+encodeURIComponent('Hantelcurl')+'"]').getAttribute('aria-pressed'),'true');
            await auditNoHorizontalScroll('Veckodagens synliga snabbval 390px');

            await page.locator('[data-week-copy="0"]').click();
            assert.equal(await page.locator('[data-week-day="0"] .week-copy-destinations').isVisible(),true,'Copy action should immediately show destination days');
            await page.locator('[data-week-copy-target="1"]').click();
            assert.equal(await page.locator('[data-week-day="1"]').getAttribute('data-week-plan-type'),'Pull','Copy should duplicate the planned workout to the chosen day');
            assert.equal(await page.locator('[data-week-day="1"] .week-day-editor').isVisible(),true,'Copied target becomes the active card so the result is obvious');

            const beforeWeekDrag=await page.locator('#week-planner-days .week-planner-day').evaluateAll(nodes=>nodes.map(n=>n.dataset.weekPlanType));
            const weekDragHandle=page.locator('[data-week-drag="0"]');
            await weekDragHandle.scrollIntoViewIfNeeded();
            const weekDragSource=await weekDragHandle.boundingBox();
            const dragX=weekDragSource.x+weekDragSource.width/2,dragY=weekDragSource.y+weekDragSource.height/2,pointerId=41;
            await weekDragHandle.dispatchEvent('pointerdown',{pointerId,button:0,buttons:1,clientX:dragX,clientY:dragY,pointerType:'touch',isPrimary:true,bubbles:true,cancelable:true});
            await page.locator('.week-planner-drag-ghost').waitFor({state:'visible'});
            const ghostBefore=await page.locator('.week-planner-drag-ghost').evaluate(el=>{const r=el.getBoundingClientRect();return {x:r.left,y:r.top};});
            await page.evaluate(({pointerId,x,y})=>document.dispatchEvent(new PointerEvent('pointermove',{pointerId,button:-1,buttons:1,clientX:x,clientY:y,pointerType:'touch',isPrimary:true,bubbles:true,cancelable:true})),{pointerId,x:dragX+18,y:dragY+24});
            const ghostAfter=await page.locator('.week-planner-drag-ghost').evaluate(el=>{const r=el.getBoundingClientRect();return {x:r.left,y:r.top};});
            assert.ok(Math.abs((ghostAfter.x-ghostBefore.x)-18)<10&&Math.abs((ghostAfter.y-ghostBefore.y)-24)<10,
              'Dragged pass preview must follow touch movement in both axes: '+JSON.stringify({ghostBefore,ghostAfter}));
            const target=await page.locator('[data-week-day="1"]').boundingBox();
            await page.evaluate(({pointerId,x,y})=>document.dispatchEvent(new PointerEvent('pointermove',{pointerId,button:-1,buttons:1,clientX:x,clientY:y,pointerType:'touch',isPrimary:true,bubbles:true,cancelable:true})),{pointerId,x:target.x+target.width/2,y:target.y+Math.min(30,target.height/2)});
            await page.evaluate(pointerId=>document.dispatchEvent(new PointerEvent('pointerup',{pointerId,button:0,buttons:0,clientX:20,clientY:20,pointerType:'touch',isPrimary:true,bubbles:true,cancelable:true})),pointerId);
            const afterWeekDrag=await page.locator('#week-planner-days .week-planner-day').evaluateAll(nodes=>nodes.map(n=>n.dataset.weekPlanType));
            assert.equal(afterWeekDrag[1],beforeWeekDrag[0],'Touch-dragging a day should move/swap its planned workout');

            await page.locator('[data-week-edit="1"]').first().click();
            assert.equal(await page.locator('#builder').evaluate(el=>el.open),true,'The main day surface opens the full workout builder');
            assert.equal(await page.locator('#week-planner').evaluate(el=>el.open),false);
            assert.equal(await page.locator('#build-date').isDisabled(),true,'Editing a week day must not silently move it to another date');
            assert.equal(await page.locator('#builder-start-from-builder').isVisible(),false,'A week draft must be saved before a session can start');
            await page.locator('[data-set="0:0:weight"]').fill('61');
            await page.locator('[data-action="save-plan"]').click();
            await page.waitForFunction(()=>document.querySelector('#week-planner').open);
            assert.equal(await page.locator('#week-planner').evaluate(el=>el.open),true,'Saving one day returns to the week planner');
            assert.equal(await page.locator('[data-week-day="1"]').getAttribute('data-week-plan-type'),'Pull');
            await page.locator('[data-week-edit="1"]').first().click();
            assert.equal(await page.locator('[data-set="0:0:weight"]').inputValue(),'61','Day edits remain in the unsaved week draft');
            await page.locator('[data-action="close-builder"]').first().click();
            await page.waitForFunction(()=>document.querySelector('#week-planner').open);

            await page.locator('.week-template-drawer summary').click();
            page.once('dialog',d=>d.accept('Demo vecka 4 dagar'));
            await page.locator('[data-action="save-week-template"]').click();
            assert.ok((await page.locator('#week-template-select option').count())>=3,'New week template should be available immediately');
            assert.equal(await page.locator('#week-template-select option:checked').textContent(),'Demo vecka 4 dagar');

            const plannedMonday=await page.locator('[data-week-day="0"]').getAttribute('data-week-date');
            const plannedTuesday=await page.locator('[data-week-day="1"]').getAttribute('data-week-date');
            await page.locator('[data-action="save-week"]').click();
            assert.equal(await page.locator('#week-planner').evaluate(el=>el.open),false);
            const savedWeek=await page.evaluate(({monday,tuesday})=>{
              const s=JSON.parse(localStorage.getItem('ingemar-pulse-demo-v1'));return {monday:s.plans[monday]||null,tuesday:s.plans[tuesday]||null,templates:s.weekTemplates||[]};
            },{monday:plannedMonday,tuesday:plannedTuesday});
            assert.ok(savedWeek.monday||savedWeek.tuesday,'Saving the whole week should persist multiple day slots');
            assert.ok(savedWeek.templates.some(t=>t.name==='Demo vecka 4 dagar'),'Saved week template should persist locally');

            await page.evaluate(previous=>{
              if(previous==null)localStorage.removeItem('ingemar-pulse-demo-v1');else localStorage.setItem('ingemar-pulse-demo-v1',previous);
            },preWeekState);
            await page.reload({waitUntil:'domcontentloaded'});
            await page.setViewportSize({width:390,height:844});
            await page.waitForSelector('[data-choice="Push"]');

            const preBuilderY=await page.evaluate(()=>{
              const target=Math.min(480,Math.max(0,document.body.scrollHeight-innerHeight));
              window.scrollTo({top:target,behavior:'instant'});return window.scrollY;
            });
            await page.evaluate(()=>document.querySelector('[data-choice="Push"]').click());
            assert.equal(await page.locator('#builder').evaluate(el=>el.open),true);
            const builderLock=await page.evaluate(()=>({
              flag:document.body.dataset.builderOpen,
              position:getComputedStyle(document.body).position,
              top:document.body.style.top
            }));
            assert.equal(builderLock.flag,'true');
            assert.equal(builderLock.position,'fixed');
            assert.equal(builderLock.top,(-preBuilderY)+'px','The fixed body offset preserves the underlying visual position');
            async function auditBuilder(label){
              await auditNoHorizontalScroll(label);
              const layout=await page.locator('#builder').evaluate(dialog=>{
                const frame=dialog.getBoundingClientRect();
                const nodes=[dialog,dialog.querySelector('.modal-head'),dialog.querySelector('.modal-body'),
                  ...dialog.querySelectorAll('.exercise-card,.exercise-fields,.builder-template-tools,.builder-exercise-name-control,.builder-exercise-name-menu:not([hidden]),.builder-row-tools,.metric-pills,.set-header,.set-row,.exercise-foot,.modal-actions,.modal-actions .right')];
                const wrong=nodes.flatMap(el=>{
                  const r=el.getBoundingClientRect(),extra=el.scrollWidth-el.clientWidth;
                  return r.left<frame.left-1||r.right>frame.right+1||extra>1
                    ?[{name:el.className||el.tagName,left:r.left,right:r.right,scroll:el.scrollWidth,client:el.clientWidth}]:[];
                });
                const inputOverflow=[...dialog.querySelectorAll('input,button')].flatMap(el=>{
                  if(!el.getClientRects().length||getComputedStyle(el).visibility==='hidden')return [];
                  const r=el.getBoundingClientRect();return r.left<frame.left-1||r.right>frame.right+1
                    ?[{name:el.getAttribute('aria-label')||el.textContent||el.tagName,left:r.left,right:r.right}]:[];
                });
                return {left:frame.left,right:frame.right,scroll:dialog.scrollWidth,client:dialog.clientWidth,
                  overflowX:getComputedStyle(dialog).overflowX,overflowY:getComputedStyle(dialog).overflowY,
                  wrong:wrong.slice(0,12),inputOverflow:inputOverflow.slice(0,12)};
              });
              assert.ok(layout.left>=-1&&layout.right<=page.viewportSize().width+1&&
                layout.overflowX==='hidden'&&layout.overflowY==='auto'&&
                layout.scroll<=layout.client+1&&layout.wrong.length===0&&layout.inputOverflow.length===0,
                label+' must stay inside the mobile dialog: '+JSON.stringify(layout));
              const dateField=await page.locator('#build-date').evaluate(input=>{
                const control=input.closest('.builder-date-control'),body=input.closest('.modal-body');
                const frame=control.getBoundingClientRect(),native=input.getBoundingClientRect(),
                  name=document.getElementById('build-name').getBoundingClientRect(),container=body.getBoundingClientRect(),
                  style=getComputedStyle(body),leftInset=parseFloat(style.paddingLeft),rightInset=parseFloat(style.paddingRight);
                return {left:frame.left,right:frame.right,width:frame.width,
                  nativeLeft:native.left,nativeRight:native.right,
                  nameLeft:name.left,nameRight:name.right,
                  bodyLeft:container.left+leftInset,bodyRight:container.right-rightInset,
                  opacity:getComputedStyle(input).opacity,hasNativePicker:input.type==='date',
                  displayed:control.querySelector('.builder-date-text').textContent};
              });
              assert.ok(Math.abs(dateField.left-dateField.nameLeft)<=1&&
                Math.abs(dateField.right-dateField.nameRight)<=1&&
                dateField.left>=dateField.bodyLeft-1&&dateField.right<=dateField.bodyRight+1&&
                dateField.nativeLeft>=dateField.left-1&&dateField.nativeRight<=dateField.right+1&&
                dateField.opacity==='0'&&dateField.hasNativePicker&&dateField.displayed.length>3,
                label+' date FIELD must match the pass name field, not merely fit inside the dialog: '+JSON.stringify(dateField));
              await page.locator('#builder').evaluate(dialog=>{dialog.scrollLeft=100;});
              assert.equal(await page.locator('#builder').evaluate(dialog=>dialog.scrollLeft),0,
                label+' must not allow sideways dragging of the builder');
            }
            for(const width of [320,360,375,390,430,600,768]){
              await page.setViewportSize({width,height:844});
              await auditBuilder('Passbyggare '+width+'px');
              if(width===320||width===390)await page.screenshot({path:'test-results/ingemar-demo/builder-'+width+'.png'});
            }
            await page.setViewportSize({width:320,height:700});
            const enlargedFonts=await page.addStyleTag({content:'#builder .type-pills .pill,#builder .metric-pills .pill,#builder .modal-actions button{font-size:17px!important}#builder .modal-head h2{font-size:28px!important}'});
            await auditBuilder('Passbyggare 320px med större text');
            await enlargedFonts.evaluate(style=>style.remove());
            await page.setViewportSize({width:390,height:844});
            assert.equal(await page.locator('#builder-template-select option').count(),1,'Empty demo starts without custom templates');
            page.once('dialog',d=>d.accept('Push standard'));
            await page.locator('[data-action="save-template"]').click();
            assert.equal(await page.locator('#builder-template-select option').count(),2,'Saved template should become selectable immediately');
            assert.equal(await page.locator('#builder-template-select option:checked').textContent(),'Push standard');
            assert.equal(await page.evaluate(()=>JSON.parse(localStorage.getItem('ingemar-pulse-demo-v1')).templates.length),1);

            const initialBuilderExercises=await page.locator('#exercise-list .exercise-card').count();
            const firstExerciseName=await page.locator('[data-exercise-name-input="0"]').inputValue();
            await page.locator('[data-copy-exercise="0"]').click();
            assert.equal(await page.locator('#exercise-list .exercise-card').count(),initialBuilderExercises+1,'Copy control should duplicate the exercise row');
            assert.equal(await page.locator('[data-exercise-name-input="1"]').inputValue(),firstExerciseName,'Copied row should preserve exercise data');
            await page.locator('[data-remove-exercise="1"]').click();

            const beforeDrag=await page.locator('#exercise-list [data-exercise-name-input]').evaluateAll(nodes=>nodes.map(n=>n.value));
            const dragHandle=page.locator('[data-drag-exercise="0"]');
            const sourceBox=await dragHandle.boundingBox();
            const lastCard=page.locator('#exercise-list .exercise-card').last();
            const targetBox=await lastCard.boundingBox(),builderPointerId=52;
            const builderDragX=sourceBox.x+sourceBox.width/2,builderDragY=sourceBox.y+sourceBox.height/2;
            await dragHandle.dispatchEvent('pointerdown',{pointerId:builderPointerId,button:0,buttons:1,clientX:builderDragX,clientY:builderDragY,pointerType:'touch',isPrimary:true,bubbles:true,cancelable:true});
            await page.locator('.builder-drag-ghost').waitFor({state:'visible'});
            await page.evaluate(({pointerId,x,y})=>document.dispatchEvent(new PointerEvent('pointermove',{pointerId,button:-1,buttons:1,clientX:x,clientY:y,pointerType:'touch',isPrimary:true,bubbles:true,cancelable:true})),{pointerId:builderPointerId,x:targetBox.x+targetBox.width/2,y:targetBox.y+targetBox.height-4});
            await page.evaluate(({pointerId,x,y})=>document.dispatchEvent(new PointerEvent('pointerup',{pointerId,button:0,buttons:0,clientX:x,clientY:y,pointerType:'touch',isPrimary:true,bubbles:true,cancelable:true})),{pointerId:builderPointerId,x:targetBox.x+targetBox.width/2,y:targetBox.y+targetBox.height-4});
            const afterDrag=await page.locator('#exercise-list [data-exercise-name-input]').evaluateAll(nodes=>nodes.map(n=>n.value));
            assert.equal(afterDrag.at(-1),beforeDrag[0],'Touch drag handle should move the first exercise to the end');
            await page.locator('#type-pills [data-type="Push"]').click();

            const firstName=page.locator('[data-exercise-name-input="0"]');
            assert.equal(await firstName.getAttribute('readonly'),'');
            await firstName.click();
            assert.equal(await page.locator('[data-exercise-menu="0"]').isVisible(),true);
