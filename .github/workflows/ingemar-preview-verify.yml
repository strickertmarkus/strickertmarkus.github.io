            async function auditZenCanvas(label){
              const data=await page.locator('#zen-session').evaluate(async root=>{
                await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
                const rect=sel=>{const r=root.querySelector(sel).getBoundingClientRect();return {top:r.top,bottom:r.bottom,left:r.left,right:r.right,width:r.width,height:r.height};};
                const canvas=root.querySelector('#zen-visual-canvas'),style=getComputedStyle(root);
                const cx=canvas.getContext('2d'),pixels=cx.getImageData(0,0,canvas.width,canvas.height).data,colors=new Set();
                for(let i=0;i<pixels.length;i+=Math.max(4,Math.floor(pixels.length/7500/4)*4))colors.add(pixels[i]+','+pixels[i+1]+','+pixels[i+2]);
                return {focus:rect('.zen-focus-card'),dock:rect('.zen-journey-card'),controls:rect('.zen-controls'),exit:rect('.zen-exit'),stageList:rect('#zen-stage-list'),
                  buttons:Array.from(root.querySelectorAll('#zen-stage-list button')).map(el=>{const r=el.getBoundingClientRect();return {top:r.top,bottom:r.bottom,left:r.left,right:r.right};}),
                  canvas:{width:canvas.width,height:canvas.height},colors:colors.size,center:parseFloat(style.getPropertyValue('--zen-art-center-y')),
                  scene:rect('.zen-layout'),scrollHeight:root.scrollHeight,clientHeight:root.clientHeight,overflow:getComputedStyle(root).overflowY};
              });
              assert.ok(data.canvas.width>100&&data.canvas.height>100&&data.colors>15,label+' Canvas must render a shaded scene: '+JSON.stringify(data));
              assert.ok(data.focus.bottom<=data.dock.top+2&&data.dock.bottom<=data.controls.top+2&&data.controls.bottom<=data.exit.top+2,
                label+' no controls may overlap: '+JSON.stringify(data));
              assert.ok(data.center+data.scene.top>=data.focus.bottom-4&&data.center+data.scene.top<=data.dock.top+4,
                label+' rendered centerpiece must remain between the instructions and the controls: '+JSON.stringify(data));
              assert.ok(data.buttons.every(b=>b.left>=data.stageList.left-2&&b.right<=data.stageList.right+2&&b.top>=data.stageList.top-2&&b.bottom<=data.stageList.bottom+2),
                label+' every numbered step must fit its container: '+JSON.stringify(data));
              assert.ok(data.exit.bottom<=innerHeight+4||data.overflow==='auto',label+' short viewports must be scrollable');
              assert.equal(await page.locator('#zen-session-ring').getAttribute('role'),'timer');
