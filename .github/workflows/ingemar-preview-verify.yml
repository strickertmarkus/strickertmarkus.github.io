name: Ingemar demo preview verification

on:
  push:
    branches: [main]
    paths:
      - 'budget/ingemar-preview.html'
      - 'budget/tests/ingemar-preview.test.cjs'
      - '.github/workflows/ingemar-preview-verify.yml'
  workflow_dispatch:

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate standalone source
        run: node --test budget/tests/ingemar-preview.test.cjs
      - name: Install WebKit
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps webkit
      - name: Serve preview
        run: |
          python3 -m http.server 4173 --directory . >/tmp/ingemar-preview-http.log 2>&1 &
          sleep 2
      - name: Test mobile and desktop interactions
        run: |
          cat > /tmp/ingemar-preview-e2e.cjs <<'EOF'
          const {webkit}=require(process.cwd()+'/node_modules/playwright');
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          (async()=>{
            const browser=await webkit.launch();
            const context=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
            const page=await context.newPage(),errors=[],firebaseRequests=[];
            page.on('pageerror',e=>errors.push(e.message));
            page.on('request',r=>{if(/firebase|firestore|googleapis\.com\/identitytoolkit/.test(r.url()))firebaseRequests.push(r.url());});
            await page.route('https://fonts.googleapis.com/**',r=>r.fulfill({status:200,contentType:'text/css',body:''}));
            await page.route('https://fonts.gstatic.com/**',r=>r.abort());
            fs.mkdirSync('test-results/ingemar-demo',{recursive:true});
            await page.goto('http://127.0.0.1:4173/budget/ingemar-preview.html');
            await page.waitForSelector('[data-choice="Push"]');
            assert.equal(await page.title(),'Ingemars träning · Förhandsvisning');
            await page.waitForSelector('#pp-volume-chart svg');
            assert.equal(await page.locator('#pp-volume-chart .pp-line').count(),2,'Push/Pull volume chart should render two trend lines');
            assert.equal(await page.locator('#pp-exercise-pills button').count(),3,'Push should expose three demo exercises');
            assert.equal(await page.locator('#pp-exercise-title').textContent(),'Bänkpress');
            await page.locator('[data-analytics-type="Pull"]').click();
            assert.equal(await page.locator('#pp-exercise-title').textContent(),'Latsdrag');
            assert.equal(await page.locator('#pp-exercise-pills button').count(),3,'Pull should expose three demo exercises');
            await page.locator('[data-analytics-metric="e1rm"]').click();
            assert.match(await page.locator('#pp-exercise-now').textContent(),/kg$/,'Estimated 1RM should be displayed in kg');
            await page.locator('[data-analytics-type="Push"]').click();
            await page.locator('[data-analytics-metric="volume"]').click();
            async function auditNoHorizontalScroll(label){
              const result=await page.evaluate(()=>{
                const width=innerWidth, selectors='main,header .inner,.hero,.stats,.choices,.week,.history,.pp-analytics,.pp-chart,.pp-summary-grid,.pp-load-row,.pp-exercise-panel,dialog[open],dialog[open] .modal-body,dialog[open] .exercise-card,.mode-screen:not([hidden]),#session-modal,#session-modal .session-shell,#session-modal .session-top,#session-modal .session-grid,#session-modal .session-main,#session-modal .session-timers,#session-modal .session-cta-row,#session-modal .session-set-rail,#session-modal .session-set-rail .mode-exercise-card,#session-modal .session-set-rail .mode-set-row,.mode-topbar,.zen-layout,.zen-scenery,.zen-workspace';
                const candidates=[...document.querySelectorAll(selectors)].filter(el=>el.getClientRects().length>0 && getComputedStyle(el).visibility!=='hidden');
                const invalid=candidates.map(el=>{
                  const box=el.getBoundingClientRect();
                  const overflow=getComputedStyle(el).overflowX;
                  return {selector:el.tagName.toLowerCase()+(el.id?'#'+el.id:'.'+String(el.className).trim().replace(/\s+/g,'.')),
                    left:box.left,right:box.right,scroll:el.scrollWidth,client:el.clientWidth,
                    clipped:overflow==='hidden'||overflow==='clip'};
                }).filter(v=>v.left<-1||v.right>width+1||(!v.clipped&&v.scroll>v.client+1));
                return {width,html:document.documentElement.scrollWidth,body:document.body.scrollWidth,invalid:invalid.slice(0,12)};
              });
              assert.ok(result.html<=result.width+1&&result.body<=result.width+1&&result.invalid.length===0,
                label+' horizontally overflows: '+JSON.stringify(result));
            }
            for(const width of [320,360,390,430,768,1440]){
              await page.setViewportSize({width,height:width===1440?960:844});
              await auditNoHorizontalScroll('Startsida '+width+'px');
              await page.screenshot({path:'test-results/ingemar-demo/overview-'+width+'.png',fullPage:true});
            }
            await page.setViewportSize({width:390,height:844});
            const preBuilderY=await page.evaluate(()=>{
              const target=Math.min(480,Math.max(0,document.body.scrollHeight-innerHeight));
              window.scrollTo({top:target,behavior:'instant'});return window.scrollY;
            });
            await page.evaluate(()=>document.querySelector('[data-choice="Push"]').click());
            assert.equal(await page.locator('#builder').evaluate(el=>el.open),true);
            const builderLock=await page.evaluate(()=>({
              flag:document.body.dataset.builderOpen,
              position:getComputedStyle(document.body).position,
              top:document.body.style.top,
              y:window.scrollY
            }));
            assert.equal(builderLock.flag,'true');
            assert.equal(builderLock.position,'fixed');
            assert.equal(builderLock.top,(-preBuilderY)+'px');
            assert.equal(builderLock.y,preBuilderY,'Opening the builder must not move the underlying page');
            async function auditBuilder(label){
              await auditNoHorizontalScroll(label);
              const layout=await page.locator('#builder').evaluate(dialog=>{
                const frame=dialog.getBoundingClientRect();
                const nodes=[dialog,dialog.querySelector('.modal-head'),dialog.querySelector('.modal-body'),
                  ...dialog.querySelectorAll('.exercise-card,.exercise-fields,.builder-exercise-name-control,.builder-exercise-name-menu:not([hidden]),.metric-pills,.set-header,.set-row,.exercise-foot,.modal-actions,.modal-actions .right')];
                const wrong=nodes.flatMap(el=>{
                  const r=el.getBoundingClientRect(),extra=el.scrollWidth-el.clientWidth;
                  return r.left<frame.left-1||r.right>frame.right+1||extra>1
                    ?[{name:el.className||el.tagName,left:r.left,right:r.right,scroll:el.scrollWidth,client:el.clientWidth}]:[];
                });
                const inputOverflow=[...dialog.querySelectorAll('input,button')].flatMap(el=>{
                  if(!el.getClientRects().length||getComputedStyle(el).visibility==='hidden')return [];
                  const r=el.getBoundingClientRect();return r.left<frame.left-1||r.right>frame.right+1
                    ?[{name:el.getAttribute('aria-label')||el.textContent||el.tagName,left:r.left,right:r.right}]:[];
                });
                return {left:frame.left,right:frame.right,scroll:dialog.scrollWidth,client:dialog.clientWidth,
                  overflowX:getComputedStyle(dialog).overflowX,overflowY:getComputedStyle(dialog).overflowY,
                  wrong:wrong.slice(0,12),inputOverflow:inputOverflow.slice(0,12)};
              });
              assert.ok(layout.left>=-1&&layout.right<=page.viewportSize().width+1&&
                layout.overflowX==='hidden'&&layout.overflowY==='auto'&&
                layout.scroll<=layout.client+1&&layout.wrong.length===0&&layout.inputOverflow.length===0,
                label+' must stay inside the mobile dialog: '+JSON.stringify(layout));
              const dateField=await page.locator('#build-date').evaluate(input=>{
                const control=input.closest('.builder-date-control'),body=input.closest('.modal-body');
                const frame=control.getBoundingClientRect(),native=input.getBoundingClientRect(),
                  name=document.getElementById('build-name').getBoundingClientRect(),container=body.getBoundingClientRect(),
                  style=getComputedStyle(body),leftInset=parseFloat(style.paddingLeft),rightInset=parseFloat(style.paddingRight);
                return {left:frame.left,right:frame.right,width:frame.width,
                  nativeLeft:native.left,nativeRight:native.right,
                  nameLeft:name.left,nameRight:name.right,
                  bodyLeft:container.left+leftInset,bodyRight:container.right-rightInset,
                  opacity:getComputedStyle(input).opacity,hasNativePicker:input.type==='date',
                  displayed:control.querySelector('.builder-date-text').textContent};
              });
              assert.ok(Math.abs(dateField.left-dateField.nameLeft)<=1&&
                Math.abs(dateField.right-dateField.nameRight)<=1&&
                dateField.left>=dateField.bodyLeft-1&&dateField.right<=dateField.bodyRight+1&&
                dateField.nativeLeft>=dateField.left-1&&dateField.nativeRight<=dateField.right+1&&
                dateField.opacity==='0'&&dateField.hasNativePicker&&dateField.displayed.length>3,
                label+' date FIELD must match the pass name field, not merely fit inside the dialog: '+JSON.stringify(dateField));
              await page.locator('#builder').evaluate(dialog=>{dialog.scrollLeft=100;});
              assert.equal(await page.locator('#builder').evaluate(dialog=>dialog.scrollLeft),0,
                label+' must not allow sideways dragging of the builder');
            }
            for(const width of [320,360,375,390,430,600,768]){
              await page.setViewportSize({width,height:844});
              await auditBuilder('Passbyggare '+width+'px');
              if(width===320||width===390)await page.screenshot({path:'test-results/ingemar-demo/builder-'+width+'.png'});
            }
            await page.setViewportSize({width:320,height:700});
            const enlargedFonts=await page.addStyleTag({content:'#builder .type-pills .pill,#builder .metric-pills .pill,#builder .modal-actions button{font-size:17px!important}#builder .modal-head h2{font-size:28px!important}'});
            await auditBuilder('Passbyggare 320px med större text');
            await enlargedFonts.evaluate(style=>style.remove());
            await page.setViewportSize({width:390,height:844});
            const firstName=page.locator('[data-exercise-name-input="0"]');
            assert.equal(await firstName.getAttribute('readonly'),'');
            await firstName.click();
            assert.equal(await page.locator('[data-exercise-menu="0"]').isVisible(),true);
            assert.equal(await page.locator('[data-exercise-menu="0"] [data-exercise-name="Bänkpress"]').count(),1,
              'Push examples should be derived from the saved Ingemar data');
            assert.equal(await page.locator('[data-exercise-new="0"]').textContent(),'＋ Ny övning');
            await auditBuilder('Passbyggare med övningsdropdown 390px');
            await page.locator('[data-exercise-picker="0"]').click();
            const originalDate=await page.locator('#build-date').inputValue();
            const originalDateText=await page.locator('#build-date-text').textContent();
            await page.locator('#build-date').fill('2026-12-31');
            assert.equal(await page.locator('#build-date').inputValue(),'2026-12-31');
            assert.match(await page.locator('#build-date-text').textContent(),/31.+2026/,
              'The visible date must follow the actual native date input');
            await auditBuilder('Passbyggare med ändrat datum 390px');
            await page.locator('#build-date').fill(originalDate);
            assert.equal(await page.locator('#build-date-text').textContent(),originalDateText,
              'Resetting the native date input must update the visible date again');
            await page.locator('#builder').evaluate(dialog=>{dialog.scrollTop=dialog.scrollHeight;});
            await auditBuilder('Passbyggare nedscrollad 390px');
            await page.screenshot({path:'test-results/ingemar-demo/builder-bottom-390.png'});
            await page.locator('[data-action="add-exercise"]').click();
            const customIndex=(await page.locator('#exercise-list .exercise-card').count())-1;
            assert.equal(await page.locator('[data-exercise-menu="'+customIndex+'"]').isVisible(),true,
              'A new row should immediately offer the saved examples');
            await page.locator('[data-exercise-new="'+customIndex+'"]').click();
            const customInput=page.locator('[data-exercise-name-input="'+customIndex+'"]');
            assert.equal(await customInput.getAttribute('readonly'),null);
            await customInput.fill('  Demo   flyes Ingemar  ');
            await page.locator('[data-action="save-plan"]').click();
            assert.equal(await page.locator('#builder').evaluate(el=>el.open),false);
            assert.equal(await page.evaluate(()=>document.body.dataset.builderOpen||''),'');
            assert.notEqual(await page.evaluate(()=>getComputedStyle(document.body).position),'fixed');
            assert.equal(await page.evaluate(()=>window.scrollY),preBuilderY,'Closing the builder restores the background scroll position');

            await page.evaluate(()=>document.querySelector('[data-action="build"]').click());
            await page.locator('[data-exercise-name-input="0"]').click();
            assert.equal(await page.locator('[data-exercise-menu="0"] [data-exercise-name="Demo flyes Ingemar"]').count(),1,
              'A newly saved exercise must become a live catalog option');
            await page.locator('[data-exercise-picker="0"]').click();
            const savedCustomIndex=(await page.locator('#exercise-list .exercise-card').count())-1;
            await page.locator('[data-remove-exercise="'+savedCustomIndex+'"]').click();
            await page.locator('[data-action="save-plan"]').click();
            await page.evaluate(()=>document.querySelector('[data-action="build"]').click());
            await page.locator('[data-exercise-name-input="0"]').click();
            assert.equal(await page.locator('[data-exercise-menu="0"] [data-exercise-name="Demo flyes Ingemar"]').count(),0,
              'Exercise catalog is derived live; an unlogged name disappears after its last saved occurrence is removed');
            await page.locator('[data-exercise-picker="0"]').click();
            assert.equal(await page.locator('[data-set="0:0:weight"]').inputValue(),'60');
            assert.equal(await page.locator('[data-set="0:1:weight"]').inputValue(),'65');
            assert.equal(await page.locator('[data-set="0:2:weight"]').inputValue(),'67.5');
            await page.locator('[data-set="0:1:weight"]').fill('72.5');
            await page.locator('[data-set="0:1:reps"]').fill('9');
            await page.locator('[data-add-set="0"]').click();
            await page.setViewportSize({width:320,height:700});
            await auditBuilder('Passbyggare med extra set 320px');
            await page.setViewportSize({width:390,height:844});
            assert.equal(await page.locator('[data-set="0:3:weight"]').inputValue(),'67.5');
            await page.locator('[data-set="0:3:weight"]').fill('75');
            await page.locator('[data-remove-set="0:3"]').click();
            await page.locator('[data-mode="1:min"]').click();
            await page.setViewportSize({width:320,height:700});
            await auditBuilder('Passbyggare med tidsbaserat set 320px');
            await page.setViewportSize({width:390,height:844});
            assert.equal(await page.locator('[data-set="1:0:minutes"]').inputValue(),'5');
            await page.locator('[data-set="1:0:minutes"]').fill('3.5');
            await page.screenshot({path:'test-results/ingemar-demo/set-editor-mobile.png'});
            await page.locator('[data-action="start-from-builder"]').click();
            await page.waitForSelector('#session:not([hidden])');
            assert.equal(await page.locator('#session').getAttribute('data-kind'),'Push');
            async function saveVisibleSession(label){
              await page.locator('#finish-session').scrollIntoViewIfNeeded();
              const position=await page.locator('#finish-session').evaluate(el=>{
                const r=el.getBoundingClientRect();return {top:r.top,bottom:r.bottom,height:innerHeight};
              });
              assert.ok(position.top>=0&&position.bottom<=position.height+1,
                label+' save button must remain reachable after scrolling: '+JSON.stringify(position));
              await page.locator('#finish-session').click();
            }
            async function assertActionsInFlow(label,shouldFit){
              const placement=await page.locator('#session-controls').evaluate(el=>{
                const rect=el.getBoundingClientRect(),buttons=[...el.querySelectorAll('button:not([disabled])')].map(btn=>{
                  const r=btn.getBoundingClientRect();return {left:r.left,right:r.right,top:r.top,bottom:r.bottom};
                });
                return {position:getComputedStyle(el).position,top:rect.top,bottom:rect.bottom,width:innerWidth,height:innerHeight,buttons};
              });
              assert.ok(placement.position!=='fixed'&&placement.position!=='sticky'&&
                placement.buttons.length>=1&&placement.buttons.every(r=>r.left>=-1&&r.right<=placement.width+1),
                label+' actions must sit in the normal layout: '+JSON.stringify(placement));
              if(shouldFit)assert.ok(placement.top>=0&&placement.bottom<=placement.height+1,
                label+' must appear without scrolling on a regular phone: '+JSON.stringify(placement));
            }
            for(const width of [320,360,390,430,768,1440]){
              await page.setViewportSize({width,height:width===1440?960:844});
              await auditNoHorizontalScroll('Pushläge '+width+'px');
              await assertActionsInFlow('Starta set '+width+'px',width===390||width===430);
              if(width===320||width===390)await page.screenshot({path:'test-results/ingemar-demo/push-session-'+width+'.png'});
            }
            for(const viewport of [{width:320,height:568},{width:390,height:667}]){
              await page.setViewportSize(viewport);
              await assertActionsInFlow('Starta set / kort mobil '+viewport.width+'×'+viewport.height,false);
              await auditNoHorizontalScroll('Kort mobil '+viewport.width+'×'+viewport.height);
            }
            await page.setViewportSize({width:390,height:844});
            assert.equal(await page.locator('#session-modal').getAttribute('data-state'),'ready');
            assert.equal(await page.locator('#session-live-timer').evaluate(el=>el.hidden),true,
              'Strength sets use the count-up timer at top right, not a one-minute ring');
            const strengthLayout=await page.evaluate(()=>{
              const ring=document.getElementById('session-live-timer'),flow=document.querySelector('#session-modal .hype-workout-progress'),
                button=document.getElementById('session-controls'),log=document.getElementById('session-set-log');
              return {ringDisplay:getComputedStyle(ring).display,flowBottom:flow.getBoundingClientRect().bottom,
                actionTop:button.getBoundingClientRect().top,logTop:log.getBoundingClientRect().top,
                logImmediatelyBelow:button.nextElementSibling?.classList.contains('session-log-section')};
            });
            assert.ok(strengthLayout.ringDisplay==='none'&&strengthLayout.logImmediatelyBelow&&
              strengthLayout.actionTop>=strengthLayout.flowBottom&&strengthLayout.actionTop-strengthLayout.flowBottom<30&&
              strengthLayout.logTop>strengthLayout.actionTop,
              'Strength action must follow progress without an invisible ring: '+JSON.stringify(strengthLayout));
            assert.match(await page.locator('#session-current-target').textContent(),/60 kg/);
            assert.equal(await page.locator('#session-prestart-toggle').getAttribute('aria-pressed'),'true');
            await page.locator('[data-action="toggle-prestart"]').click();
            assert.equal(await page.locator('#session-prestart-toggle').getAttribute('aria-pressed'),'false');
            assert.equal(await page.locator('#session-exercises .mode-exercise-card').count(),3);
            assert.ok(await page.locator('#session-modal .session-grid').evaluate(el=>
              parseFloat(getComputedStyle(el).paddingBottom)<65),'The normal layout must not reserve empty space for a fixed action bar');
            const railGeometry=await page.locator('#session-exercises').evaluate(el=>({
              height:el.getBoundingClientRect().height,scrollHeight:el.scrollHeight,clientHeight:el.clientHeight,
              overflow:getComputedStyle(el).overflowY
            }));
            assert.ok(railGeometry.height>400 && railGeometry.scrollHeight<=railGeometry.clientHeight+2 &&
              railGeometry.overflow==='visible','Rail must grow with every card instead of clipping: '+JSON.stringify(railGeometry));
            await page.locator('#session-exercises .mode-exercise-card').last().scrollIntoViewIfNeeded();
            await assertActionsInFlow('Setknappar ligger i det normala sidflödet, även efter scrollning',false);
            const cardVisibility=await page.evaluate(()=>{
              const el=document.querySelector('#session-exercises .mode-exercise-card:last-child');
              const r=el.getBoundingClientRect(),mode=document.getElementById('session');
              return {top:r.top,bottom:r.bottom,viewport:innerHeight,outerScroll:mode.scrollTop,railScroll:document.getElementById('session-exercises').scrollTop};
            });
            assert.ok(cardVisibility.top>=0&&cardVisibility.bottom<=cardVisibility.viewport+2 &&
              cardVisibility.outerScroll>0 && cardVisibility.railScroll===0,
              'Scrolling down must expose the entire last exercise card: '+JSON.stringify(cardVisibility));
            assert.equal(await page.locator('#session-modal .session-top').evaluate(el=>getComputedStyle(el).backgroundColor),'rgb(8, 13, 20)','Sticky title bar must obscure the scrolling set cards');
            await auditNoHorizontalScroll('Fully expanded set cards 390px');
            await page.screenshot({path:'test-results/ingemar-demo/all-set-cards-mobile.png'});
            await page.locator('[data-action="advance-session"]').click();
            assert.equal(await page.locator('#session-stage').textContent(),'Aktivt set');
            assert.equal(await page.locator('#session-modal').getAttribute('data-state'),'active');
            assert.match(await page.locator('#session-ecg-label').textContent(),/Aktivt set/);
            assert.equal(await page.locator('#session-live-timer').evaluate(el=>el.hidden),true);
            assert.equal(await page.locator('#session-ring-label').textContent(),'REDO FÖR SET');
            await assertActionsInFlow('Klar med set under styrkeset',false);
            await auditNoHorizontalScroll('Aktivt styrkeset 390px');
            assert.equal(await page.locator('[data-actual="0:1:weight"]').inputValue(),'72.5');
            assert.equal(await page.locator('[data-actual="0:1:reps"]').inputValue(),'9');
            assert.equal(await page.locator('[data-actual="1:0:minutes"]').inputValue(),'3.5');
            await page.locator('[data-action="advance-session"]').click();
            assert.equal(await page.locator('#session-stage').textContent(),'Återhämtning');
            assert.equal(await page.locator('#session-modal').getAttribute('data-state'),'rest');
            assert.equal(await page.locator('#session-live-timer').evaluate(el=>el.hidden),false);
            assert.equal(await page.locator('#session-ring-label').textContent(),'VILA KVAR');
            assert.notEqual(await page.locator('#session-live-timer').evaluate(el=>getComputedStyle(el).display),'none',
              'The ring remains visible during recovery');
            await assertActionsInFlow('Hoppa över vilan',false);
            assert.equal(await page.locator('#session-countdown-ring').getAttribute('role'),'timer');
            assert.match(await page.locator('#session-ring-value').textContent(),/^\d{2}:\d{2}$/);
            await auditNoHorizontalScroll('Glowing rest ring 390px');
            await page.screenshot({path:'test-results/ingemar-demo/glowing-rest-timer-mobile.png'});
            assert.equal(await page.locator('[data-action="skip-rest"]').count(),1);
            await page.locator('[data-action="skip-rest"]').click();
            assert.equal(await page.locator('#session-modal').getAttribute('data-state'),'ready');
            assert.equal(await page.locator('[data-action="extra-session-set"]').count(),1);
            assert.equal(await page.locator('[data-action="finish-session-exercise"]').count(),1);
            assert.equal(await page.locator('#session-live-timer').evaluate(el=>getComputedStyle(el).display),'none',
              'The next-set action must not have an empty timer placeholder');
            for(const viewport of [{width:320,height:568},{width:390,height:667}]){
              await page.setViewportSize(viewport);
              await assertActionsInFlow('Tre beslutsknappar '+viewport.width+'×'+viewport.height,false);
              await auditNoHorizontalScroll('Tre beslutsknappar '+viewport.width+'×'+viewport.height);
            }
            await page.setViewportSize({width:390,height:844});
            assert.equal(await page.locator('#session-set-log .set-log-item').count(),1,
              'The compact log shows the completed set above the detailed plan');
            await page.locator('[data-log-actual="0:0:weight"]').fill('61');
            assert.equal(await page.locator('[data-actual="0:0:weight"]').inputValue(),'61',
              'Logged-set edits update the independent detailed set plan');
            await page.locator('[data-done="0:1"]').click();
            await page.locator('[data-actual="0:1:weight"]').fill('73');
            await page.locator('[data-done="1:0"]').click();
            await page.screenshot({path:'test-results/ingemar-demo/live-sets-mobile.png'});
            await saveVisibleSession('Push');
            await page.waitForFunction(()=>document.getElementById('session').hidden);
            const saved=await page.evaluate(()=>JSON.parse(localStorage.getItem('ingemar-pulse-demo-v1')));
            const latest=saved.history.at(-1);
            assert.equal(latest.type,'Push');
            assert.deepEqual(latest.exercises[0].sets.map(s=>s.weight),[61,73]);
            assert.deepEqual(latest.exercises[0].sets.map(s=>s.reps),[12,9]);
            assert.equal(latest.exercises[1].sets[0].minutes,3.5);
