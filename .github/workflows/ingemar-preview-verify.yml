name: Ingemar demo preview verification

on:
  push:
    branches: [main]
    paths:
      - 'budget/ingemar-preview.html'
      - 'budget/tests/ingemar-preview.test.cjs'
      - '.github/workflows/ingemar-preview-verify.yml'
  workflow_dispatch:

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate standalone source
        run: node --test budget/tests/ingemar-preview.test.cjs
      - name: Install WebKit
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps webkit
      - name: Serve preview
        run: |
          python3 -m http.server 4173 --directory . >/tmp/ingemar-preview-http.log 2>&1 &
          sleep 2
      - name: Test mobile and desktop interactions
        run: |
          cat > /tmp/ingemar-preview-e2e.cjs <<'EOF'
          const {webkit}=require(process.cwd()+'/node_modules/playwright');
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          (async()=>{
            const browser=await webkit.launch();
            const context=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
            const page=await context.newPage(),errors=[],firebaseRequests=[];
            page.on('pageerror',e=>errors.push(e.message));
            page.on('request',r=>{if(/firebase|firestore|googleapis\.com\/identitytoolkit/.test(r.url()))firebaseRequests.push(r.url());});
            await page.route('https://fonts.googleapis.com/**',r=>r.fulfill({status:200,contentType:'text/css',body:''}));
            await page.route('https://fonts.gstatic.com/**',r=>r.abort());
            fs.mkdirSync('test-results/ingemar-demo',{recursive:true});
            await page.goto('http://127.0.0.1:4173/budget/ingemar-preview.html');
            await page.waitForSelector('[data-choice="Push"]');
            assert.equal(await page.title(),'Ingemars träning · Förhandsvisning');
            async function auditNoHorizontalScroll(label){
              const result=await page.evaluate(()=>{
                const width=innerWidth, selectors='main,header .inner,.hero,.stats,.choices,.week,.history,dialog[open],dialog[open] .modal-body,dialog[open] .exercise-card,.mode-screen:not([hidden]),#session-modal,#session-modal .session-shell,#session-modal .session-top,#session-modal .session-grid,#session-modal .session-main,#session-modal .session-timers,#session-modal .session-cta-row,#session-modal .session-set-rail,#session-modal .session-set-rail .mode-exercise-card,#session-modal .session-set-rail .mode-set-row,.mode-topbar,.zen-layout,.zen-scenery,.zen-workspace';
                const candidates=[...document.querySelectorAll(selectors)].filter(el=>el.getClientRects().length>0 && getComputedStyle(el).visibility!=='hidden');
                const invalid=candidates.map(el=>{
                  const box=el.getBoundingClientRect();
                  return {selector:el.tagName.toLowerCase()+(el.id?'#'+el.id:'.'+String(el.className).trim().replace(/\s+/g,'.')),
                    left:box.left,right:box.right,scroll:el.scrollWidth,client:el.clientWidth};
                }).filter(v=>v.left<-1||v.right>width+1||v.scroll>v.client+1);
                return {width,html:document.documentElement.scrollWidth,body:document.body.scrollWidth,invalid:invalid.slice(0,12)};
              });
              assert.ok(result.html<=result.width+1&&result.body<=result.width+1&&result.invalid.length===0,
                label+' horizontally overflows: '+JSON.stringify(result));
            }
            for(const width of [320,360,390,430,768,1440]){
              await page.setViewportSize({width,height:width===1440?960:844});
              await auditNoHorizontalScroll('Startsida '+width+'px');
              await page.screenshot({path:'test-results/ingemar-demo/overview-'+width+'.png',fullPage:true});
            }
            await page.setViewportSize({width:390,height:844});
            await page.locator('[data-choice="Push"]').click();
            assert.equal(await page.locator('#builder').evaluate(el=>el.open),true);
            for(const width of [320,390,768]){
              await page.setViewportSize({width,height:844});
              await auditNoHorizontalScroll('Passbyggare '+width+'px');
            }
            await page.setViewportSize({width:390,height:844});
            assert.equal(await page.locator('[data-set="0:0:weight"]').inputValue(),'60');
            assert.equal(await page.locator('[data-set="0:1:weight"]').inputValue(),'65');
            assert.equal(await page.locator('[data-set="0:2:weight"]').inputValue(),'67.5');
            await page.locator('[data-set="0:1:weight"]').fill('72.5');
            await page.locator('[data-set="0:1:reps"]').fill('9');
            await page.locator('[data-add-set="0"]').click();
            assert.equal(await page.locator('[data-set="0:3:weight"]').inputValue(),'67.5');
            await page.locator('[data-set="0:3:weight"]').fill('75');
            await page.locator('[data-remove-set="0:3"]').click();
            await page.locator('[data-mode="1:min"]').click();
            assert.equal(await page.locator('[data-set="1:0:minutes"]').inputValue(),'5');
            await page.locator('[data-set="1:0:minutes"]').fill('3.5');
            await page.screenshot({path:'test-results/ingemar-demo/set-editor-mobile.png'});
            await page.locator('[data-action="start-from-builder"]').click();
            await page.waitForSelector('#session:not([hidden])');
            assert.equal(await page.locator('#session').getAttribute('data-kind'),'Push');
            for(const width of [320,360,390,430,768,1440]){
              await page.setViewportSize({width,height:width===1440?960:844});
              await auditNoHorizontalScroll('Pushläge '+width+'px');
              if(width===320||width===390)await page.screenshot({path:'test-results/ingemar-demo/push-session-'+width+'.png'});
            }
            await page.setViewportSize({width:390,height:844});
            assert.equal(await page.locator('#session-modal').getAttribute('data-state'),'ready');
            assert.match(await page.locator('#session-current-target').textContent(),/60 kg/);
            assert.equal(await page.locator('#session-exercises .mode-exercise-card').count(),3);
            await page.locator('[data-action="advance-session"]').click();
            assert.equal(await page.locator('#session-stage').textContent(),'Aktivt set');
            assert.equal(await page.locator('#session-modal').getAttribute('data-state'),'active');
            assert.match(await page.locator('#session-ecg-label').textContent(),/Aktivt set/);
            await auditNoHorizontalScroll('Aktivt styrkeset 390px');
            assert.equal(await page.locator('[data-actual="0:1:weight"]').inputValue(),'72.5');
            assert.equal(await page.locator('[data-actual="0:1:reps"]').inputValue(),'9');
            assert.equal(await page.locator('[data-actual="1:0:minutes"]').inputValue(),'3.5');
            await page.locator('[data-action="advance-session"]').click();
            assert.equal(await page.locator('#session-stage').textContent(),'Återhämtning');
            assert.equal(await page.locator('#session-modal').getAttribute('data-state'),'rest');
            assert.equal(await page.locator('[data-action="skip-rest"]').count(),1);
            await page.locator('[data-action="skip-rest"]').click();
            assert.equal(await page.locator('#session-modal').getAttribute('data-state'),'ready');
            assert.equal(await page.locator('[data-action="extra-session-set"]').count(),1);
            assert.equal(await page.locator('[data-action="finish-session-exercise"]').count(),1);
            await page.locator('[data-done="0:1"]').click();
            await page.locator('[data-actual="0:1:weight"]').fill('73');
            await page.locator('[data-done="1:0"]').click();
            await page.screenshot({path:'test-results/ingemar-demo/live-sets-mobile.png'});
            await page.locator('[data-action="finish-session"]').click();
            await page.waitForFunction(()=>document.getElementById('session').hidden);
            const saved=await page.evaluate(()=>JSON.parse(localStorage.getItem('ingemar-pulse-demo-v1')));
            const latest=saved.history.at(-1);
            assert.equal(latest.type,'Push');
            assert.deepEqual(latest.exercises[0].sets.map(s=>s.weight),[60,73]);
            assert.deepEqual(latest.exercises[0].sets.map(s=>s.reps),[12,9]);
            assert.equal(latest.exercises[1].sets[0].minutes,3.5);
            await page.locator('#history [data-history]').first().click();
            await page.waitForSelector('#history-detail[open]');
            assert.equal(await page.locator('#history-detail .exercise-card').count(),2);
            const historyDetails=await page.locator('#history-detail-body').innerText();
            assert.ok(historyDetails.includes('73')&&historyDetails.includes('3.5'),
              'Recorded set details were not visible: '+historyDetails);
            await page.locator('[data-action="close-history"]').first().click();
            await page.locator('[data-choice="Pull"]').click();
            await page.locator('[data-action="start-from-builder"]').click();
            await page.waitForSelector('#session:not([hidden])');
            assert.equal(await page.locator('#session').getAttribute('data-kind'),'Pull');
            await auditNoHorizontalScroll('Pullläge 390px');
            await page.screenshot({path:'test-results/ingemar-demo/pull-session-mobile.png'});
            const pullExercise=await page.locator('#session-current-ex').textContent();
            await page.locator('[data-action="advance-session"]').click();
            await page.locator('[data-action="advance-session"]').click();
            await page.locator('[data-action="skip-rest"]').click();
            await page.locator('[data-action="extra-session-set"]').click();
            assert.equal(await page.locator('[data-actual="0:3:weight"]').count(),1,'Extra set should add its own editable row');
            assert.equal(await page.locator('#session-modal').getAttribute('data-state'),'active');
            await page.locator('[data-action="advance-session"]').click();
            await page.locator('[data-action="skip-rest"]').click();
            await page.locator('[data-action="finish-session-exercise"]').click();
            assert.notEqual(await page.locator('#session-current-ex').textContent(),pullExercise,'Övning klar should progress to the next exercise');
            await page.locator('[data-action="finish-session"]').click();
            await page.locator('[data-choice="Kondition"]').click();
            await page.locator('[data-action="start-from-builder"]').click();
            await page.waitForSelector('#session:not([hidden])');
            assert.equal(await page.locator('#session').getAttribute('data-kind'),'Kondition');
            await page.locator('[data-action="advance-session"]').click();
            assert.equal(await page.locator('#session-stage').textContent(),'Kondition pågår');
            assert.equal(await page.locator('#session-modal').getAttribute('data-state'),'active');
            assert.equal(await page.locator('#session-cardio-countdown').evaluate(el=>el.hidden),false);
            assert.match(await page.locator('#session-ecg-label').textContent(),/Kondition pågår/);
            await auditNoHorizontalScroll('Konditionsläge 390px');
            await page.screenshot({path:'test-results/ingemar-demo/cardio-session-mobile.png'});
            await page.locator('[data-done="0:0"]').click();
            await page.locator('[data-action="finish-session"]').click();
            await page.reload();
            assert.equal(await page.locator('#history .history-row').count()>0,true);
            await page.locator('[data-view="stretch"]').click();
            await page.locator('[data-zen-index="0"]').click();
            await page.waitForSelector('#zen-session:not([hidden])');
            assert.equal(await page.locator('#zen-session').getAttribute('data-kind'),'stretch');
            for(const width of [320,360,390,430,768]){
              await page.setViewportSize({width,height:844});
              await auditNoHorizontalScroll('Stretchläge '+width+'px');
              if(width===320||width===390)await page.screenshot({path:'test-results/ingemar-demo/stretch-session-'+width+'.png'});
            }
            await page.setViewportSize({width:390,height:844});
            const stretchFirst=await page.locator('#zen-session-title').textContent();
            await page.locator('[data-action="next-zen"]').click();
            assert.notEqual(await page.locator('#zen-session-title').textContent(),stretchFirst);
            await page.locator('[data-zen-step="0"]').click();
            assert.equal(await page.locator('#zen-session-title').textContent(),stretchFirst);
            await page.locator('[data-action="pause-zen"]').click();
            assert.equal(await page.locator('#zen-breath').textContent(),'PAUSAD');
            await page.locator('[data-action="finish-zen"]').click();
            await page.locator('[data-view="meditation"]').click();
            await page.locator('[data-zen-index="1"]').click();
            await page.waitForSelector('#zen-session:not([hidden])');
            assert.equal(await page.locator('#zen-session').getAttribute('data-kind'),'meditation');
            for(const width of [320,390,430]){
              await page.setViewportSize({width,height:844});
              await auditNoHorizontalScroll('Meditationsläge '+width+'px');
              if(width===320||width===390)await page.screenshot({path:'test-results/ingemar-demo/meditation-session-'+width+'.png'});
            }
            await page.setViewportSize({width:390,height:844});
            assert.match(await page.locator('#zen-breath').textContent(),/ANDAS (IN|UT)/);
            await page.locator('[data-action="next-zen"]').click();
            assert.equal(await page.locator('#zen-stage-list [aria-current="step"]').count(),1);
            await page.locator('[data-action="finish-zen"]').click();
            await page.locator('[data-view="training"]').click();
            page.once('dialog',d=>d.accept());
            await page.locator('[data-action="reset"]').click();
            const reset=await page.evaluate(()=>JSON.parse(localStorage.getItem('ingemar-pulse-demo-v1')));
            assert.equal(reset.history.length,8,'Reset must restore original fake history');
            assert.deepEqual(errors,[],'Browser errors: '+errors.join(' | '));
            assert.deepEqual(firebaseRequests,[],'Unexpected Firebase calls');
            await browser.close();
            console.log('Original Pulse Flow CSS, start/complete/next/extra/finish lifecycle, independent sets, Zen and mobile overflow passed');
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node /tmp/ingemar-preview-e2e.cjs
      - name: Upload visual snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingemar-demo-visual-review
          path: test-results/ingemar-demo/
          if-no-files-found: warn
