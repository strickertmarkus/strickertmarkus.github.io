            async function auditZenDial(label){
              const dial=await page.locator('#zen-session-ring').evaluate(ring=>{
                const rb=ring.getBoundingClientRect(),inner=ring.querySelector('.zen-clock-inner').getBoundingClientRect(),
                  arc=ring.querySelector('#zen-step-arc'),children=[...ring.querySelector('.zen-clock-inner').children];
                return {ring:{left:rb.left,right:rb.right,top:rb.top,bottom:rb.bottom,width:rb.width,height:rb.height},
                  inner:{left:inner.left,right:inner.right,top:inner.top,bottom:inner.bottom,width:inner.width,height:inner.height},
                  textOverflow:children.filter(el=>el.scrollWidth>el.clientWidth+1).map(el=>({id:el.id,scroll:el.scrollWidth,client:el.clientWidth,text:el.textContent})),
                  boxShadow:getComputedStyle(ring).boxShadow,arcFilter:getComputedStyle(arc).filter};
              });
              assert.ok(dial.inner.left>=dial.ring.left+dial.ring.width*.1&&
                dial.inner.right<=dial.ring.right-dial.ring.width*.1&&
                dial.inner.top>=dial.ring.top+dial.ring.height*.1&&
                dial.inner.bottom<=dial.ring.bottom-dial.ring.height*.1&&
                dial.textOverflow.length===0,label+' timer text must fit inside the circle: '+JSON.stringify(dial));
              assert.notEqual(dial.boxShadow,'none',label+' timer needs visible ring glow');
              assert.notEqual(dial.arcFilter,'none',label+' progress arc needs glow');
            }
