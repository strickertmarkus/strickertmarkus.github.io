name: Timer touch owner cleanup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/timer-touch-owner-cleanup.yml'
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply cleanup and touch-owner patch
        run: python3 .github/scripts/timer_touch_owner_cleanup.py
      - name: Validate JavaScript syntax
        run: node --check budget/exercise-timer-focus.js && node --check budget/exercise-pulse-flow-canvas-glow-v131.js
      - name: Install jsdom for gesture harness
        run: npm install --no-save jsdom@24
      - name: Run repeated mobile touch-cycle harness
        run: node .github/scripts/test_timer_touch_cycles.mjs
      - name: Validate cleanup
        run: |
          ! grep -q "loadTimerFocus" budget/exercise-pulse-flow-canvas-glow-v131.js
          ! grep -q "pointerdown" budget/exercise-timer-focus.js
          ! grep -q "pointermove" budget/exercise-timer-focus.js
          ! grep -q "cardio-focus-v145" budget/exercise-timer-focus.js
          grep -q "final19-touchowner" budget/exercise.html
      - name: Commit tested fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add budget/exercise-timer-focus.js budget/exercise-pulse-flow-canvas-glow-v131.js budget/exercise.html budget/auth-config.js budget/auth-gate.js
          git diff --cached --quiet || git commit -m 'Use one touch owner for timer swipe'
          git push
