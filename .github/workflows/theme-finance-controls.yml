name: Theme finance controls

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/theme-finance-controls.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply themed finance controls
        run: python3 .github/scripts/theme_finance_controls.py

      - name: Verify JavaScript
        run: node --check budget/finance-ui.js

      - name: Verify scoped changes
        shell: bash
        run: |
          grep -q "finance-month-arrow-clean-v1{appearance:none!important;width:32px" budget/finance-ui.js
          grep -q "body .container .month-btn" budget/finance-ui.js
          grep -q "body .container>.month-selector" budget/finance-ui.js
          grep -q "body .container .btn-add" budget/finance-ui.js
          grep -q "body .container .table-collapse-btn" budget/finance-ui.js
          grep -q "body .modal-btn-primary" budget/finance-ui.js
          grep -q "header>.nav-dropdown-wrapper>button" budget/finance-ui.js
          grep -q "finance-theme-exp-v4" budget/budget.html
          grep -q "finance-theme-exp-v4" budget/budget_maja.html
          grep -q "finance-theme-exp-v4" budget/analytics.html
          grep -q "finance-theme-exp-v4" budget/analytics_maja.html
          grep -q "finance-theme-exp-v4" budget/familjebudget.html
          git diff --quiet -- budget/firebase-sync.js budget/indexeddb-fallback.js budget/budget-persistence-guard.js
          changed="$(git diff --name-only)"
          echo "$changed"
          while IFS= read -r f; do
            case "$f" in
              budget/finance-ui.js|budget/budget.html|budget/budget_maja.html|budget/analytics.html|budget/analytics_maja.html|budget/familjebudget.html) ;;
              '') ;;
              *) echo "Unexpected changed file: $f" >&2; exit 1 ;;
            esac
          done <<< "$changed"

      - name: Commit themed controls
        shell: bash
        run: |
          git config user.name "strickertmarkus"
          git config user.email "markus.strickert@sigmatechnology.com"
          git add budget/finance-ui.js budget/budget.html budget/budget_maja.html budget/analytics.html budget/analytics_maja.html budget/familjebudget.html
          git commit -m "Theme finance controls by view"
          git push
