name: Finance morph v13

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finance-morph-v13.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add shared-element morph transitions
        run: python3 .github/scripts/apply_finance_morph_v13.py

      - name: Verify JavaScript syntax
        run: node --check budget/finance-ui.js

      - name: Verify morph scope
        shell: bash
        run: |
          grep -q "@view-transition{navigation:auto}" budget/finance-ui.js
          grep -q "finance-panel-2" budget/finance-ui.js
          grep -q "setupFinanceMorphTargets();" budget/finance-ui.js
          grep -q "finance-clean-v13" budget/budget.html
          grep -q "finance-clean-v13" budget/analytics.html
          grep -q "finance-clean-v13" budget/familjebudget.html
          git diff --quiet -- budget/firebase-sync.js budget/indexeddb-fallback.js budget/budget-persistence-guard.js
          changed="$(git diff --name-only)"
          echo "$changed"
          while IFS= read -r f; do
            case "$f" in
              budget/finance-ui.js|budget/budget.html|budget/budget_maja.html|budget/analytics.html|budget/analytics_maja.html|budget/familjebudget.html) ;;
              '') ;;
              *) echo "Unexpected changed file: $f" >&2; exit 1 ;;
            esac
          done <<< "$changed"

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "strickertmarkus"
          git config user.email "markus.strickert@sigmatechnology.com"
          git add budget/finance-ui.js budget/budget.html budget/budget_maja.html budget/analytics.html budget/analytics_maja.html budget/familjebudget.html
          git commit -m "Add morph transitions between finance pages"
          git push
