name: Refine budget blue theme

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-budget-blue-theme.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refine Budget blue theme
        run: python3 .github/scripts/refine_budget_blue_theme.py

      - name: Verify JavaScript
        run: node --check budget/finance-ui.js

      - name: Verify scoped changes
        shell: bash
        run: |
          grep -q "accent: '#3B82F6'" budget/finance-ui.js
          grep -q "month: '#7DD3FC'" budget/finance-ui.js
          grep -q -- "--finance-theme-bg-alpha" budget/finance-ui.js
          grep -q "finance-theme-exp-v3" budget/budget.html
          grep -q "finance-theme-exp-v3" budget/budget_maja.html
          grep -q "finance-theme-exp-v3" budget/analytics.html
          grep -q "finance-theme-exp-v3" budget/analytics_maja.html
          grep -q "finance-theme-exp-v3" budget/familjebudget.html
          git diff --quiet -- budget/firebase-sync.js budget/indexeddb-fallback.js budget/budget-persistence-guard.js
          changed="$(git diff --name-only)"
          echo "$changed"
          while IFS= read -r f; do
            case "$f" in
              budget/finance-ui.js|budget/budget.html|budget/budget_maja.html|budget/analytics.html|budget/analytics_maja.html|budget/familjebudget.html) ;;
              '') ;;
              *) echo "Unexpected changed file: $f" >&2; exit 1 ;;
            esac
          done <<< "$changed"

      - name: Commit refinement
        shell: bash
        run: |
          git config user.name "strickertmarkus"
          git config user.email "markus.strickert@sigmatechnology.com"
          git add budget/finance-ui.js budget/budget.html budget/budget_maja.html budget/analytics.html budget/analytics_maja.html budget/familjebudget.html
          git commit -m "Refine Budget blue theme contrast"
          git push
