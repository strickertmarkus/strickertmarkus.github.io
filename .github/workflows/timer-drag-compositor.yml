name: Timer drag compositor
on:
  push:
    paths:
      - '.github/workflows/timer-drag-compositor.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply compositor drag patch
        run: python .github/scripts/timer_drag_compositor.py
      - name: Validate timer script
        run: node --check budget/exercise-timer-focus.js
      - name: Commit timer fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet || git commit -m "Smooth cardio timer drag as one layer"
          git push
