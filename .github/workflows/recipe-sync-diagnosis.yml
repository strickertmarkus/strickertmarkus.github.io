name: Recipe sync read-only diagnosis
on:
  push:
    branches: [diagnose/recipe-sync-20261010]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save firebase-admin@13
      - name: Read database rules
        run: |
          node <<'NODE'
          const {initializeApp,cert,deleteApp}=require('firebase-admin/app');
          const {getDatabase}=require('firebase-admin/database');
          (async()=>{
            const app=initializeApp({credential:cert(JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT_JSON)),databaseURL:'https://frick-budget-default-rtdb.europe-west1.firebasedatabase.app'});
            const db=getDatabase(app);
            console.log('RULES '+(await db.getRules()).replace(/[A-Za-z0-9_-]{20,}/g,'[redacted-identifier]'));
            await deleteApp(app);
          })().catch(e=>{console.error(e.message);process.exitCode=1;});
          NODE
