name: Finance view theme experiment

on:
  push:
    branches: [experiment/finance-view-themes-apply]
    paths:
      - '.github/workflows/finance-view-theme-experiment.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply view themes
        run: python3 .github/scripts/apply_finance_view_theme_experiment.py

      - name: Verify JavaScript
        run: node --check budget/finance-ui.js

      - name: Verify experiment scope
        shell: bash
        run: |
          grep -q "financeTheme = view === 'analysis'" budget/finance-ui.js
          grep -q -- "--finance-accent-rgb" budget/finance-ui.js
          grep -q "finance-theme-exp-v1" budget/budget.html
          grep -q "finance-theme-exp-v1" budget/analytics.html
          grep -q "finance-theme-exp-v1" budget/familjebudget.html
          grep -q "el.querySelector('canvas')" budget/finance-ui.js
          grep -q "borderRadius: 6" budget/budget.html
          grep -q "borderRadius: 6" budget/budget_maja.html
          git diff --quiet -- budget/firebase-sync.js budget/indexeddb-fallback.js budget/budget-persistence-guard.js

          changed="$(git diff --name-only)"
          echo "$changed"
          while IFS= read -r f; do
            case "$f" in
              budget/finance-ui.js|budget/budget.html|budget/budget_maja.html|budget/analytics.html|budget/analytics_maja.html|budget/familjebudget.html) ;;
              '') ;;
              *) echo "Unexpected changed file: $f" >&2; exit 1 ;;
            esac
          done <<< "$changed"

      - name: Commit experiment
        shell: bash
        run: |
          git config user.name "strickertmarkus"
          git config user.email "markus.strickert@sigmatechnology.com"
          git add budget/finance-ui.js budget/budget.html budget/budget_maja.html budget/analytics.html budget/analytics_maja.html budget/familjebudget.html
          git commit -m "Experiment with finance view themes"
          git push
