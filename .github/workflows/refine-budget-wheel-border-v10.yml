name: Refine Budget wheel border v10

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-budget-wheel-border-v10.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refine Budget wheel border
        run: python3 .github/scripts/refine_budget_wheel_border_v10.py

      - name: Verify scoped changes
        shell: bash
        run: |
          for f in budget/budget.html budget/budget_maja.html; do
            grep -Fq 'function lightenChartColor(hex, amount = 0.10)' "$f"
            grep -Fq 'borderColor: expenseSections.map(s => lightenChartColor(s.color))' "$f"
            grep -Fq 'borderWidth: 2' "$f"
            grep -Fq 'hoverBorderWidth: 2' "$f"
            grep -Fq 'hoverBorderColor: expenseSections.map(s => lightenChartColor(s.color))' "$f"
            grep -Fq 'backgroundColor: expenseSections.map(s => s.color)' "$f"
            ! grep -Fq 'borderColor: isDarkMode() ? "#0B0F16" : "#FFFFFF"' "$f"
          done
          git diff --quiet -- budget/firebase-sync.js budget/indexeddb-fallback.js budget/budget-persistence-guard.js budget/finance-ui.js budget/analytics.html budget/analytics_maja.html budget/familjebudget.html
          changed="$(git diff --name-only)"
          echo "$changed"
          while IFS= read -r f; do
            case "$f" in
              budget/budget.html|budget/budget_maja.html) ;;
              '') ;;
              *) echo "Unexpected changed file: $f" >&2; exit 1 ;;
            esac
          done <<< "$changed"

      - name: Commit wheel border refinement
        shell: bash
        run: |
          git config user.name "strickertmarkus"
          git config user.email "markus.strickert@sigmatechnology.com"
          git add budget/budget.html budget/budget_maja.html
          git commit -m "Refine Budget wheel segment borders"
          git push
