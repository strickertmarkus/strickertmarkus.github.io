            assert.equal(await page.locator('a[href*="archive/exercise.html"]').count(),0,'No navigation to archived trainer');
            assert.deepEqual(errors.filter(e=>/training-pulse-editor\.js|field-workspace/.test(e)),[],'Host runtime errors: '+errors.join(' | '));
            await browser.close();
          }

