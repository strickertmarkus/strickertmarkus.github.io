name: Pulse Field visual verification

on:
  push:
    paths:
      - 'budget/exercise.html'
      - 'budget/archive/exercise.html'
      - 'budget/training-pulse-field.html'
      - 'budget/zen.html'
      - 'budget/zen.js'
      - 'budget/training-pulse-field.css'
      - 'budget/training-pulse-field.js'
      - '.github/workflows/pulse-field-visual-verify.yml'
  workflow_dispatch:

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install WebKit
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps webkit
      - name: Serve repository
        run: |
          python3 -m http.server 4173 --directory . >/tmp/pulse-field-http.log 2>&1 &
          sleep 2
      - name: Render desktop and mobile
        run: |
          cat > /tmp/pulse-field-visual.cjs <<'EOF'
          const {webkit}=require(process.cwd()+'/node_modules/playwright');
          const assert=require('node:assert/strict');
          const fs=require('node:fs');

          async function animationSnapshot(page){
            return page.evaluate(()=>{
              function read(el){
                const style=getComputedStyle(el),matrix=new DOMMatrix(style.transform==='none'?undefined:style.transform);
                return {transform:style.transform,x:matrix.m41,y:matrix.m42,opacity:parseFloat(style.opacity||'1'),rotation:Math.atan2(matrix.b,matrix.a)*180/Math.PI};
              }
              function pick(selector){return read(document.querySelector(selector));}
              return {
                nebula:pick('.space-scene__nebula'),
                mottle:pick('.space-scene__mottle'),
                near:pick('.space-scene__drift--near'),
                flecks:pick('.space-scene__flecks'),
                stars:Array.from(document.querySelectorAll('.space-star')).map(read)
              };
            });
          }

          async function verify(viewport,name,mobile){
            const browser=await webkit.launch();
            const context=await browser.newContext({viewport,isMobile:mobile,hasTouch:mobile});
            const page=await context.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            await page.route('https://fonts.googleapis.com/**',r=>r.fulfill({status:200,contentType:'text/css',body:''}));
            await page.route('https://fonts.gstatic.com/**',r=>r.abort());
            // Visual verification must not depend on a live Firebase login/session.
            await page.route('https://www.gstatic.com/firebasejs/**',r=>r.fulfill({status:200,contentType:'application/javascript',body:''}));
            await page.route('**/auth-gate.js*',r=>r.fulfill({status:200,contentType:'application/javascript',body:''}));
            await page.route('**/firebase-sync.js*',r=>r.fulfill({status:200,contentType:'application/javascript',body:''}));

            await page.goto('http://127.0.0.1:4173/budget/exercise.html?demo=1',{waitUntil:'domcontentloaded'});
            await page.waitForSelector('#insight-chart svg');
            assert.ok(page.url().includes('/budget/exercise.html?demo=1'),'Pulse Field must be served at canonical exercise.html');
            assert.equal(await page.locator('#build-session-link').count(),0,'Second build-pass action must not appear beneath the start circle');
            for(const [id,tool] of [['next-session-link','start'],['menu-build','build'],['edit-week-link','week'],['log-action-link','log']]){
              const href=await page.locator('#'+id).getAttribute('href');
              assert.ok(href.includes('archive/exercise.html?tool='+tool),'Training action '+id+' must reach preserved interactive tooling: '+href);
            }
            assert.ok((await page.locator('#stretch-link').getAttribute('href')).includes('zen.html?wellness=stretch'),'Stretch must open preserved Zen functionality');
            assert.ok((await page.locator('#meditation-link').getAttribute('href')).includes('zen.html?wellness=meditation'),'Meditation must open preserved Zen functionality');
            await page.waitForTimeout(950);
            const weekAppearance=await page.locator('.week-day').evaluateAll(days=>days.map(day=>({
              appearance:getComputedStyle(day).appearance,
              background:getComputedStyle(day).backgroundColor,
              shadow:getComputedStyle(day).boxShadow
            })));
            assert.equal(weekAppearance.length,7,'Seven weekday buttons should be present');
            assert.ok(weekAppearance.every(day=>day.appearance==='none'&&day.background==='rgba(0, 0, 0, 0)'&&day.shadow==='none'),'Weekdays must not have full-tile native/dark button backgrounds: '+JSON.stringify(weekAppearance));

            fs.mkdirSync('test-results/pulse-field',{recursive:true});
            await page.screenshot({path:'test-results/pulse-field/'+name+'-full.png',fullPage:true});
            await page.locator('.space-scene').screenshot({path:'test-results/pulse-field/'+name+'-hero-scene.png'});
            await page.locator('.start-orbit').screenshot({path:'test-results/pulse-field/'+name+'-start-orbit.png'});
            await page.locator('.rhythm-section').screenshot({path:'test-results/pulse-field/'+name+'-rhythm-stats.png'});
            await page.locator('#week-field').screenshot({path:'test-results/pulse-field/'+name+'-week-field.png'});
            await page.locator('#activity-field').screenshot({path:'test-results/pulse-field/'+name+'-activity-field.png'});
            await page.locator('#insights').screenshot({path:'test-results/pulse-field/'+name+'-heart-graph.png'});

            const sceneQuality=await page.evaluate(()=>{
              const mottle=document.querySelector('.space-scene__mottle');
              const nebula=document.querySelector('.space-scene__nebula');
              function canvasEnergy(selector){
                const canvas=document.querySelector(selector);
                if(!canvas||!canvas.width||!canvas.height)return {present:false,width:0,height:0,energy:0};
                const ctx=canvas.getContext('2d'),data=ctx.getImageData(0,0,canvas.width,canvas.height).data;
                let energy=0;
                const stride=Math.max(4,Math.floor((canvas.width*canvas.height)/18000))*4;
                for(let i=3;i<data.length;i+=stride)energy+=data[i];
                return {present:true,width:canvas.width,height:canvas.height,energy};
              }
              const line=document.querySelector('#insight-chart path.line-glow');
              const start=document.querySelector('.start-orbit');
              const startSymbol=document.querySelector('.start-field-symbol');
              const root=document.scrollingElement||document.documentElement;
              const activityHeading=document.querySelector('.activity-heading');
              const insightHeading=document.querySelector('#insights .section-head');
              const activityControls=document.querySelector('.activity-controls');
              const insightControls=document.querySelector('.insight-controls');
              const activityTitle=activityHeading.querySelector('h2').getBoundingClientRect();
              const insightTitle=insightHeading.querySelector('h2').getBoundingClientRect();
              const activityTabs=activityControls.querySelector('.view-tabs').getBoundingClientRect();
              const activityToggle=activityControls.querySelector('.segmented').getBoundingClientRect();
              const activitySvg=document.querySelector('#activity-chart svg');
              const activityGrid=document.querySelector('#activity-chart .chart-grid');
              const activityViewBox=activitySvg.viewBox.baseVal;
              const activityPlotWidthRatio=(Number(activityGrid.getAttribute('x2'))-Number(activityGrid.getAttribute('x1')))/activityViewBox.width;
              const activityPlotLeft=Number(activityGrid.getAttribute('x1')),activityPlotRight=Number(activityGrid.getAttribute('x2'));
              const insightTabs=insightControls.querySelector('.view-tabs').getBoundingClientRect();
              const insightToggle=insightControls.querySelector('.segmented').getBoundingClientRect();
              const weekday=document.querySelector('.week-day');
              const weekdayDate=weekday.querySelector('.day-date');
              const dayDate=document.querySelector('.week-day.is-selected .day-date');
              const statRows=Array.from(document.querySelectorAll('.rhythm-stats > div'));
              const statClearance=statRows.map((row,i)=>({left:row.getBoundingClientRect().left,separator:i?statRows[i-1].getBoundingClientRect().right:null,textLeft:row.querySelector('dd').getBoundingClientRect().left,textRight:row.querySelector('dd').getBoundingClientRect().right,rowRight:row.getBoundingClientRect().right}));
              const offenders=Array.from(document.querySelectorAll('body *')).map(el=>({el,rect:el.getBoundingClientRect()})).filter(x=>x.rect.right>innerWidth+1||x.rect.left<-1).slice(0,12).map(x=>({tag:x.el.tagName,class:x.el.className,right:Math.round(x.rect.right),left:Math.round(x.rect.left),width:Math.round(x.rect.width)}));
              return {
                mottleBackground:mottle?getComputedStyle(mottle).backgroundImage:'',
                nebulaFilter:nebula?getComputedStyle(nebula).filter:'',
                oldLayerCount:document.querySelectorAll('.chart-line-halo-wide,.chart-line-halo-near,.chart-line-core,.chart-point-halo,.activity-bar-glow-wide,.activity-bar-glow-near').length,
                insightCanvas:canvasEnergy('#insight-chart > canvas.chart-canvas-glow'),
                activityCanvas:canvasEnergy('#activity-chart > canvas.chart-canvas-glow'),
                metricAxisLines:document.querySelectorAll('#insight-chart .metric-chart-axis-line').length,
                metricUnit:(document.querySelector('#insight-chart .metric-chart-unit-label')||{}).textContent||'',
                activityMetricAxisLines:document.querySelectorAll('#activity-chart .metric-chart-axis-line').length,
                activityMetricUnit:(document.querySelector('#activity-chart .metric-chart-unit-label')||{}).textContent||'',
                activityPlotWidthRatio,activityPlotLeft,activityPlotRight,activityViewBoxWidth:activityViewBox.width,
                lineFilter:line?getComputedStyle(line).filter:'',
                startSymbol:startSymbol?startSymbol.textContent.trim():'',
                startSvgCount:start?start.querySelectorAll('svg').length:-1,
                startHaloAnimation:start?getComputedStyle(start,'::after').animationName:'',
                startHaloBackground:start?getComputedStyle(start,'::after').backgroundImage:'',
                startSymbolAnimation:startSymbol?getComputedStyle(startSymbol).animationName:'',
                startSymbolDuration:startSymbol?getComputedStyle(startSymbol).animationDuration:'',
                startSymbolColor:startSymbol?getComputedStyle(startSymbol).color:'',
                rootScrollWidth:root.scrollWidth,
                bodyScrollWidth:document.body.scrollWidth,
                viewportWidth:innerWidth,
                selectedDayCopyExists:!!document.querySelector('#selected-day-copy'),
                weekdayHeight:weekday.getBoundingClientRect().height,
                weekdayFont:parseFloat(getComputedStyle(weekdayDate).fontSize),
                weekdayCount:document.querySelectorAll('.week-day').length,
                activityHeading:{headingTop:activityHeading.getBoundingClientRect().top,titleTop:activityTitle.top,titleBottom:activityTitle.bottom,titleFont:parseFloat(getComputedStyle(activityHeading.querySelector('h2')).fontSize)},
                insightHeading:{headingTop:insightHeading.getBoundingClientRect().top,titleTop:insightTitle.top,titleBottom:insightTitle.bottom,titleFont:parseFloat(getComputedStyle(insightHeading.querySelector('h2')).fontSize)},
                activityControls:{tabsTop:activityTabs.top,tabsBottom:activityTabs.bottom,toggleTop:activityToggle.top,toggleBottom:activityToggle.bottom,toggleRight:activityToggle.right,controlsRight:activityControls.getBoundingClientRect().right},
                insightControls:{tabsTop:insightTabs.top,tabsBottom:insightTabs.bottom,tabsRight:insightTabs.right,toggleTop:insightToggle.top,toggleBottom:insightToggle.bottom,toggleLeft:insightToggle.left,toggleRight:insightToggle.right,controlsRight:insightControls.getBoundingClientRect().right},
                offenders,
                statClearance,
                weekFlow:dayDate?{animation:getComputedStyle(dayDate).animationName,selectedBorder:getComputedStyle(dayDate).borderTopWidth,dot:getComputedStyle(dayDate,'::after').content}:null,
                starSizes:Array.from(document.querySelectorAll('.space-star__glyph')).map(el=>parseFloat(getComputedStyle(el).fontSize))
              };
            });
            assert.ok(!sceneQuality.mottleBackground.includes('url('),'Nebula texture must not use a scaled raster/SVG texture: '+sceneQuality.mottleBackground);
            assert.equal(sceneQuality.nebulaFilter,'none','Main animated nebula must avoid costly filter rasterization');
            assert.equal(sceneQuality.oldLayerCount,0,'Legacy visible SVG halo layers must be absent: '+JSON.stringify(sceneQuality));
            assert.equal(sceneQuality.selectedDayCopyExists,false,'Redundant selected-day summary must be removed');
            assert.equal(sceneQuality.weekdayCount,7,'Seven weekday buttons must remain');
            assert.equal(sceneQuality.startSymbol,'✦','Start circle must use the Pulse Field ✦ symbol: '+JSON.stringify(sceneQuality));
            assert.equal(sceneQuality.startSvgCount,0,'Start symbol must not contain the old ECG ring SVG: '+JSON.stringify(sceneQuality));
            assert.equal(sceneQuality.startHaloAnimation,'startHaloBreath','Outer start glow must breathe, not rotate: '+JSON.stringify(sceneQuality));
            assert.ok(sceneQuality.startHaloBackground.includes('radial-gradient')&&!sceneQuality.startHaloBackground.includes('conic-gradient'),'Start glow must be diffuse rather than a rotating ring: '+JSON.stringify(sceneQuality));
            assert.equal(sceneQuality.startSymbolAnimation,'startSymbolHeartbeat','Start glyph should have its own heartbeat: '+JSON.stringify(sceneQuality));
            assert.equal(sceneQuality.startSymbolDuration,'2s','Start glyph heartbeat must repeat every two seconds: '+JSON.stringify(sceneQuality));
            assert.equal(sceneQuality.startSymbolColor,'rgb(255, 154, 145)','Start glyph should use Pulse Field theme accent: '+JSON.stringify(sceneQuality));
            assert.ok(new Set(sceneQuality.starSizes.map(v=>Math.round(v))).size>=5,'Pulse stars must keep visibly varied sizes: '+JSON.stringify(sceneQuality.starSizes));
            assert.equal(sceneQuality.weekFlow?.animation,'weekDateShimmer','Selected date should still shimmer');
            assert.equal(sceneQuality.weekFlow?.selectedBorder,'1px','Only selected date needs a visible tile border');
            assert.equal(sceneQuality.weekFlow?.dot,'""','The date indicator must be a dot beneath each date');
            assert.equal(await page.locator('.week-day .day-date').count(),7,'Seven weekday dates must keep their small dots');
            assert.ok(await page.locator('.week-day .day-date').evaluateAll(days=>days.every(day=>getComputedStyle(day,'::after').content==='""')),'All seven dates should display their dot pseudo-element');
            assert.equal(sceneQuality.metricAxisLines,0,'Heart graph should retain the earlier Pulse Field treatment without metric axes: '+JSON.stringify(sceneQuality));
            assert.equal(sceneQuality.metricUnit,'','Heart graph should not gain a new unit badge: '+JSON.stringify(sceneQuality));
            assert.equal(sceneQuality.activityMetricAxisLines,0,'Activity graph should retain its earlier Pulse Field treatment: '+JSON.stringify(sceneQuality));
            assert.equal(sceneQuality.activityMetricUnit,'','Activity graph should not gain a new metric-specific unit badge: '+JSON.stringify(sceneQuality));
            assert.equal((await page.locator('#activity-chart .chart-axis-unit').textContent()).trim(),'MIN','Activity minutes graph needs axis units');
            assert.equal((await page.locator('#insight-chart .chart-axis-unit').textContent()).trim(),'BPM','Heart graph needs axis units');
            assert.equal((await page.locator('#volume-chart .chart-axis-unit').textContent()).trim(),'KG','Training volume graph needs axis units');
            assert.equal(await page.locator('#volume-chart .volume-date-label').count(),5,'Sparse training-volume data should still have five evenly spaced time-axis labels');
            assert.ok(sceneQuality.activityPlotWidthRatio>.85,'Activity bars must fill nearly the entire chart width: '+JSON.stringify(sceneQuality));
            assert.ok(sceneQuality.activityPlotLeft>=18&&sceneQuality.activityPlotRight<=sceneQuality.activityViewBoxWidth-5,'Activity plot labels must stay inside viewbox');
            if(mobile){
              assert.ok(sceneQuality.weekdayHeight>=80&&sceneQuality.weekdayFont>=27,'Mobile weekday tiles and dates must be enlarged: '+JSON.stringify(sceneQuality));
              const activityTabsCenter=(sceneQuality.activityControls.tabsTop+sceneQuality.activityControls.tabsBottom)/2;
              const activityToggleCenter=(sceneQuality.activityControls.toggleTop+sceneQuality.activityControls.toggleBottom)/2;
              const insightTabsCenter=(sceneQuality.insightControls.tabsTop+sceneQuality.insightControls.tabsBottom)/2;
              const insightToggleCenter=(sceneQuality.insightControls.toggleTop+sceneQuality.insightControls.toggleBottom)/2;
              assert.ok(sceneQuality.activityControls.tabsTop>sceneQuality.activityHeading.titleBottom,'Activity controls must sit below the title: '+JSON.stringify({heading:sceneQuality.activityHeading,controls:sceneQuality.activityControls}));
              assert.ok(sceneQuality.insightControls.tabsTop>sceneQuality.insightHeading.titleBottom,'Insight controls must sit below the title: '+JSON.stringify({heading:sceneQuality.insightHeading,controls:sceneQuality.insightControls}));
              assert.ok(sceneQuality.activityControls.tabsTop-sceneQuality.activityHeading.titleBottom<=16,'Activity controls must stay compact under the title: '+JSON.stringify({heading:sceneQuality.activityHeading,controls:sceneQuality.activityControls}));
              assert.ok(sceneQuality.insightControls.tabsTop-sceneQuality.insightHeading.titleBottom<=16,'Insight controls must stay compact under the title: '+JSON.stringify({heading:sceneQuality.insightHeading,controls:sceneQuality.insightControls}));
              assert.ok(Math.abs(activityTabsCenter-activityToggleCenter)<2,'Activity time and metric toggles must share one control line: '+JSON.stringify(sceneQuality.activityControls));
              assert.ok(Math.abs(insightTabsCenter-insightToggleCenter)<2,'Insight metric and view toggles must share one control line: '+JSON.stringify(sceneQuality.insightControls));
              assert.ok(sceneQuality.insightControls.tabsRight<=sceneQuality.insightControls.toggleLeft-8,'Insight controls must not collide: '+JSON.stringify(sceneQuality.insightControls));
              assert.ok(Math.abs(sceneQuality.activityHeading.titleFont-sceneQuality.insightHeading.titleFont)<.1,'Activity and insight headings must share typography sizing: '+JSON.stringify({activity:sceneQuality.activityHeading,insight:sceneQuality.insightHeading}));
              assert.ok(sceneQuality.activityControls.toggleRight<=sceneQuality.activityControls.controlsRight+1,'Activity toggle must fit within content width: '+JSON.stringify(sceneQuality.activityControls));
              assert.ok(sceneQuality.insightControls.toggleRight<=sceneQuality.insightControls.controlsRight+1,'Insight toggle must fit within content width: '+JSON.stringify(sceneQuality.insightControls));
              assert.equal(sceneQuality.statClearance.length,3,'Expected three rhythm metrics');
              for(let i=1;i<3;i++)assert.ok(sceneQuality.statClearance[i].textLeft-sceneQuality.statClearance[i].separator>=10,'Rhythm value is too close to vertical divider: '+JSON.stringify(sceneQuality.statClearance));
              for(let i=0;i<2;i++)assert.ok(sceneQuality.statClearance[i].rowRight-sceneQuality.statClearance[i].textRight>=7,'Rhythm value is too close to its right divider: '+JSON.stringify(sceneQuality.statClearance));
              assert.ok(sceneQuality.rootScrollWidth<=sceneQuality.viewportWidth+1,'Mobile root must not overflow horizontally: '+JSON.stringify(sceneQuality));
              await page.evaluate(()=>window.scrollTo(140,0));
              await page.waitForTimeout(80);
              assert.equal(await page.evaluate(()=>window.scrollX),0,'Mobile page must not pan horizontally');
              assert.ok(sceneQuality.insightCanvas.present&&sceneQuality.insightCanvas.energy>500,'Mobile insight Canvas glow did not paint real pixels: '+JSON.stringify(sceneQuality));
              assert.ok(sceneQuality.activityCanvas.present&&sceneQuality.activityCanvas.energy>250,'Mobile activity Canvas glow did not paint real pixels: '+JSON.stringify(sceneQuality));
              assert.equal(sceneQuality.lineFilter,'none','Mobile SVG line must stay crisp above Canvas glow');
            }else{
              assert.equal(sceneQuality.insightCanvas.present,false,'Desktop should keep native SVG glow without Canvas');
              assert.notEqual(sceneQuality.lineFilter,'none','Desktop SVG glow filter must remain active');
            }

            assert.equal(await page.locator('[data-insight="distance"]').count(),0,'Standalone running distance graph must be removed');

            await page.locator('[data-insight="pace"]').click();
            await page.waitForTimeout(40);
            assert.ok(await page.locator('#insight-special').isVisible(),'Pace must show special old-page chrome');
            assert.equal((await page.locator('#insight-special-chart-title').textContent()).trim(),'Snittakt över tid');
            assert.equal((await page.locator('#insight-special-chart-unit').textContent()).trim(),'MIN/KM');
            assert.equal((await page.locator('#insight-chart .chart-axis-unit').textContent()).trim(),'MIN/KM','Pace graph needs in-plot axis units');
            assert.ok((await page.locator('#insight-special-legend').textContent()).includes('Snittakt'),'Pace legend missing');
            assert.ok((await page.locator('#insight-special-summary').textContent()).includes('Snittakt & registrerade värden'),'Pace section title missing');
            assert.equal(await page.locator('#insight-special-summary [role="progressbar"]').count(),1,'Distance goal bar above pace must be present');
            assert.ok((await page.locator('#insight-special-summary').textContent()).includes('Längsta löppass'),'Distance goal text missing');
            assert.equal(await page.locator('#pace-distance-comparison .pace-scatter-point').count(),3,'Three demo runs must appear in pace versus distance scatter');
            assert.equal(await page.locator('#pace-distance-comparison .pace-scatter-halo').count(),3,'Every scatter point must have a radial glow');
            assert.equal(await page.locator('#pace-distance-comparison .pace-scatter-unit').count(),2,'Scatter axes must each have a subtle unit label');
            assert.deepEqual((await page.locator('#pace-distance-comparison .pace-scatter-unit').allTextContents()).map(s=>s.trim()),['min/km','km'],'Scatter axis units are incorrect');
            assert.ok((await page.locator('#pace-distance-comparison .pace-scatter-halo').first().getAttribute('fill')).includes('pace-scatter-halo-gradient'),'Scatter glow must use a WebKit-safe SVG radial gradient');
            assert.equal(await page.locator('#insight-chart .metric-chart-unit-label').count(),0,'Pace unit belongs in the external old-page heading');
            assert.ok(await page.locator('#insight-chart .metric-chart-y-label').count()>=5,'Pace must keep Y-axis labels');
            await page.locator('#insights').screenshot({path:'test-results/pulse-field/'+name+'-pace-special.png'});

            await page.locator('[data-insight="vo2"]').click();
            await page.waitForTimeout(40);
            assert.ok(await page.locator('#insight-special').isVisible(),'VO2 must show special old-page chrome');
            assert.equal((await page.locator('#insight-special-chart-title').textContent()).trim(),'VO₂ över tid');
            assert.equal((await page.locator('#insight-special-chart-unit').textContent()).trim(),'ML/KG/MIN');
            assert.equal((await page.locator('#insight-chart .chart-axis-unit').textContent()).trim(),'ML/KG/MIN','VO2 graph needs in-plot axis units');
            assert.equal(await page.locator('#insight-special-summary [role="progressbar"]').count(),1,'VO2 goal progress bar missing');
            assert.ok((await page.locator('#insight-special-summary').textContent()).includes('Högsta VO₂'),'VO2 highest-value summary missing');
            assert.ok((await page.locator('#insight-special-summary').textContent()).includes('Längsta löptid'),'VO2 longest-run summary missing');
            assert.ok((await page.locator('#insight-special-legend').textContent()).includes('VO₂ max'),'VO2 legend missing');
            assert.equal(await page.locator('#insight-chart .metric-chart-unit-label').count(),0,'VO2 unit belongs in the external old-page heading');
            assert.ok(await page.locator('#insight-chart .metric-chart-y-label').count()>=5,'VO2 must keep Y-axis labels');
            await page.locator('#insights').screenshot({path:'test-results/pulse-field/'+name+'-vo2-special.png'});

            await page.locator('[data-insight="heart"]').click();
            await page.waitForTimeout(40);
            assert.ok(await page.locator('#pace-distance-comparison').isHidden(),'Scatter must only show for Pace');
            const firstLog=page.locator('#log-timeline [data-log-card]').first();
            assert.equal(await firstLog.locator('.log-mini-meter').count(),3,'Three log interval charts must render');
            assert.ok(await firstLog.locator('.exercise-row').count()>0,'Open training log must have exercises');
            assert.equal(await firstLog.locator('.exercise-row').first().locator('.exercise-performance').count(),1,'Exercise value and duration must share the same metric column');
            assert.ok(await firstLog.locator('.exercise-row').first().locator('.exercise-performance .exercise-result').isVisible(),'Exercise value must remain visible in compact metric column');
            const cardioLog=page.locator('#log-timeline [data-log-card]').nth(1);
            await cardioLog.locator('.log-summary').click();
            assert.equal(await cardioLog.locator('.log-mini-meter:not(.is-missing)').count(),3,'Cardio demo must expose recorded pulse VO2 and pace');
            assert.equal(await cardioLog.locator('.log-mini-halo').count(),0,'Old flat SVG halo graphics must be removed');
            assert.equal(await cardioLog.locator('.log-mini-point').count(),3,'Glow must not duplicate the actual measurement markers');
            await page.waitForTimeout(170);
            const miniGlow=await cardioLog.locator('.log-mini-signal').evaluateAll(signals=>signals.map(signal=>{
              const canvas=signal.querySelector('canvas.log-mini-canvas-glow');
              if(!canvas)return {present:false,energy:0};
              const pixels=canvas.getContext('2d').getImageData(0,0,canvas.width,canvas.height).data;
              let energy=0;for(let i=3;i<pixels.length;i+=4)energy+=pixels[i];
              return {present:true,energy};
            }));
            assert.equal(miniGlow.length,3,'Three mini log metrics should be checked');
            if(mobile)assert.ok(miniGlow.every(glow=>glow.present&&glow.energy>100),'Mobile mini metric glow needs actual Canvas 2D pixels: '+JSON.stringify(miniGlow));
            else assert.ok(miniGlow.every(glow=>!glow.present),'Desktop mini metrics must retain native glow without extra Canvas');
            assert.ok((await cardioLog.locator('.log-mini-meter--pace strong').textContent()).includes('min/km'),'Pace mini interval requires unit');
            assert.ok(await page.locator('#insight-special').isHidden(),'Heart graph must remain in the earlier Pulse Field format');
            assert.equal(await page.locator('#insight-chart .metric-chart-axis-line').count(),0,'Heart graph must remain in the earlier Pulse Field format');
            assert.equal(await page.locator('#insight-chart .metric-chart-unit-label').count(),0,'Heart graph must not show the new metric unit badge');
            await page.locator('[data-activity-metric="sessions"]').click();
            await page.waitForTimeout(40);
            assert.equal((await page.locator('#activity-chart .chart-axis-unit').textContent()).trim(),'PASS','Activity sessions graph needs matching axis units');
            assert.equal(await page.locator('#activity-chart .metric-chart-axis-line').count(),0,'Activity graph must remain in the earlier Pulse Field format');
            assert.equal(await page.locator('#activity-chart .metric-chart-unit-label').count(),0,'Activity graph must not show a metric unit badge');
            await page.locator('[data-activity-metric="minutes"]').click();
            await page.waitForTimeout(40);

            assert.equal(await page.locator('#record-podium .record-feature').count(),3,'Three featured records should appear in demo data');
            await page.locator('#record-customize').click();
            assert.ok(await page.locator('#record-picker').isVisible(),'Record picker must open from Customize');
            assert.equal(await page.locator('#record-picker-fields select').count(),3,'Three record selection dropdowns must be available');
            const initialRecord=(await page.locator('#record-podium .record-feature h3').first().textContent()).trim();
            const alternatives=await page.locator('[data-featured-select="0"] option').evaluateAll(opts=>opts.map(opt=>({value:opt.value,label:opt.textContent})));
            const alternative=alternatives.find(item=>item.label.trim()!==initialRecord);
            assert.ok(alternative,'Demo data should have another record to swap into the first slot');
            await page.locator('[data-featured-select="0"]').selectOption(alternative.value);
            assert.equal((await page.locator('#record-podium .record-feature h3').first().textContent()).trim(),alternative.label.trim(),'Chosen featured record must appear in the first card');
            await page.reload({waitUntil:'domcontentloaded'});
            assert.equal((await page.locator('#record-podium .record-feature h3').first().textContent()).trim(),alternative.label.trim(),'Featured record selection must survive reload');
            assert.ok(await page.locator('#record-picker').isHidden(),'Editor should start closed after reload');

            const before=await animationSnapshot(page);
            await page.waitForTimeout(1800);
            const after=await animationSnapshot(page);
            const minimumMotion={nebula:.12,mottle:.55,near:.55,flecks:.55};
            ['nebula','mottle','near','flecks'].forEach(key=>{
              const dx=after[key].x-before[key].x,dy=after[key].y-before[key].y,distance=Math.hypot(dx,dy);
              assert.ok(distance>minimumMotion[key],key+' motion is too small to register visually: '+JSON.stringify({before:before[key],after:after[key],distance,minimum:minimumMotion[key]}));
            });
            assert.equal(before.stars.length,10,'Expected ten independent pulse stars');
            const starVectors=after.stars.map((star,i)=>{
              const dx=star.x-before.stars[i].x,dy=star.y-before.stars[i].y;
              return {dx,dy,distance:Math.hypot(dx,dy)};
            });
            const moving=starVectors.filter(v=>v.distance>.25);
            assert.ok(moving.length>=7,'Most pulse stars should visibly drift: '+JSON.stringify(starVectors));
            const directions=new Set(moving.map(v=>(v.dx>=0?'R':'L')+(v.dy>=0?'D':'U')));
            assert.ok(directions.size>=3,'Pulse stars must drift in several directions, not as one field: '+JSON.stringify(starVectors));
            const speeds=moving.map(v=>v.distance).sort((a,b)=>a-b);
            assert.ok(speeds[speeds.length-1]/Math.max(.01,speeds[0])>1.45,'Pulse stars must move at noticeably different speeds: '+JSON.stringify(starVectors));
            assert.ok(Math.abs(after.mottle.rotation-before.mottle.rotation)>.01,'Nebula dust layer must keep rotating subtly: '+JSON.stringify({before:before.mottle,after:after.mottle}));
            assert.ok(Math.abs(after.near.opacity-before.near.opacity)>.004,'Near gas layer opacity must continue changing as it drifts: '+JSON.stringify({before:before.near,after:after.near}));

            assert.deepEqual(errors,[],'Browser errors: '+errors.join(' | '));
            await browser.close();
          }

          async function verifyMigration(){
            const browser=await webkit.launch(),context=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
            const page=await context.newPage();
            await page.route('https://www.gstatic.com/firebasejs/**',r=>r.fulfill({status:200,contentType:'application/javascript',body:''}));
            await page.route('**/auth-gate.js*',r=>r.fulfill({status:200,contentType:'application/javascript',body:''}));
            await page.route('**/firebase-sync.js*',r=>r.fulfill({status:200,contentType:'application/javascript',body:''}));
            await page.route('https://fonts.googleapis.com/**',r=>r.fulfill({status:200,contentType:'text/css',body:''}));
            await page.route('https://fonts.gstatic.com/**',r=>r.abort());
            await page.goto('http://127.0.0.1:4173/budget/training-pulse-field.html?demo=1&user=maja#training-log',{waitUntil:'domcontentloaded'});
            await page.waitForURL(/\/budget\/exercise\.html\?demo=1&user=maja#training-log/);
            await page.waitForSelector('#insight-chart svg');
            assert.equal((await page.locator('#profile-name').textContent()).trim(),'Maja','Old Pulse Field preview URL must redirect to canonical page with profile preserved');
            await page.evaluate(()=>window.scrollTo({top:0,behavior:'instant'}));
            const trainingNav=await page.locator('.kind-switch').boundingBox();
            const archived=await context.request.get('http://127.0.0.1:4173/budget/archive/exercise.html?tool=start');
            assert.equal(archived.status(),200,'Original session and builder page must remain available in archive');
            const archiveHtml=await archived.text();
            assert.ok(archiveHtml.includes('<base href="../">')&&archiveHtml.includes('id="session-modal"')&&archiveHtml.includes('id="observatory-build"')&&archiveHtml.includes('id="pulse-log-button"'),'Preserved app must retain all interactive training tools and root-relative assets');
            const asset=await context.request.get('http://127.0.0.1:4173/budget/training-overview-mode.js');
            assert.equal(asset.status(),200,'Preserved builder asset must resolve under /budget');
            await page.goto('http://127.0.0.1:4173/budget/exercise.html?user=maja&wellness=meditation',{waitUntil:'domcontentloaded'});
            await page.waitForURL(/\/budget\/zen\.html\?/);
            assert.ok(page.url().includes('wellness=meditation')&&page.url().includes('user=maja'),'Old Zen bookmarks must route to the standalone Zen page with profile and kind intact');
            for(const kind of ['meditation','stretch']){
              await page.goto('http://127.0.0.1:4173/budget/zen.html?user=maja&wellness='+kind,{waitUntil:'domcontentloaded'});
              await page.waitForSelector('.zen-home-switch');
              const zenNav=await page.locator('.zen-home-switch').boundingBox();
              assert.ok(Math.abs(zenNav.y-trainingNav.y)<3&&Math.abs(zenNav.width-trainingNav.width)<3&&Math.abs(zenNav.x-trainingNav.x)<3,'Zen '+kind+' toggle bar must match training position on mobile: '+JSON.stringify({zenNav,trainingNav}));
              const scene=await page.locator('.landscape').evaluate(el=>({top:el.getBoundingClientRect().top,mask:getComputedStyle(el).maskImage}));
              assert.equal(scene.top,0,'Zen scenery must start at the top of the mobile viewport');
              assert.ok(scene.mask.includes('transparent 100%'),'Zen scenery must fade into the page background without a hard boundary');
            }
            await browser.close();
          }

          (async()=>{
            await verify({width:1440,height:960},'desktop',false);
            await verify({width:390,height:844},'mobile',true);
            await verifyMigration();
            console.log('Pulse Field canonical training, archive routing and desktop/mobile glow verified in WebKit');
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node /tmp/pulse-field-visual.cjs
