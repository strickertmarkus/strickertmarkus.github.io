name: Refine finance header and navigation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-finance-header-nav.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refine finance UI and navigation
        shell: python
        run: |
          from pathlib import Path
          import re

          ui_path = Path('budget/finance-ui.js')
          s = ui_path.read_text()

          def rep(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'Missing expected finance-ui fragment: {label}')
              s = s.replace(old, new, 1)

          rep(
              "'html.finance-ui-preload-v2 body .header{height:122px!important;min-height:122px!important;max-height:122px!important;overflow:hidden!important;position:relative!important;background:linear-gradient(135deg,#0B0F1A,#151C2C)!important;box-shadow:0 4px 30px rgba(0,0,0,.5)!important}' +",
              "'html.finance-ui-preload-v2 body .header{height:160px!important;min-height:160px!important;max-height:160px!important;overflow:hidden!important;position:relative!important;background:rgba(24,31,46,.94)!important;border-bottom:1px solid rgba(255,255,255,.08)!important;box-shadow:0 8px 28px rgba(0,0,0,.32)!important}' +",
              'preload desktop height')
          rep(
              "'@media(max-width:600px){html.finance-ui-preload-v2 body .header{height:116px!important;min-height:116px!important;max-height:116px!important}}';",
              "'@media(max-width:600px){html.finance-ui-preload-v2 body .header{height:156px!important;min-height:156px!important;max-height:156px!important}}';",
              'preload mobile height')
          rep(
              "'html.finance-ui-clean-v1 body .header{min-height:122px!important;position:relative!important;padding:15px 64px 9px 16px!important;text-align:left!important;overflow:visible!important;background:linear-gradient(135deg,#0B0F1A,#151C2C)!important;box-shadow:0 4px 30px rgba(0,0,0,.5)!important}' +",
              "'html.finance-ui-clean-v1 body .header{height:160px!important;min-height:160px!important;max-height:160px!important;position:relative!important;padding:0!important;text-align:center!important;overflow:visible!important;background:rgba(24,31,46,.94)!important;border-bottom:1px solid rgba(255,255,255,.08)!important;box-shadow:0 8px 28px rgba(0,0,0,.32)!important;backdrop-filter:blur(20px)!important;-webkit-backdrop-filter:blur(20px)!important}' +",
              'main header')
          rep(
              "'html.finance-ui-clean-v1 body .header>h1{margin:0!important;font-size:21px!important;font-weight:800!important;letter-spacing:-.35px!important;line-height:1.05!important}' +",
              "'html.finance-ui-clean-v1 body .header>h1{position:absolute!important;left:50%!important;top:14px!important;transform:translateX(-50%)!important;width:max-content!important;max-width:calc(100% - 112px)!important;margin:0!important;font-size:21px!important;font-weight:800!important;letter-spacing:-.45px!important;line-height:1.1!important;white-space:nowrap!important;text-align:center!important}' +",
              'centered heading')
          rep(
              "'html.finance-ui-clean-v1 body .header>p{margin:3px 0 0!important;font-size:10.5px!important;line-height:1.1!important}' +",
              "'html.finance-ui-clean-v1 body .header>p{position:absolute!important;left:50%!important;top:40px!important;transform:translateX(-50%)!important;margin:0!important;font-size:11px!important;line-height:1.2!important;white-space:nowrap!important;text-align:center!important}' +",
              'centered subtitle')
          rep(
              "'html.finance-ui-clean-v1 body .header>#month-nav{position:absolute!important;left:50%!important;right:auto!important;top:auto!important;bottom:9px!important;transform:translateX(-50%)!important;margin:0!important;padding:3px!important;height:35px!important;width:max-content!important;box-sizing:border-box!important;display:flex!important;align-items:center!important;justify-content:center!important;flex-wrap:nowrap!important;gap:0!important;z-index:8!important;border:1px solid rgba(255,255,255,.15)!important;border-radius:18px!important;background:rgba(255,255,255,.055)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.045),0 4px 16px rgba(0,0,0,.12)!important;backdrop-filter:blur(9px)!important;-webkit-backdrop-filter:blur(9px)!important}' +",
              "'html.finance-ui-clean-v1 body .header>#month-nav{position:absolute!important;left:50%!important;right:auto!important;top:61px!important;bottom:auto!important;transform:translateX(-50%)!important;margin:0!important;padding:3px!important;height:40px!important;width:174px!important;box-sizing:border-box!important;display:flex!important;align-items:center!important;justify-content:center!important;flex-wrap:nowrap!important;gap:0!important;z-index:8!important;border:1px solid rgba(255,255,255,.16)!important;border-radius:21px!important;background:rgba(255,255,255,.065)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 5px 18px rgba(0,0,0,.16)!important;backdrop-filter:blur(12px)!important;-webkit-backdrop-filter:blur(12px)!important}' +",
              'month container')
          rep(
              "'html.finance-ui-clean-v1 body .header>#month-nav>.custom-dropdown-wrapper{position:relative!important;display:block!important;flex:0 0 90px!important;width:90px!important;height:29px!important}' +",
              "'html.finance-ui-clean-v1 body .header>#month-nav>.custom-dropdown-wrapper{position:relative!important;display:block!important;flex:0 0 112px!important;width:112px!important;height:34px!important}' +",
              'month wrapper')
          rep(
              "'html.finance-ui-clean-v1 body .header>#month-nav>.custom-dropdown-wrapper::after{content:\"\";position:absolute;right:7px;top:10px;width:5px;height:5px;border-right:1.5px solid #64748B;border-bottom:1.5px solid #64748B;transform:rotate(45deg);pointer-events:none}' +",
              "'html.finance-ui-clean-v1 body .header>#month-nav>.custom-dropdown-wrapper::after{content:\"\";position:absolute;right:8px;top:12px;width:5px;height:5px;border-right:1.5px solid #64748B;border-bottom:1.5px solid #64748B;transform:rotate(45deg);pointer-events:none}' +",
              'month chevron')
          rep(
              "'html.finance-ui-clean-v1 body .header #month-dropdown{appearance:none!important;height:29px!important;width:90px!important;min-width:90px!important;margin:0!important;padding:0 16px 0 5px!important;border:0!important;border-radius:12px!important;background:transparent!important;background-image:none!important;color:#F0F6FC!important;font:700 10px/1 Inter,sans-serif!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:clip!important;text-align:center!important;box-shadow:none!important;transform:none!important;cursor:pointer!important}' +",
              "'html.finance-ui-clean-v1 body .header #month-dropdown{appearance:none!important;height:34px!important;width:112px!important;min-width:112px!important;margin:0!important;padding:0 18px 0 6px!important;border:0!important;border-radius:17px!important;background:transparent!important;background-image:none!important;color:#F0F6FC!important;font:750 12px/1 Inter,sans-serif!important;letter-spacing:-.1px!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:clip!important;text-align:center!important;box-shadow:none!important;transform:none!important;cursor:pointer!important}' +",
              'month label')
          rep(
              "'.finance-month-arrow-clean-v1{appearance:none!important;width:27px!important;height:29px!important;flex:0 0 27px!important;margin:0!important;padding:0!important;border:0!important;border-radius:14px!important;background:transparent!important;color:#94A3B8!important;display:flex!important;align-items:center!important;justify-content:center!important;cursor:pointer!important;font:500 21px/1 Inter,sans-serif!important;-webkit-tap-highlight-color:transparent}' +",
              "'.finance-month-arrow-clean-v1{appearance:none!important;width:28px!important;height:34px!important;flex:0 0 28px!important;margin:0!important;padding:0!important;border:0!important;border-radius:17px!important;background:transparent!important;color:#A8B3C4!important;display:flex!important;align-items:center!important;justify-content:center!important;cursor:pointer!important;font:500 23px/1 Inter,sans-serif!important;-webkit-tap-highlight-color:transparent}' +",
              'month arrows')

          rep(
              "html.finance-ui-clean-v1 body .header{min-height:116px!important;padding:13px 58px 8px 12px!important}",
              "html.finance-ui-clean-v1 body .header{height:156px!important;min-height:156px!important;max-height:156px!important;padding:0!important}",
              'mobile header')
          rep(
              "html.finance-ui-clean-v1 body .header>h1{font-size:18.5px!important}",
              "html.finance-ui-clean-v1 body .header>h1{top:13px!important;font-size:20px!important;max-width:calc(100% - 108px)!important}",
              'mobile h1')
          rep(
              "html.finance-ui-clean-v1 body .header>p{font-size:10px!important}",
              "html.finance-ui-clean-v1 body .header>p{top:39px!important;font-size:11px!important}",
              'mobile subtitle')
          rep(
              "html.finance-ui-clean-v1 body .header>#month-nav{bottom:8px!important;height:34px!important;padding:3px!important;border-radius:17px!important;gap:0!important}html.finance-ui-clean-v1 body .header>#month-nav>.custom-dropdown-wrapper{height:28px!important;width:76px!important;flex-basis:76px!important}html.finance-ui-clean-v1 body .header>#month-nav>.custom-dropdown-wrapper::after{right:5px!important;top:9px!important;width:4px!important;height:4px!important}html.finance-ui-clean-v1 body .header #month-dropdown{height:28px!important;width:76px!important;min-width:76px!important;padding:0 11px 0 3px!important;font-size:9px!important}.finance-month-arrow-clean-v1{width:22px!important;height:28px!important;flex-basis:22px!important;font-size:19px!important}",
              "html.finance-ui-clean-v1 body .header>#month-nav{top:60px!important;bottom:auto!important;height:40px!important;width:172px!important;padding:3px!important;border-radius:21px!important;gap:0!important}html.finance-ui-clean-v1 body .header>#month-nav>.custom-dropdown-wrapper{height:34px!important;width:110px!important;flex-basis:110px!important}html.finance-ui-clean-v1 body .header>#month-nav>.custom-dropdown-wrapper::after{right:7px!important;top:12px!important;width:5px!important;height:5px!important}html.finance-ui-clean-v1 body .header #month-dropdown{height:34px!important;width:110px!important;min-width:110px!important;padding:0 17px 0 5px!important;font-size:12px!important}.finance-month-arrow-clean-v1{width:28px!important;height:34px!important;flex-basis:28px!important;font-size:22px!important}",
              'mobile month control')
          rep(
              "html.finance-ui-clean-v1 body .header>#month-nav>.custom-dropdown-wrapper{width:70px!important;flex-basis:70px!important}html.finance-ui-clean-v1 body .header #month-dropdown{width:70px!important;min-width:70px!important;font-size:8.5px!important}.finance-month-arrow-clean-v1{width:20px!important;flex-basis:20px!important}",
              "html.finance-ui-clean-v1 body .header>#month-nav{width:164px!important}html.finance-ui-clean-v1 body .header>#month-nav>.custom-dropdown-wrapper{width:104px!important;flex-basis:104px!important}html.finance-ui-clean-v1 body .header #month-dropdown{width:104px!important;min-width:104px!important;font-size:11.5px!important}.finance-month-arrow-clean-v1{width:27px!important;flex-basis:27px!important}",
              'narrow mobile month control')

          marker = "  var TRANSITION_KEY = 'finance-view-transition-clean-v1';\n"
          if "finance-last-page-v1" not in s:
              if marker not in s:
                  raise SystemExit('Missing transition marker')
              s = s.replace(marker, marker + "  try { localStorage.setItem('finance-last-page-v1', path.split('/').pop()); } catch (_) {}\n", 1)
          ui_path.write_text(s)

          gate_path = Path('budget/auth-gate.js')
          g = gate_path.read_text()
          if 'data-finance-hub-link' not in g:
              marker = "  var isShoppingPage = lowerPath.endsWith('/budget/shopping.html') || lowerPath.endsWith('/shopping.html');\n"
              if marker not in g:
                  raise SystemExit('Missing auth-gate page marker')
              lines = [
                  '',
                  "  var financeHubPages = ['budget.html','budget_maja.html','analytics.html','analytics_maja.html','familjebudget.html'];",
                  "  var isFinanceHubPage = financeHubPages.some(function (name) { return lowerPath.endsWith('/' + name); });",
                  '',
                  '  function financeHubTarget() {',
                  "    var saved = '';",
                  "    try { saved = String(localStorage.getItem('finance-last-page-v1') || '').toLowerCase(); } catch (_) {}",
                  '    if (financeHubPages.indexOf(saved) !== -1) return saved;',
                  "    var remembered = 'markus';",
                  "    try { remembered = localStorage.getItem('budget-last-user-v1') === 'maja' ? 'maja' : 'markus'; } catch (_) {}",
                  "    return remembered === 'maja' ? 'budget_maja.html' : 'budget.html';",
                  '  }',
                  '',
                  '  function normalizeFinanceNavigation() {',
                  "    var menu = document.getElementById('nav-menu');",
                  '    if (!menu) return;',
                  "    var links = Array.prototype.slice.call(menu.querySelectorAll('a[href]'));",
                  '    var financeLinks = links.filter(function (link) {',
                  "      var href = String(link.getAttribute('href') || '').split('#')[0].split('?')[0].toLowerCase();",
                  "      var name = href.split('/').pop();",
                  '      return financeHubPages.indexOf(name) !== -1;',
                  '    });',
                  "    var existing = menu.querySelector('a[data-finance-hub-link=\"true\"]');",
                  "    var hub = existing || document.createElement('a');",
                  "    hub.setAttribute('data-finance-hub-link','true');",
                  '    hub.href = financeHubTarget();',
                  "    hub.innerHTML = '<span class=\"nav-icon\">💰</span> Budget';",
                  "    hub.classList.toggle('active', isFinanceHubPage);",
                  "    hub.addEventListener('click', function () { hub.href = financeHubTarget(); });",
                  '    if (!existing && financeLinks.length) financeLinks[0].parentNode.insertBefore(hub, financeLinks[0]);',
                  '    financeLinks.forEach(function (link) { if (link !== hub) link.remove(); });',
                  '  }',
                  '',
                  "  document.addEventListener('DOMContentLoaded', normalizeFinanceNavigation, {once:true});",
                  ''
              ]
              block = '\n'.join(lines)
              g = g.replace(marker, marker + block, 1)
          gate_path.write_text(g)

          for p in Path('budget').glob('*.html'):
              text = p.read_text()
              original = text
              text = re.sub(r"auth-gate\.js(?:\?v=[^\"']*)?", 'auth-gate.js?v=20260830-budget-hub-v1', text)
              text = re.sub(r"finance-ui\.js(?:\?v=[^\"']*)?", 'finance-ui.js?v=20260830-finance-clean-v4', text)
              if text != original:
                  p.write_text(text)

      - name: Verify JavaScript syntax
        run: |
          node --check budget/finance-ui.js
          node --check budget/auth-gate.js

      - name: Verify finance data layer untouched
        run: |
          git diff --quiet -- budget/firebase-sync.js budget/indexeddb-fallback.js budget/budget-persistence-guard.js
          ! git diff --name-only | grep -E 'budget/(firebase-sync|indexeddb-fallback|budget-persistence-guard)\.js'

      - name: Verify intended UI changes
        run: |
          grep -q "finance-last-page-v1" budget/finance-ui.js
          grep -q "data-finance-hub-link" budget/auth-gate.js
          grep -q "finance-clean-v4" budget/budget.html
          grep -q "finance-clean-v4" budget/analytics.html
          grep -q "finance-clean-v4" budget/familjebudget.html

      - name: Commit refinement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add budget/finance-ui.js budget/auth-gate.js budget/*.html
          git commit -m 'Refine finance header and unify budget navigation'
          git push
