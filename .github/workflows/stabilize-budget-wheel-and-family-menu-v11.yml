name: Stabilize Budget wheel and Family menu v11

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stabilize-budget-wheel-and-family-menu-v11.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply finance stability patch
        run: python3 .github/scripts/stabilize_budget_wheel_and_family_menu_v11.py

      - name: Verify finance UI JavaScript
        run: node --check budget/finance-ui.js

      - name: Verify scoped changes
        shell: bash
        run: |
          for f in budget/budget.html budget/budget_maja.html; do
            grep -Fq 'hoverBackgroundColor: expenseSections.map(s => s.color)' "$f"
            grep -Fq 'borderWidth: 1.5' "$f"
            grep -Fq 'borderAlign: "inner"' "$f"
            grep -Fq 'spacing: 1' "$f"
            grep -Fq 'hoverBorderWidth: 1.5' "$f"
            ! grep -Fq "id: 'segmentGlow'" "$f"
            ! grep -Fq 'Per-segment hover glow' "$f"
            ! grep -Fq "return s.color + 'A0'" "$f"
          done
          grep -Fq 'position:relative!important;z-index:100!important;padding:0!important' budget/finance-ui.js
          for f in budget/budget.html budget/budget_maja.html budget/analytics.html budget/analytics_maja.html budget/familjebudget.html; do
            grep -Fq 'finance-ui.js?v=20260831-finance-theme-blue-v9' "$f"
          done
          git diff --quiet -- budget/firebase-sync.js budget/indexeddb-fallback.js budget/budget-persistence-guard.js
          changed="$(git diff --name-only)"
          echo "$changed"
          while IFS= read -r f; do
            case "$f" in
              budget/finance-ui.js|budget/budget.html|budget/budget_maja.html|budget/analytics.html|budget/analytics_maja.html|budget/familjebudget.html) ;;
              '') ;;
              *) echo "Unexpected changed file: $f" >&2; exit 1 ;;
            esac
          done <<< "$changed"

      - name: Commit finance stability patch
        shell: bash
        run: |
          git config user.name "strickertmarkus"
          git config user.email "markus.strickert@sigmatechnology.com"
          git add budget/finance-ui.js budget/budget.html budget/budget_maja.html budget/analytics.html budget/analytics_maja.html budget/familjebudget.html
          git commit -m "Stabilize Budget wheel styling and Family menu stacking"
          git push
