name: Refine finance month v8

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-finance-month-v8.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine finance month and heading
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('budget/finance-ui.js')
          s = p.read_text()

          old = "      'html.finance-ui-clean-v1 body .header>#month-nav>.custom-dropdown-wrapper::after{content:\"\";position:absolute;right:10px;top:16px;width:5px;height:5px;border-right:1.5px solid #64748B;border-bottom:1.5px solid #64748B;transform:rotate(45deg);pointer-events:none;z-index:2}' +\n"
          if old not in s:
              raise SystemExit('desktop dropdown caret rule not found')
          s = s.replace(old, '', 1)

          old = "      'html.finance-ui-clean-v1 body .header #month-dropdown{appearance:none!important;height:40px!important;width:154px!important;min-width:154px!important;margin:0!important;padding:0 22px 0 8px!important;border:0!important;border-radius:0!important;background:transparent!important;background-image:none!important;color:#93C5FD!important;font:760 15px/1 Inter,sans-serif!important;letter-spacing:-.15px!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:clip!important;text-align:center!important;box-shadow:none!important;text-shadow:0 2px 12px rgba(96,165,250,.18)!important;transform:none!important;cursor:pointer!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;transition:color .15s,opacity .15s!important}' +\n"
          new = "      'html.finance-ui-clean-v1 body .header #month-dropdown{appearance:none!important;height:40px!important;width:154px!important;min-width:154px!important;margin:0!important;padding:0 8px!important;border:0!important;border-radius:0!important;background:transparent!important;background-image:none!important;color:#82B7FF!important;font:760 15px/1 Inter,sans-serif!important;letter-spacing:-.15px!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:clip!important;text-align:center!important;box-shadow:none!important;text-shadow:0 0 10px rgba(96,165,250,.34),0 2px 14px rgba(96,165,250,.20)!important;transform:none!important;cursor:pointer!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;transition:color .15s,opacity .15s!important}' +\n"
          if old not in s:
              raise SystemExit('month dropdown base style not found')
          s = s.replace(old, new, 1)

          old = "      'html.finance-ui-clean-v1 body .header #month-dropdown:hover{color:#BFDBFE!important}html.finance-ui-clean-v1 body .header #month-dropdown:active{color:#60A5FA!important;opacity:.82!important}' +\n"
          new = "      'html.finance-ui-clean-v1 body .header #month-dropdown:hover{color:#B8D8FF!important}html.finance-ui-clean-v1 body .header #month-dropdown:active{color:#60A5FA!important;opacity:.86!important}' +\n"
          if old not in s:
              raise SystemExit('month dropdown interaction style not found')
          s = s.replace(old, new, 1)

          old = "html.finance-ui-clean-v1 body .header>#month-nav>.custom-dropdown-wrapper::after{right:9px!important;top:16px!important;width:5px!important;height:5px!important}"
          if old not in s:
              raise SystemExit('mobile dropdown caret rule not found')
          s = s.replace(old, '', 1)

          old = "html.finance-ui-clean-v1 body .header #month-dropdown{height:40px!important;width:150px!important;min-width:150px!important;padding:0 21px 0 7px!important;font-size:14px!important;border-radius:0!important}"
          new = "html.finance-ui-clean-v1 body .header #month-dropdown{height:40px!important;width:150px!important;min-width:150px!important;padding:0 7px!important;font-size:14px!important;border-radius:0!important}"
          if old not in s:
              raise SystemExit('mobile month style not found')
          s = s.replace(old, new, 1)

          old = "if (h1) h1.textContent = view === 'analysis' ? 'Analys' : (view === 'family' ? 'Familjebudget' : 'Budget');"
          new = "if (h1) h1.textContent = view === 'analysis' ? 'Analys' : (view === 'family' ? 'Familjebudget' : 'Budgetplanerare');"
          if old not in s:
              raise SystemExit('budget heading assignment not found')
          s = s.replace(old, new, 1)

          p.write_text(s)

          pages = [
              'budget/budget.html',
              'budget/budget_maja.html',
              'budget/analytics.html',
              'budget/analytics_maja.html',
              'budget/familjebudget.html',
          ]
          for name in pages:
              f = Path(name)
              text = f.read_text()
              oldv = 'finance-ui.js?v=20260830-finance-clean-v7'
              newv = 'finance-ui.js?v=20260830-finance-clean-v8'
              if oldv not in text:
                  raise SystemExit(f'finance v7 loader not found in {name}')
              f.write_text(text.replace(oldv, newv, 1))
          PY
      - name: Verify JavaScript syntax
        run: node --check budget/finance-ui.js
      - name: Verify scoped changes
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          echo "$changed"
          while IFS= read -r f; do
            case "$f" in
              budget/finance-ui.js|budget/budget.html|budget/budget_maja.html|budget/analytics.html|budget/analytics_maja.html|budget/familjebudget.html) ;;
              '') ;;
              *) echo "Unexpected changed file: $f" >&2; exit 1 ;;
            esac
          done <<< "$changed"
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "strickertmarkus"
          git config user.email "markus.strickert@sigmatechnology.com"
          git add budget/finance-ui.js budget/budget.html budget/budget_maja.html budget/analytics.html budget/analytics_maja.html budget/familjebudget.html
          git commit -m "Refine finance month accent and heading"
          git push
