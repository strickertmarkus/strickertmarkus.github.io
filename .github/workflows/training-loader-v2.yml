name: Training loader v2
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/training-loader-v2.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply loader v2 patch
        run: python3 budget/tools/training_loader_v2.py
      - name: Validate loader wiring
        run: |
          node --check budget/auth-config.js
          node --check budget/auth-gate.js
          grep -q '__exerciseAssetManifestV2' budget/auth-config.js
          grep -q 'data-exercise-manifest-preload-v2' budget/auth-config.js
          grep -q 'exerciseManifestV2.map' budget/auth-gate.js
          grep -q '20260915-loader-v2' budget/exercise.html
          python3 - <<'PY'
          from pathlib import Path
          a=Path('budget/auth-config.js').read_text()
          g=Path('budget/auth-gate.js').read_text()
          assert a.count("group:'") == 27, a.count("group:'")
          assert "['exercise-heart-rate-range.js',exerciseFastVersion]" in a
          assert 'window.__exerciseLoaderMetricsV2.bundleMs' in g
          print('loader-v2 validation PASS')
          PY
      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add budget/auth-config.js budget/auth-gate.js budget/exercise.html
          git diff --cached --quiet || git commit -m 'Preload exercise bundle from one ordered manifest'
          git push
