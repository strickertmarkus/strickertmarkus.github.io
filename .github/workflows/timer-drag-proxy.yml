name: Timer drag proxy morph

on:
  push:
    paths:
      - '.github/workflows/timer-drag-proxy.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply one-live-timer proxy morph
        run: python .github/scripts/timer_drag_proxy.py
      - name: Validate timer script
        run: node --check budget/exercise-timer-focus.js
      - name: Commit timer proxy fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add budget/exercise-timer-focus.js budget/exercise.html budget/auth-config.js budget/auth-gate.js budget/exercise-pulse-flow-canvas-glow-v131.js
          git rm .github/scripts/timer_drag_proxy.py .github/workflows/timer-drag-proxy.yml
          git commit -m "Use one live timer during focus drag"
          git push
