name: Training CP8 unified final cleanup
on:
  push:
    branches:
      - checkpoint/training-observatory-cp8-unified-mode-tabs-work
permissions:
  contents: write
jobs:
  cleanup-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: checkpoint/training-observatory-cp8-unified-mode-tabs-work
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Remove retired wellness CSS
        run: python .github/cp8_remove_retired_wellness_css.py
      - name: Syntax and full training regression tests
        run: |
          node --check budget/training-zen-nav.js
          node --check budget/training-overview-mode.js
          node --check budget/pulse-environment/environment.js
          node --test budget/tests/training-*.test.cjs
      - name: Verify final ownership cleanup
        run: |
          ! grep -q 'wellness-nav' budget/zen.css
          ! grep -q 'wellness-nav' budget/training-zen-nav.css
          grep -q 'zen.css?v=20260916-unified-tabs-1' budget/zen.html
          grep -q 'data-wellness-destination="training"' budget/zen.html
          grep -q 'id="training-overview-toggle"' budget/exercise.html
          ! grep -q 'nav-dropdown-wrapper' budget/exercise.html
          ! grep -q 'toggleNavMenu' budget/exercise.html
          ! grep -q 'id="profile-name"' budget/zen.html
          git diff --check origin/main...HEAD
          git diff --check
      - name: Commit cleanup and remove temporary files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/cp8_remove_retired_wellness_css.py .github/workflows/training-cp8-unified-final-cleanup.yml
          git add budget/zen.css budget/zen.html
          git commit -m 'Clean retired wellness navigation styles'
          git push origin HEAD:checkpoint/training-observatory-cp8-unified-mode-tabs-work
