name: Home orange amber blend

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/home-orange-amber-blend.yml'

permissions:
  contents: write

jobs:
  blend-home-orange:
    if: github.event.head_commit.message == 'Prepare Home orange amber blend'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Blend orange and amber tones
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          const themePath = 'budget/home-calendar-theme-v12.js';
          let theme = fs.readFileSync(themePath, 'utf8');
          const replacements = [
            ['FBBF24', 'FBA930'],
            ['FCD34D', 'FDC761'],
            ['251,191,36', '251,169,48']
          ];
          for (const [from, to] of replacements) {
            if (!theme.includes(from)) throw new Error(`Expected ${from} in ${themePath}`);
            theme = theme.replaceAll(from, to);
          }
          fs.writeFileSync(themePath, theme);

          const navPath = 'budget/nav-menu-motion.js';
          let nav = fs.readFileSync(navPath, 'utf8');
          const oldVersion = 'home-calendar-theme-v12.js?v=20260902-home-calendar-theme-v14-amber';
          const newVersion = 'home-calendar-theme-v12.js?v=20260902-home-calendar-theme-v15-orange-amber';
          if (!nav.includes(oldVersion)) throw new Error(`Expected current theme version in ${navPath}`);
          nav = nav.replace(oldVersion, newVersion);
          fs.writeFileSync(navPath, nav);
          NODE

      - name: Remove temporary workflow
        run: rm .github/workflows/home-orange-amber-blend.yml

      - name: Commit blend
        shell: bash
        run: |
          git config user.name "strickertmarkus"
          git config user.email "markus.strickert@sigmatechnology.com"
          git add budget/home-calendar-theme-v12.js budget/nav-menu-motion.js .github/workflows/home-orange-amber-blend.yml
          git diff --cached --check
          git commit -m "Blend Home orange and amber tones"
          git push origin main
